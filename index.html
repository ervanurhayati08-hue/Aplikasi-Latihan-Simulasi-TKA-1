tentu. Kehadiran dalam musyawarah belum cukup apabila pengaruh dan kesempatan menentukan keputusan tidak diberikan secara setara.","sourceId":"B1-SOS-03-01","category":"Masyarakat Multikultural","options":[{"key":"A","text":"keberagaman disertai dominasi kelompok tertentu dalam pengambilan keputusan sosial"},{"key":"B","text":"masyarakat tidak multikultural karena kelompok pendatang tinggal di wilayah yang sama"},{"key":"C","text":"masyarakat telah setara karena seluruh kelompok diperbolehkan menghadiri musyawarah"},{"key":"D","text":"kelompok minoritas memperoleh kekuasaan lebih besar karena jumlah anggotanya sedikit"},{"key":"E","text":"perbedaan kepentingan telah hilang karena keputusan dibuat melalui kegiatan musyawarah"}],"answer":"A"},{"n":7,"type":"tf","typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Di salah satu kota besar, warga merasa resah karena sering terjadi penyerangan oleh sekelompok remaja bermotor. Para pelaku membawa senjata tajam. Aksi kekerasan ini umumnya berlangsung pada malam hari, terutama di kawasan Simpang Tiga, jalur utama yang sering dilalui warga ketika malam. Pihak kepolisian menyatakan bahwa insiden ini bukan yang pertama kali terjadi. Dalam dua bulan terakhir, telah terjadi lima kasus serupa dengan pola yang sama yaitu dilakukan oleh remaja dan menyasar warga yang sedang sendirian."},{"kind":"text","text":"Mengapa peristiwa yang terjadi dalam ilustrasi tersebut dianggap sebagai gejala sosial?\nKlik pilihan Benar atau Salah pada setiap pernyataan berdasarkan isi teks!"}],"explanation":"Pernyataan pertama benar karena serangkaian penyerangan menimbulkan keresahan dan ketakutan yang berdampak pada masyarakat. Pernyataan kedua benar karena kekerasan dengan senjata merupakan penyimpangan dari norma sosial. Pernyataan ketiga salah karena peristiwa tersebut tidak terjadi satu kali; stimulus menyebutkan lima kasus serupa dalam dua bulan dengan pola yang sama.","sourceId":"D2025-05","category":"TKA Sosiologi 2025","statements":["Aksi kekerasan dalam kasus ini terjadi secara individu dan tidak berulang sama sekali sehingga bukan gejala sosial.","Kasus tersebut merupakan gejala sosial dengan dampak keresahan dan menimbulkan ketakutan di masyarakat.","Kasus ini termasuk gejala sosial akibat adanya penyimpangan perilaku dari norma sosial yang berlaku di masyarakat."],"answer":["S","B","B"],"categories":["Benar","Salah"]},{"n":8,"type":"tf","typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Fasilitas kesehatan lengkap tersedia di pusat kabupaten, sedangkan desa terpencil hanya memiliki tenaga kesehatan terbatas. Warga desa harus menempuh perjalanan panjang untuk memperoleh pemeriksaan lanjutan. Sebagian menunda berobat karena biaya transportasi dan kehilangan pendapatan selama perjalanan."},{"kind":"text","text":"Petunjuk: Tentukan kategori Tepat atau Tidak Tepat untuk setiap pernyataan."}],"explanation":"Hak yang sama belum tentu menghasilkan akses yang sama. Jarak, biaya, dan keterbatasan tenaga kesehatan dapat menimbulkan ketidaksetaraan pelayanan dan risiko kesehatan.","sourceId":"B3-SOS-B-06-03","category":"Permasalahan Sosial","statements":["Biaya perjalanan dapat memperbesar beban ekonomi keluarga di wilayah terpencil.","Ketimpangan pelayanan dapat meningkatkan risiko keterlambatan penanganan penyakit.","Perbedaan fasilitas tidak berdampak karena semua warga memiliki hak kesehatan yang sama."],"answer":["B","B","S"],"categories":["Tepat","Tidak Tepat"]},{"n":9,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"URBANISASI\nPerpindahan dari wilayah jarang penduduk ke wilayah padat penduduk (urbanisasi) dapat diartikan sebagai suatu gejala suatu wilayah bertransformasi menjadi perkotaan."},{"kind":"text","text":"Sayangnya, wilayah jarang penduduk tersebut biasanya adalah perdesaan yang sebenarnya memiliki potensi berikut:\n• PUSAT PEMELIHARAAN KEANEKARAGAMAN HAYATI: Masyarakat lokal melindungi tanah, air, dan kehidupan hewan serta tumbuhan dengan cara tidak merusak ekosistem melalui pelestarian kearifan lokal.\n• PENGHASIL UTAMA PASOKAN PANGAN: Banyak sumber daya alam yang berperan sebagai pemasok sumber pangan dan kebutuhan pokok dihasilkan di wilayah-wilayah perdesaan.\n• PENGURANGAN DAMPAK LINGKUNGAN: Lingkungan yang hijau menghasilkan banyak oksigen dan mengurangi risiko polusi udara global."},{"kind":"text","text":"Mari kita dukung pertanian berkelanjutan dan menjaga lingkungan untuk masa depan yang lebih baik."},{"kind":"text","text":"Pemerintah desa membiarkan para penduduk melakukan urbanisasi. Jika hal tersebut terus terjadi, apa dampak negatif gejala sosial yang relevan berdasarkan kasus pada infografis?"}],"explanation":"Infografis menekankan peran perdesaan sebagai penghasil utama pangan. Jika urbanisasi terus berlangsung, tenaga pengelola lahan pertanian dapat berkurang, lahan menjadi tidak tergarap, pasokan pangan menurun, dan harga berpotensi meningkat. Karena itu pilihan D paling sesuai dengan hubungan sebab-akibat pada stimulus.","sourceId":"D2025-06","category":"TKA Sosiologi 2025","options":[{"key":"A","text":"Pengangguran di wilayah pedesaan akan terus meningkat karena lapangan kerja semakin sempit."},{"key":"B","text":"Kenaikan harga terjadi seiring penurunan pasokan pangan karena banyak lahan yang tidak tergarap."},{"key":"C","text":"Pemanasan global terus meningkat karena polusi udara di perkotaan tidak diimbangi dengan penghijauan."},{"key":"D","text":"Sumber-sumber hayati akan rusak karena pencemaran lingkungan akibat pembangunan yang masif."},{"key":"E","text":"Kerusakan lingkungan di perdesaan akibat alih fungsi lahan terjadi karena industrialisasi semakin pesat."}],"answer":"B"},{"n":10,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Sebuah penelitian menemukan bahwa pekerja perempuan dan laki-laki dengan tingkat pendidikan serta masa kerja yang sebanding menerima peluang promosi yang berbeda. Sebagian perempuan lebih jarang menduduki jabatan manajerial dan rata-rata memperoleh pendapatan lebih rendah. Dalam wawancara, beberapa pekerja perempuan menyatakan menunda pendidikan lanjutan karena penghasilan mereka lebih banyak digunakan untuk kebutuhan keluarga."},{"kind":"text","text":"Evaluasi yang paling tepat terhadap dampak kondisi tersebut adalah ...."}],"explanation":"Ketimpangan pendapatan dapat membatasi kemampuan perempuan mengembangkan pendidikan, karier, tabungan, dan kemandirian ekonomi. Dampaknya dapat berlangsung lebih luas daripada sekadar selisih upah.","sourceId":"B2-BS2-18-04","category":"Kesetaraan dan Ketimpangan Sosial","options":[{"key":"A","text":"ketimpangan upah mempercepat mobilitas sosial perempuan karena tanggung jawabnya semakin meningkat"},{"key":"B","text":"ketimpangan upah hanya memengaruhi perusahaan dan tidak berhubungan dengan kehidupan keluarga"},{"key":"C","text":"ketimpangan upah meningkatkan kesetaraan karena laki-laki dan perempuan mempunyai peran berbeda"},{"key":"D","text":"ketimpangan upah membuat seluruh perempuan memilih berhenti bekerja setelah membentuk keluarga"},{"key":"E","text":"ketimpangan upah dapat membatasi kemandirian ekonomi dan mobilitas sosial pekerja perempuan"}],"answer":"E"},{"n":11,"type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Warga dari beragam pekerjaan membentuk komunitas untuk membersihkan sungai dan memberikan pendidikan lingkungan. Keanggotaan bersifat sukarela. Mereka bukan pekerja profesional di bidang lingkungan, tetapi rutin menyumbangkan waktu dan tenaga tanpa menerima gaji sebagai tujuan utama."},{"kind":"text","text":"Karakter kelompok tersebut ditunjukkan oleh ...."}],"explanation":"Kelompok yang dibentuk secara sukarela untuk mencapai tujuan sosial tertentu dapat dikategorikan sebagai voluntary group. Mereka tidak otomatis menjadi kelompok okupasional karena tidak semua anggota bekerja dalam profesi yang sama.","sourceId":"B2-BS2-20-09","category":"Kelompok Sosial","options":[{"key":"A","text":"kelompok termasuk okupasional karena seluruh anggota bekerja sebagai ahli lingkungan"},{"key":"B","text":"keanggotaan didasarkan pada kesediaan individu untuk bergabung secara sukarela"},{"key":"C","text":"kegiatan dilakukan karena adanya kepedulian pada kepentingan sosial bersama"},{"key":"D","text":"komunitas dapat dikategorikan sebagai kelompok volunteer atau kelompok sukarela"}],"answer":["B","C","D"]},{"n":12,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Masuknya budaya asing ke Indonesia yang dipercepat oleh arus globalisasi dan teknologi membawa pengaruh besar, baik secara positif maupun negatif. Di satu sisi, budaya asing memperluas wawasan, memperkenalkan inovasi, dan memperkaya kebudayaan lokal. Namun, di sisi lain, pengaruh ini juga dapat mengikis nilai-nilai tradisional, memicu perubahan gaya hidup yang bertentangan dengan norma masyarakat, serta menimbulkan ketimpangan sosial. Desa Trunyan di Bali memiliki tradisi pemakaman unik: jenazah tidak dikubur atau dibakar, melainkan diletakkan di atas tanah dan dibiarkan membusuk secara alami. Tradisi ini menarik minat wisatawan, baik domestik maupun mancanegara. Namun, meningkatnya kunjungan wisatawan memunculkan tantangan baru seperti meningkatnya volume sampah, degradasi lingkungan, dan komersialisasi budaya yang berisiko mengubah makna spiritual dari tradisi tersebut."},{"kind":"text","text":"Apa rekomendasi paling strategis yang bisa dilakukan pemuda Desa Trunyan untuk menjaga nilai budaya di tengah arus globalisasi?"}],"explanation":"Pemuda dapat memanfaatkan sarana globalisasi, terutama media sosial, untuk memperkuat identitas budaya lokal dengan cara yang relevan bagi generasi sekarang. Kampanye visual modern memungkinkan budaya Trunyan diperkenalkan tanpa menjadikan komersialisasi sebagai tujuan utama, sehingga pilihan A paling sesuai untuk penguatan budaya lokal.","sourceId":"D2025-30","category":"TKA Sosiologi 2025","options":[{"key":"A","text":"Mengampanyekan gaya hidup lokal melalui media sosial dengan pendekatan visual modern."},{"key":"B","text":"Membuat festival tahunan dengan atraksi budaya yang diatur oleh sponsor dan pihak swasta."},{"key":"C","text":"Meningkatkan daya tarik ekonomi dari tradisi dengan memperluas pasar souvenir khas pemakaman."},{"key":"D","text":"Menjadi pemandu wisata profesional agar bisa menjelaskan budaya secara sistematis dan netral."},{"key":"E","text":"Meningkatkan penggunaan bahasa asing dalam promosi budaya agar lebih diterima wisatawan asing."}],"answer":"A"},{"n":13,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Perhatikan hasil penelitian berikut!\nTabel Persepsi, hambatan, dan harapan publik mengenai pelayanan pemerintah"},{"kind":"table","rows":[["Tema Utama","Subtema","Kutipan Informan"],["Persepsi Pelayanan Publik","Ketepatan waktu","“Saya sudah datang pagi-pagi, tapi tetap saja harus menunggu lama.” – Informan 1"],["Persepsi Pelayanan Publik","Keramahan petugas","“Petugasnya sebenarnya ramah, tapi kadang terkesan terburu-buru.” – Informan 3"],["Hambatan dalam Pelayanan","Sistem antrean manual","“Kalau antrean masih tulis tangan begini, gampang diserobot.” – Informan 4"],["Hambatan dalam Pelayanan","Kurangnya petunjuk informasi","“Saya bingung harus ke loket mana dulu. Tidak ada papan petunjuk.” – Informan 9"],["Harapan Masyarakat","Digitalisasi pelayanan","“Kalau bisa, dibuat sistem online biar enggak perlu antre lama di sini.” – Informan 10"],["Harapan Masyarakat","Pelatihan SDM","“Petugasnya perlu pelatihan biar lebih cepat dan akurat saat melayani.” – Informan 7"]]},{"kind":"text","text":"Bagaimana langkah-langkah penelitian yang tepat agar peneliti bisa menghasilkan sajian data tersebut?"}],"explanation":"Sajian data berupa tema, subtema, dan kutipan informan merupakan hasil pengolahan data kualitatif. Alur yang tepat ialah menyusun panduan wawancara dari rumusan masalah, mengumpulkan data, memeriksa kelengkapan, mengidentifikasi jawaban, lalu mengelompokkan jawaban ke dalam kategori atau tema yang sama.","sourceId":"D2025-13","category":"TKA Sosiologi 2025","options":[{"key":"A","text":"Peneliti membuat daftar pertanyaan tertutup, mengujicobakannya dalam kelompok kecil, mengecek kelengkapan jawaban, mengelompokkan jawaban dalam tema tertentu, lalu menyimpulkan jawaban setiap responden."},{"key":"B","text":"Peneliti merumuskan pertanyaan-pertanyaan pokok dari judul penelitian, lalu membuat panduan wawancara, melakukan uji coba terbatas, melakukan pengumpulan data, mengecek kelengkapan data, lalu penyajian data."},{"key":"C","text":"Peneliti membuat panduan wawancara yang diturunkan dari rumusan masalah penelitian, lalu melakukan pengumpulan data, mengecek kelengkapan jawaban, mengidentifikasi hasil jawaban, lalu mengelompokkannya dalam kategori yang sama."},{"key":"D","text":"Peneliti merumuskan indikator dari variabel, lalu menurunkan indikator menjadi butir pertanyaan, melakukan uji coba terbatas, melakukan pengumpulan data, mengecek kelengkapan data, lalu penyajian data."},{"key":"E","text":"Peneliti membuat kuesioner dengan jenis pertanyaan campuran, lalu melakukan pengumpulan data, mengecek kelengkapan jawaban, mengklasifikasi jawaban setiap responden, lalu melakukan penyajian data."}],"answer":"C"},{"n":14,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Catatan sumber: blok Hierarki Indikator tidak tercantum pada halaman soal ini."},{"kind":"text","text":"Di sebuah sekolah, sekelompok siswa membentuk komunitas bernama “Green Youth Club” yang fokus pada isu lingkungan. Mereka memulai dengan saling berbagi informasi tentang daur ulang dan pengelolaan sampah organik, lalu rutin melakukan kegiatan seperti membersihkan taman sekolah, membuat kompos, dan menyosialisasikan gaya hidup ramah lingkungan. Anggota komunitas ini berasal dari berbagai kelas dan latar belakang, namun mereka merasa memiliki tujuan bersama dan saling mendukung dalam kegiatan yang dijalankan."},{"kind":"text","text":"Jika dikaji dari konsep kelompok sosial, bagaimana proses terbentuknya komunitas Green Youth Club tersebut?"}],"explanation":"Kelompok sosial terbentuk ketika terdapat interaksi yang berkelanjutan, kesadaran sebagai bagian dari kelompok, dan tujuan bersama. Green Youth Club memenuhi ciri tersebut karena anggotanya rutin berinteraksi, menjalankan kegiatan bersama, serta memiliki kepedulian yang sama terhadap lingkungan.","sourceId":"D2025-12","category":"TKA Sosiologi 2025","options":[{"key":"A","text":"Komunitas itu dibentuk secara paksa oleh sekolah sehingga tidak mencerminkan kelompok sosial."},{"key":"B","text":"Kelompok tersebut terbentuk karena interaksi sosial yang berkelanjutan dan tujuan bersama."},{"key":"C","text":"Kelompok ini bukan kelompok sosial karena anggotanya berasal dari kelas yang berbeda."},{"key":"D","text":"“Green Youth Club” termasuk kelompok semu karena hanya berkumpul sesekali."},{"key":"E","text":"Komunitas terbentuk secara spontan tanpa adanya kesamaan visi dan nilai."}],"answer":"B"},{"n":15,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Di suatu wilayah, sebagian besar tanah pertanian sebelumnya dikuasai sejumlah kecil pemilik lahan. Pemerintah kemudian menjalankan kebijakan redistribusi tanah sehingga banyak petani memperoleh hak atas lahan sendiri. Perubahan tersebut memengaruhi hubungan antara pemilik tanah, petani penggarap, sistem produksi, dan struktur ekonomi desa."},{"kind":"text","text":"Dilihat dari cakupan pengaruhnya, perubahan tersebut termasuk ...."}],"explanation":"Perubahan kepemilikan tanah memengaruhi struktur ekonomi, relasi kekuasaan, pekerjaan, dan hubungan sosial. Karena dampaknya luas, perubahan tersebut merupakan perubahan besar. B. Pilihan Ganda Kompleks MCMA Petunjuk: Pilih semua jawaban yang benar.","sourceId":"B2-BS2-25-04","category":"Perubahan Sosial","options":[{"key":"A","text":"perubahan kecil karena hanya berhubungan dengan penggunaan tanah pertanian"},{"key":"B","text":"perubahan spontan karena pemerintah tidak melakukan intervensi dalam masyarakat"},{"key":"C","text":"perubahan besar karena memengaruhi struktur dan hubungan sosial masyarakat"},{"key":"D","text":"perubahan siklus karena kepemilikan tanah selalu kembali pada keadaan semula"},{"key":"E","text":"perubahan sederhana karena tidak memengaruhi hubungan ekonomi antarkelompok"}],"answer":"C"},{"n":16,"type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Penduduk pendatang tinggal di Desa Pusaka dan membawa kebiasaan kuliner yang berbeda. Warga setempat mulai mempelajari makanan pendatang, sedangkan pendatang menggunakan bahan lokal dalam masakannya. Setelah beberapa tahun, muncul hidangan baru yang memadukan kedua tradisi dan digunakan dalam acara bersama. Meskipun demikian, setiap kelompok masih mempertahankan beberapa upacara keluarga masing-masing."},{"kind":"text","text":"Pernyataan yang tepat berdasarkan stimulus adalah ...."}],"explanation":"Terdapat interaksi dan penerimaan unsur budaya. Hidangan baru memperlihatkan akulturasi, sedangkan tradisi keluarga yang masih dipertahankan menunjukkan identitas awal tidak hilang sepenuhnya.","sourceId":"B3-SOS-B-04-02","category":"Proses Sosial","options":[{"key":"A","text":"dipertahankannya upacara keluarga menunjukkan identitas belum sepenuhnya melebur"},{"key":"B","text":"penggunaan bahan lokal menunjukkan konflik budaya yang semakin menguat"},{"key":"C","text":"saling mempelajari makanan menunjukkan terjadinya interaksi antarkelompok"},{"key":"D","text":"munculnya hidangan perpaduan menunjukkan proses akulturasi kebudayaan"}],"answer":["A","C","D"]},{"n":17,"type":"tf","typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Perdagangan bebas membuat produk dari berbagai negara masuk ke pasar domestik. Konsumen memperoleh pilihan lebih luas, tetapi usaha kecil menghadapi persaingan dengan perusahaan besar."},{"kind":"text","text":"Tentukan kategori setiap pernyataan berdasarkan stimulus."}],"explanation":"Stimulus menunjukkan adanya tekanan kompetisi, tetapi tidak menyatakan bahwa semua usaha kecil pasti gagal.","sourceId":"B1-SOS-22-03","category":"Globalisasi","statements":["Konsumen dapat memperoleh lebih banyak pilihan barang.","Perbedaan kekuatan modal dapat memengaruhi kemampuan usaha bersaing.","Semua usaha kecil pasti berhenti beroperasi karena perdagangan global."],"answer":["B","B","S"],"categories":["Didukung","Tidak Didukung"]},{"n":18,"type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"UMKM batik lokal menghadapi persaingan ketat dari produk cetakan massal. Pemilik usaha ingin budaya batik tetap bertahan sekaligus mampu bersaing."},{"kind":"text","text":"Langkah penguatan budaya lokal yang tepat adalah ...."}],"explanation":"Penguatan budaya lokal perlu memadukan nilai budaya, pemasaran modern, dan regenerasi pelaku budaya. Menghilangkan motif tradisional atau menghentikan produksi justru melemahkan budaya lokal.","sourceId":"B1-SOS-29-02","category":"Kearifan Lokal","options":[{"key":"A","text":"menghentikan produksi batik tulis karena lebih sulit dibuat"},{"key":"B","text":"melatih generasi muda belajar membatik"},{"key":"C","text":"memasarkan produk melalui platform digital"},{"key":"D","text":"memberi label cerita asal-usul motif pada setiap produk"},{"key":"E","text":"menghapus motif tradisional agar sepenuhnya sama dengan produk global"}],"answer":["B","C","D"]},{"n":19,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Di sebuah sekolah menengah, para murid mengikuti program pembelajaran berbasis teknologi digital. Setiap siswa dibekali gawai untuk mengakses materi pembelajaran dari rumah maupun di sekolah. Guru memanfaatkan platform pembelajaran daring yang memungkinkan diskusi kelas berlangsung secara virtual. Selain itu, siswa juga diperkenalkan pada tren budaya global melalui media sosial, seperti gaya hidup sehat, komunitas kreatif, hingga diskusi lintas negara tentang isu sosial. Seiring waktu, cara siswa berinteraksi, belajar, dan memandang dunia mengalami perubahan yang nyata, termasuk dalam cara mereka menanggapi keberagaman dan beradaptasi dengan perkembangan zaman."},{"kind":"text","text":"Bagaimana keterlibatan masyarakat dalam aktivitas berbasis digital merefleksikan konsekuensi sosial yang diakibatkan oleh arus globalisasi?"}],"explanation":"Keterlibatan siswa melalui platform daring dan media sosial menunjukkan tumbuhnya partisipasi dalam budaya digital. Perubahan cara berinteraksi dan mengekspresikan diri melalui media digital merupakan bentuk pergeseran ekspresi sosial masyarakat, sehingga pilihan D paling langsung menjawab pertanyaan.","sourceId":"D2025-25","category":"TKA Sosiologi 2025","options":[{"key":"A","text":"Teknologi meningkatkan refleksi terhadap perbedaan karena siswa berdiskusi lintas latar, mencerminkan tumbuhnya toleransi sosial."},{"key":"B","text":"Teknologi memudahkan akses nilai baru karena siswa terbiasa informasi global, mencerminkan pola pikir masyarakat yang terbuka."},{"key":"C","text":"Teknologi memperkuat interaksi lintas budaya karena berinteraksi dengan komunitas global, mencerminkan luasnya wawasan global."},{"key":"D","text":"Teknologi memperluas akses ruang belajar karena siswa belajar dari jejaring global, mencerminkan pendidikan yang kolaboratif."},{"key":"E","text":"Teknologi mendorong partisipasi budaya digital karena siswa aktif di media sosial, mencerminkan pergeseran ekspresi masyarakat."}],"answer":"E"},{"n":20,"type":"tf","typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Banjir melanda sebuah kawasan perkotaan. Warga dari beberapa lingkungan membentuk dapur umum, mengumpulkan pakaian, dan membantu mengevakuasi lansia. Di sisi lain, terjadi perselisihan karena sebagian warga menilai bantuan lebih banyak diberikan kepada kelompok tertentu. Pemerintah kemudian membuka data penerima bantuan dan melibatkan perwakilan warga dalam pendistribusian."},{"kind":"text","text":"Tentukan ketepatan setiap pernyataan berikut."}],"explanation":"Sosiologi tidak mengkaji proses alamiah terjadinya banjir, tetapi mengkaji tindakan kolektif, pembagian bantuan, konflik, keadilan, dan hubungan antara masyarakat dengan pemerintah.","sourceId":"B1-SOS-01-03","category":"Hakikat dan Objek Kajian Sosiologi","statements":["Perselisihan pembagian bantuan dapat dikaji melalui konsep keadilan sosial.","Sosiologi hanya mengkaji penyebab alamiah banjir dan tidak mengkaji respons masyarakat.","Kerja sama warga setelah banjir merupakan bentuk tindakan sosial kolektif."],"answer":["B","S","B"],"categories":["Tepat","Tidak Tepat"]},{"n":21,"type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Peneliti menyebarkan kuesioner kepada 300 peserta didik untuk mengukur akses perangkat, kualitas jaringan, dan tingkat partisipasi belajar. Setelah data angka dianalisis, peneliti mewawancarai 15 peserta didik untuk memahami alasan mereka aktif atau pasif dalam pembelajaran. Data kuantitatif dan hasil wawancara kemudian dihubungkan saat menyusun simpulan."},{"kind":"text","text":"Pernyataan yang tepat berdasarkan kasus tersebut adalah ...."}],"explanation":"Penelitian menggunakan metode campuran karena menggabungkan survei kuantitatif dengan wawancara kualitatif. Wawancara digunakan untuk menjelaskan lebih dalam\ntemuan angka.","sourceId":"B1-SOS-09-02","category":"Penelitian Sosial","options":[{"key":"A","text":"kuesioner digunakan untuk memperoleh gambaran umum dari banyak responden"},{"key":"B","text":"wawancara digunakan untuk memperdalam penjelasan atas hasil survei"},{"key":"C","text":"penelitian memadukan data kuantitatif dan data kualitatif"},{"key":"D","text":"penelitian hanya menggunakan metode kualitatif karena terdapat kegiatan wawancara"}],"answer":["A","B","C"]},{"n":22,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Lima peserta didik membentuk kelompok untuk membuat proyek penelitian sosial. Dira menginginkan seluruh anggota bekerja berdasarkan pembagian tugas yang ketat. Sementara itu, Bima lebih menyukai pembahasan bersama dan perubahan tugas secara fleksibel. Perbedaan cara kerja tersebut menyebabkan keduanya saling menyalahkan ketika laporan tidak selesai sesuai jadwal."},{"kind":"text","text":"Penyebab konflik yang paling tepat adalah ...."}],"explanation":"Konflik terjadi karena Dira dan Bima mempunyai karakter, cara bekerja, serta pandangan yang berbeda. Kondisi tersebut termasuk penyebab konflik berupa perbedaan individu.","sourceId":"B3-SOS-B-15-01","category":"Konflik Sosial","options":[{"key":"A","text":"perubahan kebudayaan akibat masuknya teknologi dalam pembelajaran"},{"key":"B","text":"perbedaan nilai ekonomi yang dianut oleh setiap anggota kelompok"},{"key":"C","text":"kesenjangan sosial antara anggota yang berasal dari wilayah berbeda"},{"key":"D","text":"perbedaan karakter dan cara pandang antarindividu dalam bekerja"},{"key":"E","text":"persaingan politik untuk memperoleh kekuasaan dalam pemerintahan"}],"answer":"D"},{"n":23,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Seorang siswa mengunggah video kegiatan sekolah ke media sosial. Beberapa pengguna dari sekolah lain memberikan komentar mengejek penampilan siswa tersebut. Komentar kemudian dibagikan oleh banyak akun sehingga semakin banyak orang ikut memberikan hinaan. Siswa tersebut merasa malu, menarik diri dari pergaulan, dan beberapa kali tidak masuk sekolah."},{"kind":"text","text":"Masalah sosial yang paling tepat pada kasus tersebut adalah ...."}],"explanation":"Penghinaan dilakukan melalui media digital dan menyebar kepada banyak pengguna. Fenomena tersebut merupakan cyberbullying, yaitu perundungan yang dilakukan menggunakan media elektronik.","sourceId":"B3-SOS-C-24-01","category":"Globalisasi","options":[{"key":"A","text":"cyberbullying karena tindakan penghinaan dilakukan dan menyebar melalui ruang digital"},{"key":"B","text":"westernisasi karena siswa mulai menggunakan media sosial yang berasal dari luar negeri"},{"key":"C","text":"kesenjangan digital karena tidak semua siswa memiliki kemampuan menggunakan media sosial"},{"key":"D","text":"individualisasi karena seluruh siswa lebih memilih berkomunikasi tanpa berinteraksi langsung"},{"key":"E","text":"pengangguran teknologi karena siswa tidak mampu mengikuti perkembangan aplikasi komunikasi"}],"answer":"A"},{"n":24,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Sebuah desa mengalami pertumbuhan penduduk setelah dibangun kawasan industri. Banyak pekerja dari luar daerah menyewa rumah di desa tersebut. Penduduk lama menilai pendatang kurang terlibat dalam kegiatan gotong royong, sedangkan pendatang merasa tidak pernah mendapat informasi yang jelas mengenai kegiatan warga. Prasangka kemudian berkembang di kedua pihak dan mulai memengaruhi hubungan dalam kehidupan sehari-hari."},{"kind":"text","text":"Faktor yang paling menjelaskan berkembangnya permasalahan sosial tersebut adalah ...."}],"explanation":"Stimulus memperlihatkan proses kurangnya komunikasi → salah persepsi → prasangka → jarak sosial. Dinamika masalah tidak hanya disebabkan perbedaan asal, melainkan interaksi antarkelompok yang tidak berjalan efektif. B. Pilihan Ganda Kompleks MCMA Petunjuk: Pilih semua jawaban yang benar.","sourceId":"B2-BS2-21-04","category":"Permasalahan Sosial","options":[{"key":"A","text":"bertambahnya penduduk selalu menyebabkan penduduk lama kehilangan identitas sosial"},{"key":"B","text":"kegiatan gotong royong hanya dapat dijalankan masyarakat yang berasal dari daerah sama"},{"key":"C","text":"perbedaan asal daerah secara langsung membuat hubungan sosial tidak dapat dibangun"},{"key":"D","text":"masuknya pekerja baru menunjukkan bahwa masyarakat desa telah kehilangan solidaritas sepenuhnya"},{"key":"E","text":"komunikasi terbatas memperkuat prasangka dan memperlebar jarak sosial antarkelompok"}],"answer":"E"},{"n":25,"type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Saat banjir, petugas penyelamat memberikan tanda dengan peluit kepada warga yang berada di atap rumah. Warga memahami tanda tersebut, melambaikan kain, dan menunjukkan jumlah orang yang membutuhkan pertolongan. Petugas kemudian mengarahkan perahu menuju lokasi warga."},{"kind":"text","text":"Unsur yang mendukung terjadinya interaksi sosial dalam kasus tersebut adalah ...."}],"explanation":"Peluit berfungsi sebagai pesan, warga memahami maknanya, lalu memberikan respons. Kesamaan pekerjaan bukan syarat interaksi sosial.","sourceId":"B1-SOS-02-02","category":"Interaksi Sosial","options":[{"key":"A","text":"adanya respons warga melalui lambaian dan isyarat jumlah korban"},{"key":"B","text":"adanya kesamaan pekerjaan antara petugas dan seluruh warga terdampak"},{"key":"C","text":"adanya pemahaman warga terhadap makna bunyi peluit"},{"key":"D","text":"adanya tanda yang berfungsi sebagai pesan kepada warga"}],"answer":["A","C","D"]},{"n":26,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Indonesia, China, India, Pakistan, Bangladesh, dan Nigeria menyumbang 75% dari total beban polusi udara global karena tingkat polusi udara yang tinggi dan jumlah populasi yang besar. Udara yang berisi partikel halus (PM 2.5) berpotensi mengurangi usia hidup rata-rata warga Indonesia hingga 1,4 tahun dibandingkan jika kualitas udara di Indonesia memenuhi standar WHO, yakni 5 µg/m. Pencemaran udara oleh pelaku industri menjadi sorotan karena berkontribusi tinggi terhadap polusi udara. Selain itu, beberapa pihak juga berencana menggugat pemerintah karena dinilai belum optimal dalam mengatasi masalah polusi udara. Hal ini tidak mengherankan karena beberapa negara juga masih belum memiliki data yang lengkap berupa hasil riset maupun alat untuk memonitor dan mengukur kualitas udara."},{"kind":"text","text":"Diolah dari: https://www.bbc.com/indonesia/articles/c72enp76622o"},{"kind":"text","text":"Apa rekomendasi yang paling tepat diberikan kepada institusi pendidikan tinggi agar bisa berkontribusi dalam mengatasi masalah tersebut?"}],"explanation":"Stimulus menyoroti keterbatasan data riset serta alat pemantauan kualitas udara. Perguruan tinggi memiliki fungsi penelitian, sehingga pembangunan pusat riset lingkungan merupakan kontribusi yang paling langsung untuk menghasilkan data, strategi, dan solusi pembangunan berkelanjutan.","sourceId":"D2025-29","category":"TKA Sosiologi 2025","options":[{"key":"A","text":"Mengembangkan program pengabdian kepada masyarakat untuk memberikan edukasi cara mengelola limbah rumah tangga."},{"key":"B","text":"Menjalin kerja sama dengan negara-negara maju agar berinvestasi di sektor industri dengan konsep energi terbaharukan."},{"key":"C","text":"Membangun pusat riset yang berkonsentrasi pada lingkungan agar menghasilkan strategi dan pembangunan berkelanjutan."},{"key":"D","text":"Mendampingi masyarakat menuntut pemerintah menggratiskan pengobatan untuk penyakit gangguan pernafasan."},{"key":"E","text":"Menjalin kerja sama dengan berbagai pihak untuk membuat program penanaman sejuta pohon di wilayah hutan gundul."}],"answer":"C"},{"n":27,"type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Kawasan perumahan menengah di Kota Tirta mendapat aliran air bersih setiap hari. Sebaliknya, permukiman padat di pinggiran kota hanya memperoleh pasokan beberapa kali seminggu. Warga pinggiran harus membeli air tambahan dengan harga lebih mahal. Sebagian keluarga mengurangi penggunaan air untuk mencuci dan sanitasi."},{"kind":"text","text":"Dampak yang didukung oleh stimulus adalah ...."}],"explanation":"Kelompok yang aksesnya rendah harus mengeluarkan biaya tambahan sekaligus menghadapi risiko sanitasi. Pernyataan D terlalu pasti karena stimulus hanya menunjukkan peningkatan risiko, bukan kepastian penyakit.","sourceId":"B2-BS2-18-09","category":"Kesetaraan dan Ketimpangan Sosial","options":[{"key":"A","text":"ketidaksetaraan layanan dapat memperbesar kerentanan kelompok yang telah kurang mampu"},{"key":"B","text":"keterbatasan pasokan memastikan seluruh warga pinggiran mengalami penyakit menular"},{"key":"C","text":"keterbatasan air dapat meningkatkan risiko persoalan kebersihan dan kesehatan masyarakat"},{"key":"D","text":"keluarga berpenghasilan rendah dapat menanggung beban biaya air secara proporsional lebih besar"}],"answer":["A","C","D"]},{"n":28,"type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Sebuah bendungan dibangun di wilayah pedesaan. Sebagian lahan pertanian berubah menjadi kawasan perairan. Beberapa petani beralih menjadi pembudidaya ikan, pengelola wisata, atau pedagang. Pendapatan sebagian warga meningkat, tetapi warga yang tidak memiliki keterampilan baru mengalami kesulitan memperoleh pekerjaan."},{"kind":"text","text":"Dampak yang dapat dianalisis dari perubahan tersebut adalah ...."}],"explanation":"Perubahan fisik dapat diikuti perubahan sosial-ekonomi. Muncul diversifikasi pekerjaan, tetapi kemampuan adaptasi berbeda menyebabkan hasil yang tidak merata.","sourceId":"B3-SOS-C-26-02","category":"Perubahan Sosial","options":[{"key":"A","text":"muncul peluang ekonomi baru bagi masyarakat yang mampu melakukan penyesuaian"},{"key":"B","text":"struktur mata pencaharian masyarakat menjadi lebih beragam dibandingkan sebelumnya"},{"key":"C","text":"kelompok yang kurang mampu beradaptasi berpotensi mengalami kerentanan ekonomi"},{"key":"D","text":"perubahan lingkungan membuat seluruh warga memperoleh peningkatan pendapatan yang sama"}],"answer":["A","B","C"]},{"n":29,"type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Manajemen menaikkan target produksi tanpa menambah jumlah pekerja. Buruh menyatakan beban kerja meningkat, tetapi upah lembur belum dibayarkan secara penuh. Perusahaan beralasan kebijakan diperlukan untuk menjaga keuntungan. Serikat buruh menilai keputusan dibuat sepihak dan mengancam melakukan mogok kerja."},{"kind":"text","text":"Penyebab konflik yang tampak dalam kasus tersebut adalah ...."}],"explanation":"Konflik terjadi karena kepentingan perusahaan dan pekerja berbeda, pengambilan keputusan tidak seimbang, serta hak ekonomi pekerja dipersoalkan. Posisi buruh dan pemilik perusahaan tidak setara.","sourceId":"B2-BS2-15-09","category":"Konflik Sosial","options":[{"key":"A","text":"kesamaan posisi sosial antara buruh dan pemilik perusahaan dalam produksi"},{"key":"B","text":"ketimpangan kekuasaan dalam proses penetapan kebijakan perusahaan"},{"key":"C","text":"perbedaan kepentingan antara keuntungan perusahaan dan kesejahteraan pekerja"},{"key":"D","text":"ketidakpuasan pekerja terhadap pembayaran upah dan beban kerja"}],"answer":["B","C","D"]},{"n":30,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Sebuah pasar tradisional mulai didatangi pedagang dari luar daerah. Pedagang pendatang menawarkan barang dengan harga lebih murah dan menggunakan promosi melalui media sosial. Pedagang lama merasa jumlah pembelinya menurun dan menuduh pedagang pendatang merusak harga pasar. Ketegangan muncul ketika kedua kelompok memperebutkan tempat berjualan yang dianggap strategis."},{"kind":"text","text":"Fenomena sosial yang paling tepat dikaji melalui sosiologi adalah ...."}],"explanation":"Kasus tersebut menunjukkan persaingan, kepentingan ekonomi, dan konflik antarkelompok. Ketiga hal itu merupakan bagian dari ruang lingkup sosiologi karena berkaitan dengan hubungan dan dinamika sosial di masyarakat.","sourceId":"B3-SOS-B-01-01","category":"Hakikat dan Objek Kajian Sosiologi","options":[{"key":"A","text":"perbedaan masa penyimpanan barang dagangan di setiap kios pasar"},{"key":"B","text":"persaingan dan konflik antarkelompok dalam memperoleh sumber ekonomi"},{"key":"C","text":"perubahan warna kemasan produk yang dipasarkan melalui internet"},{"key":"D","text":"penggunaan alat pembayaran yang berbeda dalam kegiatan perdagangan"},{"key":"E","text":"perbedaan kualitas barang yang diperjualbelikan oleh pedagang"}],"answer":"B"}]},{"id":3,"title":"Paket 3","questions":[{"n":1,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Nasionalisme sebagai masyarakat yang lahir di Indonesia muncul pertama kali setelah Indische Partij terbentuk pada 1912. Partai ini melibatkan segala etnis, termasuk Eropa dan peranakan Indo. Kemudian peranakan Indo melebur dengan momentum nasionalisme berikutnya, Sumpah Pemuda 1928. Sumpah Pemuda menjadi ajang persatuan antara peranakan Tionghoa, Arab, dan Indo untuk jati dirinya sebagai orang Indonesia. Peristiwa ini mempertemukan kalangan tersebut untuk mengampanyekan persatuan. Berangsur-angsur setelah Sumpah Pemuda, berdirilah partai berbasis etnis yang mendukung nasionalisme. Kemudian pergerakan secara etnik perlahan pun melebur dengan kelompok nasionalisme lainnya. Tanpa sekat, dan bermuara pada kemerdekaan Indonesia."},{"kind":"text","text":"Sumber diadaptasi dari: https://nationalgeographic.grid.id/"},{"kind":"text","text":"Mengapa Sumpah Pemuda pada kasus tersebut bisa dikategorikan sebagai simbol multikulturalisme?"}],"explanation":"Sumpah Pemuda dalam ilustrasi mempertemukan berbagai kelompok etnik dalam satu tujuan bersama tanpa menjadikannya eksklusif bagi satu etnik tertentu. Sikap inklusif dan terbuka terhadap keberagaman inilah yang sesuai dengan prinsip masyarakat multikultural.","sourceId":"D2025-03","category":"TKA Sosiologi 2025","options":[{"key":"A","text":"Bersifat tidak eksklusif untuk satu kelompok etnik melainkan inklusif dan terbuka bagi semua etnik yang hidup di Indonesia."},{"key":"B","text":"Adanya bentuk tuntutan agar etnik yang bergabung turut serta menjadi bagian dari kelompok mayoritas."},{"key":"C","text":"Mencerminkan proses asimilasi nilai dan tujuan budaya-budaya yang berbeda demi menjaga identitas asli setiap etnik."},{"key":"D","text":"Terdapat dorongan untuk membangun partikularisme melalui partai-partai bernuansa etnik dalam meraih kemerdekaan."},{"key":"E","text":"Mengakomodasi berbagai etnik dari latar belakang berbeda untuk mendukung penghapusan identitasnya menjadi Indonesia."}],"answer":"A"},{"n":2,"type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Guru memilih enam peserta didik untuk melakukan penelitian mengenai kebiasaan membuang sampah. Pada pertemuan pertama, anggota belum memahami tugas masing-"},{"kind":"text","text":"masing dan terjadi perbedaan pendapat. Setelah berdiskusi, mereka menyepakati tujuan, membagi peran sebagai pengamat, pewawancara, pengolah data, dan penyaji hasil. Mereka juga menentukan batas waktu penyelesaian pekerjaan."},{"kind":"text","text":"Pernyataan yang benar berdasarkan proses pembentukan tim tersebut adalah ...."}],"explanation":"Kelompok dapat mengalami perbedaan pendapat pada tahap awal. Kelompok menjadi lebih terorganisasi setelah memiliki tujuan, pembagian peran, norma, dan kesepakatan kerja.","sourceId":"B2-BS2-05-09","category":"Kelompok Sosial","options":[{"key":"A","text":"kelompok hanya dapat terbentuk jika tidak pernah terjadi perbedaan pendapat"},{"key":"B","text":"pembagian peran membantu terbentuknya struktur kerja dalam kelompok"},{"key":"C","text":"penetapan tujuan bersama memperjelas arah kegiatan anggota kelompok"},{"key":"D","text":"perbedaan pendapat awal dapat menjadi bagian dari dinamika pembentukan"}],"answer":["B","C","D"]},{"n":3,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Kampung Cempaka dulunya merupakan permukiman padat dengan kegiatan sosial yang tinggi. Warga sering mengadakan kerja bakti, arisan RT, dan kegiatan keagamaan bersama. Namun, sejak banyak rumah dijual dan dibeli oleh pendatang dari luar daerah, suasana sosial berubah. Warga baru lebih tertutup, tidak aktif dalam kegiatan warga, dan lebih memilih berinteraksi melalui media sosial. Meskipun kawasan menjadi lebih bersih dan tertata, namun hubungan antarwarga melemah."},{"kind":"text","text":"Apa dampak jangka panjang dari pola interaksi sosial yang mulai berubah di Kampung Cempaka?"}],"explanation":"Hubungan antarwarga yang semakin lemah dan rendahnya keterlibatan dalam kegiatan bersama dapat mengikis rasa memiliki terhadap komunitas. Dalam jangka panjang hal ini berpotensi menurunkan kohesi sosial, sehingga pilihan C paling menggambarkan dampak mendalam dari perubahan pola interaksi.","sourceId":"D2025-26","category":"TKA Sosiologi 2025","options":[{"key":"A","text":"Norma sosial tetap bertahan meskipun jumlah interaksi warga semakin terbatas."},{"key":"B","text":"Kegiatan sosial berubah bentuk tanpa memperkuat hubungan antarwarga."},{"key":"C","text":"Partisipasi warga dalam kegiatan rutin mengalami penurunan yang tidak disadari."},{"key":"D","text":"Rasa memiliki terhadap komunitas perlahan terkikis karena kurangnya keterlibatan."},{"key":"E","text":"Kesadaran kolektif dalam menjaga lingkungan mulai melemah secara bertahap."}],"answer":"D"},{"n":4,"type":"tf","typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Peneliti akan mengkaji pengalaman anak yang bekerja di kawasan pasar. Penelitian membahas kondisi keluarga, jam kerja, pengalaman kekerasan, dan keberlanjutan sekolah. Identitas peserta berpotensi diketahui oleh pemberi kerja."},{"kind":"text","text":"Petunjuk: Kategorikan setiap tindakan sebagai Etis atau Tidak Etis."}],"explanation":"Peneliti harus melindungi identitas peserta, terutama anak dalam kondisi rentan. Partisipasi harus sukarela dan peserta berhak menolak pertanyaan atau menghentikan keikutsertaan tanpa tekanan.","sourceId":"B2-BS2-12-14","category":"Penelitian Sosial","statements":["Menjelaskan bahwa peserta dapat menghentikan wawancara kapan saja.","Menyamarkan nama, lokasi khusus, dan ciri yang dapat mengungkap identitas anak.","Memaksa anak menjawab seluruh pertanyaan agar data penelitian lengkap."],"answer":["B","B","S"],"categories":["Etis","Tidak Etis"]},{"n":5,"type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Siswa di sebuah sekolah sangat menyukai musik dan film dari berbagai negara. Mereka mulai mempelajari bahasa asing dan memahami kebudayaan lain. Namun, beberapa siswa menganggap kesenian daerah sendiri tidak relevan dan tidak perlu dipelajari."},{"kind":"text","text":"Sikap kritis yang tepat adalah ...."}],"explanation":"Sikap kritis terhadap globalisasi budaya berarti terbuka tetapi selektif, sekaligus tetap memiliki kesadaran terhadap identitas lokal.","sourceId":"B1-SOS-28-02","category":"Globalisasi","options":[{"key":"A","text":"menolak seluruh budaya asing agar budaya lokal tidak mengalami perubahan"},{"key":"B","text":"mempelajari budaya asing sebagai bagian dari perluasan wawasan"},{"key":"C","text":"menilai unsur budaya asing secara selektif sesuai nilai dan konteks masyarakat"},{"key":"D","text":"tetap mengenal dan mengembangkan budaya lokal sebagai identitas masyarakat"}],"answer":["B","C","D"]},{"n":6,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Penggunaan media sosial yang sangat banyak digemari oleh remaja menimbulkan kekhawatiran dapat mempengaruhi perilaku dan moral mereka. Kenakalan remaja yang makin rumit sering dihubungkan dengan interaksi mereka dengan konten online tertentu. Sehingga seorang peneliti melakukan penelitian pada remaja usia 13–18 tahun yang sering memakai media sosial. Peneliti tersebut mengumpulkan data dengan menyebarkan kuesioner online kepada 150 remaja. Kuesioner ini mempunyai dua bagian utama yaitu satu untuk mengukur seberapa sering dan bagaimana mereka menggunakan media sosial, dan bagian lainnya untuk mengukur tingkat kenakalan remaja berdasarkan pengalaman dan pandangan mereka sendiri."},{"kind":"text","text":"Manakah pernyataan yang menunjukkan metode penelitian yang sesuai dengan teknik pengumpulan data yang dilakukan?"}],"explanation":"Penggunaan kuesioner kepada 150 responden untuk mengukur dua variabel menunjukkan pendekatan kuantitatif. Dari pilihan yang tersedia, C paling sesuai karena menggambarkan penelitian kuantitatif yang menguji hubungan/pengaruh penggunaan media sosial terhadap kenakalan remaja. Catatan: stimulus tidak menjelaskan secara eksplisit teknik pengambilan sampel; karena itu bagian 'simple random sampling' pada opsi C dipilih sebagai opsi yang paling mendekati keseluruhan desain penelitian.","sourceId":"D2025-09","category":"TKA Sosiologi 2025","options":[{"key":"A","text":"Penelitian kuantitatif dengan teknik penentuan sampel simple random sampling berdasarkan rentang usia yang diambil secara acak untuk menganalisis pengaruh penggunaan media sosial terhadap tingkat kenakalan remaja."},{"key":"B","text":"Penelitian kualitatif dengan teknik penentuan sampel purposive sampling dengan menentukan kriteria tertentu untuk memahami dampak yang ditimbulkan dari fenomena penggunaan media sosial pada remaja."},{"key":"C","text":"Penelitian lapangan dengan teknik penentuan sampel area sampling berdasarkan area tertentu untuk mengobservasi fenomena penggunaan media sosial terhadap tingkat kenakalan remaja."},{"key":"D","text":"Penelitian eksperimen dengan teknik penentuan sampel stratified sampling karena penelitian ini membandingkan pada kelompok pengguna media sosial maupun yang tidak dari berbagai kalangan yang berbeda tingkatan."},{"key":"E","text":"Penelitian eksploratif dengan teknik penentuan sampel cluster sampling berdasarkan wilayah untuk mengeksplorasi fenomena penggunaan media sosial dapat mempengaruhi moral remaja."}],"answer":"A"},{"n":7,"type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Dua komunitas keagamaan menggunakan gedung serbaguna milik kelurahan. Konflik\n\nmuncul karena keduanya membutuhkan gedung pada waktu yang sama. Pemerintah kelurahan mempertemukan perwakilan komunitas, memeriksa jadwal, dan menyusun pembagian waktu secara bergiliran. Kedua kelompok menerima kesepakatan serta membentuk tim komunikasi bersama."},{"kind":"text","text":"Unsur yang menunjukkan pengelolaan masyarakat multikultural secara konstruktif adalah ...."}],"explanation":"Pengakuan, dialog, dan komunikasi antarkelompok memperkuat integrasi. Memberikan fasilitas hanya kepada kelompok mayoritas dapat memperbesar ketidaksetaraan.","sourceId":"B1-SOS-03-02","category":"Masyarakat Multikultural","options":[{"key":"A","text":"penyerahan gedung kepada kelompok yang memiliki anggota terbanyak"},{"key":"B","text":"pengakuan terhadap kebutuhan kedua komunitas secara seimbang"},{"key":"C","text":"pembentukan komunikasi bersama untuk mencegah konflik berulang"},{"key":"D","text":"dialog antarkelompok untuk menyusun kesepakatan penggunaan ruang"}],"answer":["B","C","D"]},{"n":8,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Sebuah perusahaan membuka lowongan staf administrasi untuk lulusan SMA. Persyaratan tertulis hanya mencantumkan kemampuan komputer dan komunikasi. Namun, dalam praktiknya, pelamar yang memiliki hubungan keluarga dengan pegawai lama lebih sering dipanggil untuk wawancara. Sejumlah pelamar lain dengan kemampuan yang sama bahkan lebih tinggi tidak memperoleh kesempatan karena tidak memiliki jaringan pribadi di dalam perusahaan."},{"kind":"text","text":"Faktor utama penyebab ketidaksetaraan kesempatan kerja tersebut adalah ...."}],"explanation":"Para pelamar memiliki kualifikasi relatif sebanding, tetapi akses mereka berbeda karena jaringan sosial atau koneksi. Kondisi tersebut menunjukkan bahwa modal sosial dapat menciptakan ketidaksetaraan kesempatan.","sourceId":"B3-SOS-B-17-01","category":"Kesetaraan dan Ketimpangan Sosial","options":[{"key":"A","text":"ketidaksamaan pengalaman organisasi yang dimiliki pelamar selama masih bersekolah"},{"key":"B","text":"perbedaan usia pelamar yang memengaruhi kemampuan menggunakan teknologi digital"},{"key":"C","text":"perbedaan motivasi individual ketika mempersiapkan diri mengikuti proses seleksi"},{"key":"D","text":"ketimpangan jaringan sosial yang memengaruhi akses terhadap kesempatan kerja"},{"key":"E","text":"perbedaan tingkat pendidikan formal yang dimiliki oleh setiap pelamar"}],"answer":"D"},{"n":9,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Survei terhadap 300 pekerja menunjukkan bahwa sebagian besar responden bersedia menggunakan bus kota apabila jadwal keberangkatan dapat diprediksi dan halte mudah dijangkau. Responden yang tetap menggunakan kendaraan pribadi menyebut waktu tunggu, perpindahan kendaraan, dan keamanan perjalanan sebagai pertimbangan utama."},{"kind":"text","text":"Harga tiket yang murah tidak selalu membuat responden beralih apabila waktu perjalanan dinilai terlalu lama."},{"kind":"text","text":"Simpulan penelitian yang paling tepat adalah ...."}],"explanation":"Hasil penelitian memperlihatkan bahwa keputusan menggunakan bus tidak hanya ditentukan harga. Kepastian jadwal, akses halte, keamanan, waktu tunggu, dan kemudahan perpindahan turut menentukan pilihan responden.","sourceId":"B2-BS2-07-04","category":"Penelitian Sosial","options":[{"key":"A","text":"seluruh pekerja akan menggunakan bus apabila pemerintah menurunkan harga tiket hingga setengahnya"},{"key":"B","text":"kendaraan pribadi selalu dipilih karena memberikan tingkat keamanan tertinggi bagi semua pekerja"},{"key":"C","text":"kesediaan menggunakan bus dipengaruhi oleh keterjangkauan, kepastian waktu, keamanan, dan kemudahan perjalanan"},{"key":"D","text":"harga tiket merupakan satu-satunya pertimbangan pekerja ketika memilih sarana transportasi harian"},{"key":"E","text":"jarak halte tidak memengaruhi pilihan transportasi selama kendaraan umum memiliki tempat duduk yang nyaman"}],"answer":"C"},{"n":10,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Petugas stasiun mengumumkan bahwa keberangkatan kereta mengalami keterlambatan. Para penumpang mendengar pengumuman tersebut, tetapi sebagian tidak memahami\n\nkarena suara pengeras terlalu pelan. Mereka tetap menunggu di jalur keberangkatan yang salah dan tidak memberikan tanggapan terhadap pesan petugas."},{"kind":"text","text":"Mengapa interaksi sosial belum berlangsung secara efektif dalam kasus tersebut?"}],"explanation":"Komunikasi membutuhkan pesan yang dapat diterima dan dimaknai. Dalam stimulus, suara yang tidak jelas menyebabkan penumpang gagal memahami informasi. Karena itu, komunikasi sebagai salah satu syarat interaksi belum berlangsung efektif.","sourceId":"B1-SOS-02-01","category":"Interaksi Sosial","options":[{"key":"A","text":"penumpang tidak berada di tempat yang sama ketika pengumuman mulai disampaikan"},{"key":"B","text":"petugas dan penumpang tidak mempunyai persamaan tujuan dalam menggunakan layanan"},{"key":"C","text":"petugas tidak menggunakan bahasa asing ketika mengumumkan perubahan keberangkatan"},{"key":"D","text":"pesan yang disampaikan tidak diterima dan dimaknai dengan jelas oleh penumpang"},{"key":"E","text":"penumpang tidak memiliki hubungan pribadi dengan petugas yang memberikan pengumuman"}],"answer":"D"},{"n":11,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Di sebuah kawasan pinggiran perkotaan yang padat penduduk, banyak keluarga hidup tanpa memiliki akses ke air bersih, sanitasi dan jaringan listrik yang stabil. Di kawasan ini banyak orang tua yang bekerja di sektor informal dengan pendapatan tidak teratur. Anak-anak di daerah ini sering putus sekolah karena mendukung ekonomi orang tuanya. Penduduknya merasa terasing dari perkembangan kota dan tidak banyak menerima dukungan dari program pemerintah. Hal ini menunjukkan adanya ketimpangan sosial dan hal tersebut pada akhirnya berkontribusi pada meningkatnya kemiskinan, layanan publik yang terbatas dan rendahnya literasi."},{"kind":"text","text":"Mengapa ketimpangan sosial dapat meningkatkan angka kemiskinan pada masyarakat perkotaan pada kasus tersebut?"}],"explanation":"Kemiskinan dalam kasus tersebut berkaitan dengan akses yang tidak merata terhadap air bersih, sanitasi, listrik, pendidikan, dan dukungan kebijakan. Ketika kelompok tertentu terus terpinggirkan dari layanan dasar, peluang untuk memperbaiki kondisi sosial-ekonomi juga menjadi terbatas sehingga kemiskinan dapat berulang.","sourceId":"D2025-22","category":"TKA Sosiologi 2025","options":[{"key":"A","text":"Penolakan kelompok marginal untuk direlokasi ke lingkungan yang lebih sehat, yang menyebabkan mereka tetap tinggal di wilayah tanpa akses layanan dasar."},{"key":"B","text":"Perencanaan keuangan buruk dan tingkat konsumsi yang tidak berimbang menyebabkan pendapatan dari sektor informal sulit mencukupi kebutuhan dasar."},{"key":"C","text":"Tradisi budaya yang memprioritaskan pendidikan formal daripada informal, sehingga mengabaikan keterampilan hidup yang relevan dengan kondisi masyarakat."},{"key":"D","text":"Kurangnya motivasi warga untuk memperbaiki kehidupan mereka sendiri karena tidak adanya bentuk pengangguran yang nyata di wilayah masyarakat berada."},{"key":"E","text":"Akses yang tidak merata terhadap layanan dasar dan ketidakberpihakan kebijakan yang menyebabkan warga terpinggirkan dan tidak mendapat layanan memadai."}],"answer":"E"},{"n":12,"type":"tf","typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Seorang supervisor menuduh seorang pekerja tidak menyelesaikan tugas dengan baik. Pada saat yang sama, serikat pekerja menuntut manajemen menaikkan upah seluruh pekerja. Di bagian lain, dua pekerja bertengkar karena saling menyalahkan atas kerusakan mesin."},{"kind":"text","text":"Petunjuk: Kategorikan setiap peristiwa sebagai Konflik Pribadi atau Konflik Antarkelas."}],"explanation":"Pertengkaran langsung antarindividu termasuk konflik pribadi. Tuntutan kolektif pekerja terhadap manajemen menunjukkan pertentangan kepentingan antara kelas pekerja dan pemilik atau pengelola modal.","sourceId":"B3-SOS-B-13-03","category":"Konflik Sosial","statements":["Pertengkaran antara dua pekerja akibat kerusakan mesin.","Perselisihan langsung antara supervisor dan seorang pekerja.","Tuntutan serikat pekerja terhadap manajemen mengenai upah."],"answer":["B","B","S"],"categories":["Pribadi","Antarkelas"]},{"n":13,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Konflik mulai terjadi ketika proyek pabrik yang didukung pemerintah lokal mulai dibangun di tanah yang secara tradisional menghidupi petani lokal. Petani mengatakan bahwa mereka tidak diberi informasi dan mengkhawatirkan nasib mereka akibat hilangnya mata pencaharian. Protes petani akhirnya viral di media sosial dan akhirnya mendapatkan perhatian dari pemerintah. Pemerintah lokal mengundang pihak petani dan pabrik untuk duduk bersama berdialog dengan fasilitasi tim perdamaian. Kesepakatan akhirnya terwujud dalam bentuk kompensasi, dibangunnya zona penyangga pertanian dan dilibatkannya warga (petani) dalam pengawasan proyek."},{"kind":"text","text":"Berdasarkan ilustrasi tersebut, apa cara yang paling efektif untuk meredakan konflik dan menciptakan harmoni sosial?"}],"explanation":"Ilustrasi menunjukkan bahwa konflik mereda setelah pihak-pihak yang berkepentingan duduk bersama dalam dialog yang difasilitasi tim perdamaian. Kesepakatan yang dihasilkan mencakup kompensasi, zona penyangga, dan pelibatan warga, sehingga dialog inklusif merupakan cara yang paling sesuai.","sourceId":"D2025-17","category":"TKA Sosiologi 2025","options":[{"key":"A","text":"Melanjutkan konstruksi tanpa mempertimbangkan keberatan warga."},{"key":"B","text":"Memindahkan lahan pertanian ke lokasi lain tanpa perundingan."},{"key":"C","text":"Melakukan dialog untuk menciptakan kesepakatan yang inklusif."},{"key":"D","text":"Menawarkan bagi hasil saham kepada petani tanpa jaminan tanah."},{"key":"E","text":"Menekan protes dengan melakukan mobilisasi aparat keamanan."}],"answer":"C"},{"n":14,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Banyak remaja di sebuah kota lebih bangga menggunakan bahasa asing dalam percakapan sehari-hari dan mulai jarang menggunakan bahasa daerah. Tokoh masyarakat ingin memperkuat identitas lokal tanpa menolak perkembangan global."},{"kind":"text","text":"Langkah yang paling tepat adalah ...."}],"explanation":"Sikap kritis terhadap globalisasi bukan menolak bahasa asing, melainkan menguatkan penggunaan bahasa daerah melalui pendidikan, kegiatan budaya, dan media modern. B. Pilihan Ganda Kompleks MCMA Petunjuk: Pilih lebih dari satu jawaban benar.","sourceId":"B2-BS2-29-04","category":"Kearifan Lokal","options":[{"key":"A","text":"membuat kegiatan sastra, lomba pidato, dan konten digital dalam bahasa daerah"},{"key":"B","text":"melarang semua penggunaan bahasa asing"},{"key":"C","text":"membiarkan bahasa daerah hilang dengan sendirinya"},{"key":"D","text":"mewajibkan semua orang berbicara bahasa daerah sepanjang waktu"},{"key":"E","text":"menghapus pelajaran bahasa asing di sekolah"}],"answer":"A"},{"n":15,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Sebuah kawasan industri dihuni oleh pekerja dari berbagai daerah. Mereka membawa bahasa, makanan, agama, dan kebiasaan yang berbeda. Setiap komunitas memiliki tempat berkumpul serta kegiatan budaya masing-masing. Walaupun jarang mengikuti kegiatan kelompok lain, para pekerja tetap berhubungan dalam pekerjaan, menggunakan fasilitas umum yang sama, dan menaati aturan lingkungan yang disepakati."},{"kind":"text","text":"Ciri masyarakat multikultural yang paling menonjol pada kasus tersebut adalah ...."}],"explanation":"Masyarakat multikultural terdiri atas kelompok-kelompok budaya yang tetap mempertahankan identitasnya, tetapi hidup dan berinteraksi dalam satu masyarakat. Mereka terhubung melalui pekerjaan, fasilitas, dan aturan bersama.","sourceId":"B3-SOS-B-03-01","category":"Masyarakat Multikultural","options":[{"key":"A","text":"setiap kelompok hidup terpisah tanpa memiliki hubungan dengan kelompok lainnya"},{"key":"B","text":"kelompok budaya mempertahankan identitas sambil hidup dalam satu sistem sosial"},{"key":"C","text":"seluruh kelompok melebur sehingga tidak memiliki ciri budaya yang berbeda lagi"},{"key":"D","text":"hubungan sosial hanya berlangsung karena semua pekerja berasal dari daerah sama"},{"key":"E","text":"masyarakat memiliki kebudayaan tunggal yang diterapkan kepada seluruh pekerja"}],"answer":"B"},{"n":16,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Pemerintah membangun jalan penghubung antara Desa Cakrawala dan pusat kabupaten. Sebelumnya, perjalanan ke kota membutuhkan waktu hampir dua jam. Setelah jalan selesai, warga lebih mudah membawa hasil pertanian ke pasar, pelajar dapat mencapai sekolah dengan lebih cepat, dan pedagang dari kota mulai membuka usaha di desa. Di sisi lain, sejumlah warung kecil lokal menghadapi persaingan yang lebih ketat."},{"kind":"text","text":"Analisis dampak perubahan sosial yang paling tepat adalah ...."}],"explanation":"Perubahan infrastruktur menghasilkan dampak multidimensional: mobilitas meningkat, akses pendidikan dan pasar membaik, tetapi persaingan ekonomi juga bertambah.","sourceId":"B1-SOS-26-01","category":"Perubahan Sosial","options":[{"key":"A","text":"pembangunan jalan menyebabkan seluruh usaha desa berhenti karena pedagang kota menguasai pasar setempat"},{"key":"B","text":"pembangunan jalan memperluas mobilitas dan kesempatan ekonomi, tetapi meningkatkan persaingan usaha lokal"},{"key":"C","text":"pembangunan jalan hanya berpengaruh terhadap transportasi tanpa memengaruhi kehidupan ekonomi masyarakat"},{"key":"D","text":"pembangunan jalan mengurangi interaksi masyarakat karena warga tidak lagi membutuhkan hubungan dengan kota"},{"key":"E","text":"pembangunan jalan meningkatkan keterisolasian desa karena mobilitas masyarakat semakin sulit dilakukan"}],"answer":"B"},{"n":17,"type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Sebuah kawasan industri dihuni oleh pekerja dari berbagai daerah. Mereka membawa bahasa, adat, dan kebiasaan yang berbeda. Pada awalnya, warga sering mengalami kesalahpahaman saat mengadakan kegiatan lingkungan. Setelah dibentuk forum warga dan kegiatan budaya bersama, komunikasi membaik dan prasangka antarkelompok mulai berkurang."},{"kind":"text","text":"Unsur yang dapat dikaji secara sosiologis berdasarkan stimulus adalah ...."}],"explanation":"Adaptasi, prasangka, interaksi antarkelompok, dan integrasi sosial merupakan ruang lingkup sosiologi. Kondisi biologis bukan fokus utama kasus tersebut.","sourceId":"B2-BS2-01-09","category":"Hakikat dan Objek Kajian Sosiologi","options":[{"key":"A","text":"proses adaptasi kelompok dengan latar belakang budaya berbeda"},{"key":"B","text":"prasangka dan perubahan hubungan sosial antarkelompok masyarakat"},{"key":"C","text":"perbedaan kondisi biologis penduduk yang berasal dari daerah berbeda"},{"key":"D","text":"peran forum warga dalam mendorong integrasi sosial di permukiman"}],"answer":["A","B","D"]},{"n":18,"type":"tf","typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Dua komunitas pemuda memiliki program yang hampir sama. Untuk menghindari tumpang tindih, keduanya membentuk organisasi baru dengan nama dan aturan yang disepakati. Sebagian kebiasaan lama masih dipertahankan, tetapi identitas organisasi sebelumnya tidak lagi digunakan."},{"kind":"text","text":"Petunjuk: Tentukan kategori Tepat atau Tidak Tepat untuk setiap pernyataan."}],"explanation":"Peleburan dua komunitas menjadi organisasi baru menunjukkan asimilasi. Kesepakatan aturan bersifat asosiatif. Hilangnya identitas lama merupakan hasil peleburan, bukan tanda meningkatnya persaingan.","sourceId":"B2-BS2-04-14","category":"Proses Sosial","statements":["Kesepakatan aturan bersama menunjukkan proses hubungan asosiatif.","Pembentukan organisasi baru menunjukkan proses asimilasi kelompok.","Hilangnya identitas organisasi lama menunjukkan persaingan semakin kuat."],"answer":["B","B","S"],"categories":["Tepat","Tidak Tepat"]},{"n":19,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Sejumlah keluarga pendatang menetap di Desa Mulyajaya. Mereka memiliki kebiasaan mengadakan kegiatan keluarga hingga malam dengan menggunakan pengeras suara. Penduduk lama terbiasa menjaga ketenangan setelah pukul sembilan malam. Teguran yang disampaikan penduduk lama dianggap sebagai penolakan terhadap identitas kelompok pendatang. Hubungan kedua kelompok kemudian menjadi renggang."},{"kind":"text","text":"Penyebab utama konflik pada kasus tersebut adalah ...."}],"explanation":"Penduduk lama dan pendatang mempunyai kebiasaan serta aturan tidak tertulis yang berbeda. Perbedaan tersebut tidak dikelola melalui komunikasi yang baik sehingga berkembang menjadi konflik budaya.","sourceId":"B1-SOS-15-01","category":"Konflik Sosial","options":[{"key":"A","text":"persaingan memperoleh jabatan dalam pemerintahan tingkat desa"},{"key":"B","text":"kesenjangan pendapatan antara keluarga lama dan keluarga pendatang"},{"key":"C","text":"perubahan jumlah penduduk yang terjadi secara bertahap di wilayah desa"},{"key":"D","text":"perbedaan kemampuan kelompok dalam memperoleh pendidikan formal"},{"key":"E","text":"perbedaan kebudayaan dan kebiasaan dalam kehidupan masyarakat"}],"answer":"E"},{"n":20,"type":"tf","typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Peneliti memperoleh kutipan wawancara berikut.\n\nInforman 1: “Petugasnya ramah, tetapi saya menunggu hampir dua jam.”\n\nInforman 2: “Saya kesulitan datang karena tidak ada angkutan dari desa.”\n\nInforman 3: “Informasi jadwal pemeriksaan sering berubah tanpa pemberitahuan.”"},{"kind":"text","text":"Sesuai."}],"explanation":"Kutipan menunjukkan penilaian yang beragam. Petugas dinilai ramah, tetapi terdapat persoalan waktu tunggu, akses transportasi, dan informasi jadwal. Tidak tepat menyimpulkan seluruh pelayanan dinilai sangat buruk.","sourceId":"B1-SOS-11-03","category":"Penelitian Sosial","statements":["Keramahan petugas dinilai baik, tetapi waktu tunggu masih menjadi persoalan.","Hambatan transportasi dapat membatasi akses sebagian warga terhadap layanan.","Semua informan menyatakan kualitas pelayanan puskesmas sangat buruk."],"answer":["B","B","S"],"categories":["Sesuai","Tidak Sesuai"]},{"n":21,"type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Sebuah sekolah mulai menggunakan sistem berbasis kecerdasan buatan untuk membantu pengolahan jadwal, rekap kehadiran, dan penyusunan laporan. Pekerjaan administratif dapat diselesaikan lebih cepat. Staf tata usaha kemudian lebih banyak melakukan verifikasi data dan pelayanan kepada warga sekolah. Sekolah juga mulai menyusun aturan mengenai keamanan dan kerahasiaan data."},{"kind":"text","text":"Dampak perubahan yang sesuai adalah ...."}],"explanation":"Teknologi mengubah efisiensi, pembagian kerja, dan kebutuhan regulasi. Perubahan tidak berarti seluruh tenaga manusia otomatis hilang.","sourceId":"B3-SOS-C-27-02","category":"Perubahan Sosial","options":[{"key":"A","text":"penggunaan kecerdasan buatan membuat seluruh tenaga administrasi tidak lagi diperlukan"},{"key":"B","text":"efisiensi pekerjaan administratif dapat meningkat setelah penggunaan teknologi baru"},{"key":"C","text":"sebagian peran staf berubah dari pekerjaan rutin menuju pekerjaan pengawasan dan pelayanan"},{"key":"D","text":"penggunaan sistem digital memunculkan kebutuhan baru terkait perlindungan data pribadi"}],"answer":["B","C","D"]},{"n":22,"type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Wilayah Utara berkembang menjadi pusat industri setelah pembangunan jalan tol dan pelabuhan baru. Banyak perusahaan membuka pabrik dan lapangan kerja di wilayah tersebut. Wilayah Selatan tetap mengandalkan pertanian dengan infrastruktur jalan yang terbatas. Dalam beberapa tahun, pendapatan rata-rata masyarakat Utara meningkat jauh lebih cepat daripada masyarakat Selatan."},{"kind":"text","text":"Faktor yang berkontribusi terhadap ketidaksetaraan tersebut adalah ...."}],"explanation":"Ketimpangan regional dapat terbentuk karena pembangunan dan investasi terkonsentrasi pada wilayah tertentu. Akibatnya, peluang kerja dan pendapatan berkembang tidak seimbang.","sourceId":"B2-BS2-17-09","category":"Kesetaraan dan Ketimpangan Sosial","options":[{"key":"A","text":"kesamaan kesempatan memperoleh pekerjaan industri pada kedua wilayah"},{"key":"B","text":"perbedaan struktur kegiatan ekonomi yang berkembang pada kedua wilayah"},{"key":"C","text":"konsentrasi investasi serta kesempatan kerja pada satu wilayah tertentu"},{"key":"D","text":"perbedaan pembangunan infrastruktur antara wilayah Utara dan Selatan"}],"answer":["B","C","D"]},{"n":23,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Perhatikan grafik di bawah ini!"},{"kind":"text","text":"Data grafik (editable)"},{"kind":"table","rows":[["Jenis Kegiatan","Jumlah"],["Daur Ulang Sampah","50"],["Penanaman Pohon","80"],["Bersih Sungai","120"]]},{"kind":"text","text":"Berdasarkan grafik hasil penelitian di atas, penjelasan manakah yang paling tepat mengenai pola partisipasi komunitas dalam kegiatan lingkungan?"}],"explanation":"Data menunjukkan Daur Ulang Sampah 50 peserta, Penanaman Pohon 80 peserta, dan Bersih Sungai 120 peserta. Karena jumlah 120 adalah yang tertinggi, kegiatan bersih sungai merupakan kegiatan dengan partisipasi komunitas terbanyak.","sourceId":"D2025-11","category":"TKA Sosiologi 2025","options":[{"key":"A","text":"Masyarakat cenderung tidak tertarik pada kegiatan lingkungan yang bersifat fisik seperti penanaman pohon."},{"key":"B","text":"Tidak ada perbedaan yang signifikan antara partisipasi dalam penanaman pohon dan daur ulang sampah."},{"key":"C","text":"Semua jenis kegiatan lingkungan memiliki tingkat partisipasi yang seragam dan tinggi."},{"key":"D","text":"Daur ulang sampah merupakan kegiatan yang paling sukses dalam menarik jumlah peserta terbanyak."},{"key":"E","text":"Kegiatan bersih sungai adalah yang paling populer dan menarik partisipasi komunitas terbanyak."}],"answer":"E"},{"n":24,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Seorang siswa baru sering diejek karena logat daerahnya berbeda. Awalnya ejekan hanya dilakukan dua siswa, tetapi beberapa teman lain kemudian ikut menertawakan agar diterima dalam kelompok. Korban mulai menghindari kegiatan kelas dan prestasinya menurun. Setelah beberapa video ejekan disebarkan melalui grup percakapan, kasus tersebut diketahui guru dan orang tua."},{"kind":"text","text":"Dinamika permasalahan sosial yang paling tepat ditunjukkan oleh kasus tersebut adalah ...."}],"explanation":"Kasus menunjukkan bahwa permasalahan berkembang melalui tekanan dan pengaruh kelompok sebaya. Perilaku dua siswa kemudian diperkuat ketika anggota lain ikut terlibat, sehingga perundungan semakin meluas dan berdampak pada korban.","sourceId":"B3-SOS-C-21-01","category":"Permasalahan Sosial","options":[{"key":"A","text":"keterlibatan teman lain menunjukkan seluruh siswa mempunyai sikap yang sama terhadap korban"},{"key":"B","text":"prestasi belajar korban menurun semata-mata karena kemampuan akademiknya tidak berkembang"},{"key":"C","text":"perbedaan logat berkembang menjadi perundungan karena penguatan perilaku oleh kelompok sebaya"},{"key":"D","text":"penggunaan grup percakapan merupakan satu-satunya penyebab munculnya konflik antarindividu"},{"key":"E","text":"perpindahan siswa ke sekolah baru selalu menyebabkan munculnya permasalahan sosial baru"}],"answer":"C"},{"n":25,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Mahasiswa yang berasal dari Kabupaten Ranah Indah kuliah di berbagai perguruan tinggi di Kota Madani. Pada awalnya, mereka saling mengenal melalui media sosial. Kesamaan daerah asal, bahasa, dan kebiasaan membuat hubungan mereka semakin dekat. Mereka kemudian membentuk paguyuban untuk membantu mahasiswa baru, mengadakan kegiatan budaya, dan memberikan bantuan ketika salah satu anggota mengalami kesulitan."},{"kind":"text","text":"Proses terbentuknya kelompok sosial tersebut terutama didasari oleh ...."}],"explanation":"Kesamaan asal daerah, bahasa, dan kebiasaan menumbuhkan kedekatan serta perasaan senasib sebagai perantau. Faktor tersebut menjadi dasar pembentukan kelompok sosial berupa paguyuban mahasiswa.","sourceId":"B3-SOS-B-05-01","category":"Kelompok Sosial","options":[{"key":"A","text":"kewajiban pemerintah daerah mengorganisasi seluruh mahasiswa perantau"},{"key":"B","text":"kesamaan asal daerah yang menumbuhkan rasa memiliki antaranggota"},{"key":"C","text":"keinginan anggota memperoleh kedudukan tinggi dalam organisasi kampus"},{"key":"D","text":"perbedaan perguruan tinggi yang mendorong persaingan antarmahasiswa"},{"key":"E","text":"kesamaan kemampuan akademik dalam menyelesaikan tugas perkuliahan"}],"answer":"B"},{"n":26,"type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Sebuah video peserta didik saat melakukan kesalahan dalam presentasi diunggah tanpa izin. Video tersebut disebarkan dan diberi komentar menghina. Korban merasa malu, menutup akun media sosial, dan tidak mau kembali melakukan presentasi. Di kelas, peserta didik terbagi menjadi kelompok yang membela korban dan kelompok yang menganggap kejadian tersebut sebagai hiburan."},{"kind":"text","text":"Dampak yang tepat berdasarkan kasus tersebut adalah ...."}],"explanation":"Perundungan siber dapat berlangsung luas dan terus-menerus. Dampaknya mencakup tekanan psikologis, penurunan partisipasi akademik, serta polarisasi dalam kelompok. Menghapus akun tidak otomatis memulihkan kondisi korban.","sourceId":"B3-SOS-B-06-02","category":"Permasalahan Sosial","options":[{"key":"A","text":"penyebaran video dapat memperluas jangkauan perundungan melampaui lingkungan sekolah"},{"key":"B","text":"penghapusan akun media sosial menjamin seluruh dampak psikologis korban segera berakhir"},{"key":"C","text":"korban dapat mengalami penurunan rasa percaya diri dan partisipasi dalam pembelajaran"},{"key":"D","text":"perbedaan sikap peserta didik dapat memicu ketegangan antarkelompok di dalam kelas"}],"answer":["A","C","D"]},{"n":27,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Desa Pantai Indah berkembang menjadi tujuan wisata internasional. Pemilik lahan di sekitar pantai memperoleh keuntungan besar dari penjualan tanah dan usaha penginapan. Sebaliknya, sebagian nelayan yang tidak memiliki tanah hanya bekerja sebagai buruh wisata dengan pendapatan tidak tetap. Harga kebutuhan sehari-hari dan biaya sewa rumah juga meningkat."},{"kind":"text","text":"Dampak globalisasi yang paling tepat dievaluasi dari kasus tersebut adalah ...."}],"explanation":"Globalisasi pariwisata dapat meningkatkan pendapatan wilayah, tetapi manfaatnya tidak selalu sama. Pemilik aset memperoleh keuntungan lebih besar, sedangkan kelompok tanpa aset dapat tetap berada pada pekerjaan berpendapatan rendah. B. Pilihan Ganda Kompleks MCMA Petunjuk: Pilih semua jawaban yang benar.","sourceId":"B2-BS2-22-04","category":"Globalisasi","options":[{"key":"A","text":"sektor pariwisata internasional selalu menghapus pekerjaan tradisional tanpa menciptakan pekerjaan baru"},{"key":"B","text":"pertumbuhan pariwisata dapat meningkatkan ekonomi sekaligus memperlebar perbedaan manfaat antarkelompok"},{"key":"C","text":"berkembangnya pariwisata membuat seluruh warga desa beralih menjadi pengusaha wisata yang mandiri"},{"key":"D","text":"keberadaan wisatawan asing menyebabkan seluruh ketimpangan sosial di desa menjadi berkurang"},{"key":"E","text":"meningkatnya harga kebutuhan menunjukkan semua penduduk desa memiliki daya beli yang lebih besar"}],"answer":"B"},{"n":28,"type":"tf","typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Alumni sebuah sekolah membentuk komunitas untuk berbagi informasi pekerjaan, memberikan beasiswa, dan membantu anggota yang mengalami kesulitan. Setelah komunitas berkembang, anggota yang memiliki jabatan tinggi lebih sering menentukan program. Sebagian anggota lain merasa pendapatnya kurang diperhatikan dan mulai pasif mengikuti kegiatan. Tentukan ketepatan setiap pernyataan berikut."},{"kind":"text","text":"Tentukan kategori setiap pernyataan berdasarkan stimulus."}],"explanation":"Kelompok alumni memiliki struktur, tujuan, dan pola hubungan. Ketimpangan pengaruh dapat dianalisis melalui konsep kekuasaan dan stratifikasi. Perbedaan pendapat menjadi kajian sosiologi ketika memengaruhi dinamika kelompok.","sourceId":"B3-SOS-B-01-03","category":"Hakikat dan Objek Kajian Sosiologi","statements":["Dominasi anggota tertentu berkaitan dengan kekuasaan dan stratifikasi dalam kelompok.","Perbedaan pendapat anggota tidak termasuk kajian sosiologi karena bersifat pribadi sepenuhnya.","Pembentukan komunitas alumni dapat dikaji sebagai proses terbentuknya kelompok sosial."],"answer":["B","S","B"],"categories":["Tepat","Tidak Tepat"]},{"n":29,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"JENIS-JENIS KELOMPOK SOSIAL DI SEKITAR KITA"},{"kind":"text","text":"• KELOMPOK PRIMER: Hubungan dekat dan bersifat personal, seperti keluarga atau sahabat.\n• KELOMPOK SEKUNDER: Interaksi lebih formal dan berorientasi pada tujuan tertentu, seperti organisasi sekolah.\n• KELOMPOK FORMAL: Memiliki struktur, aturan, dan keanggotaan resmi.\n• KELOMPOK INFORMAL: Terbentuk secara spontan tanpa aturan resmi, seperti teman bermain."},{"kind":"text","text":"Manakah pernyataan yang paling tepat menunjukkan perbedaan kelompok sosial pada infografis tersebut?"}],"explanation":"OSIS merupakan kelompok sekunder karena hubungan antaranggota relatif lebih formal, berorientasi pada tujuan organisasi, dan tidak semata-mata didasarkan pada kedekatan pribadi. Ciri tersebut sesuai dengan pilihan E.","sourceId":"D2025-18","category":"TKA Sosiologi 2025","options":[{"key":"A","text":"Keluarga menunjukkan kelompok informal yang terbentuk secara spontan dan alami dari interaksi sosial yang terjadi karena adanya kesamaan minat, hobi, atau tujuan."},{"key":"B","text":"Organisasi pramuka menunjukkan kelompok primer yang ditandai dengan adanya hubungan yang sangat erat, personal, intim, dan interaksi tatap muka yang sering."},{"key":"C","text":"Teman bermain menunjukkan kelompok formal yang dibentuk secara sengaja dan terencana dengan tujuan serta struktur yang jelas dan memiliki aturan yang tertulis."},{"key":"D","text":"Organisasi OSIS menunjukkan kelompok sekunder yang dicirikan oleh hubungan yang lebih formal, impersonal, dan berdasarkan tujuan atau kepentingan tertentu."},{"key":"E","text":"Kelompok belajar menunjukkan kelompok primer yang ditandai oleh adanya hubungan yang sangat erat, personal, intim, dan interaksi tatap muka yang sering."}],"answer":"D"},{"n":30,"type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Tiga calon ketua OSIS menyampaikan program melalui debat terbuka. Setiap calon berusaha memperoleh dukungan dengan menjelaskan rencana kegiatan dan rekam jejaknya. Salah satu tim pendukung kemudian menyebarkan rumor yang belum terbukti mengenai calon lain. Guru meminta rumor dihentikan dan mengadakan klarifikasi bersama."},{"kind":"text","text":"Pernyataan yang benar berdasarkan kasus tersebut adalah ...."}],"explanation":"Debat program adalah persaingan yang wajar. Penyebaran rumor termasuk kontravensi karena bertujuan melemahkan pihak lain secara tidak langsung. Klarifikasi menjadi bentuk akomodasi. Perbedaan calon tidak otomatis menjadi konflik.","sourceId":"B1-SOS-04-02","category":"Proses Sosial","options":[{"key":"A","text":"penyebaran rumor merupakan bentuk kontravensi dalam proses pemilihan"},{"key":"B","text":"klarifikasi bersama merupakan upaya akomodasi untuk meredakan ketegangan"},{"key":"C","text":"penyampaian program merupakan persaingan yang berlangsung secara terbuka"},{"key":"D","text":"seluruh rangkaian pemilihan merupakan konflik karena terdapat calon berbeda"}],"answer":["A","B","C"]}]},{"id":4,"title":"Paket 4","questions":[{"n":1,"type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Banyak remaja membeli pakaian, kosmetik, dan perangkat elektronik setelah melihat promosi tokoh digital. Sebagian menggunakan fasilitas pembayaran tertunda karena tidak memiliki cukup uang. Tagihan kemudian meningkat akibat denda dan bunga. Beberapa remaja menyembunyikan utang dari orang tua, menjual barang pribadi, dan mengalami stres ketika waktu pembayaran mendekat."},{"kind":"text","text":"Dampak konsumerisme yang tepat ditunjukkan oleh ...."}],"explanation":"Konsumerisme membuat keinginan diperlakukan sebagai kebutuhan. Ketika pembelian dilakukan melalui utang, muncul tekanan ekonomi, stres, dan konflik kepercayaan dalam keluarga. Kepemilikan barang tidak menjamin status sosial yang tetap.","sourceId":"B1-SOS-06-02","category":"Permasalahan Sosial","options":[{"key":"A","text":"penggunaan pembayaran tertunda dapat menimbulkan utang serta tekanan psikologis"},{"key":"B","text":"penyembunyian tagihan dapat mengganggu keterbukaan dan kepercayaan dalam\nkeluarga"},{"key":"C","text":"kepemilikan barang populer selalu meningkatkan kedudukan sosial secara berkelanjutan"},{"key":"D","text":"pembelian berdasarkan tren dapat menggeser pertimbangan kebutuhan dan kemampuan ekonomi"}],"answer":["A","B","D"]},{"n":2,"type":"tf","typeLabel":"Pilihan Ganda Kompleks Kat
