rga dalam memenuhi kebutuhan ekonomi sehari-hari"},{"key":"D","text":"ketidaksamaan kebiasaan masyarakat ketika mengikuti kegiatan di lingkungan tempat tinggal"},{"key":"E","text":"perbedaan pandangan politik masyarakat terhadap program bantuan yang disediakan pemerintah"}],"statements":[],"categories":[],"answer":"A","explanation":"Digitalisasi tidak otomatis dapat diakses semua kelompok. Ketidaksetaraan muncul karena kesenjangan digital, yaitu perbedaan kepemilikan perangkat, akses internet, dan kemampuan menggunakan teknologi.","validation":"Sumber lama","reviewNotes":[]},{"id":"B1-SOS-17-02","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 17(2).docx","n":8,"title":"Penyandang Disabilitas di Dunia Kerja","category":"Kesetaraan dan Ketimpangan Sosial","subcategory":"Faktor Ketidaksetaraan","type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Sebuah survei menemukan bahwa sebagian penyandang disabilitas memiliki pendidikan dan keterampilan yang sesuai dengan lowongan kerja. Namun, beberapa perusahaan belum menyediakan akses gedung yang ramah kursi roda. Selain itu, terdapat perusahaan yang menganggap pekerja dengan disabilitas akan kurang produktif meskipun belum melakukan penilaian kemampuan secara individual."},{"kind":"text","text":"Faktor penyebab ketidaksetaraan kesempatan kerja pada kasus tersebut adalah ...."}],"options":[{"key":"A","text":"keterbatasan aksesibilitas fisik pada lingkungan tempat kerja"},{"key":"B","text":"stereotip perusahaan mengenai kemampuan penyandang disabilitas"},{"key":"C","text":"praktik rekrutmen yang belum memberikan kesempatan secara setara"},{"key":"D","text":"rendahnya kemampuan seluruh penyandang disabilitas dalam melaksanakan pekerjaan"}],"statements":[],"categories":[],"answer":"A, B, dan C","explanation":"Stimulus memperlihatkan hambatan fasilitas, stereotip, dan praktik kelembagaan. Tidak ada dasar untuk menyatakan seluruh penyandang disabilitas memiliki kemampuan rendah.","validation":"Sumber lama","reviewNotes":[]},{"id":"B1-SOS-18-01","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 18(2).docx","n":3,"title":"Perubahan Kawasan Permukiman","category":"Kesetaraan dan Ketimpangan Sosial","subcategory":"Dampak Ketidaksetaraan","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Sebuah kawasan yang dahulu dihuni keluarga berpenghasilan rendah berkembang menjadi pusat kuliner dan wisata. Harga tanah serta biaya sewa meningkat tajam. Sebagian pemilik rumah memperoleh keuntungan dari kenaikan harga properti, tetapi banyak keluarga penyewa harus pindah ke wilayah yang lebih jauh. Warga lama juga mengeluhkan berkurangnya interaksi karena tetangga yang telah tinggal bersama selama bertahun-tahun tersebar ke berbagai tempat."},{"kind":"text","text":"Dampak sosial yang paling kuat dari kondisi tersebut adalah ...."}],"options":[{"key":"A","text":"meningkatnya pemerataan kepemilikan rumah bagi seluruh kelompok masyarakat di kawasan tersebut"},{"key":"B","text":"menguatnya solidaritas warga karena seluruh keluarga memperoleh manfaat ekonomi yang sama besar"},{"key":"C","text":"berkurangnya mobilitas penduduk karena biaya tempat tinggal semakin mudah dijangkau masyarakat"},{"key":"D","text":"melemahnya ikatan sosial akibat tersingkirnya sebagian warga dari lingkungan tempat tinggalnya"},{"key":"E","text":"hilangnya seluruh kegiatan ekonomi masyarakat setelah kawasan berkembang menjadi tujuan wisata"}],"statements":[],"categories":[],"answer":"D","explanation":"Kenaikan harga kawasan dapat mendorong kelompok berpenghasilan rendah keluar dari lingkungan lama. Dampaknya adalah perubahan komposisi penduduk dan melemahnya jaringan sosial yang sebelumnya terbentuk.","validation":"Sumber lama","reviewNotes":[]},{"id":"B1-SOS-18-02","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 18(2).docx","n":8,"title":"Representasi Politik","category":"Kesetaraan dan Ketimpangan Sosial","subcategory":"Dampak Ketidaksetaraan","type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Di sebuah kota, perempuan membentuk sekitar separuh jumlah penduduk, tetapi hanya sedikit yang terlibat dalam forum penyusunan anggaran daerah. Sebagian besar keputusan ditentukan kelompok yang sudah lama memiliki jaringan politik. Program yang berkaitan dengan keamanan transportasi perempuan dan fasilitas penitipan anak beberapa kali tidak masuk dalam prioritas anggaran."},{"kind":"text","text":"Dampak ketidaksetaraan partisipasi politik tersebut adalah ...."}],"options":[{"key":"A","text":"seluruh keputusan pemerintah pasti merugikan setiap perempuan di wilayah kota"},{"key":"B","text":"kepentingan sebagian kelompok masyarakat berisiko kurang terwakili dalam kebijakan"},{"key":"C","text":"dominasi kelompok tertentu dapat menyebabkan distribusi perhatian pemerintah tidak seimbang"},{"key":"D","text":"rendahnya representasi dapat mengurangi rasa percaya terhadap proses pengambilan keputusan"}],"statements":[],"categories":[],"answer":"B, C, dan D","explanation":"Ketimpangan representasi dapat mengakibatkan kebutuhan kelompok tertentu kurang diperhatikan dan menurunkan kepercayaan terhadap lembaga. Tidak tepat menyatakan semua keputusan pasti merugikan seluruh perempuan.","validation":"Sumber lama","reviewNotes":[]},{"id":"B1-SOS-19-01","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 19(2).docx","n":3,"title":"Akses Gedung Pelayanan Publik","category":"Kesetaraan dan Ketimpangan Sosial","subcategory":"Prinsip Kesetaraan dan Inklusi","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Pemerintah kota merenovasi kantor pelayanan masyarakat. Selain tangga, gedung dilengkapi jalur landai, lift, toilet aksesibel, penanda braille, dan meja pelayanan dengan ketinggian yang dapat digunakan pengguna kursi roda. Pemerintah menyatakan bahwa seluruh warga harus dapat menggunakan pelayanan yang sama tanpa terhalang kondisi fisiknya."},{"kind":"text","text":"Prinsip kesetaraan yang diterapkan dalam kasus tersebut adalah ...."}],"options":[{"key":"A","text":"aksesibilitas agar fasilitas publik dapat digunakan warga dengan kebutuhan berbeda"},{"key":"B","text":"kompetisi agar setiap warga memperoleh pelayanan berdasarkan kemampuan individual"},{"key":"C","text":"segregasi agar kelompok berbeda memperoleh pelayanan pada gedung yang berbeda"},{"key":"D","text":"dominasi agar kelompok mayoritas menentukan fasilitas yang disediakan pemerintah"},{"key":"E","text":"homogenitas agar seluruh warga menggunakan fasilitas dalam bentuk yang sama persis"}],"statements":[],"categories":[],"answer":"A","explanation":"Penyediaan jalur landai, braille, dan fasilitas aksesibel merupakan penerapan prinsip aksesibilitas dan inklusi, yaitu menghilangkan hambatan agar seluruh warga dapat menggunakan pelayanan publik secara setara.","validation":"Sumber lama","reviewNotes":[]},{"id":"B1-SOS-19-02","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 19(2).docx","n":8,"title":"Forum Pemuda Kecamatan","category":"Kesetaraan dan Ketimpangan Sosial","subcategory":"Prinsip Kesetaraan dan Inklusi","type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Pemerintah kecamatan membentuk forum pemuda yang melibatkan perwakilan setiap desa, laki-laki dan perempuan, pemuda penyandang disabilitas, serta kelompok dari latar belakang budaya berbeda. Pertemuan dilaksanakan di gedung yang mudah diakses dan setiap perwakilan memperoleh kesempatan berbicara."},{"kind":"text","text":"Prinsip yang tercermin pada kebijakan tersebut adalah ...."}],"options":[{"key":"A","text":"representasi yang memberi ruang bagi beragam kelompok dalam forum"},{"key":"B","text":"inklusivitas yang mencegah kelompok tertentu tersisih dari kegiatan"},{"key":"C","text":"kesetaraan partisipasi dalam menyampaikan gagasan dan kepentingan"},{"key":"D","text":"dominasi mayoritas dalam menentukan keputusan sebelum forum dimulai"}],"statements":[],"categories":[],"answer":"A, B, dan C","explanation":"Forum tersebut memberi keterwakilan, akses, dan kesempatan berpartisipasi kepada kelompok yang beragam. Hal tersebut merupakan ciri kesetaraan yang inklusif.","validation":"Sumber lama","reviewNotes":[]},{"id":"B1-SOS-13-01","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 13(2).docx","n":3,"title":"Pembangunan Tambang di Wilayah Adat","category":"Konflik Sosial","subcategory":"Bentuk dan Jenis Konflik","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Sebuah perusahaan tambang memperoleh izin pemerintah untuk beroperasi di wilayah yang selama ini dikelola masyarakat adat. Warga menolak karena khawatir kehilangan lahan pertanian dan sumber air. Perusahaan tetap melanjutkan pembangunan dengan dukungan aparat. Warga kemudian melakukan aksi protes dan menutup akses menuju lokasi tambang."},{"kind":"text","text":"Bentuk konflik berdasarkan posisi pihak yang terlibat adalah ...."}],"options":[{"key":"A","text":"konflik vertikal karena melibatkan masyarakat dan pihak yang lebih berkuasa"},{"key":"B","text":"konflik horizontal karena melibatkan kelompok berkedudukan sosial setara"},{"key":"C","text":"konflik pribadi karena hanya melibatkan dua tokoh yang berbeda pandangan"},{"key":"D","text":"konflik rasial karena terjadi akibat perbedaan ciri keturunan masyarakat"},{"key":"E","text":"konflik internasional karena perusahaan beroperasi di lebih dari satu negara"}],"statements":[],"categories":[],"answer":"A","explanation":"Konflik melibatkan masyarakat dengan perusahaan dan pemerintah yang memiliki kekuasaan lebih besar. Perbedaan posisi tersebut menunjukkan konflik vertikal.","validation":"Sumber lama","reviewNotes":[]},{"id":"B1-SOS-13-02","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 13(2).docx","n":8,"title":"Bentrokan Pendukung Klub Olahraga","category":"Konflik Sosial","subcategory":"Bentuk dan Jenis Konflik","type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Dua kelompok pendukung klub sepak bola bertemu di stasiun setelah pertandingan. Mereka saling mengejek mengenai hasil pertandingan dan sejarah klub. Ejekan berkembang menjadi perkelahian serta perusakan fasilitas umum. Petugas kemudian memisahkan kedua kelompok."},{"kind":"text","text":"Pernyataan yang tepat adalah ...."}],"options":[{"key":"A","text":"konflik termasuk konflik antarkelompok karena melibatkan dua kelompok pendukung"},{"key":"B","text":"konflik bersifat horizontal karena kedua kelompok memiliki kedudukan relatif sejajar"},{"key":"C","text":"konflik dipicu kuatnya identitas kelompok dan sikap fanatik antarpendukung"},{"key":"D","text":"konflik termasuk konflik antarkelas karena mempertemukan buruh dan pemilik modal"}],"statements":[],"categories":[],"answer":"A, B, dan C","explanation":"Dua kelompok pendukung berhadapan karena identitas dan fanatisme terhadap klub. Posisi mereka relatif setara sehingga konflik bersifat horizontal, bukan konflik antarkelas.","validation":"Sumber lama","reviewNotes":[]},{"id":"B1-SOS-14-01","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 14(2).docx","n":3,"title":"Pengemudi Angkutan Daring dan Perusahaan Platform","category":"Konflik Sosial","subcategory":"Penyelesaian Konflik Berbasis Data","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Perusahaan aplikasi menurunkan tarif perjalanan tanpa berkonsultasi dengan pengemudi. Pengemudi menilai kebijakan tersebut menurunkan pendapatan, sedangkan perusahaan menyatakan tarif baru diperlukan agar layanan tetap bersaing. Aksi penghentian layanan menyebabkan penumpang kesulitan memperoleh transportasi."},{"kind":"text","text":"Rekomendasi penyelesaian konflik yang paling tepat adalah ...."}],"options":[{"key":"A","text":"meminta pengemudi menerima tarif baru karena perusahaan menyediakan aplikasinya"},{"key":"B","text":"memblokir aplikasi hingga perusahaan memenuhi seluruh tuntutan para pengemudi"},{"key":"C","text":"melakukan perundingan dengan membuka data tarif, biaya, dan pendapatan pengemudi"},{"key":"D","text":"menyerahkan penetapan tarif kepada penumpang melalui penawaran setiap perjalanan"},{"key":"E","text":"menghentikan layanan angkutan daring agar konflik tidak memengaruhi masyarakat"}],"statements":[],"categories":[],"answer":"C","explanation":"Perundingan perlu didasarkan pada data yang transparan agar kedua pihak memahami\nstruktur biaya dan dampak kebijakan. Solusi dapat berbentuk penyesuaian tarif, insentif, atau batas potongan yang disepakati.","validation":"Sumber lama","reviewNotes":[]},{"id":"B1-SOS-14-02","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 14(2).docx","n":8,"title":"Pemilihan Ketua Organisasi Mahasiswa","category":"Konflik Sosial","subcategory":"Penyelesaian Konflik Berbasis Data","type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Dua calon ketua organisasi mahasiswa saling menuduh melakukan manipulasi suara. Salah satu kelompok menolak hasil pemilihan, sedangkan panitia menyatakan seluruh proses telah berjalan sesuai aturan. Bukti yang beredar di media sosial belum diperiksa secara resmi."},{"kind":"text","text":"Langkah yang tepat dilakukan adalah ...."}],"options":[{"key":"A","text":"membentuk tim pemeriksa netral yang tidak berafiliasi dengan kedua calon"},{"key":"B","text":"memverifikasi daftar pemilih, berita acara, dan hasil penghitungan suara"},{"key":"C","text":"mendiskualifikasi calon yang dituduh tanpa menunggu pemeriksaan bukti"},{"key":"D","text":"menyusun mekanisme keberatan dan keputusan yang dapat diperiksa peserta"}],"statements":[],"categories":[],"answer":"A, B, dan D","explanation":"Pemeriksaan netral, verifikasi dokumen, dan mekanisme keberatan diperlukan untuk menjaga legitimasi pemilihan. Diskualifikasi tanpa bukti melanggar asas keadilan dan dapat memicu konflik baru.","validation":"Sumber lama","reviewNotes":[]},{"id":"B1-SOS-15-01","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 15(2).docx","n":3,"title":"Penolakan Tradisi Pendatang","category":"Konflik Sosial","subcategory":"Penyebab Konflik","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Sejumlah keluarga pendatang menetap di Desa Mulyajaya. Mereka memiliki kebiasaan mengadakan kegiatan keluarga hingga malam dengan menggunakan pengeras suara. Penduduk lama terbiasa menjaga ketenangan setelah pukul sembilan malam. Teguran yang disampaikan penduduk lama dianggap sebagai penolakan terhadap identitas kelompok pendatang. Hubungan kedua kelompok kemudian menjadi renggang."},{"kind":"text","text":"Penyebab utama konflik pada kasus tersebut adalah ...."}],"options":[{"key":"A","text":"perbedaan kebudayaan dan kebiasaan dalam kehidupan masyarakat"},{"key":"B","text":"persaingan memperoleh jabatan dalam pemerintahan tingkat desa"},{"key":"C","text":"kesenjangan pendapatan antara keluarga lama dan keluarga pendatang"},{"key":"D","text":"perubahan jumlah penduduk yang terjadi secara bertahap di wilayah desa"},{"key":"E","text":"perbedaan kemampuan kelompok dalam memperoleh pendidikan formal"}],"statements":[],"categories":[],"answer":"A","explanation":"Penduduk lama dan pendatang mempunyai kebiasaan serta aturan tidak tertulis yang berbeda. Perbedaan tersebut tidak dikelola melalui komunikasi yang baik sehingga berkembang menjadi konflik budaya.","validation":"Sumber lama","reviewNotes":[]},{"id":"B1-SOS-15-02","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 15(2).docx","n":8,"title":"Pertentangan Antarsuporter","category":"Konflik Sosial","subcategory":"Penyebab Konflik","type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Dua kelompok suporter sepak bola memiliki riwayat perselisihan. Sebelum pertandingan, unggahan lama tentang bentrokan kembali disebarkan tanpa konteks yang lengkap. Para anggota kemudian saling mengejek dan menganggap kelompok lawan selalu bertindak kasar. Bentrokan terjadi ketika kedua kelompok bertemu di terminal."},{"kind":"text","text":"Penyebab konflik yang sesuai dengan kasus adalah ...."}],"options":[{"key":"A","text":"stereotip negatif yang terus dipertahankan terhadap kelompok lain"},{"key":"B","text":"penyebaran informasi yang memperkuat prasangka dan permusuhan"},{"key":"C","text":"kuatnya identitas kelompok yang disertai fanatisme berlebihan"},{"key":"D","text":"pembagian sumber ekonomi yang tidak merata di antara para suporter"}],"statements":[],"categories":[],"answer":"A, B, dan C","explanation":"Konflik dipicu oleh stereotip, informasi provokatif, dan fanatisme kelompok. Stimulus tidak menunjukkan adanya perebutan sumber ekonomi.","validation":"Sumber lama","reviewNotes":[]},{"id":"B1-SOS-16-01","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 16(2).docx","n":3,"title":"Masyarakat Adat dan Perusahaan Perkebunan","category":"Konflik Sosial","subcategory":"Pembangunan Perdamaian","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Masyarakat adat dan perusahaan perkebunan berselisih mengenai batas lahan. Setelah proses mediasi, sebagian lahan dikembalikan kepada masyarakat dan sebagian tetap dikelola perusahaan. Namun, masyarakat masih kehilangan sumber penghasilan karena kebun lama telah berubah fungsi. Mereka juga belum dilibatkan dalam pengawasan pelaksanaan kesepakatan."},{"kind":"text","text":"Upaya yang paling tepat untuk memperkuat perdamaian adalah ...."}],"options":[{"key":"A","text":"menghentikan pembahasan karena pembagian lahan telah disepakati secara tertulis"},{"key":"B","text":"memberikan bantuan sesaat tanpa memulihkan mata pencaharian masyarakat terdampak"},{"key":"C","text":"melakukan pemetaan partisipatif, pemulihan penghasilan, dan pemantauan bersama"},{"key":"D","text":"menyerahkan pengawasan seluruh kesepakatan kepada pihak perusahaan perkebunan"},{"key":"E","text":"membatasi kegiatan masyarakat agar tidak kembali menyampaikan tuntutan mengenai lahan"}],"statements":[],"categories":[],"answer":"C","explanation":"Perdamaian perlu disertai pemulihan hak, penghidupan, dan partisipasi masyarakat. Pemetaan serta pemantauan bersama juga mencegah perbedaan penafsiran dan pelanggaran kesepakatan.","validation":"Sumber lama","reviewNotes":[]},{"id":"B1-SOS-16-02","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 16(2).docx","n":8,"title":"Penggunaan Balai Warga","category":"Konflik Sosial","subcategory":"Pembangunan Perdamaian","type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Dua komunitas keagamaan berselisih mengenai jadwal penggunaan balai warga. Kesepakatan sementara telah menghentikan pertengkaran, tetapi kedua kelompok belum memiliki mekanisme tetap untuk mengatur jadwal dan masih saling menyebarkan prasangka."},{"kind":"text","text":"Upaya yang mendukung pembangunan perdamaian adalah ...."}],"options":[{"key":"A","text":"menyusun jadwal penggunaan balai secara bergiliran dan transparan"},{"key":"B","text":"membentuk forum lintas kelompok untuk membahas masalah bersama"},{"key":"C","text":"menetapkan aturan antisdiskriminasi dalam penggunaan fasilitas umum"},{"key":"D","text":"memberikan prioritas tetap kepada kelompok dengan jumlah anggota terbanyak"}],"statements":[],"categories":[],"answer":"A, B, dan C","explanation":"Jadwal yang adil, forum komunikasi, dan aturan antisdiskriminasi mendukung kesetaraan. Prioritas berdasarkan jumlah anggota dapat menyingkirkan kelompok minoritas.","validation":"Sumber lama","reviewNotes":[]},{"id":"B1-SOS-03-01","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 3(2).docx","n":3,"title":"Musyawarah Pembangunan Desa","category":"Masyarakat Multikultural","subcategory":"Keragaman dan Hubungan Antarkelompok","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Desa Harmoni dihuni penduduk asli, warga pendatang, dan kelompok etnis minoritas. Dalam musyawarah pembangunan, tokoh penduduk asli lebih sering menentukan keputusan. Warga pendatang dan kelompok minoritas hadir, tetapi usul mereka jarang dipertimbangkan. Akibatnya, pembangunan fasilitas lebih banyak diarahkan ke wilayah yang dihuni kelompok dominan."},{"kind":"text","text":"Penilaian yang paling tepat terhadap masyarakat tersebut adalah ...."}],"options":[{"key":"A","text":"masyarakat telah setara karena seluruh kelompok diperbolehkan menghadiri musyawarah"},{"key":"B","text":"masyarakat tidak multikultural karena kelompok pendatang tinggal di wilayah yang sama"},{"key":"C","text":"keberagaman disertai dominasi kelompok tertentu dalam pengambilan keputusan sosial"},{"key":"D","text":"perbedaan kepentingan telah hilang karena keputusan dibuat melalui kegiatan musyawarah"},{"key":"E","text":"kelompok minoritas memperoleh kekuasaan lebih besar karena jumlah anggotanya sedikit"}],"statements":[],"categories":[],"answer":"C","explanation":"Salah satu dinamika masyarakat multikultural adalah kemungkinan munculnya dominasi kelompok tertentu. Kehadiran dalam musyawarah belum cukup apabila pengaruh dan kesempatan menentukan keputusan tidak diberikan secara setara.","validation":"Sumber lama","reviewNotes":[]},{"id":"B1-SOS-03-02","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 3(2).docx","n":8,"title":"Konflik Jadwal Kegiatan Keagamaan","category":"Masyarakat Multikultural","subcategory":"Keragaman dan Hubungan Antarkelompok","type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Dua komunitas keagamaan menggunakan gedung serbaguna milik kelurahan. Konflik\n\nmuncul karena keduanya membutuhkan gedung pada waktu yang sama. Pemerintah kelurahan mempertemukan perwakilan komunitas, memeriksa jadwal, dan menyusun pembagian waktu secara bergiliran. Kedua kelompok menerima kesepakatan serta membentuk tim komunikasi bersama."},{"kind":"text","text":"Unsur yang menunjukkan pengelolaan masyarakat multikultural secara konstruktif adalah ...."}],"options":[{"key":"A","text":"pengakuan terhadap kebutuhan kedua komunitas secara seimbang"},{"key":"B","text":"dialog antarkelompok untuk menyusun kesepakatan penggunaan ruang"},{"key":"C","text":"penyerahan gedung kepada kelompok yang memiliki anggota terbanyak"},{"key":"D","text":"pembentukan komunikasi bersama untuk mencegah konflik berulang"}],"statements":[],"categories":[],"answer":"A, B, dan D","explanation":"Pengakuan, dialog, dan komunikasi antarkelompok memperkuat integrasi. Memberikan fasilitas hanya kepada kelompok mayoritas dapat memperbesar ketidaksetaraan.","validation":"Sumber lama","reviewNotes":[]},{"id":"B1-SOS-10-01","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 10(2).docx","n":3,"title":"Kehadiran Lansia di Posyandu","category":"Penelitian Sosial","subcategory":"Manfaat Hasil Penelitian","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Penelitian di Kecamatan Sejahtera menemukan bahwa lansia jarang menghadiri posyandu karena lokasi pelayanan jauh, tidak tersedia kendaraan, dan anggota keluarga bekerja pada waktu pemeriksaan. Lansia yang memperoleh layanan antar-jemput dan pengingat jadwal menunjukkan tingkat kehadiran lebih tinggi. Petugas kesehatan akan merancang tindak lanjut berdasarkan temuan tersebut."},{"kind":"text","text":"Tindakan yang paling mencerminkan manfaat hasil penelitian adalah ...."}],"options":[{"key":"A","text":"menambah jenis pemeriksaan tanpa memperhatikan hambatan perjalanan para lansia"},{"key":"B","text":"mewajibkan seluruh lansia datang sendiri agar tidak bergantung kepada keluarganya"},{"key":"C","text":"memusatkan semua pelayanan di kecamatan agar peralatan mudah dikelola petugas"},{"key":"D","text":"menyediakan layanan keliling, pengingat jadwal, dan dukungan transportasi terbatas"},{"key":"E","text":"mengurangi frekuensi posyandu karena jumlah peserta yang hadir masih relatif rendah"}],"statements":[],"categories":[],"answer":"D","explanation":"Temuan menunjukkan bahwa akses dan dukungan keluarga memengaruhi kehadiran. Layanan keliling, pengingat, dan dukungan transportasi langsung menjawab hambatan yang ditemukan penelitian.","validation":"Sumber lama","reviewNotes":[]},{"id":"B1-SOS-10-02","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 10(2).docx","n":8,"title":"Revitalisasi Pasar Tradisional","category":"Penelitian Sosial","subcategory":"Manfaat Hasil Penelitian","type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Penelitian mengenai penurunan pengunjung pasar menunjukkan bahwa warga mengeluhkan kebersihan, keamanan parkir, tata letak kios, dan ketidakjelasan harga. Penelitian juga mencatat bahwa sebagian pedagang belum menggunakan pembayaran digital, tetapi pelanggan tetap menganggap transaksi tunai masih diperlukan."},{"kind":"text","text":"Manfaat hasil penelitian tersebut dapat diwujudkan melalui ...."}],"options":[{"key":"A","text":"memperbaiki kebersihan, parkir, dan penataan kios berdasarkan kebutuhan pengunjung"},{"key":"B","text":"mendorong transparansi harga agar pembeli dapat membandingkan barang dengan mudah"},{"key":"C","text":"menghapus seluruh pembayaran tunai karena dianggap menghambat modernisasi pasar"},{"key":"D","text":"menyediakan pilihan pembayaran digital tanpa menghilangkan transaksi tunai sepenuhnya"}],"statements":[],"categories":[],"answer":"A, B, dan D","explanation":"Temuan penelitian dapat digunakan untuk memperbaiki fasilitas, transparansi harga, dan pilihan pembayaran. Menghapus pembayaran tunai tidak sesuai dengan data karena sebagian konsumen masih membutuhkannya.","validation":"Sumber lama","reviewNotes":[]},{"id":"B1-SOS-10-03","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 10(2).docx","n":13,"title":"Partisipasi Pemuda Desa","category":"Penelitian Sosial","subcategory":"Manfaat Hasil Penelitian","type":"category","typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Penelitian menemukan bahwa partisipasi pemuda dalam kegiatan desa menurun karena jadwal rapat bertabrakan dengan jam kerja, program dianggap tidak sesuai minat, dan keputusan lebih banyak ditentukan tokoh senior. Pemuda bersedia terlibat apabila diberikan peran yang jelas dan kesempatan menyampaikan gagasan."}],"options":[],"statements":["Jadwal kegiatan perlu disesuaikan dengan ketersediaan waktu sebagian besar pemuda.","Pemuda tidak perlu dilibatkan dalam perencanaan karena pengalamannya masih terbatas.","Ruang partisipasi dan pembagian peran dapat meningkatkan keterlibatan pemuda."],"categories":["Didukung","Tidak Didukung"],"answer":"1. Didukung Temuan; 2. Tidak Didukung Temuan; 3. Didukung Temuan","explanation":"Temuan mendukung penyesuaian jadwal dan pelibatan pemuda dalam pengambilan keputusan. Mengurangi keterlibatan pemuda justru bertentangan dengan hasil penelitian.","validation":"Sumber lama","reviewNotes":[]},{"id":"B1-SOS-11-03","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 11(2).docx","n":13,"title":"Pengalaman Pengguna Puskesmas","category":"Penelitian Sosial","subcategory":"Interpretasi Data Penelitian","type":"category","typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Peneliti memperoleh kutipan wawancara berikut.\n\nInforman 1: “Petugasnya ramah, tetapi saya menunggu hampir dua jam.”\n\nInforman 2: “Saya kesulitan datang karena tidak ada angkutan dari desa.”\n\nInforman 3: “Informasi jadwal pemeriksaan sering berubah tanpa pemberitahuan.”"},{"kind":"text","text":"Sesuai."}],"options":[],"statements":["Keramahan petugas dinilai baik, tetapi waktu tunggu masih menjadi persoalan.","Hambatan transportasi dapat membatasi akses sebagian warga terhadap layanan.","Semua informan menyatakan kualitas pelayanan puskesmas sangat buruk."],"categories":["Sesuai","Tidak Sesuai"],"answer":"1. Interpretasi Sesuai; 2. Interpretasi Sesuai; 3. Interpretasi Tidak Sesuai","explanation":"Kutipan menunjukkan penilaian yang beragam. Petugas dinilai ramah, tetapi terdapat persoalan waktu tunggu, akses transportasi, dan informasi jadwal. Tidak tepat menyimpulkan seluruh pelayanan dinilai sangat buruk.","validation":"Sumber lama","reviewNotes":[]},{"id":"B1-SOS-12-01","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 12(2).docx","n":3,"title":"Strategi Bertahan Pedagang Kaki Lima","category":"Penelitian Sosial","subcategory":"Rancangan Penelitian dan Etika","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Peneliti ingin memahami cara pedagang kaki lima mempertahankan usahanya setelah dilakukan penataan kawasan kota. Penelitian difokuskan pada satu kawasan pasar. Peneliti berencana mewawancarai pedagang lama, pedagang baru, petugas pengelola, dan pelanggan. Peneliti juga akan mengamati aktivitas perdagangan serta memeriksa dokumen kebijakan penataan."},{"kind":"text","text":"Rancangan penelitian yang paling tepat adalah ...."}],"options":[{"key":"A","text":"studi kasus kualitatif dengan informan purposif dan beberapa teknik pengumpulan data"},{"key":"B","text":"survei kuantitatif dengan satu pertanyaan tertutup kepada seluruh pedagang kawasan"},{"key":"C","text":"eksperimen lapangan dengan memindahkan sebagian pedagang ke wilayah yang berbeda"},{"key":"D","text":"penelitian korelasional dengan menghitung hubungan usia pedagang dan harga dagangan"},{"key":"E","text":"sensus penduduk dengan mendata seluruh keluarga yang tinggal di sekitar kawasan pasar"}],"statements":[],"categories":[],"answer":"A","explanation":"Penelitian memusatkan perhatian pada satu kasus tertentu dan bertujuan memahami proses secara mendalam. Penggunaan wawancara, observasi, dan dokumen menunjukkan studi kasus kualitatif. Informan dipilih secara purposif karena harus memiliki pengalaman yang relevan dengan penataan kawasan.","validation":"Sumber lama","reviewNotes":[]},{"id":"B1-SOS-12-02","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 12(2).docx","n":8,"title":"Perundungan Siber Remaja","category":"Penelitian Sosial","subcategory":"Rancangan Penelitian dan Etika","type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Penelitian mengenai perundungan siber akan melibatkan peserta didik berusia 14–17 tahun. Kuesioner menanyakan pengalaman menerima ancaman, penyebaran foto, dan penghinaan daring. Beberapa pertanyaan berpotensi menimbulkan ketidaknyamanan emosional. Peneliti berencana menyimpan jawaban tanpa mencantumkan nama responden."},{"kind":"text","text":"Komponen rancangan yang tepat adalah ...."}],"options":[{"key":"A","text":"memperoleh persetujuan peserta dan persetujuan orang tua atau wali sesuai ketentuan"},{"key":"B","text":"menyediakan informasi layanan pendampingan apabila peserta mengalami ketidaknyamanan"},{"key":"C","text":"menjaga anonimitas dan membatasi akses terhadap data yang telah dikumpulkan"},{"key":"D","text":"membagikan jawaban individu kepada guru kelas agar identitas korban dapat diketahui"}],"statements":[],"categories":[],"answer":"A, B, dan C","explanation":"Responden masih berusia di bawah umur dan topik penelitian sensitif. Peneliti harus memperoleh persetujuan yang sesuai, melindungi kerahasiaan, serta menyediakan mekanisme bantuan. Membuka jawaban individu tanpa persetujuan melanggar prinsip perlindungan peserta penelitian.","validation":"Sumber lama","reviewNotes":[]},{"id":"B1-SOS-07-01","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 7(2).docx","n":3,"title":"Keikutsertaan Warga dalam Bank Sampah","category":"Penelitian Sosial","subcategory":"Tujuan Penelitian","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Program bank sampah telah berjalan selama dua tahun di Kelurahan Sukabersih. Meskipun jumlah penduduk cukup besar, hanya sebagian kecil keluarga yang rutin menyetorkan sampah terpilah. Peneliti melakukan observasi, mewawancarai warga yang aktif dan tidak aktif, serta menelaah sistem pengelolaan tabungan sampah. Penelitian juga mencatat jarak rumah warga dari tempat pengumpulan."},{"kind":"text","text":"Tujuan penelitian yang paling sesuai adalah ...."}],"options":[{"key":"A","text":"mengidentifikasi faktor yang memengaruhi partisipasi warga dalam kegiatan bank sampah"},{"key":"B","text":"menghitung jumlah seluruh sampah rumah tangga yang dihasilkan kelurahan setiap tahun"},{"key":"C","text":"menentukan harga jual setiap jenis sampah yang disetorkan kepada pengelola lingkungan"},{"key":"D","text":"membandingkan kemampuan pengurus dalam mengolah sampah organik dan sampah anorganik"},{"key":"E","text":"memilih keluarga yang paling layak menerima penghargaan atas kebersihan lingkungannya"}],"statements":[],"categories":[],"answer":"A","explanation":"Peneliti membandingkan pengalaman warga aktif dan tidak aktif, sistem pengelolaan, serta jarak menuju tempat pengumpulan. Data tersebut digunakan untuk mengidentifikasi faktor pendorong dan penghambat partisipasi warga.","validation":"Sumber lama","reviewNotes":[]},{"id":"B1-SOS-07-02","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 7(2).docx","n":8,"title":"Migrasi Pemuda Desa","category":"Penelitian Sosial","subcategory":"Tujuan Penelitian","type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Banyak pemuda Desa Kertamukti berpindah ke kota setelah menyelesaikan sekolah. Peneliti mewawancarai pemuda yang pindah, keluarga yang ditinggalkan, petani, dan perangkat desa. Penelitian juga mengumpulkan data mengenai pekerjaan, pendapatan, kegiatan organisasi pemuda, dan ketersediaan lapangan kerja di desa."},{"kind":"text","text":"Tujuan penelitian yang sesuai adalah ...."}],"options":[{"key":"A","text":"mengidentifikasi faktor yang mendorong pemuda meninggalkan desa menuju perkotaan"},{"key":"B","text":"menganalisis dampak migrasi pemuda terhadap keluarga dan kegiatan sosial desa"},{"key":"C","text":"mendeskripsikan hubungan antara ketersediaan pekerjaan dan keputusan pemuda bermigrasi"},{"key":"D","text":"menetapkan seluruh pemuda yang telah bermigrasi agar segera kembali bekerja di desa"}],"statements":[],"categories":[],"answer":"A, B, dan C","explanation":"Data yang dikumpulkan memungkinkan peneliti mengidentifikasi penyebab, hubungan ketersediaan pekerjaan dengan migrasi, dan dampaknya. Memerintahkan pemuda kembali merupakan kebijakan, bukan tujuan penelitian.","validation":"Sumber lama","reviewNotes":[]},{"id":"B1-SOS-08-01","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 8(2).docx","n":3,"title":"Penelitian Penggunaan Media Sosial","category":"Penelitian Sosial","subcategory":"Sistematika Laporan Penelitian","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Dalam laporan penelitian tentang penggunaan media sosial oleh remaja, peneliti menuliskan jumlah responden, teknik penentuan sampel, kisi-kisi kuesioner, prosedur wawancara, serta teknik analisis data. Informasi tersebut diperlukan agar pembaca memahami cara penelitian dilaksanakan."},{"kind":"text","text":"Uraian tersebut ditempatkan pada bagian ...."}],"options":[{"key":"A","text":"pendahuluan karena menjelaskan pentingnya masalah penggunaan media sosial"},{"key":"B","text":"kajian pustaka karena menerangkan teori tentang perilaku pengguna internet"},{"key":"C","text":"metode penelitian karena menjelaskan prosedur memperoleh dan mengolah data"},{"key":"D","text":"hasil penelitian karena menyajikan temuan yang diperoleh dari para responden"},{"key":"E","text":"penutup karena merangkum keseluruhan proses dan hasil kegiatan penelitian"}],"statements":[],"categories":[],"answer":"C","explanation":"Bagian metode penelitian memuat pendekatan, subjek atau sampel, teknik pengumpulan data, instrumen, prosedur penelitian, dan teknik analisis data.","validation":"Sumber lama","reviewNotes":[]},{"id":"B1-SOS-08-02","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 8(2).docx","n":8,"title":"Hasil dan Pembahasan Penelitian Remaja","category":"Penelitian Sosial","subcategory":"Sistematika Laporan Penelitian","type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Penelitian mengenai kebiasaan membaca remaja menghasilkan temuan bahwa 62% responden lebih sering membaca melalui perangkat digital. Peneliti kemudian menghubungkan temuan itu dengan teori perubahan perilaku membaca dan hasil\n\npenelitian terdahulu."},{"kind":"text","text":"Pernyataan yang tepat mengenai sistematika laporan tersebut adalah ...."}],"options":[{"key":"A","text":"persentase kebiasaan membaca ditempatkan dalam bagian hasil penelitian"},{"key":"B","text":"penafsiran data dengan teori ditempatkan dalam bagian pembahasan"},{"key":"C","text":"hasil dan pembahasan harus menjawab rumusan masalah yang telah disusun"},{"key":"D","text":"teori yang digunakan pertama kali sebaiknya baru dicantumkan dalam simpulan"}],"statements":[],"categories":[],"answer":"A, B, dan C","explanation":"Hasil menyajikan temuan penelitian, sedangkan pembahasan menafsirkan temuan dengan konsep, teori, atau penelitian terdahulu. Teori seharusnya telah dijelaskan dalam kajian pustaka.","validation":"Sumber lama","reviewNotes":[]},{"id":"B1-SOS-09-01","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 9(2).docx","n":3,"title":"Pengalaman Korban Perundungan Siber","category":"Penelitian Sosial","subcategory":"Metode dan Pendekatan Penelitian","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Peneliti ingin memahami pengalaman peserta didik yang pernah menjadi korban perundungan siber. Ia memilih delapan informan yang bersedia menceritakan pengalaman secara mendalam. Wawancara dilakukan beberapa kali untuk menggali perasaan, perubahan perilaku, dukungan yang diterima, serta cara korban memaknai peristiwa tersebut. Hasil wawancara kemudian dikelompokkan ke dalam tema-tema pengalaman."},{"kind":"text","text":"Metode yang paling tepat digunakan dalam penelitian tersebut adalah ...."}],"options":[{"key":"A","text":"penelitian fenomenologi untuk memahami pengalaman subjektif para korban"},{"key":"B","text":"penelitian survei untuk memperoleh persentase korban di seluruh sekolah"},{"key":"C","text":"penelitian eksperimen untuk membandingkan perilaku sebelum dan sesudah perlakuan"},{"key":"D","text":"penelitian historis untuk mengetahui perkembangan perundungan dari waktu ke waktu"},{"key":"E","text":"penelitian korelasional untuk menghitung hubungan dua variabel dalam bentuk angka"}],"statements":[],"categories":[],"answer":"A","explanation":"Fenomenologi digunakan untuk memahami pengalaman hidup dan pemaknaan subjektif individu terhadap suatu peristiwa. Wawancara mendalam dan analisis tema sesuai dengan karakteristik metode tersebut.","validation":"Sumber lama","reviewNotes":[]},{"id":"B1-SOS-09-02","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 9(2).docx","n":8,"title":"Penelitian Campuran tentang Pembelajaran Daring","category":"Penelitian Sosial","subcategory":"Metode dan Pendekatan Penelitian","type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Peneliti menyebarkan kuesioner kepada 300 peserta didik untuk mengukur akses perangkat, kualitas jaringan, dan tingkat partisipasi belajar. Setelah data angka dianalisis, peneliti mewawancarai 15 peserta didik untuk memahami alasan mereka aktif atau pasif dalam pembelajaran. Data kuantitatif dan hasil wawancara kemudian dihubungkan saat menyusun simpulan."},{"kind":"text","text":"Pernyataan yang tepat berdasarkan kasus tersebut adalah ...."}],"options":[{"key":"A","text":"penelitian memadukan data kuantitatif dan data kualitatif"},{"key":"B","text":"kuesioner digunakan untuk memperoleh gambaran umum dari banyak responden"},{"key":"C","text":"wawancara digunakan untuk memperdalam penjelasan atas hasil survei"},{"key":"D","text":"penelitian hanya menggunakan metode kualitatif karena terdapat kegiatan wawancara"}],"statements":[],"categories":[],"answer":"A, B, dan C","explanation":"Penelitian menggunakan metode campuran karena menggabungkan survei kuantitatif dengan wawancara kualitatif. Wawancara digunakan untuk menjelaskan lebih dalam\ntemuan angka.","validation":"Sumber lama","reviewNotes":[]},{"id":"B1-SOS-21-01","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 21.docx","n":3,"title":"Otomatisasi dan Pengangguran","category":"Permasalahan Sosial","subcategory":"Dinamika dan Dampak Permasalahan Sosial","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Sebuah kawasan industri mulai menggunakan mesin otomatis. Produktivitas perusahaan meningkat, tetapi sebagian pekerjaan rutin tidak lagi membutuhkan banyak tenaga manusia. Pekerja yang memiliki keterampilan teknologi dipindahkan ke bagian baru, sedangkan sebagian pekerja lain kehilangan pekerjaan. Beberapa mantan pekerja kemudian masuk ke sektor informal dengan pendapatan lebih rendah karena belum memiliki keterampilan baru."},{"kind":"text","text":"Analisis yang paling tepat terhadap dinamika permasalahan tersebut adalah ...."}],"options":[{"key":"A","text":"otomatisasi selalu menurunkan produktivitas karena jumlah tenaga kerja menjadi lebih sedikit"},{"key":"B","text":"perubahan teknologi mengubah struktur pekerjaan dan dapat memperlebar ketimpangan keterampilan"},{"key":"C","text":"pekerja yang kehilangan pekerjaan pada dasarnya tidak mempunyai motivasi untuk bekerja kembali"},{"key":"D","text":"sektor informal muncul karena perusahaan melarang pekerjanya mengikuti pelatihan keterampilan"},{"key":"E","text":"penggunaan teknologi menyebabkan semua jenis pekerjaan manusia menghilang secara bersamaan"}],"statements":[],"categories":[],"answer":"B","explanation":"Masalah bukan sekadar kehilangan pekerjaan. Perubahan teknologi menciptakan pergeseran kebutuhan keterampilan, sehingga pekerja yang dapat beradaptasi memperoleh peluang baru, sedangkan pekerja lain semakin rentan.","validation":"Lengkap dari sumber","reviewNotes":[]},{"id":"B1-SOS-21-03","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 21.docx","n":13,"title":"Permasalahan Lingkungan Perkotaan","category":"Permasalahan Sosial","subcategory":"Dinamika dan Dampak Permasalahan Sosial","type":"category","typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Permukiman di sekitar sungai sering mengalami banjir. Saluran air sempit karena pembangunan tidak teratur, sementara sebagian warga masih membuang sampah ke saluran tersebut."},{"kind":"text","text":"Tentukan kategori setiap pernyataan berdasarkan stimulus."}],"options":[],"statements":["Saluran air tidak memadai akibat pembangunan permukiman yang tidak tertata.","Sebagian warga membuang sampah rumah tangga langsung ke saluran air.","Ketersediaan fasilitas pengelolaan sampah di kawasan masih sangat terbatas."],"categories":["Struktural","Perilaku"],"answer":"1. Struktural; 2. Perilaku Sosial; 3. Struktural","explanation":"Masalah lingkungan sering terjadi karena interaksi antara kondisi struktural dan perilaku masyarakat, bukan hanya salah satu faktor.","validation":"Lengkap dari sumber","reviewNotes":[]},{"id":"B1-SOS-06-01","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 6(2).docx","n":3,"title":"Perundungan di Lingkungan Sekolah","category":"Permasalahan Sosial","subcategory":"Dampak Permasalahan Sosial","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Seorang peserta didik sering diejek karena bentuk tubuh dan cara bicaranya. Ejekan kemudian berlanjut melalui grup pesan kelas. Beberapa teman membagikan foto korban tanpa izin dan menambahkan komentar yang merendahkan. Korban mulai menghindari pergaulan, tidak aktif dalam pembelajaran, dan sering meminta izin tidak masuk sekolah. Peserta didik lain merasa takut menjadi sasaran apabila membela korban."},{"kind":"text","text":"Evaluasi yang paling tepat terhadap dampak perundungan tersebut adalah ...."}],"options":[{"key":"A","text":"perundungan hanya menimbulkan rasa tidak nyaman tanpa memengaruhi proses pendidikan di sekolah"},{"key":"B","text":"perundungan memperkuat solidaritas karena peserta didik membentuk kelompok pertemanan yang lebih dekat"},{"key":"C","text":"perundungan mengganggu kondisi psikologis korban serta melemahkan rasa aman di lingkungan sekolah"},{"key":"D","text":"perundungan dapat dihentikan dengan memindahkan korban tanpa mengubah perilaku kelompok pelaku"},{"key":"E","text":"perundungan menunjukkan bahwa korban belum mampu menyesuaikan diri dengan kebiasaan teman sekelas"}],"statements":[],"categories":[],"answer":"C","explanation":"Perundungan dapat menimbulkan kecemasan, penurunan kepercayaan diri, ketidakhadiran, dan penurunan prestasi. Dampaknya juga dirasakan lingkungan sekolah karena peserta didik lain menjadi takut serta menganggap perilaku merendahkan sebagai hal biasa.","validation":"Sumber lama","reviewNotes":[]},{"id":"B1-SOS-06-02","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 6(2).docx","n":8,"title":"Konsumerisme dan Pembayaran Tertunda","category":"Permasalahan Sosial","subcategory":"Dampak Permasalahan Sosial","type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Banyak remaja membeli pakaian, kosmetik, dan perangkat elektronik setelah melihat promosi tokoh digital. Sebagian menggunakan fasilitas pembayaran tertunda karena tidak memiliki cukup uang. Tagihan kemudian meningkat akibat denda dan bunga. Beberapa remaja menyembunyikan utang dari orang tua, menjual barang pribadi, dan mengalami stres ketika waktu pembayaran mendekat."},{"kind":"text","text":"Dampak konsumerisme yang tepat ditunjukkan oleh ...."}],"options":[{"key":"A","text":"pembelian berdasarkan tren dapat menggeser pertimbangan kebutuhan dan kemampuan ekonomi"},{"key":"B","text":"penggunaan pembayaran tertunda dapat menimbulkan utang serta tekanan psikologis"},{"key":"C","text":"penyembunyian tagihan dapat mengganggu keterbukaan dan kepercayaan dalam\nkeluarga"},{"key":"D","text":"kepemilikan barang populer selalu meningkatkan kedudukan sosial secara berkelanjutan"}],"statements":[],"categories":[],"answer":"A, B, dan C","explanation":"Konsumerisme membuat keinginan diperlakukan sebagai kebutuhan. Ketika pembelian dilakukan melalui utang, muncul tekanan ekonomi, stres, dan konflik kepercayaan dalam keluarga. Kepemilikan barang tidak menjamin status sosial yang tetap.","validation":"Sumber lama","reviewNotes":[]},{"id":"B1-SOS-25-01","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 25_Perubahan sosial.docx","n":3,"title":"Bencana dan Perubahan Mata Pencaharian","category":"Perubahan Sosial","subcategory":"Bentuk Perubahan Sosial","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Banjir besar merusak lahan pertanian di Desa Tirta. Sebagian petani kehilangan sumber penghasilan sehingga beralih menjadi pekerja bangunan dan pedagang kecil di kota terdekat. Pemerintah sebelumnya tidak pernah merencanakan perubahan mata pencaharian tersebut. Perubahan muncul sebagai respons masyarakat terhadap kondisi yang terjadi setelah bencana."},{"kind":"text","text":"Berdasarkan proses terjadinya, kasus tersebut merupakan ...."}],"options":[{"key":"A","text":"perubahan direncanakan karena masyarakat memilih pekerjaan yang dianggap lebih menguntungkan"},{"key":"B","text":"perubahan tidak direncanakan karena muncul sebagai akibat kondisi yang tidak dipersiapkan"},{"key":"C","text":"perubahan evolusioner karena masyarakat telah merancang perpindahan pekerjaan sejak lama"},{"key":"D","text":"perubahan kecil karena peralihan pekerjaan tidak memengaruhi kehidupan keluarga masyarakat"},{"key":"E","text":"perubahan progresif karena setiap warga memperoleh pekerjaan dengan penghasilan lebih tinggi"}],"statements":[],"categories":[],"answer":"B","explanation":"Perubahan terjadi sebagai konsekuensi bencana yang tidak direncanakan. Karena itu, bentuknya adalah unplanned change atau perubahan tidak direncanakan.","validation":"Lengkap dari sumber","reviewNotes":[]},{"id":"B1-SOS-25-02","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 25_Perubahan sosial.docx","n":8,"title":"Pandemi dan Pola Kerja","category":"Perubahan Sosial","subcategory":"Bentuk Perubahan Sosial","type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Ketika terjadi wabah penyakit, sejumlah perusahaan tiba-tiba menerapkan kerja dari rumah. Rapat, pelaporan, dan koordinasi dilakukan melalui aplikasi digital. Setelah keadaan membaik, beberapa perusahaan tetap mempertahankan pola kerja hibrida karena dianggap efisien."},{"kind":"text","text":"Bentuk perubahan yang dapat diidentifikasi dari stimulus adalah ...."}],"options":[{"key":"A","text":"pada awalnya perubahan muncul sebagai respons terhadap kondisi yang tidak direncanakan"},{"key":"B","text":"penggunaan teknologi mempercepat perubahan pola interaksi dalam kegiatan pekerjaan"},{"key":"C","text":"sebagian perubahan kemudian bertahan dan menjadi pola baru dalam organisasi pekerjaan"},{"key":"D","text":"seluruh perubahan merupakan perubahan kecil karena hanya berkaitan dengan tempat bekerja"}],"statements":[],"categories":[],"answer":"A, B, dan C","explanation":"Pandemi menjadi faktor eksternal yang tidak direncanakan. Perubahan kemudian berkembang dan sebagian dilembagakan menjadi pola baru. Pernyataan D tidak tepat karena perubahan juga menyentuh organisasi dan interaksi kerja.","validation":"Lengkap dari sumber","reviewNotes":[]},{"id":"B1-SOS-25-03","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 25_Perubahan sosial.docx","n":13,"title":"Cakupan Perubahan","category":"Perubahan Sosial","subcategory":"Bentuk Perubahan Sosial","type":"category","typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Sebuah masyarakat mengalami beberapa perubahan berikut."},{"kind":"text","text":"Tentukan kategori setiap pernyataan berdasarkan stimulus."}],"options":[],"statements":["Tren gaya rambut remaja berubah mengikuti mode yang berkembang.","Industrialisasi mengubah pekerjaan, struktur ekonomi, dan pola permukiman masyarakat.","Model sepatu sekolah berubah tanpa memengaruhi sistem pendidikan."],"categories":["Kecil","Besar"],"answer":"1. Perubahan Kecil; 2. Perubahan Besar; 3. Perubahan Kecil","explanation":"Perubahan kecil tidak mengubah struktur utama masyarakat. Industrialisasi mempunyai dampak luas terhadap berbagai aspek sehingga merupakan perubahan besar.","validation":"Lengkap dari sumber","reviewNotes":[]},{"id":"B1-SOS-26-01","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 26_Peruahan sosial.docx","n":3,"title":"Pembangunan Jalan Baru","category":"Perubahan Sosial","subcategory":"Dampak Perubahan Sosial","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Pemerintah membangun jalan penghubung antara Desa Cakrawala dan pusat kabupaten. Sebelumnya, perjalanan ke kota membutuhkan waktu hampir dua jam. Setelah jalan selesai, warga lebih mudah membawa hasil pertanian ke pasar, pelajar dapat mencapai sekolah dengan lebih cepat, dan pedagang dari kota mulai membuka usaha di desa. Di sisi lain, sejumlah warung kecil lokal menghadapi persaingan yang lebih ketat."},{"kind":"text","text":"Analisis dampak perubahan sosial yang paling tepat adalah ...."}],"options":[{"key":"A","text":"pembangunan jalan memperluas mobilitas dan kesempatan ekonomi, tetapi meningkatkan persaingan usaha lokal"},{"key":"B","text":"pembangunan jalan menyebabkan seluruh usaha desa berhenti karena pedagang kota menguasai pasar setempat"},{"key":"C","text":"pembangunan jalan hanya berpengaruh terhadap transportasi tanpa memengaruhi kehidupan ekonomi masyarakat"},{"key":"D","text":"pembangunan jalan mengurangi interaksi masyarakat karena warga tidak lagi membutuhkan hubungan dengan kota"},{"key":"E","text":"pembangunan jalan meningkatkan keterisolasian desa karena mobilitas masyarakat semakin sulit dilakukan"}],"statements":[],"categories":[],"answer":"A","explanation":"Perubahan infrastruktur menghasilkan dampak multidimensional: mobilitas meningkat, akses pendidikan dan pasar membaik, tetapi persaingan ekonomi juga bertambah.","validation":"Lengkap dari sumber","reviewNotes":[]},{"id":"B1-SOS-26-02","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 26_Peruahan sosial.docx","n":8,"title":"Urbanisasi di Daerah Industri","category":"Perubahan Sosial","subcategory":"Dampak Perubahan Sosial","type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Setelah kawasan industri dibangun, ribuan pendatang menetap di Kecamatan Maju. Rumah kontrakan, toko, dan layanan transportasi berkembang pesat. Interaksi masyarakat menjadi lebih beragam. Akan tetapi, kepadatan penduduk meningkat, kemacetan bertambah, dan beberapa fasilitas umum tidak lagi mampu melayani seluruh warga secara optimal."},{"kind":"text","text":"Dampak perubahan sosial yang tepat adalah ...."}],"options":[{"key":"A","text":"heterogenitas penduduk meningkat karena semakin banyak kelompok sosial berinteraksi"},{"key":"B","text":"kegiatan ekonomi baru berkembang mengikuti pertambahan kebutuhan penduduk"},{"key":"C","text":"kepadatan dapat memberikan tekanan terhadap fasilitas dan pelayanan publik"},{"key":"D","text":"meningkatnya jumlah penduduk selalu menghasilkan integrasi sosial tanpa masalah baru"}],"statements":[],"categories":[],"answer":"A, B, dan C","explanation":"Urbanisasi memberikan dampak berupa keberagaman penduduk dan pertumbuhan ekonomi, tetapi juga dapat meningkatkan tekanan pada ruang, transportasi, dan fasilitas sosial.","validation":"Lengkap dari sumber","reviewNotes":[]},{"id":"B1-SOS-26-03","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 26_Peruahan sosial.docx","n":13,"title":"Dampak Integratif dan Disintegratif","category":"Perubahan Sosial","subcategory":"Dampak Perubahan Sosial","type":"category","typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Sebuah permukiman baru dihuni warga dari berbagai daerah. Pemerintah kelurahan membentuk forum warga, mengadakan festival budaya, dan menyelenggarakan kegiatan olahraga bersama. Namun, beberapa kelompok masih menyebarkan stereotip negatif terhadap pendatang."},{"kind":"text","text":"Tentukan kategori setiap pernyataan berdasarkan stimulus."}],"options":[],"statements":["Forum warga memperluas komunikasi antarpenduduk dari latar berbeda.","Festival budaya memperkuat rasa saling mengenal antarkelompok masyarakat.","Penyebaran stereotip negatif meningkatkan jarak sosial antarpenduduk."],"categories":["Integratif","Disintegratif"],"answer":"1. Integratif; 2. Integratif; 3. Disintegratif","explanation":"Dampak integratif memperkuat keterhubungan dan solidaritas sosial, sedangkan dampak disintegratif meningkatkan jarak, ketegangan, atau konflik.","validation":"Lengkap dari sumber","reviewNotes":[]},{"id":"B1-SOS-27-01","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 27_Perubahan sosial(1).docx","n":3,"title":"Relokasi Pascabencana","category":"Perubahan Sosial","subcategory":"Dampak Perubahan Sosial","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Setelah erupsi gunung, ratusan keluarga direlokasi dari lereng gunung ke permukiman baru. Rumah baru memiliki sanitasi lebih baik, akses jalan lebih mudah, dan lokasinya lebih aman. Namun, lokasi rumah warga tidak lagi mengikuti pola permukiman lama. Sebagian warga merasa hubungan dengan tetangga dan kerabat menjadi tidak seerat sebelumnya karena mereka tinggal lebih berjauhan."},{"kind":"text","text":"Dampak perubahan sosial yang paling tepat adalah ...."}],"options":[{"key":"A","text":"relokasi hanya menimbulkan dampak negatif karena masyarakat kehilangan seluruh kebiasaan kehidupan sebelumnya"},{"key":"B","text":"relokasi memperkuat hubungan kekerabatan karena seluruh penduduk ditempatkan dalam satu kelompok permukiman lama"},{"key":"C","text":"relokasi tidak mengubah kehidupan sosial karena perpindahan tempat tinggal hanya berkaitan dengan kondisi geografis"},{"key":"D","text":"relokasi meningkatkan keamanan dan fasilitas tetapi dapat mengubah pola interaksi serta kohesi sosial masyarakat"},{"key":"E","text":"relokasi menyebabkan seluruh warga meninggalkan nilai sosial yang sebelumnya berkembang dalam kehidupan masyarakat"}],"statements":[],"categories":[],"answer":"D","explanation":"Relokasi membawa dampak positif dalam keamanan dan fasilitas, tetapi perubahan pola permukiman juga dapat memengaruhi intensitas hubungan sosial. Dampak perubahan sosial dapat bersifat multidimensional.","validation":"Lengkap dari sumber","reviewNotes":[]},{"id":"B1-SOS-27-02","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 27_Perubahan sosial(1).docx","n":8,"title":"Penggalangan Dana melalui Media Sosial","category":"Perubahan Sosial","subcategory":"Dampak Perubahan Sosial","type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Ketika banjir melanda beberapa desa, komunitas mahasiswa menggalang bantuan melalui media sosial. Dalam dua hari, bantuan datang dari berbagai daerah yang sebelumnya tidak memiliki hubungan langsung dengan korban. Namun, muncul pula beberapa akun palsu yang menggunakan foto bencana untuk meminta uang bagi kepentingan pribadi."},{"kind":"text","text":"Dampak perubahan sosial yang dapat dianalisis adalah ...."}],"options":[{"key":"A","text":"media digital selalu menjamin bantuan tersalurkan kepada penerima yang tepat"},{"key":"B","text":"jaringan solidaritas dapat berkembang melampaui batas wilayah melalui media digital"},{"key":"C","text":"kemudahan penyebaran informasi juga dapat dimanfaatkan untuk tindakan penipuan"},{"key":"D","text":"partisipasi masyarakat dalam kegiatan kemanusiaan dapat berlangsung lebih cepat dan luas"}],"statements":[],"categories":[],"answer":"B, C, dan D","explanation":"Media sosial memperluas solidaritas dan partisipasi sosial, tetapi juga menghasilkan risiko penyalahgunaan. Pernyataan A terlalu mutlak.","validation":"Lengkap dari sumber","reviewNotes":[]},{"id":"B1-SOS-27-03","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 27_Perubahan sosial(1).docx","n":13,"title":"Dampak Ekonomi dan Sosial","category":"Perubahan Sosial","subcategory":"Dampak Perubahan Sosial","type":"category","typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Sebuah pusat perbelanjaan besar dibangun di wilayah yang sebelumnya didominasi pasar kecil. Nilai tanah meningkat dan lapangan kerja baru tersedia. Pada saat yang sama, beberapa pedagang lama kehilangan pelanggan dan hubungan antarpenjual yang sebelumnya sangat erat mulai berkurang."},{"kind":"text","text":"Tentukan kategori setiap pernyataan berdasarkan stimulus."}],"options":[],"statements":["Harga tanah di sekitar pusat perbelanjaan mengalami peningkatan.","Sebagian pedagang kecil mengalami penurunan jumlah pelanggan.","Intensitas hubungan antarpenjual lama menjadi semakin berkurang."],"categories":["Ekonomi","Sosial"],"answer":"1. Dampak Ekonomi; 2. Dampak Ekonomi; 3. Dampak Sosial","explanation":"Harga tanah dan pendapatan berkaitan dengan aspek ekonomi, sedangkan perubahan intensitas hubungan antarwarga menunjukkan dampak sosial.","validation":"Lengkap dari sumber","reviewNotes":[]},{"id":"B1-SOS-04-01","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 4(2).docx","n":3,"title":"Penyelesaian Perselisihan Lahan","category":"Proses Sosial","subcategory":"Proses Asosiatif dan Disosiatif","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Dua kelompok petani berselisih mengenai batas penggunaan lahan irigasi. Setelah beberapa kali terjadi ketegangan, kepala desa mempertemukan kedua pihak. Mereka memeriksa dokumen, mendengarkan penjelasan masing-masing, lalu menyepakati pembagian waktu penggunaan air. Kesepakatan tersebut diterima untuk mencegah perselisihan berulang."},{"kind":"text","text":"Bentuk hubungan sosial yang terjadi pada akhir kasus adalah ...."}],"options":[{"key":"A","text":"akulturasi karena kedua pihak menerima unsur kebudayaan dari luar"},{"key":"B","text":"persaingan karena kedua pihak tetap berusaha memperoleh air terbanyak"},{"key":"C","text":"asimilasi karena identitas kelompok petani tidak lagi dapat dibedakan"},{"key":"D","text":"akomodasi karena pertentangan diselesaikan melalui kesepakatan bersama"},{"key":"E","text":"kontravensi karena penolakan masih disembunyikan oleh kedua kelompok"}],"statements":[],"categories":[],"answer":"D","explanation":"Akomodasi merupakan proses meredakan atau menyelesaikan pertentangan agar tercapai kestabilan. Musyawarah dan pembagian waktu penggunaan air menunjukkan bentuk akomodasi.","validation":"Sumber lama","reviewNotes":[]},{"id":"B1-SOS-04-02","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 4(2).docx","n":8,"title":"Pemilihan Ketua OSIS","category":"Proses Sosial","subcategory":"Proses Asosiatif dan Disosiatif","type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Tiga calon ketua OSIS menyampaikan program melalui debat terbuka. Setiap calon berusaha memperoleh dukungan dengan menjelaskan rencana kegiatan dan rekam jejaknya. Salah satu tim pendukung kemudian menyebarkan rumor yang belum terbukti mengenai calon lain. Guru meminta rumor dihentikan dan mengadakan klarifikasi bersama."},{"kind":"text","text":"Pernyataan yang benar berdasarkan kasus tersebut adalah ...."}],"options":[{"key":"A","text":"penyampaian program merupakan persaingan yang berlangsung secara terbuka"},{"key":"B","text":"penyebaran rumor merupakan bentuk kontravensi dalam proses pemilihan"},{"key":"C","text":"klarifikasi bersama merupakan upaya akomodasi untuk meredakan ketegangan"},{"key":"D","text":"seluruh rangkaian pemilihan merupakan konflik karena terdapat calon berbeda"}],"statements":[],"categories":[],"answer":"A, B, dan C","explanation":"Debat program adalah persaingan yang wajar. Penyebaran rumor termasuk kontravensi karena bertujuan melemahkan pihak lain secara tidak langsung. Klarifikasi menjadi bentuk akomodasi. Perbedaan calon tidak otomatis menjadi konflik.","validation":"Sumber lama","reviewNotes":[]},{"id":"B2-BS2-01-04","bank":"Bank Soal 2","source":"Bank Soal 2","originDoc":"SOAL TKA 1(6).docx","n":4,"title":"Perubahan Tradisi Perkawinan","category":"Hakikat dan Objek Kajian Sosiologi","subcategory":"","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Masyarakat Desa Mekarjaya biasanya melaksanakan rangkaian upacara perkawinan selama tiga hari. Generasi muda mulai mengusulkan penyederhanaan acara karena biaya yang diperlukan cukup besar. Tokoh adat menilai pengurangan tahapan dapat menghilangkan makna budaya. Perbedaan pandangan tersebut menimbulkan perdebatan antara kelompok muda dan kelompok tua."},{"kind":"text","text":"Fenomena tersebut termasuk kajian sosiologi karena berkaitan dengan ...."}],"options":[{"key":"A","text":"perbedaan nilai dan perubahan norma dalam kehidupan masyarakat"},{"key":"B","text":"perubahan cuaca yang memengaruhi pelaksanaan upacara perkawinan"},{"key":"C","text":"pemilihan bahan makanan yang disediakan selama kegiatan berlangsung"},{"key":"D","text":"kemampuan keluarga dalam mendekorasi tempat pelaksanaan perkawinan"},{"key":"E","text":"perbedaan usia biologis antara anggota masyarakat muda dan tua"}],"statements":[],"categories":[],"answer":"A","explanation":"Stimulus menunjukkan perbedaan nilai, norma, dan pandangan antargenerasi. Sosiologi mengkaji bagaimana perubahan nilai dapat memengaruhi hubungan dan keteraturan sosial dalam masyarakat.","validation":"Sesuai dokumen sumber; perlu pemeriksaan guru","reviewNotes":[]},{"id":"B2-BS2-01-09","bank":"Bank Soal 2","source":"Bank Soal 2","originDoc":"SOAL TKA 1(6).docx","n":9,"title":"Masyarakat Multikultural di Permukiman Baru","category":"Hakikat dan Objek Kajian Sosiologi","subcategory":"","type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Sebuah kawasan industri dihuni oleh pekerja dari berbagai daerah. Mereka membawa bahasa, adat, dan kebiasaan yang berbeda. Pada awalnya, warga sering mengalami kesalahpahaman saat mengadakan kegiatan lingkungan. Setelah dibentuk forum warga dan kegiatan budaya bersama, komunikasi membaik dan prasangka antarkelompok mulai berkurang."},{"kind":"text","text":"Unsur yang dapat dikaji secara sosiologis berdasarkan stimulus adalah ...."}],"options":[{"key":"A","text":"proses adaptasi kelompok dengan latar belakang budaya berbeda"},{"key":"B","text":"prasangka dan perubahan hubungan sosial antarkelompok masyarakat"},{"key":"C","text":"perbedaan kondisi biologis penduduk yang berasal dari daerah berbeda"},{"key":"D","text":"peran forum warga dalam mendorong integrasi sosial di permukiman"}],"statements":[],"categories":[],"answer":"A, B, dan D","explanation":"Adaptasi, prasangka, interaksi antarkelompok, dan integrasi sosial merupakan ruang lingkup sosiologi. Kondisi biologis bukan fokus utama kasus tersebut.","validation":"Sesuai dokumen sumber; perlu pemeriksaan guru","reviewNotes":[]},{"id":"B2-BS2-01-14","bank":"Bank Soal 2","source":"Bank Soal 2","originDoc":"SOAL TKA 1(6).docx","n":14,"title":"Kepemimpinan Perempuan di Desa","category":"Hakikat dan Objek Kajian Sosiologi","subcategory":"","type":"category","typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Seorang perempuan terpilih menjadi kepala desa setelah memperoleh dukungan mayoritas warga. Ia melibatkan kelompok perempuan, pemuda, dan penyandang disabilitas dalam perencanaan pembangunan. Namun, sebagian warga menilai perempuan tidak seharusnya memimpin kegiatan publik. Perbedaan pandangan menimbulkan perdebatan dalam sejumlah pertemuan desa."},{"kind":"text","text":"Tentukan ketepatan setiap pernyataan berikut."}],"options":[],"statements":["Penolakan terhadap pemimpin perempuan dapat dianalisis melalui stereotip gender.","Pelibatan berbagai kelompok mencerminkan upaya memperluas partisipasi sosial.","Jenis kelamin pemimpin hanya merupakan fakta biologis sehingga tidak berkaitan dengan sosiologi."],"categories":["Tepat","Tidak Tepat"],"answer":"Tepat | Tepat | Tidak Tepat","explanation":"Sosiologi mengkaji bagaimana masyarakat memberi makna sosial terhadap jenis kelamin melalui peran dan stereotip gender. Partisipasi kelompok yang beragam juga berkaitan dengan inklusi dan kesetaraan sosial.","validation":"Sesuai dokumen sumber; perlu pemeriksaan guru","reviewNotes":[]},{"id":"B2-BS2-02-04","bank":"Bank Soal 2","source":"Bank Soal 2","originDoc":"SOAL TKA 2(5).docx","n":4,"title":"Pelayanan Konsultasi Daring","category":"Interaksi Sosial","subcategory":"","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Seorang warga mengirimkan keluhan melalui aplikasi pelayanan kesehatan. Petugas membaca keluhan tersebut, meminta informasi tambahan, lalu memberikan petunjuk untuk memperoleh pemeriksaan di puskesmas. Warga memahami petunjuk itu dan mengonfirmasi jadwal kedatangannya."},{"kind":"text","text":"Bentuk kontak sosial yang mendukung interaksi pada kasus tersebut adalah ...."}],"options":[{"key":"A","text":"kontak primer karena kedua pihak bertemu dan berbicara dalam tempat yang sama"},{"key":"B","text":"kontak sekunder karena hubungan dilakukan menggunakan sarana komunikasi digital"},{"key":"C","text":"kontak negatif karena warga menyampaikan keluhan mengenai kondisi kesehatannya"},{"key":"D","text":"kontak kelompok karena komunikasi melibatkan seluruh petugas pelayanan kesehatan"},{"key":"E","text":"kontak spontan karena percakapan berlangsung tanpa tujuan yang telah ditentukan"}],"statements":[],"categories":[],"answer":"B","explanation":"Kontak sekunder terjadi melalui perantara atau media. Warga dan petugas berinteraksi menggunakan aplikasi. Pesan diterima, ditanggapi, dan dipahami sehingga komunikasi juga berlangsung.","validation":"Sesuai dokumen sumber; perlu pemeriksaan guru","reviewNotes":[]},{"id":"B2-BS2-03-04","bank":"Bank Soal 2","source":"Bank Soal 2","originDoc":"SOAL TKA 3(5).docx","n":4,"title":"Festival Budaya Kota","category":"Masyarakat Multikultural","subcategory":"","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Pemerintah Kota Pusaka menyelenggarakan festival yang menampilkan makanan, pakaian, musik, dan tarian dari berbagai kelompok budaya. Pengunjung dapat mempelajari tradisi kelompok lain. Namun, penyelenggara hanya menampilkan unsur budaya sebagai hiburan tanpa melibatkan komunitas pemiliknya dalam perencanaan. Beberapa komunitas menilai simbol budayanya disederhanakan dan digunakan tanpa penjelasan yang tepat."},{"kind":"text","text":"Evaluasi paling tepat terhadap pelaksanaan festival tersebut adalah ...."}],"options":[{"key":"A","text":"festival sepenuhnya mencerminkan multikulturalisme karena menampilkan banyak kesenian"},{"key":"B","text":"festival menghapus identitas kelompok karena seluruh budaya ditampilkan pada tempat sama"},{"key":"C","text":"festival berhasil menciptakan kesetaraan karena jumlah pertunjukan dibagi secara merata"},{"key":"D","text":"festival menunjukkan keragaman, tetapi belum menjamin partisipasi dan penghormatan budaya"},{"key":"E","text":"festival tidak berkaitan dengan masyarakat multikultural karena hanya berupa kegiatan hiburan"}],"statements":[],"categories":[],"answer":"D","explanation":"Multikulturalisme tidak hanya menampilkan keberagaman, tetapi juga menuntut pengakuan, partisipasi, dan penghormatan terhadap komunitas pemilik budaya. Tanpa pelibatan mereka, representasi budaya dapat menjadi tidak tepat.","validation":"Sesuai dokumen sumber; perlu pemeriksaan guru","reviewNotes":[]},{"id":"B2-BS2-03-09","bank":"Bank Soal 2","source":"Bank Soal 2","originDoc":"SOAL TKA 3(5).docx","n":9,"title":"Pasar Multikultural","category":"Masyarakat Multikultural","subcategory":"","type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Sebuah pasar dihuni pedagang dari berbagai suku dan daerah. Para pedagang menjual makanan, kain, dan kerajinan khas komunitasnya. Ketika menetapkan aturan kebersihan dan keamanan, pengelola hanya berkonsultasi dengan kelompok pedagang terbesar. Pedagang lain merasa kebutuhannya tidak dipertimbangkan dan mulai menolak aturan tersebut."},{"kind":"text","text":"Pernyataan yang tepat berdasarkan stimulus adalah ...."}],"options":[{"key":"A","text":"pasar menunjukkan keragaman budaya melalui barang yang diperdagangkan"},{"key":"B","text":"dominasi kelompok terbesar dapat menimbulkan ketidaksetaraan partisipasi"},{"key":"C","text":"penolakan aturan menunjukkan lemahnya konsensus dalam masyarakat majemuk"},{"key":"D","text":"keberagaman otomatis menjamin semua kelompok memperoleh pengaruh setara"}],"statements":[],"categories":[],"answer":"A, B, dan C","explanation":"Keragaman tidak otomatis menghasilkan kesetaraan. Dominasi kelompok besar dan tidak dilibatkannya kelompok lain dapat melemahkan konsensus serta memicu penolakan.","validation":"Sesuai dokumen sumber; perlu pemeriksaan guru","reviewNotes":[]},{"id":"B2-BS2-04-04","bank":"Bank Soal 2","source":"Bank Soal 2","originDoc":"SOAL TKA 4(5).docx","n":4,"title":"Perpaduan Musik Tradisional dan Modern","category":"Proses Sosial","subcategory":"","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Kelompok seni sekolah menampilkan musik tradisional menggunakan alat musik daerah. Agar lebih menarik bagi generasi muda, mereka menambahkan gitar el ","text":"hubungan sosial dapat berubah sesuai situasi dan tujuan yang dihadapi"}],"statements":[],"categories":[],"answer":"A, B, dan D","explanation":"Hubungan sosial bersifat dinamis. Kedua perusahaan bersaing dalam kegiatan bisnis, tetapi bekerja sama ketika menghadapi kebutuhan kemanusiaan. Kerja sama sementara tidak menghapus persaingan usaha.","validation":"Sesuai dokumen sumber; perlu pemeriksaan guru","reviewNotes":[]},{"id":"B2-BS2-04-14","bank":"Bank Soal 2","source":"Bank Soal 2","originDoc":"SOAL TKA 4(5).docx","n":14,"title":"Penggabungan Dua Komunitas Pemuda","category":"Proses Sosial","subcategory":"","type":"category","typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Dua komunitas pemuda memiliki program yang hampir sama. Untuk menghindari tumpang tindih, keduanya membentuk organisasi baru dengan nama dan aturan yang disepakati. Sebagian kebiasaan lama masih dipertahankan, tetapi identitas organisasi sebelumnya tidak lagi digunakan."},{"kind":"text","text":"Petunjuk: Tentukan kategori Tepat atau Tidak Tepat untuk setiap pernyataan."}],"options":[],"statements":["Pembentukan organisasi baru menunjukkan proses asimilasi kelompok.","Kesepakatan aturan bersama menunjukkan proses hubungan asosiatif.","Hilangnya identitas organisasi lama menunjukkan persaingan semakin kuat."],"categories":["Tepat","Tidak Tepat"],"answer":"Tepat | Tepat | Tidak Tepat","explanation":"Peleburan dua komunitas menjadi organisasi baru menunjukkan asimilasi. Kesepakatan aturan bersifat asosiatif. Hilangnya identitas lama merupakan hasil peleburan, bukan tanda meningkatnya persaingan.","validation":"Sesuai dokumen sumber; perlu pemeriksaan guru","reviewNotes":[]},{"id":"B2-BS2-05-04","bank":"Bank Soal 2","source":"Bank Soal 2","originDoc":"SOAL TKA 5(5).docx","n":4,"title":"Kelompok Pendukung Anak Berkebutuhan Khusus","category":"Kelompok Sosial","subcategory":"","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":" ":"Lengkap dari sumber","reviewNotes":[]},{"id":"B3-SOS-B-05-02","bank":"Bank Soal 3","source":"Bank Soal 3","originDoc":"SOAL TKA 5(4).docx","n":7,"title":"Komunitas Pembaca","category":"Kelompok Sosial","subcategory":"Pembentukan Kelompok Sosial","type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Pengunjung sebuah perpustakaan sering bertemu di ruang bacaan. Beberapa orang ternyata menyukai jenis buku sejarah yang sama. Mereka mulai berdiskusi, bertukar rekomendasi, dan membuat jadwal pertemuan bulanan. Setelah itu, komunitas menyusun aturan diskusi dan menunjuk seorang koordinator."},{"kind":"text","text":"Pernyataan yang tepat mengenai proses terbentuknya komunitas tersebut adalah ...."}],"options":[{"key":"A","text":"kesamaan minat menjadi dasar awal terbentuknya hubungan antaranggota"},{"key":"B","text":"pertemuan berulang memperkuat interaksi dan kedekatan dalam komunitas"},{"key":"C","text":"penunjukan koordinator menunjukkan mulai terbentuknya struktur kelompok"},{"key":"D","text":"berada di perpustakaan yang sama otomatis menjadikan semua pengunjung anggota"}],"statements":[],"categories":[],"answer":"A, B, dan C","explanation":"Kesamaan minat, interaksi berulang, dan pembentukan struktur mendukung lahirnya kelompok sosial. Kehadiran di lokasi yang sama tidak otomatis menjadikan semua orang sebagai anggota kelompok.","validation":"Lengkap dari sumber","reviewNotes":[]},{"id":"B3-SOS-B-05-03","bank":"Bank Soal 3","source":"Bank Soal 3","originDoc":"SOAL TKA 5(4).docx","n":12,"title":"Organisasi Penghuni Rumah Susun","category":"Kelompok Sosial","subcategory":"Pembentukan Kelompok Sosial","type":"category","typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Penghuni rumah susun berasal dari berbagai daerah dan belum saling mengenal. Masalah kebersihan dan keamanan membuat mereka mengadakan pertemuan. Penghuni lalu memilih pengurus, menyusun aturan penggunaan fasilitas, dan menetapkan iuran lingkungan."},{"kind":"text","text":"Petunjuk: Tentukan kategori Tepat atau Tidak Tepat untuk setiap pernyataan."}],"options":[],"statements":["Masalah bersama menjadi pendorong terbentuknya organisasi penghuni.","Pemilihan pengurus menunjukkan terbentuknya struktur dalam kelompok.","Perbedaan asal daerah membuat kelompok sosial tidak mungkin terbentuk."],"categories":["Tepat","Tidak Tepat"],"answer":"Tepat Tepat Tidak Tepat","explanation":"Permasalahan bersama mendorong penghuni berinteraksi dan membentuk organisasi. Struktur terlihat melalui pengurus dan aturan. Perbedaan daerah tidak menghalangi pembentukan kelompok selama terdapat kepentingan bersama.","validation":"Lengkap dari sumber","reviewNotes":[]},{"id":"B3-SOS-B-17-01","bank":"Bank Soal 3","source":"Bank Soal 3","originDoc":"SOAL TKA 17(4).docx","n":2,"title":"Rekrutmen Kerja dan Latar Belakang Sosial","category":"Kesetaraan dan Ketimpangan Sosial","subcategory":"Faktor Ketidaksetaraan","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Sebuah perusahaan membuka lowongan staf administrasi untuk lulusan SMA. Persyaratan tertulis hanya mencantumkan kemampuan komputer dan komunikasi. Namun, dalam praktiknya, pelamar yang memiliki hubungan keluarga dengan pegawai lama lebih sering dipanggil untuk wawancara. Sejumlah pelamar lain dengan kemampuan yang sama bahkan lebih tinggi tidak memperoleh kesempatan karena tidak memiliki jaringan pribadi di dalam perusahaan."},{"kind":"text","text":"Faktor utama penyebab ketidaksetaraan kesempatan kerja tersebut adalah ...."}],"options":[{"key":"A","text":"perbedaan tingkat pendidikan formal yang dimiliki oleh setiap pelamar"},{"key":"B","text":"ketimpangan jaringan sosial yang memengaruhi akses terhadap kesempatan kerja"},{"key":"C","text":"perbedaan usia pelamar yang memengaruhi kemampuan menggunakan teknologi digital"},{"key":"D","text":"perbedaan motivasi individual ketika mempersiapkan diri mengikuti proses seleksi"},{"key": nk Soal 3","source":"Bank Soal 3","originDoc":"SOAL TKA 17(4).docx","n":12,"title":"Desa Pegunungan dan Layanan Publik","category":"Kesetaraan dan Ketimpangan Sosial","subcategory":"Faktor Ketidaksetaraan","type":"category","typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Warga Desa Arunika tinggal di daerah pegunungan dengan jalan yang sering rusak. Puskesmas terdekat berjarak 35 kilometer. Di sisi lain, beberapa keluarga juga tidak mampu membayar ongkos kendaraan menuju puskesmas."},{"kind":"text","text":"Petunjuk: Kategorikan setiap faktor sebagai Faktor Geografis atau Faktor Ekonomi."}],"options":[],"statements":["Jarak desa yang jauh dari pusat pelayanan kesehatan.","Rendahnya kemampuan keluarga membayar biaya transportasi.","Kondisi jalan pegunungan yang menyulitkan perjalanan warga."],"categories":["Geografis","Ekonomi"],"answer":"Geografis Ekonomi Geografis","explanation":"Jarak dan kondisi wilayah merupakan faktor geografis, sedangkan kemampuan membayar perjalanan berkaitan dengan kondisi ekonomi.","validation":"Lengkap dari sumber","reviewNotes":[]},{"id":"B3-SOS-B-18-01","bank":"Bank Soal 3","source":"Bank Soal 3","originDoc":"SOAL TKA 18(4).docx","n":2,"title":"Kesenjangan Digital dalam Pendidikan","category":"Kesetaraan dan Ketimpangan Sosial","subcategory":"Dampak Ketidaksetaraan","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Sebuah SMA menerapkan pembelajaran berbasis platform digital. Sebagian peserta didik memiliki laptop pribadi dan internet berkecepatan tinggi di rumah. Sementara itu, sejumlah peserta didik hanya menggunakan telepon genggam milik orang tua dan harus mencari jaringan internet di tempat umum. Dalam satu semester, kelompok pertama lebih sering mengumpulkan tugas tepat waktu dan lebih aktif mengikuti kelas tambahan daring."},{"kind":"text","text":"Dampak ketidaksetaraan yang paling tepat berdasarkan kasus tersebut adalah ...."}],"options":[{"key":"A","text":"meni
