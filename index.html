at untuk setiap pernyataan."}],"options":[],"statements":["Upaya membuat stan terbaik menunjukkan bentuk persaingan.","Tuduhan meniru desain menunjukkan bentuk kerja sama antarkelas.","Mediasi guru dan kesepakatan baru menunjukkan bentuk akomodasi."],"categories":["Tepat","Tidak Tepat"],"answer":"Tepat Tidak Tepat Tepat","explanation":"Lomba mendorong persaingan. Tuduhan meniru menimbulkan ketegangan dan bukan kerja sama. Mediasi serta kesepakatan menjadi bentuk akomodasi untuk meredakan perselisihan.","validation":"Lengkap dari sumber","reviewNotes":[]},{"id":"D2025-01","bank":"Dokumen TKA 2025","source":"Dokumen TKA 2025","originDoc":"TKA_Sosiologi_2025_Kunci_Pembahasan_EDITABLE(4).docx","n":1,"title":"Soal TKA 2025 Nomor 1","category":"TKA Sosiologi 2025","subcategory":"25SOSSSIPOSS01SA-000000-0057","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Dahulu, masyarakat desa hidup rukun dan saling membantu melalui kegiatan gotong royong, seperti membersihkan lingkungan bersama-sama. Namun, belakangan ini kegiatan tersebut mulai ditinggalkan. Banyak warga lebih memilih menyewa jasa kebersihan karena kesibukan pekerjaan masing-masing. Perubahan ini menimbulkan kekhawatiran di kalangan tokoh masyarakat karena dinilai dapat mengikis nilai kebersamaan yang menjadi ciri khas desa."},{"kind":"text","text":"Apa makna perubahan perilaku masyarakat desa jika ditinjau dari sudut pandang sosiologi?"}],"options":[{"key":"A","text":"Perubahan gaya hidup karena meningkatnya pendapatan masyarakat desa."},{"key":"B","text":"Pergeseran sistem ekonomi dari komunal menuju individualisme."},{"key":"C","text":"Perubahan nilai sosial yang memengaruhi interaksi antarwarga."},{"key":"D","text":"Penurunan semangat kerja kolektif karena pengaruh globalisasi."},{"key":"E","text":"Kecenderungan masyarakat dalam menyesuaikan diri dengan tren modern."}],"statements":[],"categories":[],"answer":"C","explanation":"Perubahan dari gotong royong menuju penggunaan jasa kebersihan menunjukkan perubahan nilai sosial yang memengaruhi pola hubungan antarwarga. Fokus sosiologi bukan semata-mata kenaikan pendapatan atau tren modern, melainkan perubahan nilai kebersamaan dan dampaknya terhadap interaksi sosial.","validation":"Kunci/pembahasan menurut dokumen Word yang diunggah (bukan hasil TKA resmi)","reviewNotes":[]},{"id":"D2025-02","bank":"Dokumen TKA 2025","source":"Dokumen TKA 2025","originDoc":"TKA_Sosiologi_2025_Kunci_Pembahasan_EDITABLE(4).docx","n":2,"title":"Soal TKA 2025 Nomor 2","category":"TKA Sosiologi 2025","subcategory":"25SOSHGSKGSS09SA-000000-0095","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Pandemi COVID-19 yang melanda dunia sejak awal tahun 2020 telah membawa perubahan dalam berbagai aspek kehidupan, termasuk cara kita berinteraksi dan menjaga hubungan sosial. Kebijakan jaga jarak atau physical distancing menjadi norma baru yang wajib dipatuhi, sementara aktivitas tatap muka, termasuk pembelajaran, beralih secara drastis menjadi daring."},{"kind":"text","text":"Apa yang memungkinkan interaksi sosial tetap terjadi pada masa pandemi meskipun terdapat pembatasan tatap muka secara langsung?"}],"options":[{"key":"A","text":"Individu memahami teknologi informasi."},{"key":"B","text":"Komunikasi tetap terjalin melalui media daring."},{"key":"C","text":"Semua pihak mengikuti aturan dengan taat."},{"key":"D","text":"Lingkungan sekitar menyediakan jaringan internet."},{"key":"E","text":"Siswa dan guru menggunakan handphone."}],"statements":[],"categories":[],"answer":"B","explanation":"Interaksi sosial mensyaratkan adanya kontak sosial dan komunikasi. Ketika pertemuan langsung dibatasi, komunikasi tetap berlangsung melalui media daring sehingga hubungan sosial masih dapat terjadi walaupun tanpa tatap muka.","validation":"Kunci/pembahasan menurut dokumen Word yang diunggah (bukan hasil TKA resmi)","reviewNotes":[]},{"id":"D2025-03","bank":"Dokumen TKA 2025","source":"Dokumen TKA 2025","originDoc":"TKA_Sosiologi_2025_Kunci_Pembahasan_EDITABLE(4).docx","n":3,"title":"Soal TKA 2025 Nomor 3","category":"TKA Sosiologi 2025","subcategory":"25SOSHGSMMKS12SA-000000-0202","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Nasionalisme sebagai masyarakat yang lahir di Indonesia muncul pertama kali setelah Indische Partij terbentuk pada 1912. Partai ini melibatkan segala etnis, termasuk Eropa dan peranakan Indo. Kemudian peranakan Indo melebur dengan momentum nasionalisme berikutnya, Sumpah Pemuda 1928. Sumpah Pemuda menjadi ajang persatuan antara peranakan Tionghoa, Arab, dan Indo untuk jati dirinya sebagai orang Indonesia. Peristiwa ini mempertemukan kalangan tersebut untuk mengampanyekan persatuan. Berangsur-angsur setelah Sumpah Pemuda, berdirilah partai berbasis etnis yang mendukung nasionalisme. Kemudian pergerakan secara etnik perlahan pun melebur dengan kelompok nasionalisme lainnya. Tanpa sekat, dan bermuara pada kemerdekaan Indonesia."},{"kind":"text","text":"Sumber diadaptasi dari: https://nationalgeographic.grid.id/"},{"kind":"text","text":"Mengapa Sumpah Pemuda pada kasus tersebut bisa dikategorikan sebagai simbol multikulturalisme?"}],"options":[{"key":"A","text":"Mencerminkan proses asimilasi nilai dan tujuan budaya-budaya yang berbeda demi menjaga identitas asli setiap etnik."},{"key":"B","text":"Mengakomodasi berbagai etnik dari latar belakang berbeda untuk mendukung penghapusan identitasnya menjadi Indonesia."},{"key":"C","text":"Terdapat dorongan untuk membangun partikularisme melalui partai-partai bernuansa etnik dalam meraih kemerdekaan."},{"key":"D","text":"Bersifat tidak eksklusif untuk satu kelompok etnik melainkan inklusif dan terbuka bagi semua etnik yang hidup di Indonesia."},{"key":"E","text":"Adanya bentuk tuntutan agar etnik yang bergabung turut serta menjadi bagian dari kelompok mayoritas."}],"statements":[],"categories":[],"answer":"D","explanation":"Sumpah Pemuda dalam ilustrasi mempertemukan berbagai kelompok etnik dalam satu tujuan bersama tanpa menjadikannya eksklusif bagi satu etnik tertentu. Sikap inklusif dan terbuka terhadap keberagaman inilah yang sesuai dengan prinsip masyarakat multikultural.","validation":"Kunci/pembahasan menurut dokumen Word yang diunggah (bukan hasil TKA resmi)","reviewNotes":[]},{"id":"D2025-04","bank":"Dokumen TKA 2025","source":"Dokumen TKA 2025","originDoc":"TKA_Sosiologi_2025_Kunci_Pembahasan_EDITABLE(4).docx","n":4,"title":"Soal TKA 2025 Nomor 4","category":"TKA Sosiologi 2025","subcategory":"25SOSHGSPGSS10SA-000000-0030","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Di sebuah desa yang sedang berkembang, hidup dua kelompok masyarakat dengan latar belakang budaya dan kebiasaan yang berbeda, yaitu satu kelompok berasal dari penduduk asli desa dan kelompok lainnya berasal dari warga pendatang. Pada awalnya, hubungan antara kedua kelompok kerap diwarnai kesalahpahaman saat rapat desa, karena perbedaan cara pandang dan nilai-nilai budaya yang dianut. Kondisi ini menimbulkan ketegangan sosial yang menghambat pembangunan desa. Melihat hal ini, tokoh masyarakat menginisiasi kegiatan bersama seperti gotong royong, pelatihan kewirausahaan, dan dialog antarbudaya. Melalui proses ini, kedua kelompok mulai saling memahami, menghargai perbedaan, dan bekerja sama dalam pembangunan desa. Mereka juga sepakat untuk tetap mempertahankan budaya masing-masing, sambil merancang kegiatan budaya bersama yang melibatkan semua warga tanpa membedakan asal-usul."},{"kind":"text","text":"Berdasarkan ilustrasi tersebut, bentuk hubungan sosial apakah yang akhirnya terwujud di antara kedua kelompok masyarakat di atas?"}],"options":[{"key":"A","text":"Asimilasi, karena kedua kelompok membentuk budaya baru dengan menghilangkan perbedaan."},{"key":"B","text":"Kontravensi, karena terjadi perbedaan pandangan meskipun belum sampai pada konflik terbuka."},{"key":"C","text":"Koersi, karena kedua kelompok menyelesaikan konflik dengan dominasi kelompok yang lebih kuat."},{"key":"D","text":"Persaingan, karena masing-masing kelompok tetap mempertahankan identitas budaya secara tertutup."},{"key":"E","text":"Akomodasi, karena terdapat upaya meredakan ketegangan dengan kesepakatan bersama dan saling membantu."}],"statements":[],"categories":[],"answer":"E","explanation":"Akomodasi adalah proses meredakan pertentangan atau ketegangan agar kelompok yang berbeda dapat hidup dan bekerja sama. Dalam kasus ini kedua kelompok melakukan dialog, kegiatan bersama, dan kesepakatan tanpa harus menghapus identitas budaya masing-masing.","validation":"Kunci/pembahasan menurut dokumen Word yang diunggah (bukan hasil TKA resmi)","reviewNotes":[]},{"id":"D2025-05","bank":"Dokumen TKA 2025","source":"Dokumen TKA 2025","originDoc":"TKA_Sosiologi_2025_Kunci_Pembahasan_EDITABLE(4).docx","n":5,"title":"Soal TKA 2025 Nomor 5","category":"TKA Sosiologi 2025","subcategory":"25SOSHGSPGSS10SA-000000-0047","type":"category","typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Di salah satu kota besar, warga merasa resah karena sering terjadi penyerangan oleh sekelompok remaja bermotor. Para pelaku membawa senjata tajam. Aksi kekerasan ini umumnya berlangsung pada malam hari, terutama di kawasan Simpang Tiga, jalur utama yang sering dilalui warga ketika malam. Pihak kepolisian menyatakan bahwa insiden ini bukan yang pertama kali terjadi. Dalam dua bulan terakhir, telah terjadi lima kasus serupa dengan pola yang sama yaitu dilakukan oleh remaja dan menyasar warga yang sedang sendirian."},{"kind":"text","text":"Mengapa peristiwa yang terjadi dalam ilustrasi tersebut dianggap sebagai gejala sosial?\nKlik pilihan Benar atau Salah pada setiap pernyataan berdasarkan isi teks!"}],"options":[],"statements":["Kasus tersebut merupakan gejala sosial dengan dampak keresahan dan menimbulkan ketakutan di masyarakat.","Kasus ini termasuk gejala sosial akibat adanya penyimpangan perilaku dari norma sosial yang berlaku di masyarakat.","Aksi kekerasan dalam kasus ini terjadi secara individu dan tidak berulang sama sekali sehingga bukan gejala sosial."],"categories":["Benar","Salah"],"answer":"Benar – Benar – Salah","explanation":"Pernyataan pertama benar karena serangkaian penyerangan menimbulkan keresahan dan ketakutan yang berdampak pada masyarakat. Pernyataan kedua benar karena kekerasan dengan senjata merupakan penyimpangan dari norma sosial. Pernyataan ketiga salah karena peristiwa tersebut tidak terjadi satu kali; stimulus menyebutkan lima kasus serupa dalam dua bulan dengan pola yang sama.","validation":"Kunci/pembahasan menurut dokumen Word yang diunggah (bukan hasil TKA resmi)","reviewNotes":[]},{"id":"D2025-06","bank":"Dokumen TKA 2025","source":"Dokumen TKA 2025","originDoc":"TKA_Sosiologi_2025_Kunci_Pembahasan_EDITABLE(4).docx","n":6,"title":"Soal TKA 2025 Nomor 6","category":"TKA Sosiologi 2025","subcategory":"25SOSHGSRGSS11SA-000000-0262","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"URBANISASI\nPerpindahan dari wilayah jarang penduduk ke wilayah padat penduduk (urbanisasi) dapat diartikan sebagai suatu gejala suatu wilayah bertransformasi menjadi perkotaan."},{"kind":"text","text":"Sayangnya, wilayah jarang penduduk tersebut biasanya adalah perdesaan yang sebenarnya memiliki potensi berikut:\n• PUSAT PEMELIHARAAN KEANEKARAGAMAN HAYATI: Masyarakat lokal melindungi tanah, air, dan kehidupan hewan serta tumbuhan dengan cara tidak merusak ekosistem melalui pelestarian kearifan lokal.\n• PENGHASIL UTAMA PASOKAN PANGAN: Banyak sumber daya alam yang berperan sebagai pemasok sumber pangan dan kebutuhan pokok dihasilkan di wilayah-wilayah perdesaan.\n• PENGURANGAN DAMPAK LINGKUNGAN: Lingkungan yang hijau menghasilkan banyak oksigen dan mengurangi risiko polusi udara global."},{"kind":"text","text":"Mari kita dukung pertanian berkelanjutan dan menjaga lingkungan untuk masa depan yang lebih baik."},{"kind":"text","text":"Pemerintah desa membiarkan para penduduk melakukan urbanisasi. Jika hal tersebut terus terjadi, apa dampak negatif gejala sosial yang relevan berdasarkan kasus pada infografis?"}],"options":[{"key":"A","text":"Pengangguran di wilayah pedesaan akan terus meningkat karena lapangan kerja semakin sempit."},{"key":"B","text":"Sumber-sumber hayati akan rusak karena pencemaran lingkungan akibat pembangunan yang masif."},{"key":"C","text":"Kerusakan lingkungan di perdesaan akibat alih fungsi lahan terjadi karena industrialisasi semakin pesat."},{"key":"D","text":"Kenaikan harga terjadi seiring penurunan pasokan pangan karena banyak lahan yang tidak tergarap."},{"key":"E","text":"Pemanasan global terus meningkat karena polusi udara di perkotaan tidak diimbangi dengan penghijauan."}],"statements":[],"categories":[],"answer":"D","explanation":"Infografis menekankan peran perdesaan sebagai penghasil utama pangan. Jika urbanisasi terus berlangsung, tenaga pengelola lahan pertanian dapat berkurang, lahan menjadi tidak tergarap, pasokan pangan menurun, dan harga berpotensi meningkat. Karena itu pilihan D paling sesuai dengan hubungan sebab-akibat pada stimulus.","validation":"Kunci/pembahasan menurut dokumen Word yang diunggah (bukan hasil TKA resmi)","reviewNotes":[]},{"id":"D2025-07","bank":"Dokumen TKA 2025","source":"Dokumen TKA 2025","originDoc":"TKA_Sosiologi_2025_Kunci_Pembahasan_EDITABLE(4).docx","n":7,"title":"Soal TKA 2025 Nomor 7","category":"TKA Sosiologi 2025","subcategory":"25SOSPNSLPSS13SA-250020-0246","type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Pentingnya Keterlibatan Perempuan Dalam Politik"},{"kind":"text","text":"PARTAI POLITIK\nPerempuan yang berada di partai politik mampu menyuarakan isu kebijakan yang berpihak kepada perempuan melalui wakilnya yang duduk di parlemen. Mendorong perempuan menduduki jabatan penting di partai dan terpenuhinya minimal 30% kepengurusan perempuan."},{"kind":"text","text":"PARLEMEN\nKehadiran perempuan dalam Parlemen dapat memperjuangkan kebijakan yang berpihak pada perempuan karena perempuanlah yang tahu akan kebutuhannya. Selain itu juga dapat menentukan kebijakan dalam peningkatan kesetaraan dan keadilan gender."},{"kind":"text","text":"YUDIKATIF\nPerempuan dalam Lembaga Yudikatif sebagai pelaksana kebijakan harus terus mendukung terlaksananya semua peraturan yang berpihak kepada perempuan. Selain itu juga dapat mengusulkan kebijakan-kebijakan perlindungan terhadap perempuan."},{"kind":"text","text":"Penelitian ini bertujuan untuk memahami bagaimana keterlibatan perempuan dalam partai politik. Peneliti ingin melihat apakah perempuan benar-benar memiliki kesempatan dan mampu mengambil peran penting di dalamnya. Fokus peneliti adalah mengamati sejauh mana perempuan terlibat sebagai anggota biasa, pengurus partai, atau sebagai calon wakil rakyat dalam pemilihan umum. Dengan ini, peneliti berharap bisa mengetahui posisi perempuan dalam struktur partai dan kontribusi mereka terhadap aktivitas politik. Penelitian ini penting untuk melihat kesetaraan gender dalam dunia politik."},{"kind":"text","text":"Manakah pernyataan yang menunjukkan tujuan penelitian kualitatif studi kasus dari permasalahan sosial tersebut?\nKlik pada setiap pilihan jawaban benar! Jawaban benar lebih dari satu."}],"options":[{"key":"A","text":"Untuk mengidentifikasi kesempatan dan peran yang dapat diambil perempuan dalam aktivitas politik di partai."},{"key":"B","text":"Untuk memahami kontribusi spesifik perempuan terhadap dinamika dan keputusan politik di dalam partai."},{"key":"C","text":"Untuk menganalisis korelasi antara tingkat keterlibatan perempuan dengan eksistensi partai politik."},{"key":"D","text":"Untuk mengetahui sejauh mana kesetaraan gender terwujud dalam struktur dan praktik partai politik."},{"key":"E","text":"Untuk menentukan pengaruh keterlibatan perempuan terhadap pengambilan keputusan yang berpihak pada perempuan."}],"statements":[],"categories":[],"answer":"A, B, dan D","explanation":"Penelitian kualitatif studi kasus bertujuan memahami fenomena secara mendalam, sehingga tujuan yang sesuai ialah mengidentifikasi kesempatan dan peran perempuan (A), memahami kontribusi spesifik perempuan dalam dinamika politik partai (B), serta melihat sejauh mana kesetaraan gender terwujud (D). Pilihan C menggunakan konsep korelasi dan pilihan E menekankan pengaruh sebab-akibat, yang lebih khas penelitian kuantitatif.","validation":"Kunci/pembahasan menurut dokumen Word yang diunggah (bukan hasil TKA resmi)","reviewNotes":[]},{"id":"D2025-08","bank":"Dokumen TKA 2025","source":"Dokumen TKA 2025","originDoc":"TKA_Sosiologi_2025_Kunci_Pembahasan_EDITABLE(4).docx","n":8,"title":"Soal TKA 2025 Nomor 8","category":"TKA Sosiologi 2025","subcategory":"25SOSPNSLPSS13SA-250020-0135","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Pentingnya Keterlibatan Perempuan Dalam Politik"},{"kind":"text","text":"PARTAI POLITIK\nPerempuan yang berada di partai politik mampu menyuarakan isu kebijakan yang berpihak kepada perempuan melalui wakilnya yang duduk di parlemen. Mendorong perempuan menduduki jabatan penting di partai dan terpenuhinya minimal 30% kepengurusan perempuan."},{"kind":"text","text":"PARLEMEN\nKehadiran perempuan dalam Parlemen dapat memperjuangkan kebijakan yang berpihak pada perempuan karena perempuanlah yang tahu akan kebutuhannya. Selain itu juga dapat menentukan kebijakan dalam peningkatan kesetaraan dan keadilan gender."},{"kind":"text","text":"YUDIKATIF\nPerempuan dalam Lembaga Yudikatif sebagai pelaksana kebijakan harus terus mendukung terlaksananya semua peraturan yang berpihak kepada perempuan. Selain itu juga dapat mengusulkan kebijakan-kebijakan perlindungan terhadap perempuan."},{"kind":"text","text":"Berikut merupakan langkah-langkah penelitian sosial yang akan dilakukan peneliti:\n1. Mengumpulkan data melalui wawancara, observasi, dan dokumentasi.\n2. Menentukan landasan teori dan konsep yang relevan.\n3. Mengolah dan menganalisis data hasil penelitian.\n4. Menyusun latar belakang penelitian berdasarkan data resmi.\n5. Menarik kesimpulan dan memberikan rekomendasi kebijakan."},{"kind":"text","text":"Manakah urutan langkah-langkah penelitian yang termasuk tahapan pelaksanaan penelitian sosial?"}],"options":[{"key":"A","text":"Mengumpulkan data melalui wawancara, observasi, dan dokumentasi dan menentukan landasan teori dan konsep yang relevan."},{"key":"B","text":"Mengumpulkan data melalui wawancara, observasi, dan dokumentasi dan mengolah dan menganalisis data hasil penelitian."},{"key":"C","text":"Mengumpulkan data melalui wawancara, observasi, dan dokumentasi dan menarik kesimpulan dan memberikan rekomendasi kebijakan."},{"key":"D","text":"Menentukan landasan teori dan konsep yang relevan dan menyusun latar belakang penelitian berdasarkan data resmi."},{"key":"E","text":"Menyusun latar belakang penelitian berdasarkan data resmi dan menarik kesimpulan dan memberikan rekomendasi kebijakan."}],"statements":[],"categories":[],"answer":"B","explanation":"Tahap pelaksanaan penelitian mencakup kegiatan mengumpulkan data dan kemudian mengolah serta menganalisis data. Menentukan landasan teori dan menyusun latar belakang termasuk tahap perencanaan, sedangkan menarik kesimpulan dan memberi rekomendasi berada pada tahap akhir/pelaporan.","validation":"Kunci/pembahasan menurut dokumen Word yang diunggah (bukan hasil TKA resmi)","reviewNotes":[]},{"id":"D2025-09","bank":"Dokumen TKA 2025","source":"Dokumen TKA 2025","originDoc":"TKA_Sosiologi_2025_Kunci_Pembahasan_EDITABLE(4).docx","n":9,"title":"Soal TKA 2025 Nomor 9","category":"TKA Sosiologi 2025","subcategory":"25SOSPNSMTPS15SA-000000-0161","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Penggunaan media sosial yang sangat banyak digemari oleh remaja menimbulkan kekhawatiran dapat mempengaruhi perilaku dan moral mereka. Kenakalan remaja yang makin rumit sering dihubungkan dengan interaksi mereka dengan konten online tertentu. Sehingga seorang peneliti melakukan penelitian pada remaja usia 13–18 tahun yang sering memakai media sosial. Peneliti tersebut mengumpulkan data dengan menyebarkan kuesioner online kepada 150 remaja. Kuesioner ini mempunyai dua bagian utama yaitu satu untuk mengukur seberapa sering dan bagaimana mereka menggunakan media sosial, dan bagian lainnya untuk mengukur tingkat kenakalan remaja berdasarkan pengalaman dan pandangan mereka sendiri."},{"kind":"text","text":"Manakah pernyataan yang menunjukkan metode penelitian yang sesuai dengan teknik pengumpulan data yang dilakukan?"}],"options":[{"key":"A","text":"Penelitian eksperimen dengan teknik penentuan sampel stratified sampling karena penelitian ini membandingkan pada kelompok pengguna media sosial maupun yang tidak dari berbagai kalangan yang berbeda tingkatan."},{"key":"B","text":"Penelitian eksploratif dengan teknik penentuan sampel cluster sampling berdasarkan wilayah untuk mengeksplorasi fenomena penggunaan media sosial dapat mempengaruhi moral remaja."},{"key":"C","text":"Penelitian kuantitatif dengan teknik penentuan sampel simple random sampling berdasarkan rentang usia yang diambil secara acak untuk menganalisis pengaruh penggunaan media sosial terhadap tingkat kenakalan remaja."},{"key":"D","text":"Penelitian lapangan dengan teknik penentuan sampel area sampling berdasarkan area tertentu untuk mengobservasi fenomena penggunaan media sosial terhadap tingkat kenakalan remaja."},{"key":"E","text":"Penelitian kualitatif dengan teknik penentuan sampel purposive sampling dengan menentukan kriteria tertentu untuk memahami dampak yang ditimbulkan dari fenomena penggunaan media sosial pada remaja."}],"statements":[],"categories":[],"answer":"C","explanation":"Penggunaan kuesioner kepada 150 responden untuk mengukur dua variabel menunjukkan pendekatan kuantitatif. Dari pilihan yang tersedia, C paling sesuai karena menggambarkan penelitian kuantitatif yang menguji hubungan/pengaruh penggunaan media sosial terhadap kenakalan remaja. Catatan: stimulus tidak menjelaskan secara eksplisit teknik pengambilan sampel; karena itu bagian 'simple random sampling' pada opsi C dipilih sebagai opsi yang paling mendekati keseluruhan desain penelitian.","validation":"Kunci/pembahasan menurut dokumen Word yang diunggah (bukan hasil TKA resmi)","reviewNotes":[]},{"id":"D2025-10","bank":"Dokumen TKA 2025","source":"Dokumen TKA 2025","originDoc":"TKA_Sosiologi_2025_Kunci_Pembahasan_EDITABLE(4).docx","n":10,"title":"Soal TKA 2025 Nomor 10","category":"TKA Sosiologi 2025","subcategory":"25SOSPNSMNPS14SA-000000-0117","type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Penelitian ini bertujuan untuk menelaah secara komprehensif fenomena meningkatnya jumlah pengemis anak di ruang publik. Fokus utama diarahkan pada identifikasi faktor-faktor penyebab anak-anak berada di jalanan, seperti kondisi kemiskinan, keterbatasan akses terhadap pendidikan, serta eksploitasi oleh pihak tertentu. Penelitian ini juga mengeksplorasi dampak sosial dan psikologis yang dialami anak-anak tersebut, termasuk hilangnya masa kanak-kanak, kerentanan terhadap tindak kekerasan, dan munculnya stigma sosial. Teknik pengumpulan data yang digunakan meliputi observasi partisipatif, wawancara mendalam, dan kajian pustaka. Temuan dari penelitian ini diharapkan dapat memberikan kontribusi dalam pengembangan ilmu sosial, menjadi dasar pemecahan permasalahan sosial, serta meningkatkan kapasitas dan kompetensi peneliti."},{"kind":"text","text":"Pernyataan manakah yang paling tepat menggambarkan kontribusi penelitian sosial dalam menyelesaikan permasalahan berdasarkan ilustrasi tersebut?\nKlik pada setiap pilihan jawaban benar! Jawaban benar lebih dari satu."}],"options":[{"key":"A","text":"Menambah wawasan tentang dampak fisik, psikologis maupun sosial yang dialami oleh pengemis di bawah umur."},{"key":"B","text":"Memberikan solusi atau saran kepada pemerintah untuk dapat dijadikan sebagai dasar pengambilan kebijakan."},{"key":"C","text":"Menjadi referensi utama bagi penelitian selanjutnya dan memberikan manfaat bagi para pembaca."},{"key":"D","text":"Meningkatkan kesadaran masyarakat tentang kompleksitas dan bahaya pengemis di bawah umur."},{"key":"E","text":"Mengurangi tingkat kekerasan dan eksploitasi di jalanan pada anak di bawah umur."}],"statements":[],"categories":[],"answer":"B dan D","explanation":"Kontribusi penelitian untuk penyelesaian masalah tampak pada kemampuan hasil penelitian menjadi dasar rekomendasi kebijakan (B) dan meningkatkan kesadaran masyarakat terhadap kompleksitas persoalan (D). Pilihan A dan C lebih menonjolkan manfaat akademik/pengetahuan, sedangkan E menyatakan hasil langsung yang tidak otomatis terjadi hanya karena penelitian dilakukan.","validation":"Kunci/pembahasan menurut dokumen Word yang diunggah (bukan hasil TKA resmi)","reviewNotes":[]},{"id":"D2025-11","bank":"Dokumen TKA 2025","source":"Dokumen TKA 2025","originDoc":"TKA_Sosiologi_2025_Kunci_Pembahasan_EDITABLE(4).docx","n":11,"title":"Soal TKA 2025 Nomor 11","category":"TKA Sosiologi 2025","subcategory":"25SOSPNSPGDS18SA-000000-0238","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Perhatikan grafik di bawah ini!"},{"kind":"text","text":"Data grafik (editable)"},{"kind":"table","rows":[["Jenis Kegiatan","Jumlah"],["Daur Ulang Sampah","50"],["Penanaman Pohon","80"],["Bersih Sungai","120"]]},{"kind":"text","text":"Berdasarkan grafik hasil penelitian di atas, penjelasan manakah yang paling tepat mengenai pola partisipasi komunitas dalam kegiatan lingkungan?"}],"options":[{"key":"A","text":"Semua jenis kegiatan lingkungan memiliki tingkat partisipasi yang seragam dan tinggi."},{"key":"B","text":"Kegiatan bersih sungai adalah yang paling populer dan menarik partisipasi komunitas terbanyak."},{"key":"C","text":"Masyarakat cenderung tidak tertarik pada kegiatan lingkungan yang bersifat fisik seperti penanaman pohon."},{"key":"D","text":"Daur ulang sampah merupakan kegiatan yang paling sukses dalam menarik jumlah peserta terbanyak."},{"key":"E","text":"Tidak ada perbedaan yang signifikan antara partisipasi dalam penanaman pohon dan daur ulang sampah."}],"statements":[],"categories":[],"answer":"B","explanation":"Data menunjukkan Daur Ulang Sampah 50 peserta, Penanaman Pohon 80 peserta, dan Bersih Sungai 120 peserta. Karena jumlah 120 adalah yang tertinggi, kegiatan bersih sungai merupakan kegiatan dengan partisipasi komunitas terbanyak.","validation":"Kunci/pembahasan menurut dokumen Word yang diunggah (bukan hasil TKA resmi)","reviewNotes":[]},{"id":"D2025-12","bank":"Dokumen TKA 2025","source":"Dokumen TKA 2025","originDoc":"TKA_Sosiologi_2025_Kunci_Pembahasan_EDITABLE(4).docx","n":12,"title":"Soal TKA 2025 Nomor 12","category":"TKA Sosiologi 2025","subcategory":"25SOSHGSPKLS07SA-000000-0252","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Catatan sumber: blok Hierarki Indikator tidak tercantum pada halaman soal ini."},{"kind":"text","text":"Di sebuah sekolah, sekelompok siswa membentuk komunitas bernama “Green Youth Club” yang fokus pada isu lingkungan. Mereka memulai dengan saling berbagi informasi tentang daur ulang dan pengelolaan sampah organik, lalu rutin melakukan kegiatan seperti membersihkan taman sekolah, membuat kompos, dan menyosialisasikan gaya hidup ramah lingkungan. Anggota komunitas ini berasal dari berbagai kelas dan latar belakang, namun mereka merasa memiliki tujuan bersama dan saling mendukung dalam kegiatan yang dijalankan."},{"kind":"text","text":"Jika dikaji dari konsep kelompok sosial, bagaimana proses terbentuknya komunitas Green Youth Club tersebut?"}],"options":[{"key":"A","text":"Komunitas terbentuk secara spontan tanpa adanya kesamaan visi dan nilai."},{"key":"B","text":"“Green Youth Club” termasuk kelompok semu karena hanya berkumpul sesekali."},{"key":"C","text":"Kelompok tersebut terbentuk karena interaksi sosial yang berkelanjutan dan tujuan bersama."},{"key":"D","text":"Komunitas itu dibentuk secara paksa oleh sekolah sehingga tidak mencerminkan kelompok sosial."},{"key":"E","text":"Kelompok ini bukan kelompok sosial karena anggotanya berasal dari kelas yang berbeda."}],"statements":[],"categories":[],"answer":"C","explanation":"Kelompok sosial terbentuk ketika terdapat interaksi yang berkelanjutan, kesadaran sebagai bagian dari kelompok, dan tujuan bersama. Green Youth Club memenuhi ciri tersebut karena anggotanya rutin berinteraksi, menjalankan kegiatan bersama, serta memiliki kepedulian yang sama terhadap lingkungan.","validation":"Kunci/pembahasan menurut dokumen Word yang diunggah (bukan hasil TKA resmi)","reviewNotes":[]},{"id":"D2025-13","bank":"Dokumen TKA 2025","source":"Dokumen TKA 2025","originDoc":"TKA_Sosiologi_2025_Kunci_Pembahasan_EDITABLE(4).docx","n":13,"title":"Soal TKA 2025 Nomor 13","category":"TKA Sosiologi 2025","subcategory":"25SOSPNSRCPS19SA-000000-0150","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Perhatikan hasil penelitian berikut!\nTabel Persepsi, hambatan, dan harapan publik mengenai pelayanan pemerintah"},{"kind":"table","rows":[["Tema Utama","Subtema","Kutipan Informan"],["Persepsi Pelayanan Publik","Ketepatan waktu","“Saya sudah datang pagi-pagi, tapi tetap saja harus menunggu lama.” – Informan 1"],["Persepsi Pelayanan Publik","Keramahan petugas","“Petugasnya sebenarnya ramah, tapi kadang terkesan terburu-buru.” – Informan 3"],["Hambatan dalam Pelayanan","Sistem antrean manual","“Kalau antrean masih tulis tangan begini, gampang diserobot.” – Informan 4"],["Hambatan dalam Pelayanan","Kurangnya petunjuk informasi","“Saya bingung harus ke loket mana dulu. Tidak ada papan petunjuk.” – Informan 9"],["Harapan Masyarakat","Digitalisasi pelayanan","“Kalau bisa, dibuat sistem online biar enggak perlu antre lama di sini.” – Informan 10"],["Harapan Masyarakat","Pelatihan SDM","“Petugasnya perlu pelatihan biar lebih cepat dan akurat saat melayani.” – Informan 7"]]},{"kind":"text","text":"Bagaimana langkah-langkah penelitian yang tepat agar peneliti bisa menghasilkan sajian data tersebut?"}],"options":[{"key":"A","text":"Peneliti membuat panduan wawancara yang diturunkan dari rumusan masalah penelitian, lalu melakukan pengumpulan data, mengecek kelengkapan jawaban, mengidentifikasi hasil jawaban, lalu mengelompokkannya dalam kategori yang sama."},{"key":"B","text":"Peneliti membuat daftar pertanyaan tertutup, mengujicobakannya dalam kelompok kecil, mengecek kelengkapan jawaban, mengelompokkan jawaban dalam tema tertentu, lalu menyimpulkan jawaban setiap responden."},{"key":"C","text":"Peneliti membuat kuesioner dengan jenis pertanyaan campuran, lalu melakukan pengumpulan data, mengecek kelengkapan jawaban, mengklasifikasi jawaban setiap responden, lalu melakukan penyajian data."},{"key":"D","text":"Peneliti merumuskan pertanyaan-pertanyaan pokok dari judul penelitian, lalu membuat panduan wawancara, melakukan uji coba terbatas, melakukan pengumpulan data, mengecek kelengkapan data, lalu penyajian data."},{"key":"E","text":"Peneliti merumuskan indikator dari variabel, lalu menurunkan indikator menjadi butir pertanyaan, melakukan uji coba terbatas, melakukan pengumpulan data, mengecek kelengkapan data, lalu penyajian data."}],"statements":[],"categories":[],"answer":"A","explanation":"Sajian data berupa tema, subtema, dan kutipan informan merupakan hasil pengolahan data kualitatif. Alur yang tepat ialah menyusun panduan wawancara dari rumusan masalah, mengumpulkan data, memeriksa kelengkapan, mengidentifikasi jawaban, lalu mengelompokkan jawaban ke dalam kategori atau tema yang sama.","validation":"Kunci/pembahasan menurut dokumen Word yang diunggah (bukan hasil TKA resmi)","reviewNotes":[]},{"id":"D2025-14","bank":"Dokumen TKA 2025","source":"Dokumen TKA 2025","originDoc":"TKA_Sosiologi_2025_Kunci_Pembahasan_EDITABLE(4).docx","n":14,"title":"Soal TKA 2025 Nomor 14","category":"TKA Sosiologi 2025","subcategory":"25SOSKSKKKSS26SA-000000-0409","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Di beberapa kota di Indonesia mulai banyak terjadi konflik antara kelompok pedagang pasar tradisional dan pengelola pusat perbelanjaan modern/mal yang baru dibangun. Para pedagang pasar tradisional merasa dirugikan karena kehadiran mal tersebut mengakibatkan menurunnya jumlah pembeli di pasar tradisional. Mereka menganggap bahwa pembangunan pusat perbelanjaan tidak memperhatikan keberlangsungan ekonomi masyarakat kecil. Sementara itu, pihak pengelola mal merasa bahwa pembangunan tersebut sah dan merupakan bentuk kemajuan ekonomi kota. Ketegangan makin meningkat setelah terjadi aksi demonstrasi yang diwarnai kericuhan. Pemerintah kota mencoba meredam konflik dengan memediasi kedua belah pihak namun hingga kini belum tercapai kesepakatan yang memuaskan semua pihak. Konflik ini menjadi sorotan media dan memunculkan berbagai reaksi dari masyarakat luas."},{"kind":"text","text":"Apa bentuk konflik sosial yang terjadi berdasarkan ilustrasi tersebut?"}],"options":[{"key":"A","text":"Konflik antar kelas sosial karena terjadi benturan antara pedagang tradisional dan pedagang di mal."},{"key":"B","text":"Konflik antarkelompok kepentingan karena adanya perbedaan kepentingan ekonomi yang berbeda."},{"key":"C","text":"Konflik politik antar institusi dalam hal ini kelompok pedagang di mal ingin mengalahkan pedagang pasar tradisional."},{"key":"D","text":"Konflik budaya akibat perubahan nilai dimana pedagang pasar tradisional kehilangan pelanggan sejak adanya mal."},{"key":"E","text":"Konflik antarpribadi karena perbedaan individu yang terjadi di antara para pedagang tradisional kepada pedagang di mal."}],"statements":[],"categories":[],"answer":"B","explanation":"Konflik terjadi antara dua kelompok yang memiliki kepentingan ekonomi berbeda: pedagang pasar tradisional dan pengelola pusat perbelanjaan modern. Karena sumber pertentangannya adalah perbedaan kepentingan antarkelompok, bentuk yang paling tepat adalah konflik antarkelompok kepentingan.","validation":"Kunci/pembahasan menurut dokumen Word yang diunggah (bukan hasil TKA resmi)","reviewNotes":[]},{"id":"D2025-15","bank":"Dokumen TKA 2025","source":"Dokumen TKA 2025","originDoc":"TKA_Sosiologi_2025_Kunci_Pembahasan_EDITABLE(4).docx","n":15,"title":"Soal TKA 2025 Nomor 15","category":"TKA Sosiologi 2025","subcategory":"25SOSKSKPNKS29SA-000000-0345","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Pada suatu daerah terjadi ketegangan antara komunitas adat dengan perusahaan perkebunan sawit. Konflik ini bermulai dari klaim terhadap hak kepemilikan lahan. Perusahaan berpegang pada izin yang mereka miliki, sementara komunitas adat merasa terabaikan. Konflik ini mengakibatkan terjadinya bentrokan fisik dan pemblokiran jalan oleh warga yang mengakibatkan aktivitas distribusi hasil perkebunan sawit menjadi terhambat. Mediasi awal dalam rangka penyelesaian konflik yang terjadi sudah dilakukan tetapi gagal total dan bahkan memperparah ketegangan dan ketidakpercayaan antara kedua belah pihak (komunitas adat dan pihak perusahaan perkebunan sawit). Situasi yang terjadi ini berada pada titik kritis dan memerlukan intervensi yang lebih kuat."},{"kind":"text","text":"Bagaimana strategi yang tepat untuk mencapai kedamaian yang berkelanjutan antara komunitas adat dan perusahaan perkebunan?"}],"options":[{"key":"A","text":"Memulai kembali negosiasi antara manajemen perusahaan dan perwakilan komunitas adat tanpa melibatkan campur tangan pihak ketiga yang netral."},{"key":"B","text":"Melakukan dialog multi-pihak yang melibatkan pemerintah, akademisi, dan organisasi non pemerintah untuk membangun pemahaman bersama."},{"key":"C","text":"Melakukan arbitrase dengan menunjuk pihak ketiga yang independen dan memiliki kewenangan untuk membuat keputusan mengikat secara hukum."},{"key":"D","text":"Mengembangkan program kemitraan usaha bersama antara kedua belah pihak dengan sistem pembagian keuntungan yang dibagi secara adil."},{"key":"E","text":"Membentuk forum musyawarah desa yang difasilitasi oleh tokoh masyarakat setempat untuk mencari solusi terbaik yang berbasis kearifan lokal."}],"statements":[],"categories":[],"answer":"C","explanation":"Mediasi telah gagal dan situasi sudah berada pada titik kritis, sehingga dibutuhkan intervensi pihak ketiga yang lebih kuat. Arbitrase melibatkan pihak ketiga yang independen dan menghasilkan keputusan yang mengikat, sehingga merupakan pilihan yang paling sesuai di antara opsi yang tersedia.","validation":"Kunci/pembahasan menurut dokumen Word yang diunggah (bukan hasil TKA resmi)","reviewNotes":[]},{"id":"D2025-16","bank":"Dokumen TKA 2025","source":"Dokumen TKA 2025","originDoc":"TKA_Sosiologi_2025_Kunci_Pembahasan_EDITABLE(4).docx","n":16,"title":"Soal TKA 2025 Nomor 16","category":"TKA Sosiologi 2025","subcategory":"25SOSKSKPKSS27SA-000000-0593","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"[Ilustrasi visual: aksi protes menolak tambang]"},{"kind":"text","text":"Di Desa Tanjung Harapan, sebuah perusahaan tambang mulai beroperasi setelah mendapatkan izin dari pemerintah daerah. Perusahaan tersebut membuka lahan secara besar-besaran, termasuk wilayah hutan adat yang selama ini dikelola secara turun-temurun oleh masyarakat lokal. Masyarakat adat menolak keberadaan tambang karena merasa tidak dilibatkan dalam proses perizinan dan khawatir kehilangan sumber penghidupan. Dalam beberapa bulan terakhir, terjadi aksi protes yang berujung pada bentrokan antara warga dan aparat keamanan."},{"kind":"text","text":"Berdasarkan ilustrasi tersebut, apa penyebab utama terjadinya konflik sosial di Desa Tanjung Harapan?"}],"options":[{"key":"A","text":"Pemerintah daerah tidak mampu mengelola hasil tambang dengan baik."},{"key":"B","text":"Perusahaan tidak memberikan pelatihan kerja kepada masyarakat sekitar."},{"key":"C","text":"Masyarakat adat tidak memiliki pengetahuan tentang kegiatan pertambangan modern."},{"key":"D","text":"Kurangnya komunikasi dan partisipasi masyarakat dalam proses pengambilan keputusan."},{"key":"E","text":"Terjadi benturan kepentingan antara perusahaan dan hak masyarakat adat atas lahan."}],"statements":[],"categories":[],"answer":"E","explanation":"Akar konflik adalah benturan kepentingan antara kegiatan pertambangan dan hak masyarakat adat atas lahan yang telah dikelola turun-temurun. Minimnya komunikasi dan partisipasi memperburuk konflik, tetapi pokok pertentangan dalam stimulus adalah klaim dan kepentingan yang saling bertabrakan atas lahan tersebut.","validation":"Kunci/pembahasan menurut dokumen Word yang diunggah (bukan hasil TKA resmi)","reviewNotes":[]},{"id":"D2025-17","bank":"Dokumen TKA 2025","source":"Dokumen TKA 2025","originDoc":"TKA_Sosiologi_2025_Kunci_Pembahasan_EDITABLE(4).docx","n":17,"title":"Soal TKA 2025 Nomor 17","category":"TKA Sosiologi 2025","subcategory":"25SOSKSKPNKS29SA-000000-0511","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Konflik mulai terjadi ketika proyek pabrik yang didukung pemerintah lokal mulai dibangun di tanah yang secara tradisional menghidupi petani lokal. Petani mengatakan bahwa mereka tidak diberi informasi dan mengkhawatirkan nasib mereka akibat hilangnya mata pencaharian. Protes petani akhirnya viral di media sosial dan akhirnya mendapatkan perhatian dari pemerintah. Pemerintah lokal mengundang pihak petani dan pabrik untuk duduk bersama berdialog dengan fasilitasi tim perdamaian. Kesepakatan akhirnya terwujud dalam bentuk kompensasi, dibangunnya zona penyangga pertanian dan dilibatkannya warga (petani) dalam pengawasan proyek."},{"kind":"text","text":"Berdasarkan ilustrasi tersebut, apa cara yang paling efektif untuk meredakan konflik dan menciptakan harmoni sosial?"}],"options":[{"key":"A","text":"Memindahkan lahan pertanian ke lokasi lain tanpa perundingan."},{"key":"B","text":"Melakukan dialog untuk menciptakan kesepakatan yang inklusif."},{"key":"C","text":"Menawarkan bagi hasil saham kepada petani tanpa jaminan tanah."},{"key":"D","text":"Menekan protes dengan melakukan mobilisasi aparat keamanan."},{"key":"E","text":"Melanjutkan konstruksi tanpa mempertimbangkan keberatan warga."}],"statements":[],"categories":[],"answer":"B","explanation":"Ilustrasi menunjukkan bahwa konflik mereda setelah pihak-pihak yang berkepentingan duduk bersama dalam dialog yang difasilitasi tim perdamaian. Kesepakatan yang dihasilkan mencakup kompensasi, zona penyangga, dan pelibatan warga, sehingga dialog inklusif merupakan cara yang paling sesuai.","validation":"Kunci/pembahasan menurut dokumen Word yang diunggah (bukan hasil TKA resmi)","reviewNotes":[]},{"id":"D2025-18","bank":"Dokumen TKA 2025","source":"Dokumen TKA 2025","originDoc":"TKA_Sosiologi_2025_Kunci_Pembahasan_EDITABLE(4).docx","n":18,"title":"Soal TKA 2025 Nomor 18","category":"TKA Sosiologi 2025","subcategory":"25SOSKSKRKSS21SA-000000-0585","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"JENIS-JENIS KELOMPOK SOSIAL DI SEKITAR KITA"},{"kind":"text","text":"• KELOMPOK PRIMER: Hubungan dekat dan bersifat personal, seperti keluarga atau sahabat.\n• KELOMPOK SEKUNDER: Interaksi lebih formal dan berorientasi pada tujuan tertentu, seperti organisasi sekolah.\n• KELOMPOK FORMAL: Memiliki struktur, aturan, dan keanggotaan resmi.\n• KELOMPOK INFORMAL: Terbentuk secara spontan tanpa aturan resmi, seperti teman bermain."},{"kind":"text","text":"Manakah pernyataan yang paling tepat menunjukkan perbedaan kelompok sosial pada infografis tersebut?"}],"options":[{"key":"A","text":"Keluarga menunjukkan kelompok informal yang terbentuk secara spontan dan alami dari interaksi sosial yang terjadi karena adanya kesamaan minat, hobi, atau tujuan."},{"key":"B","text":"Kelompok belajar menunjukkan kelompok primer yang ditandai oleh adanya hubungan yang sangat erat, personal, intim, dan interaksi tatap muka yang sering."},{"key":"C","text":"Organisasi pramuka menunjukkan kelompok primer yang ditandai dengan adanya hubungan yang sangat erat, personal, intim, dan interaksi tatap muka yang sering."},{"key":"D","text":"Teman bermain menunjukkan kelompok formal yang dibentuk secara sengaja dan terencana dengan tujuan serta struktur yang jelas dan memiliki aturan yang tertulis."},{"key":"E","text":"Organisasi OSIS menunjukkan kelompok sekunder yang dicirikan oleh hubungan yang lebih formal, impersonal, dan berdasarkan tujuan atau kepentingan tertentu."}],"statements":[],"categories":[],"answer":"E","explanation":"OSIS merupakan kelompok sekunder karena hubungan antaranggota relatif lebih formal, berorientasi pada tujuan organisasi, dan tidak semata-mata didasarkan pada kedekatan pribadi. Ciri tersebut sesuai dengan pilihan E.","validation":"Kunci/pembahasan menurut dokumen Word yang diunggah (bukan hasil TKA resmi)","reviewNotes":[]},{"id":"D2025-19","bank":"Dokumen TKA 2025","source":"Dokumen TKA 2025","originDoc":"TKA_Sosiologi_2025_Kunci_Pembahasan_EDITABLE(4).docx","n":19,"title":"Soal TKA 2025 Nomor 19","category":"TKA Sosiologi 2025","subcategory":"25SOSKSKRKTS24SA-000000-0554","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Di Kelurahan Maju Jaya, warga terdiri dari beragam kelompok sosial seperti penduduk asli, pendatang dari kota, serta etnis minoritas. Dalam kegiatan pembangunan balai warga, kelompok penduduk asli selalu diundang dalam rapat musyawarah, sementara kelompok lain jarang dilibatkan. Kelompok pendatang dan etnis minoritas juga kesulitan memperoleh informasi tentang kegiatan warga karena akses informasi hanya beredar di lingkaran tertentu. Akibatnya, kelompok yang tidak terlibat merasa tersisih dan mulai muncul perasaan tidak dihargai. Ketegangan mulai terlihat ketika beberapa warga menyuarakan ketidakpuasan dalam forum daring lokal. Situasi ini menimbulkan saling curiga, bahkan muncul komentar negatif antar kelompok. Dalam masyarakat majemuk seperti ini, praktik ketidaksetaraan sosial dalam partisipasi dapat menjadi awal dari konflik yang lebih besar."},{"kind":"text","text":"Manakah pernyataan yang menjadi pemicu awal terjadinya ketegangan antara kelompok pendatang dan etnis minoritas?"}],"options":[{"key":"A","text":"Ketidakadilan dalam pengambilan keputusan musyawarah membentuk jarak sosial antar kelompok dan menurunkan rasa dihargai."},{"key":"B","text":"Kesenjangan dalam akses informasi memperkuat stigma sosial dan mendorong eksklusi kelompok minoritas."},{"key":"C","text":"Dominasi kelompok mayoritas memperlemah solidaritas sosial dan merenggangkan relasi antar kelompok masyarakat."},{"key":"D","text":"Ketimpangan dalam hak partisipasi membentuk jurang sosial, menurunkan rasa saling percaya antar kelompok."},{"key":"E","text":"Ketidaksetaraan dalam pembagian peran memperkuat stratifikasi sosial dan menghambat mobilitas kelompok."}],"statements":[],"categories":[],"answer":"D","explanation":"Pemicu utama ketegangan adalah ketimpangan hak untuk berpartisipasi dalam musyawarah. Ketika sebagian kelompok jarang dilibatkan, mereka merasa tersisih, jarak sosial meningkat, dan kepercayaan antarkelompok menurun. Kesenjangan informasi juga berperan, tetapi ketimpangan partisipasi paling langsung menggambarkan masalah pokok pada stimulus.","validation":"Kunci/pembahasan menurut dokumen Word yang diunggah (bukan hasil TKA resmi)","reviewNotes":[]},{"id":"D2025-20","bank":"Dokumen TKA 2025","source":"Dokumen TKA 2025","originDoc":"TKA_Sosiologi_2025_Kunci_Pembahasan_EDITABLE(4).docx","n":20,"title":"Soal TKA 2025 Nomor 20","category":"TKA Sosiologi 2025","subcategory":"25SOSKSKRKTS24SA-000000-0473","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Sebuah studi di Kota Bahari menunjukkan bahwa ketimpangan pendapatan antara kelompok kaya dan miskin semakin lebar dalam 10 tahun terakhir. Akses terhadap fasilitas pendidikan, kesehatan, dan pekerjaan berkualitas lebih mudah diperoleh oleh kelompok masyarakat atas. Sementara itu, masyarakat miskin harus bergantung pada layanan publik yang terbatas dan sering kali berkualitas rendah. Ketidakpuasan mulai muncul di media sosial dan ruang publik. Beberapa kelompok masyarakat melakukan aksi protes untuk menuntut keadilan sosial."},{"kind":"text","text":"Apakah dampak sosial yang mungkin terjadi akibat adanya ketidakpuasan masyarakat miskin terhadap layanan publik?"}],"options":[{"key":"A","text":"Menimbulkan aksi protes masyarakat miskin untuk menyuarakan pendapat."},{"key":"B","text":"Menimbulkan kerentanan kelompok miskin akibat terbatasnya akses terhadap fasilitas publik."},{"key":"C","text":"Menimbulkan ketidaksetaraan yang membuat kelompok miskin semakin terhambat dan merasa tidak adil."},{"key":"D","text":"Menimbulkan rendahnya partisipasi masyarakat miskin dalam proses pengambilan keputusan publik."},{"key":"E","text":"Menimbulkan kebijakan pemerintah yang diarahkan untuk memperbaiki layanan publik di wilayah miskin."}],"statements":[],"categories":[],"answer":"A","explanation":"Stimulus secara langsung menyebut munculnya ketidakpuasan di media sosial dan ruang publik yang kemudian berkembang menjadi aksi protes. Oleh karena itu, dampak sosial yang paling jelas dari ketidakpuasan terhadap layanan publik adalah munculnya aksi protes untuk menyuarakan tuntutan.","validation":"Kunci/pembahasan menurut dokumen Word yang diunggah (bukan hasil TKA resmi)","reviewNotes":[]},{"id":"D2025-21","bank":"Dokumen TKA 2025","source":"Dokumen TKA 2025","originDoc":"TKA_Sosiologi_2025_Kunci_Pembahasan_EDITABLE(4).docx","n":21,"title":"Soal TKA 2025 Nomor 21","category":"TKA Sosiologi 2025","subcategory":"25SOSKSKRKTS24SA-000000-0584","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Pemerintah Kota Madani membuka program beasiswa bagi pelajar SMA yang berasal dari keluarga kurang mampu. Program ini tidak hanya berdasarkan nilai akademik, tetapi juga mempertimbangkan latar belakang ekonomi dan akses pendidikan siswa. Selain itu, fasilitas transportasi gratis diberikan khusus bagi siswa dari daerah terpencil untuk memudahkan mereka bersekolah."},{"kind":"text","text":"Berdasarkan ilustrasi di atas, bagaimana prinsip kesetaraan sosial diterapkan dalam pelayanan publik?"}],"options":[{"key":"A","text":"Kesetaraan kesempatan, karena siswa diberi peluang yang setara untuk maju."},{"key":"B","text":"Kesetaraan budaya, karena pemerintah menghormati adat dan kebiasaan lokal."},{"key":"C","text":"Kesetaraan ekonomi, karena pemerintah memberikan bantuan kepada semua warga."},{"key":"D","text":"Kesetaraan hukum, karena semua siswa diperlakukan sama tanpa melihat latar belakang."},{"key":"E","text":"Kesetaraan politik, karena semua siswa mendapat hak suara dalam menentukan program."}],"statements":[],"categories":[],"answer":"A","explanation":"Beasiswa untuk siswa kurang mampu dan transportasi gratis bagi siswa dari daerah terpencil bertujuan mengurangi hambatan yang berbeda-beda agar semua siswa memiliki peluang untuk berkembang. Ini merupakan penerapan kesetaraan kesempatan, bukan perlakuan identik tanpa mempertimbangkan kondisi awal.","validation":"Kunci/pembahasan menurut dokumen Word yang diunggah (bukan hasil TKA resmi)","reviewNotes":[]},{"id":"D2025-22","bank":"Dokumen TKA 2025","source":"Dokumen TKA 2025","originDoc":"TKA_Sosiologi_2025_Kunci_Pembahasan_EDITABLE(4).docx","n":22,"title":"Soal TKA 2025 Nomor 22","category":"TKA Sosiologi 2025","subcategory":"25SOSKSKRPSS23SA-000000-0501","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Di sebuah kawasan pinggiran perkotaan yang padat penduduk, banyak keluarga hidup tanpa memiliki akses ke air bersih, sanitasi dan jaringan listrik yang stabil. Di kawasan ini banyak orang tua yang bekerja di sektor informal dengan pendapatan tidak teratur. Anak-anak di daerah ini sering putus sekolah karena mendukung ekonomi orang tuanya. Penduduknya merasa terasing dari perkembangan kota dan tidak banyak menerima dukungan dari program pemerintah. Hal ini menunjukkan adanya ketimpangan sosial dan hal tersebut pada akhirnya berkontribusi pada meningkatnya kemiskinan, layanan publik yang terbatas dan rendahnya literasi."},{"kind":"text","text":"Mengapa ketimpangan sosial dapat meningkatkan angka kemiskinan pada masyarakat perkotaan pada kasus tersebut?"}],"options":[{"key":"A","text":"Tradisi budaya yang memprioritaskan pendidikan formal daripada informal, sehingga mengabaikan keterampilan hidup yang relevan dengan kondisi masyarakat."},{"key":"B","text":"Penolakan kelompok marginal untuk direlokasi ke lingkungan yang lebih sehat, yang menyebabkan mereka tetap tinggal di wilayah tanpa akses layanan dasar."},{"key":"C","text":"Kurangnya motivasi warga untuk memperbaiki kehidupan mereka sendiri karena tidak adanya bentuk pengangguran yang nyata di wilayah masyarakat berada."},{"key":"D","text":"Akses yang tidak merata terhadap layanan dasar dan ketidakberpihakan kebijakan yang menyebabkan warga terpinggirkan dan tidak mendapat layanan memadai."},{"key":"E","text":"Perencanaan keuangan buruk dan tingkat konsumsi yang tidak berimbang menyebabkan pendapatan dari sektor informal sulit mencukupi kebutuhan dasar."}],"statements":[],"categories":[],"answer":"D","explanation":"Kemiskinan dalam kasus tersebut berkaitan dengan akses yang tidak merata terhadap air bersih, sanitasi, listrik, pendidikan, dan dukungan kebijakan. Ketika kelompok tertentu terus terpinggirkan dari layanan dasar, peluang untuk memperbaiki kondisi sosial-ekonomi juga menjadi terbatas sehingga kemiskinan dapat berulang.","validation":"Kunci/pembahasan menurut dokumen Word yang diunggah (bukan hasil TKA resmi)","reviewNotes":[]},{"id":"D2025-23","bank":"Dokumen TKA 2025","source":"Dokumen TKA 2025","originDoc":"TKA_Sosiologi_2025_Kunci_Pembahasan_EDITABLE(4).docx","n":23,"title":"Soal TKA 2025 Nomor 23","category":"TKA Sosiologi 2025","subcategory":"25SOSPSGDPGS35SA-000000-0652","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Globalisasi mendorong pertumbuhan ekonomi di negara-negara berkembang terutama di sektor industri dan jasa. Namun, pembangunan seringkali tidak merata dan terpusat di kota-kota besar. Padahal, akses terhadap pendidikan dan teknologi sebelumnya memang sudah banyak terpusat di wilayah kota. Meskipun hal ini tampak menguntungkan, perusahaan multinasional yang masuk ke negara berkembang sebenarnya diuntungkan karena bisa membayar upah rendah kepada pekerja lokal. Sebagian bahkan tidak memberikan hak-hak yang adil seperti pekerja dari negara asal mereka. Sayangnya, hal ini sering dianggap lazim demi mendorong perekonomian negara dan menyerap tenaga kerja tinggi."},{"kind":"text","text":"Mengapa globalisasi pada kasus tersebut dapat menimbulkan kesenjangan sosial?"}],"options":[{"key":"A","text":"Kesenjangan sosial pada kasus muncul karena pertumbuhan ekonomi Indonesia yang lambat dibandingkan negara lain."},{"key":"B","text":"Kesenjangan sosial pada kasus terjadi karena adanya alienasi/keterasingan pekerja dari produk yang dihasilkannya."},{"key":"C","text":"Kesenjangan sosial pada kasus terjadi karena kurangnya perencanaan dan peran pemerintah dalam pembangunan ekonomi."},{"key":"D","text":"Kesenjangan sosial pada kasus terjadi karena industrialisasi merupakan perubahan sosial dampaknya tidak bisa diprediksi."},{"key":"E","text":"Kesenjangan sosial pada kasus terjadi karena tidak adanya kesadaran dari pekerja untuk memperjuangkan keadilan sosial."}],"statements":[],"categories":[],"answer":"C","explanation":"Globalisasi dapat memperlebar kesenjangan apabila manfaat pembangunan terkonsentrasi di wilayah tertentu dan perlindungan terhadap pekerja tidak memadai. Dari opsi yang tersedia, C paling mendekati masalah struktural tersebut karena menekankan pentingnya perencanaan dan peran pemerintah agar pembangunan, hak pekerja, serta akses ekonomi tidak timpang.","validation":"Kunci/pembahasan menurut dokumen Word yang diunggah (bukan hasil TKA resmi)","reviewNotes":[]},{"id":"D2025-24","bank":"Dokumen TKA 2025","source":"Dokumen TKA 2025","originDoc":"TKA_Sosiologi_2025_Kunci_Pembahasan_EDITABLE(4).docx","n":24,"title":"Soal TKA 2025 Nomor 24","category":"TKA Sosiologi 2025","subcategory":"25SOSPSGDPGS35SA-000000-0550","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Desa Wirausaha yang dahulu mengandalkan pertanian tradisional kini mulai berubah. Sejak adanya akses internet dan media sosial, banyak pemuda desa membuka toko daring untuk menjual produk kerajinan tangan ke luar negeri. Selain itu, beberapa keluarga mengadopsi gaya hidup konsumtif dan mulai meninggalkan tradisi gotong royong. Bahasa asing juga mulai sering digunakan dalam pergaulan anak muda."},{"kind":"text","text":"Apa bentuk dampak globalisasi yang paling menonjol terhadap kehidupan ekonomi masyarakat?"}],"options":[{"key":"A","text":"Globalisasi menyebabkan desa kembali pada ekonomi subsisten dan lokal."},{"key":"B","text":"Globalisasi menyebabkan masyarakat menolak transaksi dengan pihak luar."},{"key":"C","text":"Globalisasi menyebabkan peningkatan aktivitas jual beli melalui platform digital."},{"key":"D","text":"Globalisasi menyebabkan seluruh hasil kerajinan digunakan untuk kebutuhan pribadi."},{"key":"E","text":"Globalisasi menyebabkan masyarakat berhenti memproduksi barang tradisional."}],"statements":[],"categories":[],"answer":"C","explanation":"Akses internet dan media sosial membuat pemuda desa dapat menjual kerajinan kepada konsumen di luar daerah bahkan luar negeri. Dampak ekonomi yang paling menonjol adalah meningkatnya aktivitas jual-beli melalui platform digital.","validation":"Kunci/pembahasan menurut dokumen Word yang diunggah (bukan hasil TKA resmi)","reviewNotes":[]},{"id":"D2025-25","bank":"Dokumen TKA 2025","source":"Dokumen TKA 2025","originDoc":"TKA_Sosiologi_2025_Kunci_Pembahasan_EDITABLE(4).docx","n":25,"title":"Soal TKA 2025 Nomor 25","category":"TKA Sosiologi 2025","subcategory":"25SOSPSGDPSS32SA-000000-0617","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Di sebuah sekolah menengah, para murid mengikuti program pembelajaran berbasis teknologi digital. Setiap siswa dibekali gawai untuk mengakses materi pembelajaran dari rumah maupun di sekolah. Guru memanfaatkan platform pembelajaran daring yang memungkinkan diskusi kelas berlangsung secara virtual. Selain itu, siswa juga diperkenalkan pada tren budaya global melalui media sosial, seperti gaya hidup sehat, komunitas kreatif, hingga diskusi lintas negara tentang isu sosial. Seiring waktu, cara siswa berinteraksi, belajar, dan memandang dunia mengalami perubahan yang nyata, termasuk dalam cara mereka menanggapi keberagaman dan beradaptasi dengan perkembangan zaman."},{"kind":"text","text":"Bagaimana keterlibatan masyarakat dalam aktivitas berbasis digital merefleksikan konsekuensi sosial yang diakibatkan oleh arus globalisasi?"}],"options":[{"key":"A","text":"Teknologi memperluas akses ruang belajar karena siswa belajar dari jejaring global, mencerminkan pendidikan yang kolaboratif."},{"key":"B","text":"Teknologi memudahkan akses nilai baru karena siswa terbiasa informasi global, mencerminkan pola pikir masyarakat yang terbuka."},{"key":"C","text":"Teknologi meningkatkan refleksi terhadap perbedaan karena siswa berdiskusi lintas latar, mencerminkan tumbuhnya toleransi sosial."},{"key":"D","text":"Teknologi mendorong partisipasi budaya digital karena siswa aktif di media sosial, mencerminkan pergeseran ekspresi masyarakat."},{"key":"E","text":"Teknologi memperkuat interaksi lintas budaya karena berinteraksi dengan komunitas global, mencerminkan luasnya wawasan global."}],"statements":[],"categories":[],"answer":"D","explanation":"Keterlibatan siswa melalui platform daring dan media sosial menunjukkan tumbuhnya partisipasi dalam budaya digital. Perubahan cara berinteraksi dan mengekspresikan diri melalui media digital merupakan bentuk pergeseran ekspresi sosial masyarakat, sehingga pilihan D paling langsung menjawab pertanyaan.","validation":"Kunci/pembahasan menurut dokumen Word yang diunggah (bukan hasil TKA resmi)","reviewNotes":[]},{"id":"D2025-26","bank":"Dokumen TKA 2025","source":"Dokumen TKA 2025","originDoc":"TKA_Sosiologi_2025_Kunci_Pembahasan_EDITABLE(4).docx","n":26,"title":"Soal TKA 2025 Nomor 26","category":"TKA Sosiologi 2025","subcategory":"25SOSPSGDPSS32SA-000000-0607","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Kampung Cempaka dulunya merupakan permukiman padat dengan kegiatan sosial yang tinggi. Warga sering mengadakan kerja bakti, arisan RT, dan kegiatan keagamaan bersama. Namun, sejak banyak rumah dijual dan dibeli oleh pendatang dari luar daerah, suasana sosial berubah. Warga baru lebih tertutup, tidak aktif dalam kegiatan warga, dan lebih memilih berinteraksi melalui media sosial. Meskipun kawasan menjadi lebih bersih dan tertata, namun hubungan antarwarga melemah."},{"kind":"text","text":"Apa dampak jangka panjang dari pola interaksi sosial yang mulai berubah di Kampung Cempaka?"}],"options":[{"key":"A","text":"Kesadaran kolektif dalam menjaga lingkungan mulai melemah secara bertahap."},{"key":"B","text":"Partisipasi warga dalam kegiatan rutin mengalami penurunan yang tidak disadari."},{"key":"C","text":"Rasa memiliki terhadap komunitas perlahan terkikis karena kurangnya keterlibatan."},{"key":"D","text":"Kegiatan sosial berubah bentuk tanpa memperkuat hubungan antarwarga."},{"key":"E","text":"Norma sosial tetap bertahan meskipun jumlah interaksi warga semakin terbatas."}],"statements":[],"categories":[],"answer":"C","explanation":"Hubungan antarwarga yang semakin lemah dan rendahnya keterlibatan dalam kegiatan bersama dapat mengikis rasa memiliki terhadap komunitas. Dalam jangka panjang hal ini berpotensi menurunkan kohesi sosial, sehingga pilihan C paling menggambarkan dampak mendalam dari perubahan pola interaksi.","validation":"Kunci/pembahasan menurut dokumen Word yang diunggah (bukan hasil TKA resmi)","reviewNotes":[]},{"id":"D2025-27","bank":"Dokumen TKA 2025","source":"Dokumen TKA 2025","originDoc":"TKA_Sosiologi_2025_Kunci_Pembahasan_EDITABLE(4).docx","n":27,"title":"Soal TKA 2025 Nomor 27","category":"TKA Sosiologi 2025","subcategory":"25SOSPSGMSGS36SA-000000-0357","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"[Ilustrasi visual: telepon genggam dengan tulisan “HOAX” dan tombol “SHARE”.]"},{"kind":"text","text":"Di era digital saat ini, media sosial menjadi salah satu sumber utama informasi bagi masyarakat. Namun, tidak semua informasi yang tersebar dapat dipertanggungjawabkan. Baru-baru ini, di sebuah kota kecil, beredar pesan berantai di aplikasi pengirim pesan yang menyebutkan akan terjadi gempa besar dan mengimbau warga untuk segera mengungsi. Informasi tersebut ternyata tidak berasal dari lembaga resmi dan terbukti hoaks. Akibatnya, banyak warga panik, meninggalkan rumah, bahkan terjadi penjarahan di beberapa toko. Situasi ini menunjukkan bagaimana penyebaran informasi yang tidak benar bisa menimbulkan kepanikan massal dan merusak tatanan sosial masyarakat."},{"kind":"text","text":"Mengapa masalah sosial dalam ilustrasi tersebut merupakan dampak dari globalisasi?"}],"options":[{"key":"A","text":"Globalisasi memfasilitasi peningkatan interaksi dan relasi sosial secara tatap muka yang intens antarwarga."},{"key":"B","text":"Globalisasi mendorong kembalinya nilai-nilai tradisional dan kearifan lokal yang mampu menyaring informasi."},{"key":"C","text":"Globalisasi menyebabkan homogenitas budaya sehingga masyarakat lebih mudah percaya pada satu jenis informasi."},{"key":"D","text":"Globalisasi memungkinkan penyebaran informasi, termasuk hoaks, secara cepat dan masif melintasi batas geografis."},{"key":"E","text":"Globalisasi menekankan pentingnya peran lembaga formal dalam mengontrol setiap bentuk komunikasi masyarakat."}],"statements":[],"categories":[],"answer":"D","explanation":"Teknologi komunikasi global memungkinkan informasi beredar sangat cepat dan menjangkau banyak orang tanpa dibatasi wilayah. Sifat ini juga berlaku bagi informasi palsu, sehingga hoaks dapat menyebar secara cepat dan masif serta menimbulkan kepanikan sosial.","validation":"Kunci/pembahasan menurut dokumen Word yang diunggah (bukan hasil TKA resmi)","reviewNotes":[]},{"id":"D2025-28","bank":"Dokumen TKA 2025","source":"Dokumen TKA 2025","originDoc":"TKA_Sosiologi_2025_Kunci_Pembahasan_EDITABLE(4).docx","n":28,"title":"Soal TKA 2025 Nomor 28","category":"TKA Sosiologi 2025","subcategory":"25SOSPSGSKGS37SA-000000-0461","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Dalam dua tahun terakhir, banyak siswa di sebuah SMA mulai meninggalkan kebiasaan menggunakan bahasa daerah dalam percakapan sehari-hari. Mereka lebih sering menggunakan istilah dalam bahasa Inggris yang dipopulerkan melalui media sosial, film, dan budaya pop barat. Selain itu, pakaian adat mulai jarang dipakai, bahkan saat acara sekolah. Sebagian siswa merasa budaya lokal sudah ketinggalan zaman dan tidak menarik untuk ditampilkan."},{"kind":"text","text":"Sikap manakah yang paling sesuai untuk membangun kesadaran siswa agar tetap menghargai budaya daerah tanpa menolak budaya luar?"}],"options":[{"key":"A","text":"Mendorong siswa untuk lebih sering menampilkan budaya lokal dalam kegiatan sekolah yang bersifat terbuka."},{"key":"B","text":"Mengarahkan siswa untuk menekankan unsur-unsur lokal dalam proyek yang menampilkan identitas global."},{"key":"C","text":"Menanamkan rasa bangga terhadap budaya lokal sambil tetap membuka ruang eksplorasi budaya luar."},{"key":"D","text":"Menyediakan platform yang memfasilitasi siswa dalam menggabungkan nilai-nilai lokal dan global secara kreatif."},{"key":"E","text":"Mengutamakan nilai-nilai budaya daerah dalam seluruh bentuk kegiatan tanpa menghilangkan pengaruh luar sepenuhnya."}],"statements":[],"categories":[],"answer":"C","explanation":"Sikap kritis terhadap globalisasi bukan berarti menolak seluruh budaya luar. Pilihan C menunjukkan sikap selektif: menumbuhkan kebanggaan terhadap budaya lokal sekaligus tetap membuka ruang untuk mempelajari budaya luar secara bijak.","validation":"Kunci/pembahasan menurut dokumen Word yang diunggah (bukan hasil TKA resmi)","reviewNotes":[]},{"id":"D2025-29","bank":"Dokumen TKA 2025","source":"Dokumen TKA 2025","originDoc":"TKA_Sosiologi_2025_Kunci_Pembahasan_EDITABLE(4).docx","n":29,"title":"Soal TKA 2025 Nomor 29","category":"TKA Sosiologi 2025","subcategory":"25SOSPSGSKGS37SA-000000-0635","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Indonesia, China, India, Pakistan, Bangladesh, dan Nigeria menyumbang 75% dari total beban polusi udara global karena tingkat polusi udara yang tinggi dan jumlah populasi yang besar. Udara yang berisi partikel halus (PM 2.5) berpotensi mengurangi usia hidup rata-rata warga Indonesia hingga 1,4 tahun dibandingkan jika kualitas udara di Indonesia memenuhi standar WHO, yakni 5 µg/m. Pencemaran udara oleh pelaku industri menjadi sorotan karena berkontribusi tinggi terhadap polusi udara. Selain itu, beberapa pihak juga berencana menggugat pemerintah karena dinilai belum optimal dalam mengatasi masalah polusi udara. Hal ini tidak mengherankan karena beberapa negara juga masih belum memiliki data yang lengkap berupa hasil riset maupun alat untuk memonitor dan mengukur kualitas udara."},{"kind":"text","text":"Diolah dari: https://www.bbc.com/indonesia/articles/c72enp76622o"},{"kind":"text","text":"Apa rekomendasi yang paling tepat diberikan kepada institusi pendidikan tinggi agar bisa berkontribusi dalam mengatasi masalah tersebut?"}],"options":[{"key":"A","text":"Mendampingi masyarakat menuntut pemerintah menggratiskan pengobatan untuk penyakit gangguan pernafasan."},{"key":"B","text":"Menjalin kerja sama dengan negara-negara maju agar berinvestasi di sektor industri dengan konsep energi terbaharukan."},{"key":"C","text":"Membangun pusat riset yang berkonsentrasi pada lingkungan agar menghasilkan strategi dan pembangunan berkelanjutan."},{"key":"D","text":"Menjalin kerja sama dengan berbagai pihak untuk membuat program penanaman sejuta pohon di wilayah hutan gundul."},{"key":"E","text":"Mengembangkan program pengabdian kepada masyarakat untuk memberikan edukasi cara mengelola limbah rumah tangga."}],"statements":[],"categories":[],"answer":"C","explanation":"Stimulus menyoroti keterbatasan data riset serta alat pemantauan kualitas udara. Perguruan tinggi memiliki fungsi penelitian, sehingga pembangunan pusat riset lingkungan merupakan kontribusi yang paling langsung untuk menghasilkan data, strategi, dan solusi pembangunan berkelanjutan.","validation":"Kunci/pembahasan menurut dokumen Word yang diunggah (bukan hasil TKA resmi)","reviewNotes":[]},{"id":"D2025-30","bank":"Dokumen TKA 2025","source":"Dokumen TKA 2025","originDoc":"TKA_Sosiologi_2025_Kunci_Pembahasan_EDITABLE(4).docx","n":30,"title":"Soal TKA 2025 Nomor 30","category":"TKA Sosiologi 2025","subcategory":"25SOSPSGSKGS37SA-000000-0447","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Masuknya budaya asing ke Indonesia yang dipercepat oleh arus globalisasi dan teknologi membawa pengaruh besar, baik secara positif maupun negatif. Di satu sisi, budaya asing memperluas wawasan, memperkenalkan inovasi, dan memperkaya kebudayaan lokal. Namun, di sisi lain, pengaruh ini juga dapat mengikis nilai-nilai tradisional, memicu perubahan gaya hidup yang bertentangan dengan norma masyarakat, serta menimbulkan ketimpangan sosial. Desa Trunyan di Bali memiliki tradisi pemakaman unik: jenazah tidak dikubur atau dibakar, melainkan diletakkan di atas tanah dan dibiarkan membusuk secara alami. Tradisi ini menarik minat wisatawan, baik domestik maupun mancanegara. Namun, meningkatnya kunjungan wisatawan memunculkan tantangan baru seperti meningkatnya volume sampah, degradasi lingkungan, dan komersialisasi budaya yang berisiko mengubah makna spiritual dari tradisi tersebut."},{"kind":"text","text":"Apa rekomendasi paling strategis yang bisa dilakukan pemuda Desa Trunyan untuk menjaga nilai budaya di tengah arus globalisasi?"}],"options":[{"key":"A","text":"Mengampanyekan gaya hidup lokal melalui media sosial dengan pendekatan visual modern."},{"key":"B","text":"Meningkatkan daya tarik ekonomi dari tradisi dengan memperluas pasar souvenir khas pemakaman."},{"key":"C","text":"Menjadi pemandu wisata profesional agar bisa menjelaskan budaya secara sistematis dan netral."},{"key":"D","text":"Meningkatkan penggunaan bahasa asing dalam promosi budaya agar lebih diterima wisatawan asing."},{"key":"E","text":"Membuat festival tahunan dengan atraksi budaya yang diatur oleh sponsor dan pihak swasta."}],"statements":[],"categories":[],"answer":"A","explanation":"Pemuda dapat memanfaatkan sarana globalisasi, terutama media sosial, untuk memperkuat identitas budaya lokal dengan cara yang relevan bagi generasi sekarang. Kampanye visual modern memungkinkan budaya Trunyan diperkenalkan tanpa menjadikan komersialisasi sebagai tujuan utama, sehingga pilihan A paling sesuai untuk penguatan budaya lokal.","validation":"Kunci/pembahasan menurut dokumen Word yang diunggah (bukan hasil TKA resmi)","reviewNotes":[]}];</script><script>

 if(teacherPreview||state.screen!=='exam'||state.submitted||!state.sessionId)return;

 }},immediate?0:450);

function simulasiNilai(raw,benar=null,total=null){
 if(raw===null||raw===undefined||raw===''||!Number.isFinite(Number(raw)))return null;
 const benarValid=benar!==null&&benar!==undefined&&Number.isFinite(Number(benar));
 const totalValid=total!==null&&total!==undefined&&Number.isFinite(Number(total))&&Number(total)>0;
 const p=benarValid&&totalValid?Math.max(0,Math.min(1,Number(benar)/Number(total))):Math.max(0,Math.min(1,Number(raw)/100));
 return Math.round((200+600*p)*100)/100;
}
function formatSimNilai(raw,benar=null,total=null){const n=simulasiNilai(raw,benar,total);return n===null?'—':n.toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2})}

function computeResult(auto=false,violationReason=null){const questions=sessionQuestions();let correct=0,wrong=0,blank=0;const detail=questions.map((q,i)=>{const ua=state.answers[q.n],isBlank=!answered(q),ok=!isBlank&&same(ua,q.answer);if(isBlank)blank++;else if(ok)correct++;else wrong++;return{displayNo:i+1,sourceNo:q.n,ok,isBlank,user:ua,answer:q.answer,explanation:q.explanation,type:q.type,categories:q.categories||null}});const score=Math.round(correct/Math.max(1,questions.length)*100);return{correct,wrong,blank,score,detail,auto,violationReason}}

async function finishViolation(reason,{silent=false,useBeacon=false}={}){
 if(!isStrictExamActive()||violationInFlight)return;
 violationInFlight=true;examFinalizing=true;
 clearTimeout(progressTimer);const label=violationLabel(reason);const r=computeResult(true,label);
 state.submitted=true;state.submittedAt=new Date().toISOString();state.violationReason=label;state.result=r;state.screen='result';save();clearInterval(tick);
 updateLocalActivity(state.sessionId,{type:'violation',nis:state.nis,name:state.name,kelas:state.kelas,pkg:state.pkg,status:'Selesai - Pelanggaran',score:r.score,correct:r.correct,wrong:r.wrong,blank:r.blank,reason:label,submittedAt:new Date().toISOString()});

}
function bindExamGuard(){

}

let backendReady=false;
function canUseServer(){return backendReady && hostedApplication}
async function api(action,data={}){
 if(!hostedApplication)throw new Error('Aplikasi offline, tidak terhubung ke server.');
 const controller=new AbortController(),timeoutMs=action==='get_settings'?6500:12000,timer=setTimeout(()=>controller.abort(),timeoutMs);
 try{
  const res=await fetch('api.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...data}),credentials:'same-origin',cache:'no-store',signal:controller.signal});
  const typ=(res.headers.get('content-type')||'').toLowerCase();
  if(!typ.includes('application/json'))throw new Error('api.php tidak mengembalikan JSON. Periksa versi PHP, lokasi file, dan pengaturan hosting. (HTTP '+res.status+')');
  const out=await res.json();
  if(!res.ok||out.ok===false){const err=new Error(out.message||'Server menolak permintaan.');err.code=out.code||'';err.httpStatus=res.status;throw err;}
  backendReady=true;serverConnectionError='';return out;
 }catch(e){
  if(e?.name==='AbortError')throw new Error('Koneksi api.php terlalu lama. Periksa hosting atau jaringan.');
  throw e;
 }finally{clearTimeout(timer)}
}
async function syncPublicSettings(){
 loadLocalSettings();
 if(!hostedApplication)return false;
 for(let i=0;i<2;i++){
  try{
   const r=await api('get_settings');
   if(!r.settings||typeof r.settings!=='object'||r.service!=='TKA-Sosiologi-PHP'||r.apiVersion!==appBackendVersion)throw new Error('api.php versi lama/tidak kompatibel. Unggah index.html dan api.php V5.1 bersama-sama.');
   backendReady=true;serverIdentity=String(r.serverIdentity||'');settingsRevision=Number(r.settingsRevision)||1;
   settings={...defaultSettings,...r.settings};saveLocalSettings();serverConnectionError='';return true;
  }catch(e){backendReady=false;serverConnectionError=e.message||'Koneksi server gagal';if(i===0)await new Promise(resolve=>setTimeout(resolve,700));}
 }
 return false;
}

function ensureQuestionOrder(){const p=pkgData();if(!p)return[];const valid=Array.isArray(state.questionOrder)&&state.questionOrder.length===p.questions.length&&state.questionOrder.every(n=>p.questions.some(q=>q.n===n));if(!valid){state.questionOrder=settings.shuffleQuestions===false?p.questions.map(q=>q.n):shuffleArray(p.questions.map(q=>q.n));save()}return state.questionOrder}

// Katalog bank soal tambahan — hanya terlihat oleh admin. Tidak mengubah TKA_DATA, sesi, skor atau API.
let bankVisibleLimit=12;
function importedItems(){return Array.isArray(window.TKA_IMPORT_BANK)?window.TKA_IMPORT_BANK:[]}
function filteredImportedItems(){
 const s=(document.getElementById('bankSearch')?.value||'').trim().toLocaleLowerCase('id-ID');
 const doc=document.getElementById('bankSource')?.value||'all';
 const type=document.getElementById('bankType')?.value||'all';
 return importedItems().filter(q=>{
  if(doc!=='all'&&q.source!==doc)return false;
  if(type!=='all'&&q.type!==type)return false;
  if(!s)return true;
  return [q.title,q.source,q.originDoc,q.category,q.subcategory,q.typeLabel,...(q.promptBlocks||[]).filter(b=>b.kind==='text').map(b=>b.text)].join(' ').toLocaleLowerCase('id-ID').includes(s);
 });
}
function drawImportedBank(){
 if(!adminAuthed)return;
 const list=document.getElementById('bankResults');if(!list)return;
 const items=filteredImportedItems();
 const count=document.getElementById('bankResultCount');if(count)count.textContent=`Menampilkan ${Math.min(bankVisibleLimit,items.length)} dari ${items.length} soal yang cocok · ${importedItems().length} soal tersimpan`;
 list.innerHTML=items.length?items.slice(0,bankVisibleLimit).map(q=>`<article class="bank-item"><div class="bank-micro">${esc(q.source)} · SOAL ${q.n} · ${esc(q.typeLabel)}</div><b>${esc(q.title)}</b>${q.reviewNotes?.length?'<div class="bank-micro" style="color:#a14125;font-weight:800">Perlu tinjauan guru</div>':''}<div><button type="button" class="btn secondary" data-view-import="${esc(q.id)}">Lihat soal & pembahasan →</button></div></article>`).join(''):'<div class="empty-state"><b>Tidak ada soal yang cocok.</b><p>Coba ubah kata kunci atau filter sumber dan jenis soal.</p></div>';
 const more=document.getElementById('bankMore');if(more)more.style.display=items.length>bankVisibleLimit?'inline-flex':'none';
}
function importedCorrectText(q){return Array.isArray(q.answer)?q.answer.join(', '):String(q.answer??'—')}
function viewImportedItem(id){
 if(!adminAuthed)return;
 const q=importedItems().find(x=>x.id===id);if(!q)return;
 const prompt=(q.promptBlocks||[]).map(b=>b.kind==='text'?`<p>${esc(b.text)}</p>`:`<table class="data-table">${b.rows.map((row,i)=>`<tr>${row.map(c=>`<${i?'td':'th'}>${esc(c)}</${i?'td':'th'}>`).join('')}</tr>`).join('')}</table>`).join('');
 const opts=q.type==='category'?(q.statements||[]).map((t,i)=>`<div class="bank-opt"><b>${i+1}.</b> ${esc(t)}<div class="bank-micro">Kategori: ${esc((q.categories||[]).join(' / '))}</div></div>`).join(''):(q.options||[]).map(o=>`<div class="bank-opt"><strong>${esc(o.key)}.</strong> ${esc(o.text)}</div>`).join('');
 const o=document.createElement('div');o.className='audit-overlay';o.dataset.importBankDialog='1';o.innerHTML=`<div class="audit-dialog card bank-viewer" role="dialog" aria-modal="true" aria-label="Pratinjau soal tambahan" style="max-height:88vh;overflow:auto"><button type="button" class="btn secondary" data-close-import style="float:right">Tutup ×</button><div class="eyebrow">${esc(q.source)} · Soal ${q.n} · ${esc(q.typeLabel)}</div><h2>${esc(q.title)}</h2><div class="bank-micro">Materi: ${esc(q.category||'—')} · Sumber awal: ${esc(q.originDoc||q.source)}</div><div class="prompt">${prompt}</div>${opts}${q.reviewNotes?.length?`<p style="color:#a14125;font-weight:700">Perlu tinjauan: ${esc(q.reviewNotes.join('; '))}</p>`:''}<details class="bank-answer"><summary>Lihat kunci jawaban & pembahasan</summary><p class="bank-key">Kunci: ${esc(importedCorrectText(q))}</p><p>${esc(q.explanation||'Pembahasan belum tersedia dalam dokumen sumber.')}</p><p class="muted">Status sumber: ${esc(q.validation||'Perlu pemeriksaan guru')}</p></details><div class="actions"><button type="button" class="btn secondary" data-close-import>Tutup pratinjau</button></div></div>`;
 o.querySelectorAll('[data-close-import]').forEach(b=>b.onclick=()=>o.remove());
 o.addEventListener('click',e=>{if(e.target===o)o.remove()});
 document.body.appendChild(o);o.querySelector('[data-close-import]')?.focus();
}
function initImportedBank(){
 const root=document.getElementById('additionalBankSection');if(!root)return;
 bankVisibleLimit=12;
 ['bankSearch','bankSource','bankType'].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener(id==='bankSearch'?'input':'change',()=>{bankVisibleLimit=12;drawImportedBank()})});

function showQuestionAudit(){

 const types={};let issues=[];let count=0;
 TKA_DATA.forEach(p=>{p.questions.forEach(q=>{count++;types[q.type]=(types[q.type]||0)+1;if(!q.promptBlocks?.length)issues.push(`${p.title}: soal ${q.n} tanpa pertanyaan`);if(!q.explanation)issues.push(`${p.title}: soal ${q.n} tanpa pembahasan`);if(q.type==='tf'&&(!Array.isArray(q.statements)||!Array.isArray(q.answer)||q.statements.length!==q.answer.length))issues.push(`${p.title}: soal ${q.n} benar/salah tidak lengkap`);if(q.type!=='tf'&&(!Array.isArray(q.options)||!q.options.length))issues.push(`${p.title}: soal ${q.n} tanpa opsi`)});if(p.questions.length>0&&p.questions.length!==30)issues.push(`${p.title} memiliki ${p.questions.length} soal (seharusnya 30)`)});
 importedItems().forEach(q=>{if(!q.promptBlocks?.length)issues.push(`${q.id}: stimulus kosong`);if(!q.explanation)issues.push(`${q.id}: pembahasan kosong`);if(q.type==='category'&&(!q.statements?.length||!q.answer))issues.push(`${q.id}: pernyataan atau kunci kategori tidak lengkap`);if(q.type!=='category'&&(!q.options?.length||!q.answer||/belum tercantum/i.test(String(q.answer))))issues.push(`${q.id}: opsi atau kunci tidak lengkap`);if(q.reviewNotes?.length)issues.push(`${q.id}: ${q.reviewNotes.join('; ')}`)});
 const el=document.createElement('div');el.className='audit-overlay';el.innerHTML=`<div class="audit-dialog card" role="dialog" aria-modal="true"><button class="btn secondary" id="closeAudit" style="float:right">Tutup ✕</button><div class="eyebrow">Pemeriksaan otomatis struktur</div><h2>Audit Bank Soal</h2><p><b>${TKA_DATA.length} paket ujian • ${count} soal utama + ${importedItems().length} soal tambahan</b></p><p>Jenis soal: ${Object.entries(types).map(([t,n])=>`${esc(t)}: ${n}`).join(' • ')||'Belum ada soal'}</p><p>${issues.length?`<b>${issues.length} catatan:</b><br>${issues.map(x=>esc(x)).join('<br>')}`:(count===0&&importedItems().length===0?'Bank soal kosong. Tidak ada soal untuk diaudit.':'✓ Struktur dasar soal, opsi, kunci, dan pembahasan terdeteksi lengkap.')}</p><p class="muted">Audit ini memeriksa struktur data, bukan kebenaran substansi materi Sosiologi. Gunakan pratinjau untuk pemeriksaan manual.</p></div>`;document.body.appendChild(el);el.querySelector('#closeAudit').onclick=()=>el.remove();el.onclick=e=>{if(e.target===el)el.remove()};
}
