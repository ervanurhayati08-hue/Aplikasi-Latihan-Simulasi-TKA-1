egori","promptBlocks":[{"kind":"text","text":"Sekolah A dan Sekolah B mengikuti pertandingan persahabatan. Masing-masing siswa merasa bangga terhadap sekolahnya, tetapi tetap menghargai peserta dari sekolah lain."},{"kind":"text","text":"Petunjuk: Kategorikan posisi kelompok sebagai In-group atau Out-group dari sudut pandang siswa Sekolah A."}],"explanation":"Dari sudut pandang siswa Sekolah A, kelompok sendiri merupakan in-group, sedangkan kelompok lain merupakan out-group. Out-group tidak berarti harus diperlakukan secara bermusuhan.","sourceId":"B2-BS2-20-14","category":"Kelompok Sosial","statements":["Tim pendukung Sekolah A yang menyemangati peserta sekolahnya.","Teman-teman yang menjadi siswa dan pendukung Sekolah A.","Siswa Sekolah B yang menjadi lawan dalam pertandingan."],"answer":["B","B","S"],"categories":["In-group","Out-group"]},{"n":3,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Sebuah pabrik tekstil berhenti beroperasi karena mengalami kerugian. Ratusan pekerja kehilangan pendapatan dalam waktu hampir bersamaan. Sebagian pekerja membuka usaha kecil atau mengikuti pelatihan, tetapi banyak lainnya belum memperoleh pekerjaan baru. Beberapa keluarga menunda pembayaran sekolah anak, mengurangi konsumsi makanan bergizi, dan meminjam uang untuk memenuhi kebutuhan sehari-hari. Ketegangan rumah tangga juga meningkat karena tekanan ekonomi."},{"kind":"text","text":"Dampak gejala sosial yang paling tepat berdasarkan kasus tersebut adalah ...."}],"explanation":"Pengangguran berdampak lebih luas daripada hilangnya pendapatan. Kondisi tersebut dapat memengaruhi pemenuhan gizi, pendidikan anak, kemampuan membayar utang, kesehatan mental, dan keharmonisan keluarga.","sourceId":"B3-SOS-B-06-01","category":"Permasalahan Sosial","options":[{"key":"A","text":"pengangguran mendorong seluruh pekerja menjadi pengusaha sehingga ketergantungan pada perusahaan berkurang"},{"key":"B","text":"tekanan ekonomi hanya berlangsung sementara dan tidak berpengaruh terhadap kesejahteraan jangka panjang"},{"key":"C","text":"kehilangan pekerjaan dapat berkembang menjadi masalah ekonomi, pendidikan, kesehatan, dan hubungan keluarga"},{"key":"D","text":"pengangguran hanya memengaruhi pekerja karena anggota keluarga masih dapat menjalani kehidupan seperti biasa"},{"key":"E","text":"penutupan pabrik memperbaiki keadaan masyarakat karena pekerja mempunyai waktu lebih banyak bersama keluarga"}],"answer":"C"},{"n":4,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Sebuah organisasi siswa mempunyai ketua, sekretaris, bendahara, pembagian bidang kerja, program tahunan, dan aturan keanggotaan yang ditetapkan sekolah. Setiap anggota menjalankan tugas berdasarkan jabatan yang dimiliki. Pergantian pengurus dilakukan melalui prosedur yang telah disepakati."},{"kind":"text","text":"Berdasarkan cirinya, organisasi tersebut termasuk ...."}],"explanation":"Adanya struktur, jabatan, aturan, dan prosedur menunjukkan karakteristik kelompok formal.","sourceId":"B1-SOS-20-01","category":"Kelompok Sosial","options":[{"key":"A","text":"kelompok informal karena hubungan anggotanya muncul melalui persahabatan pribadi"},{"key":"B","text":"kelompok primer karena semua anggota mempunyai hubungan emosional yang mendalam"},{"key":"C","text":"kelompok semu karena anggotanya hanya berkumpul dalam waktu yang sangat singkat"},{"key":"D","text":"kelompok formal karena memiliki struktur, aturan, dan pembagian tugas yang jelas"},{"key":"E","text":"kelompok kerumunan karena tidak terdapat pola hubungan yang berlangsung berkelanjutan"}],"answer":"D"},{"n":5,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Dalam dua tahun terakhir, banyak siswa di sebuah SMA mulai meninggalkan kebiasaan menggunakan bahasa daerah dalam percakapan sehari-hari. Mereka lebih sering menggunakan istilah dalam bahasa Inggris yang dipopulerkan melalui media sosial, film, dan budaya pop barat. Selain itu, pakaian adat mulai jarang dipakai, bahkan saat acara sekolah. Sebagian siswa merasa budaya lokal sudah ketinggalan zaman dan tidak menarik untuk ditampilkan."},{"kind":"text","text":"Sikap manakah yang paling sesuai untuk membangun kesadaran siswa agar tetap menghargai budaya daerah tanpa menolak budaya luar?"}],"explanation":"Sikap kritis terhadap globalisasi bukan berarti menolak seluruh budaya luar. Pilihan C menunjukkan sikap selektif: menumbuhkan kebanggaan terhadap budaya lokal sekaligus tetap membuka ruang untuk mempelajari budaya luar secara bijak.","sourceId":"D2025-28","category":"TKA Sosiologi 2025","options":[{"key":"A","text":"Mengarahkan siswa untuk menekankan unsur-unsur lokal dalam proyek yang menampilkan identitas global."},{"key":"B","text":"Mendorong siswa untuk lebih sering menampilkan budaya lokal dalam kegiatan sekolah yang bersifat terbuka."},{"key":"C","text":"Menyediakan platform yang memfasilitasi siswa dalam menggabungkan nilai-nilai lokal dan global secara kreatif."},{"key":"D","text":"Menanamkan rasa bangga terhadap budaya lokal sambil tetap membuka ruang eksplorasi budaya luar."},{"key":"E","text":"Mengutamakan nilai-nilai budaya daerah dalam seluruh bentuk kegiatan tanpa menghilangkan pengaruh luar sepenuhnya."}],"answer":"D"},{"n":6,"type":"tf","typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Dua kelas mengikuti lomba stan budaya. Setiap kelas berusaha membuat stan paling menarik. Salah satu kelas sempat menuduh kelas lain meniru desainnya. Setelah guru memediasi, kedua kelas sepakat membedakan konsep dan bersama-sama menjaga kebersihan tempat festival."},{"kind":"text","text":"Petunjuk: Tentukan kategori Tepat atau Tidak Tepat untuk setiap pernyataan."}],"explanation":"Lomba mendorong persaingan. Tuduhan meniru menimbulkan ketegangan dan bukan kerja sama. Mediasi serta kesepakatan menjadi bentuk akomodasi untuk meredakan perselisihan.","sourceId":"B3-SOS-B-04-03","category":"Proses Sosial","statements":["Tuduhan meniru desain menunjukkan bentuk kerja sama antarkelas.","Mediasi guru dan kesepakatan baru menunjukkan bentuk akomodasi.","Upaya membuat stan terbaik menunjukkan bentuk persaingan."],"answer":["S","B","B"],"categories":["Tepat","Tidak Tepat"]},{"n":7,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Desa Wirausaha yang dahulu mengandalkan pertanian tradisional kini mulai berubah. Sejak adanya akses internet dan media sosial, banyak pemuda desa membuka toko daring untuk menjual produk kerajinan tangan ke luar negeri. Selain itu, beberapa keluarga mengadopsi gaya hidup konsumtif dan mulai meninggalkan tradisi gotong royong. Bahasa asing juga mulai sering digunakan dalam pergaulan anak muda."},{"kind":"text","text":"Apa bentuk dampak globalisasi yang paling menonjol terhadap kehidupan ekonomi masyarakat?"}],"explanation":"Akses internet dan media sosial membuat pemuda desa dapat menjual kerajinan kepada konsumen di luar daerah bahkan luar negeri. Dampak ekonomi yang paling menonjol adalah meningkatnya aktivitas jual-beli melalui platform digital.","sourceId":"D2025-24","category":"TKA Sosiologi 2025","options":[{"key":"A","text":"Globalisasi menyebabkan seluruh hasil kerajinan digunakan untuk kebutuhan pribadi."},{"key":"B","text":"Globalisasi menyebabkan masyarakat berhenti memproduksi barang tradisional."},{"key":"C","text":"Globalisasi menyebabkan peningkatan aktivitas jual beli melalui platform digital."},{"key":"D","text":"Globalisasi menyebabkan masyarakat menolak transaksi dengan pihak luar."},{"key":"E","text":"Globalisasi menyebabkan desa kembali pada ekonomi subsisten dan lokal."}],"answer":"C"},{"n":8,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Kelurahan Mandiri mengembangkan bank sampah yang menggunakan aplikasi untuk mencatat jumlah sampah yang disetor warga. Nilai sampah dapat disimpan sebagai tabungan dan digunakan untuk membayar beberapa kebutuhan. Setelah program berjalan, jumlah warga yang memilah sampah meningkat. Kelompok pemuda juga membentuk usaha daur ulang, sedangkan kegiatan membersihkan lingkungan menjadi lebih terorganisasi."},{"kind":"text","text":"Dampak sosial yang paling tepat dari perubahan tersebut adalah ...."}],"explanation":"Program menghasilkan peningkatan partisipasi sosial, kesadaran lingkungan, dan peluang ekonomi. Ini menunjukkan bahwa satu perubahan dapat berdampak pada beberapa bidang sekaligus. B. Pilihan Ganda Kompleks – MCMA Petunjuk: Pilih semua pernyataan yang benar berdasarkan stimulus.","sourceId":"B2-BS2-27-04","category":"Perubahan Sosial","options":[{"key":"A","text":"perubahan sistem pengelolaan sampah menyebabkan masyarakat hanya memperhatikan keuntungan ekonomi pribadi"},{"key":"B","text":"perubahan sistem pengelolaan sampah mengurangi kesadaran lingkungan karena sampah mempunyai nilai ekonomi"},{"key":"C","text":"perubahan sistem pengelolaan sampah mendorong partisipasi warga sekaligus membuka kegiatan ekonomi baru"},{"key":"D","text":"perubahan sistem pengelolaan sampah membuat seluruh pekerjaan kebersihan menjadi tanggung jawab kelompok pemuda"},{"key":"E","text":"perubahan sistem pengelolaan sampah menghilangkan kebutuhan kerja sama karena seluruh proses dilakukan aplikasi"}],"answer":"C"},{"n":9,"type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Sekolah menyusun program pengurangan sampah plastik selama lima tahun. Tahap pertama dilakukan melalui edukasi, kemudian penyediaan tempat isi ulang air, pembatasan plastik sekali pakai, dan penerapan kantin ramah lingkungan. Program dipantau secara berkala oleh sekolah."},{"kind":"text","text":"Karakter perubahan sosial yang sesuai adalah ...."}],"explanation":"Program tersebut merupakan planned change, dilaksanakan secara bertahap, dan terdapat agen perubahan yang mengarahkan prosesnya.","sourceId":"B3-SOS-C-25-02","category":"Perubahan Sosial","options":[{"key":"A","text":"perubahan dilakukan melalui agen perubahan berupa sekolah dan warga sekolah"},{"key":"B","text":"perubahan direncanakan karena memiliki tujuan dan tahapan pelaksanaan"},{"key":"C","text":"perubahan bertahap karena diterapkan melalui beberapa tahap dalam jangka waktu tertentu"},{"key":"D","text":"perubahan tidak direncanakan karena siswa harus mengubah kebiasaan konsumsi mereka"}],"answer":["A","B","C"]},{"n":10,"type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Media sosial memperkenalkan gaya hidup, produk, dan tren global kepada remaja. Sebagian keluarga mampu memenuhi konsumsi tersebut, sedangkan keluarga lain memiliki keterbatasan ekonomi. Di beberapa sekolah muncul perbedaan kelompok pergaulan berdasarkan merek pakaian, perangkat digital, dan kemampuan mengikuti tren."},{"kind":"text","text":"Dampak yang tepat berdasarkan stimulus adalah ...."}],"explanation":"Tren global dapat memperbesar perbedaan simbolik dan sosial yang berakar pada kemampuan ekonomi. Pernyataan D merupakan generalisasi yang tidak didukung. C. Pilihan Ganda Kompleks Kategori","sourceId":"B2-BS2-22-09","category":"Globalisasi","options":[{"key":"A","text":"perbedaan daya beli dapat berkembang menjadi jarak sosial dalam kelompok remaja"},{"key":"B","text":"budaya konsumsi global dapat memperkuat simbol status berdasarkan kemampuan ekonomi"},{"key":"C","text":"media global dapat meningkatkan tekanan konsumtif pada kelompok berpendapatan rendah"},{"key":"D","text":"semua remaja pasti menolak teman yang tidak mengikuti tren internasional"}],"answer":["A","B","C"]},{"n":11,"type":"tf","typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Pemerintah kecamatan membagikan bantuan kepada warga terdampak bencana. Pendataan dilakukan bersama perwakilan berbagai kelompok masyarakat. Bantuan diberikan berdasarkan tingkat kerusakan dan kebutuhan. Namun, salah satu pejabat meminta agar kelompok asalnya didahulukan meskipun dampak yang dialami lebih ringan."},{"kind":"text","text":"Tentukan kategori setiap pernyataan berdasarkan stimulus."}],"explanation":"Partisipasi dan keadilan kebutuhan mendukung integrasi masyarakat multikultural. Mengutamakan kelompok sendiri merupakan sikap primordial yang dapat menimbulkan ketidakadilan.","sourceId":"B3-SOS-B-03-03","category":"Masyarakat Multikultural","statements":["Pelibatan perwakilan kelompok menunjukkan partisipasi dalam masyarakat beragam.","Mendahulukan kelompok asal pejabat menunjukkan kesetaraan masyarakat multikultural.","Pembagian berdasarkan kebutuhan mendukung perlakuan yang adil antarkelompok."],"answer":["B","S","B"],"categories":["Mencerminkan","Tidak Mencerminkan"]},{"n":12,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Dua komunitas budaya ingin menggunakan gedung serbaguna pada tanggal yang sama. Komunitas pertama akan menyelenggarakan peringatan hari jadi, sedangkan komunitas kedua akan mengadakan pertunjukan budaya tahunan. Kedua kegiatan telah dipersiapkan selama beberapa bulan. Perdebatan berkembang menjadi penghinaan terhadap tradisi kelompok lain."},{"kind":"text","text":"Penanganan konflik yang paling tepat adalah ...."}],"explanation":"Dialog diperlukan untuk menghentikan prasangka dan memperjelas kepentingan setiap pihak. Pembagian waktu atau penyesuaian jadwal merupakan kompromi yang mempertahankan hak kedua komunitas.","sourceId":"B3-SOS-B-14-01","category":"Konflik Sosial","options":[{"key":"A","text":"memfasilitasi dialog dan menyusun pembagian waktu yang disepakati bersama"},{"key":"B","text":"memberikan gedung kepada komunitas yang mempunyai jumlah anggota lebih banyak"},{"key":"C","text":"membatalkan kedua kegiatan agar tidak terjadi pertentangan antarkomunitas"},{"key":"D","text":"menyerahkan keputusan kepada kelompok yang paling dahulu melakukan demonstrasi"},{"key":"E","text":"memisahkan kedua komunitas dari seluruh kegiatan bersama di lingkungan kota"}],"answer":"A"},{"n":13,"type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Setelah terjadi bencana, sejumlah pemuda membuat kampanye donasi melalui media sosial. Informasi tersebut menyebar dengan cepat dan bantuan terkumpul dari berbagai daerah. Namun, warga mulai mempertanyakan pengelolaan dana karena laporan penyaluran belum diumumkan. Sebagian penyumbang menghentikan dukungan sampai pengurus memberikan laporan secara terbuka."},{"kind":"text","text":"Pernyataan yang menunjukkan kajian sosiologi adalah ...."}],"explanation":"Tindakan kolektif, kepercayaan sosial, partisipasi, serta legitimasi kelompok merupakan kajian sosiologi. Kualitas kamera tidak menjadi unsur utama dalam analisis hubungan sosial.","sourceId":"B1-SOS-01-02","category":"Hakikat dan Objek Kajian Sosiologi","options":[{"key":"A","text":"transparansi berhubungan dengan legitimasi kelompok pengelola bantuan"},{"key":"B","text":"media sosial dapat mendorong terbentuknya tindakan kolektif masyarakat"},{"key":"C","text":"kualitas kamera menentukan tingkat keberhasilan seluruh kegiatan donasi"},{"key":"D","text":"kepercayaan sosial memengaruhi keberlanjutan partisipasi para penyumbang"}],"answer":["A","B","D"]},{"n":14,"type":"tf","typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Permukiman di sekitar sungai sering mengalami banjir. Saluran air sempit karena pembangunan tidak teratur, sementara sebagian warga masih membuang sampah ke saluran tersebut."},{"kind":"text","text":"Tentukan kategori setiap pernyataan berdasarkan stimulus."}],"explanation":"Masalah lingkungan sering terjadi karena interaksi antara kondisi struktural dan perilaku masyarakat, bukan hanya salah satu faktor.","sourceId":"B1-SOS-21-03","category":"Permasalahan Sosial","statements":["Ketersediaan fasilitas pengelolaan sampah di kawasan masih sangat terbatas.","Saluran air tidak memadai akibat pembangunan permukiman yang tidak tertata.","Sebagian warga membuang sampah rumah tangga langsung ke saluran air."],"answer":["B","B","S"],"categories":["Struktural","Perilaku"]},{"n":15,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Sebuah studi di Kota Bahari menunjukkan bahwa ketimpangan pendapatan antara kelompok kaya dan miskin semakin lebar dalam 10 tahun terakhir. Akses terhadap fasilitas pendidikan, kesehatan, dan pekerjaan berkualitas lebih mudah diperoleh oleh kelompok masyarakat atas. Sementara itu, masyarakat miskin harus bergantung pada layanan publik yang terbatas dan sering kali berkualitas rendah. Ketidakpuasan mulai muncul di media sosial dan ruang publik. Beberapa kelompok masyarakat melakukan aksi protes untuk menuntut keadilan sosial."},{"kind":"text","text":"Apakah dampak sosial yang mungkin terjadi akibat adanya ketidakpuasan masyarakat miskin terhadap layanan publik?"}],"explanation":"Stimulus secara langsung menyebut munculnya ketidakpuasan di media sosial dan ruang publik yang kemudian berkembang menjadi aksi protes. Oleh karena itu, dampak sosial yang paling jelas dari ketidakpuasan terhadap layanan publik adalah munculnya aksi protes untuk menyuarakan tuntutan.","sourceId":"D2025-20","category":"TKA Sosiologi 2025","options":[{"key":"A","text":"Menimbulkan ketidaksetaraan yang membuat kelompok miskin semakin terhambat dan merasa tidak adil."},{"key":"B","text":"Menimbulkan kebijakan pemerintah yang diarahkan untuk memperbaiki layanan publik di wilayah miskin."},{"key":"C","text":"Menimbulkan rendahnya partisipasi masyarakat miskin dalam proses pengambilan keputusan publik."},{"key":"D","text":"Menimbulkan kerentanan kelompok miskin akibat terbatasnya akses terhadap fasilitas publik."},{"key":"E","text":"Menimbulkan aksi protes masyarakat miskin untuk menyuarakan pendapat."}],"answer":"E"},{"n":16,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Kelompok seni sekolah menampilkan musik tradisional menggunakan alat musik daerah. Agar lebih menarik bagi generasi muda, mereka menambahkan gitar elektrik dan tata panggung modern. Melodi dasar, bahasa lagu, serta makna upacara tetap dipertahankan. Penampilan tersebut kemudian diterima oleh siswa dan tokoh adat."},{"kind":"text","text":"Bentuk hubungan sosial budaya yang tampak adalah ...."}],"explanation":"Akulturasi terjadi ketika unsur kebudayaan baru diterima dan dipadukan tanpa menghilangkan kepribadian budaya lama. Musik modern digunakan, tetapi ciri budaya tradisional tetap dipertahankan.","sourceId":"B2-BS2-04-04","category":"Proses Sosial","options":[{"key":"A","text":"persaingan karena setiap kelompok seni ingin menguasai kegiatan sekolah"},{"key":"B","text":"konflik karena perbedaan kebudayaan menimbulkan kekerasan antarkelompok"},{"key":"C","text":"akulturasi karena unsur baru diterima tanpa menghilangkan budaya utama"},{"key":"D","text":"kontravensi karena seniman muda menolak pandangan tokoh adat setempat"},{"key":"E","text":"asimilasi karena seluruh unsur budaya lama digantikan budaya modern"}],"answer":"C"},{"n":17,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Pemerintah kota mengalihkan hampir seluruh pendaftaran bantuan sosial ke aplikasi daring. Kebijakan tersebut mempercepat pelayanan bagi warga yang memiliki telepon pintar dan mampu menggunakan internet. Namun, sebagian warga lanjut usia dan keluarga miskin tidak mempunyai perangkat memadai atau belum terbiasa mengoperasikan aplikasi. Akibatnya, beberapa warga yang sebenarnya memenuhi syarat tidak berhasil menyelesaikan proses pendaftaran."},{"kind":"text","text":"Faktor penyebab ketidaksetaraan yang paling tepat adalah ...."}],"explanation":"Digitalisasi tidak otomatis dapat diakses semua kelompok. Ketidaksetaraan muncul karena kesenjangan digital, yaitu perbedaan kepemilikan perangkat, akses internet, dan kemampuan menggunakan teknologi.","sourceId":"B1-SOS-17-01","category":"Kesetaraan dan Ketimpangan Sosial","options":[{"key":"A","text":"perbedaan pandangan politik masyarakat terhadap program bantuan yang disediakan pemerintah"},{"key":"B","text":"ketimpangan penguasaan dan akses teknologi dalam sistem pelayanan publik"},{"key":"C","text":"ketidaksamaan kebiasaan masyarakat ketika mengikuti kegiatan di lingkungan tempat tinggal"},{"key":"D","text":"perbedaan keinginan warga untuk memperoleh program bantuan dari pemerintah"},{"key":"E","text":"perbedaan jumlah anggota keluarga dalam memenuhi kebutuhan ekonomi sehari-hari"}],"answer":"B"},{"n":18,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Pentingnya Keterlibatan Perempuan Dalam Politik"},{"kind":"text","text":"PARTAI POLITIK\nPerempuan yang berada di partai politik mampu menyuarakan isu kebijakan yang berpihak kepada perempuan melalui wakilnya yang duduk di parlemen. Mendorong perempuan menduduki jabatan penting di partai dan terpenuhinya minimal 30% kepengurusan perempuan."},{"kind":"text","text":"PARLEMEN\nKehadiran perempuan dalam Parlemen dapat memperjuangkan kebijakan yang berpihak pada perempuan karena perempuanlah yang tahu akan kebutuhannya. Selain itu juga dapat menentukan kebijakan dalam peningkatan kesetaraan dan keadilan gender."},{"kind":"text","text":"YUDIKATIF\nPerempuan dalam Lembaga Yudikatif sebagai pelaksana kebijakan harus terus mendukung terlaksananya semua peraturan yang berpihak kepada perempuan. Selain itu juga dapat mengusulkan kebijakan-kebijakan perlindungan terhadap perempuan."},{"kind":"text","text":"Berikut merupakan langkah-langkah penelitian sosial yang akan dilakukan peneliti:\n1. Mengumpulkan data melalui wawancara, observasi, dan dokumentasi.\n2. Menentukan landasan teori dan konsep yang relevan.\n3. Mengolah dan menganalisis data hasil penelitian.\n4. Menyusun latar belakang penelitian berdasarkan data resmi.\n5. Menarik kesimpulan dan memberikan rekomendasi kebijakan."},{"kind":"text","text":"Manakah urutan langkah-langkah penelitian yang termasuk tahapan pelaksanaan penelitian sosial?"}],"explanation":"Tahap pelaksanaan penelitian mencakup kegiatan mengumpulkan data dan kemudian mengolah serta menganalisis data. Menentukan landasan teori dan menyusun latar belakang termasuk tahap perencanaan, sedangkan menarik kesimpulan dan memberi rekomendasi berada pada tahap akhir/pelaporan.","sourceId":"D2025-08","category":"TKA Sosiologi 2025","options":[{"key":"A","text":"Menentukan landasan teori dan konsep yang relevan dan menyusun latar belakang penelitian berdasarkan data resmi."},{"key":"B","text":"Mengumpulkan data melalui wawancara, observasi, dan dokumentasi dan menarik kesimpulan dan memberikan rekomendasi kebijakan."},{"key":"C","text":"Menyusun latar belakang penelitian berdasarkan data resmi dan menarik kesimpulan dan memberikan rekomendasi kebijakan."},{"key":"D","text":"Mengumpulkan data melalui wawancara, observasi, dan dokumentasi dan menentukan landasan teori dan konsep yang relevan."},{"key":"E","text":"Mengumpulkan data melalui wawancara, observasi, dan dokumentasi dan mengolah dan menganalisis data hasil penelitian."}],"answer":"E"},{"n":19,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Dalam laporan penelitian tentang penggunaan media sosial oleh remaja, peneliti menuliskan jumlah responden, teknik penentuan sampel, kisi-kisi kuesioner, prosedur wawancara, serta teknik analisis data. Informasi tersebut diperlukan agar pembaca memahami cara penelitian dilaksanakan."},{"kind":"text","text":"Uraian tersebut ditempatkan pada bagian ...."}],"explanation":"Bagian metode penelitian memuat pendekatan, subjek atau sampel, teknik pengumpulan data, instrumen, prosedur penelitian, dan teknik analisis data.","sourceId":"B1-SOS-08-01","category":"Penelitian Sosial","options":[{"key":"A","text":"kajian pustaka karena menerangkan teori tentang perilaku pengguna internet"},{"key":"B","text":"penutup karena merangkum keseluruhan proses dan hasil kegiatan penelitian"},{"key":"C","text":"hasil penelitian karena menyajikan temuan yang diperoleh dari para responden"},{"key":"D","text":"pendahuluan karena menjelaskan pentingnya masalah penggunaan media sosial"},{"key":"E","text":"metode penelitian karena menjelaskan prosedur memperoleh dan mengolah data"}],"answer":"E"},{"n":20,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Media sosial membuat tren pakaian global berubah sangat cepat. Sebagian siswa membeli pakaian baru hampir setiap bulan agar selalu mengikuti tren. Setelah beberapa kali dipakai, pakaian tersebut tidak digunakan lagi. Di sisi lain, berbagai informasi menunjukkan bahwa produksi pakaian berlebihan dapat meningkatkan limbah tekstil dan konsumsi sumber daya."},{"kind":"text","text":"Rekomendasi sikap kritis yang paling tepat adalah ...."}],"explanation":"Sikap kritis tidak berarti menolak globalisasi, tetapi bersikap selektif dan bertanggung jawab dalam konsumsi, termasuk mempertimbangkan kebutuhan dan dampaknya.","sourceId":"B3-SOS-C-28-01","category":"Globalisasi","options":[{"key":"A","text":"membeli produk termurah tanpa mempertimbangkan proses produksi dan ketahanannya"},{"key":"B","text":"memilih pakaian berdasarkan kebutuhan, kualitas, dan dampak lingkungannya"},{"key":"C","text":"menolak seluruh jenis pakaian buatan industri modern dan hanya memakai pakaian tradisional"},{"key":"D","text":"mengganti pakaian setiap tren berubah agar industri mode terus berkembang"},{"key":"E","text":"membeli seluruh produk yang sedang tren agar tidak dianggap tertinggal"}],"answer":"B"},{"n":21,"type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Penelitian ini bertujuan untuk menelaah secara komprehensif fenomena meningkatnya jumlah pengemis anak di ruang publik. Fokus utama diarahkan pada identifikasi faktor-faktor penyebab anak-anak berada di jalanan, seperti kondisi kemiskinan, keterbatasan akses terhadap pendidikan, serta eksploitasi oleh pihak tertentu. Penelitian ini juga mengeksplorasi dampak sosial dan psikologis yang dialami anak-anak tersebut, termasuk hilangnya masa kanak-kanak, kerentanan terhadap tindak kekerasan, dan munculnya stigma sosial. Teknik pengumpulan data yang digunakan meliputi observasi partisipatif, wawancara mendalam, dan kajian pustaka. Temuan dari penelitian ini diharapkan dapat memberikan kontribusi dalam pengembangan ilmu sosial, menjadi dasar pemecahan permasalahan sosial, serta meningkatkan kapasitas dan kompetensi peneliti."},{"kind":"text","text":"Pernyataan manakah yang paling tepat menggambarkan kontribusi penelitian sosial dalam menyelesaikan permasalahan berdasarkan ilustrasi tersebut?\nKlik pada setiap pilihan jawaban benar! Jawaban benar lebih dari satu."}],"explanation":"Kontribusi penelitian untuk penyelesaian masalah tampak pada kemampuan hasil penelitian menjadi dasar rekomendasi kebijakan (B) dan meningkatkan kesadaran masyarakat terhadap kompleksitas persoalan (D). Pilihan A dan C lebih menonjolkan manfaat akademik/pengetahuan, sedangkan E menyatakan hasil langsung yang tidak otomatis terjadi hanya karena penelitian dilakukan.","sourceId":"D2025-10","category":"TKA Sosiologi 2025","options":[{"key":"A","text":"Mengurangi tingkat kekerasan dan eksploitasi di jalanan pada anak di bawah umur."},{"key":"B","text":"Menambah wawasan tentang dampak fisik, psikologis maupun sosial yang dialami oleh pengemis di bawah umur."},{"key":"C","text":"Meningkatkan kesadaran masyarakat tentang kompleksitas dan bahaya pengemis di bawah umur."},{"key":"D","text":"Menjadi referensi utama bagi penelitian selanjutnya dan memberikan manfaat bagi para pembaca."},{"key":"E","text":"Memberikan solusi atau saran kepada pemerintah untuk dapat dijadikan sebagai dasar pengambilan kebijakan."}],"answer":["C","E"]},{"n":22,"type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Peneliti mengumpulkan 120 berita daring mengenai kemiskinan perkotaan yang diterbitkan selama satu tahun. Setiap berita diklasifikasikan berdasarkan sumber masalah, kelompok yang ditampilkan, istilah yang digunakan, dan solusi yang ditawarkan. Peneliti kemudian menghitung kemunculan tiap kategori serta menafsirkan pola pemberitaan."},{"kind":"text","text":"Pernyataan yang sesuai dengan penelitian tersebut adalah ...."}],"explanation":"Analisis isi dilakukan dengan mengkaji pesan atau isi dokumen secara sistematis. Berita dikategorikan, dihitung, dan ditafsirkan. Peneliti tidak mengikuti kehidupan keluarga secara langsung.","sourceId":"B2-BS2-09-09","category":"Penelitian Sosial","options":[{"key":"A","text":"kategori digunakan untuk menemukan pola yang muncul dalam pemberitaan"},{"key":"B","text":"sumber data utama berupa teks berita yang telah dipublikasikan"},{"key":"C","text":"penelitian menggunakan analisis isi terhadap dokumen media"},{"key":"D","text":"penelitian menggunakan observasi partisipatif terhadap keluarga miskin"}],"answer":["A","B","C"]},{"n":23,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Pemerintah Kota Pusaka menyelenggarakan festival yang menampilkan makanan, pakaian, musik, dan tarian dari berbagai kelompok budaya. Pengunjung dapat mempelajari tradisi kelompok lain. Namun, penyelenggara hanya menampilkan unsur budaya sebagai hiburan tanpa melibatkan komunitas pemiliknya dalam perencanaan. Beberapa komunitas menilai simbol budayanya disederhanakan dan digunakan tanpa penjelasan yang tepat."},{"kind":"text","text":"Evaluasi paling tepat terhadap pelaksanaan festival tersebut adalah ...."}],"explanation":"Multikulturalisme tidak hanya menampilkan keberagaman, tetapi juga menuntut pengakuan, partisipasi, dan penghormatan terhadap komunitas pemilik budaya. Tanpa pelibatan mereka, representasi budaya dapat menjadi tidak tepat.","sourceId":"B2-BS2-03-04","category":"Masyarakat Multikultural","options":[{"key":"A","text":"festival tidak berkaitan dengan masyarakat multikultural karena hanya berupa kegiatan hiburan"},{"key":"B","text":"festival berhasil menciptakan kesetaraan karena jumlah pertunjukan dibagi secara merata"},{"key":"C","text":"festival menunjukkan keragaman, tetapi belum menjamin partisipasi dan penghormatan budaya"},{"key":"D","text":"festival menghapus identitas kelompok karena seluruh budaya ditampilkan pada tempat sama"},{"key":"E","text":"festival sepenuhnya mencerminkan multikulturalisme karena menampilkan banyak kesenian"}],"answer":"C"},{"n":24,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Di beberapa kota di Indonesia mulai banyak terjadi konflik antara kelompok pedagang pasar tradisional dan pengelola pusat perbelanjaan modern/mal yang baru dibangun. Para pedagang pasar tradisional merasa dirugikan karena kehadiran mal tersebut mengakibatkan menurunnya jumlah pembeli di pasar tradisional. Mereka menganggap bahwa pembangunan pusat perbelanjaan tidak memperhatikan keberlangsungan ekonomi masyarakat kecil. Sementara itu, pihak pengelola mal merasa bahwa pembangunan tersebut sah dan merupakan bentuk kemajuan ekonomi kota. Ketegangan makin meningkat setelah terjadi aksi demonstrasi yang diwarnai kericuhan. Pemerintah kota mencoba meredam konflik dengan memediasi kedua belah pihak namun hingga kini belum tercapai kesepakatan yang memuaskan semua pihak. Konflik ini menjadi sorotan media dan memunculkan berbagai reaksi dari masyarakat luas."},{"kind":"text","text":"Apa bentuk konflik sosial yang terjadi berdasarkan ilustrasi tersebut?"}],"explanation":"Konflik terjadi antara dua kelompok yang memiliki kepentingan ekonomi berbeda: pedagang pasar tradisional dan pengelola pusat perbelanjaan modern. Karena sumber pertentangannya adalah perbedaan kepentingan antarkelompok, bentuk yang paling tepat adalah konflik antarkelompok kepentingan.","sourceId":"D2025-14","category":"TKA Sosiologi 2025","options":[{"key":"A","text":"Konflik politik antar institusi dalam hal ini kelompok pedagang di mal ingin mengalahkan pedagang pasar tradisional."},{"key":"B","text":"Konflik budaya akibat perubahan nilai dimana pedagang pasar tradisional kehilangan pelanggan sejak adanya mal."},{"key":"C","text":"Konflik antarpribadi karena perbedaan individu yang terjadi di antara para pedagang tradisional kepada pedagang di mal."},{"key":"D","text":"Konflik antarkelompok kepentingan karena adanya perbedaan kepentingan ekonomi yang berbeda."},{"key":"E","text":"Konflik antar kelas sosial karena terjadi benturan antara pedagang tradisional dan pedagang di mal."}],"answer":"D"},{"n":25,"type":"tf","typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Pemerintah menyediakan platform pembelajaran daring yang dapat digunakan secara gratis. Namun, siswa di beberapa desa masih mengalami kesulitan karena jaringan internet lemah dan tidak semua keluarga memiliki perangkat. Sebagian siswa yang telah memiliki perangkat juga belum menguasai cara menggunakan platform secara efektif."},{"kind":"text","text":"Petunjuk: Kategorikan setiap faktor sebagai Kesenjangan Akses atau Kesenjangan Kompetensi."}],"explanation":"Kepemilikan perangkat dan ketersediaan jaringan termasuk persoalan akses. Kemampuan menggunakan teknologi merupakan persoalan kompetensi atau literasi digital.","sourceId":"B2-BS2-17-14","category":"Kesetaraan dan Ketimpangan Sosial","statements":["Tidak tersedianya perangkat digital pada sebagian keluarga.","Jaringan internet yang belum stabil pada sebagian wilayah desa.","Rendahnya kemampuan mengoperasikan platform pembelajaran daring."],"answer":["B","B","S"],"categories":["Akses","Kompetensi"]},{"n":26,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Desa Suka Rasa memiliki makanan tradisional yang mulai ditinggalkan generasi muda karena lebih tertarik pada makanan cepat saji luar negeri. Pemerintah desa ingin menjaga keberadaan kuliner lokal tersebut."},{"kind":"text","text":"Upaya yang paling tepat adalah ...."}],"explanation":"Penguatan budaya lokal dapat dilakukan dengan promosi kreatif dan pemanfaatan teknologi digital agar budaya lokal tetap diminati. Festival kuliner dan promosi daring adalah contoh langkah adaptif menghadapi globalisasi.","sourceId":"B3-SOS-C-29-01","category":"Kearifan Lokal","options":[{"key":"A","text":"membiarkan masyarakat memilih sendiri tanpa edukasi"},{"key":"B","text":"menutup semua warung yang menjual makanan modern"},{"key":"C","text":"mempromosikan kuliner tradisional melalui festival dan media digital"},{"key":"D","text":"mengganti nama makanan tradisional dengan nama asing seluruhnya"},{"key":"E","text":"melarang warga membeli makanan dari luar negeri"}],"answer":"C"},{"n":27,"type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Sebuah survei menemukan bahwa sebagian penyandang disabilitas memiliki pendidikan dan keterampilan yang sesuai dengan lowongan kerja. Namun, beberapa perusahaan belum menyediakan akses gedung yang ramah kursi roda. Selain itu, terdapat perusahaan yang menganggap pekerja dengan disabilitas akan kurang produktif meskipun belum melakukan penilaian kemampuan secara individual."},{"kind":"text","text":"Faktor penyebab ketidaksetaraan kesempatan kerja pada kasus tersebut adalah ...."}],"explanation":"Stimulus memperlihatkan hambatan fasilitas, stereotip, dan praktik kelembagaan. Tidak ada dasar untuk menyatakan seluruh penyandang disabilitas memiliki kemampuan rendah.","sourceId":"B1-SOS-17-02","category":"Kesetaraan dan Ketimpangan Sosial","options":[{"key":"A","text":"praktik rekrutmen yang belum memberikan kesempatan secara setara"},{"key":"B","text":"stereotip perusahaan mengenai kemampuan penyandang disabilitas"},{"key":"C","text":"rendahnya kemampuan seluruh penyandang disabilitas dalam melaksanakan pekerjaan"},{"key":"D","text":"keterbatasan aksesibilitas fisik pada lingkungan tempat kerja"}],"answer":["A","B","D"]},{"n":28,"type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Setelah orang tua meninggal, tiga bersaudara berselisih mengenai pembagian rumah dan lahan. Anak pertama merasa berhak memperoleh bagian lebih besar karena telah merawat orang tua. Dua saudara lainnya menghendaki pembagian yang sama. Perselisihan memutus komunikasi dan melibatkan anggota keluarga besar."},{"kind":"text","text":"Pernyataan yang sesuai dengan kasus tersebut adalah ...."}],"explanation":"Konflik berlangsung dalam keluarga dan dipicu kepentingan atas pembagian warisan. Konflik juga dapat dikategorikan sebagai konflik antarindividu. Tidak terdapat perebutan kekuasaan pemerintahan.","sourceId":"B3-SOS-B-13-02","category":"Konflik Sosial","options":[{"key":"A","text":"konflik termasuk konflik politik karena menyangkut perebutan kekuasaan negara"},{"key":"B","text":"konflik termasuk konflik keluarga karena terjadi dalam hubungan kekerabatan"},{"key":"C","text":"konflik dipicu perbedaan kepentingan atas pembagian harta warisan"},{"key":"D","text":"konflik dapat disebut antarindividu karena melibatkan beberapa anggota keluarga"}],"answer":["B","C","D"]},{"n":29,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Di Kelurahan Maju Jaya, warga terdiri dari beragam kelompok sosial seperti penduduk asli, pendatang dari kota, serta etnis minoritas. Dalam kegiatan pembangunan balai warga, kelompok penduduk asli selalu diundang dalam rapat musyawarah, sementara kelompok lain jarang dilibatkan. Kelompok pendatang dan etnis minoritas juga kesulitan memperoleh informasi tentang kegiatan warga karena akses informasi hanya beredar di lingkaran tertentu. Akibatnya, kelompok yang tidak terlibat merasa tersisih dan mulai muncul perasaan tidak dihargai. Ketegangan mulai terlihat ketika beberapa warga menyuarakan ketidakpuasan dalam forum daring lokal. Situasi ini menimbulkan saling curiga, bahkan muncul komentar negatif antar kelompok. Dalam masyarakat majemuk seperti ini, praktik ketidaksetaraan sosial dalam partisipasi dapat menjadi awal dari konflik yang lebih besar."},{"kind":"text","text":"Manakah pernyataan yang menjadi pemicu awal terjadinya ketegangan antara kelompok pendatang dan etnis minoritas?"}],"explanation":"Pemicu utama ketegangan adalah ketimpangan hak untuk berpartisipasi dalam musyawarah. Ketika sebagian kelompok jarang dilibatkan, mereka merasa tersisih, jarak sosial meningkat, dan kepercayaan antarkelompok menurun. Kesenjangan informasi juga berperan, tetapi ketimpangan partisipasi paling langsung menggambarkan masalah pokok pada stimulus.","sourceId":"D2025-19","category":"TKA Sosiologi 2025","options":[{"key":"A","text":"Ketimpangan dalam hak partisipasi membentuk jurang sosial, menurunkan rasa saling percaya antar kelompok."},{"key":"B","text":"Ketidakadilan dalam pengambilan keputusan musyawarah membentuk jarak sosial antar kelompok dan menurunkan rasa dihargai."},{"key":"C","text":"Dominasi kelompok mayoritas memperlemah solidaritas sosial dan merenggangkan relasi antar kelompok masyarakat."},{"key":"D","text":"Kesenjangan dalam akses informasi memperkuat stigma sosial dan mendorong eksklusi kelompok minoritas."},{"key":"E","text":"Ketidaksetaraan dalam pembagian peran memperkuat stratifikasi sosial dan menghambat mobilitas kelompok."}],"answer":"A"},{"n":30,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Seorang warga mengirimkan keluhan melalui aplikasi pelayanan kesehatan. Petugas membaca keluhan tersebut, meminta informasi tambahan, lalu memberikan petunjuk untuk memperoleh pemeriksaan di puskesmas. Warga memahami petunjuk itu dan mengonfirmasi jadwal kedatangannya."},{"kind":"text","text":"Bentuk kontak sosial yang mendukung interaksi pada kasus tersebut adalah ...."}],"explanation":"Kontak sekunder terjadi melalui perantara atau media. Warga dan petugas berinteraksi menggunakan aplikasi. Pesan diterima, ditanggapi, dan dipahami sehingga komunikasi juga berlangsung.","sourceId":"B2-BS2-02-04","category":"Interaksi Sosial","options":[{"key":"A","text":"kontak primer karena kedua pihak bertemu dan berbicara dalam tempat yang sama"},{"key":"B","text":"kontak negatif karena warga menyampaikan keluhan mengenai kondisi kesehatannya"},{"key":"C","text":"kontak sekunder karena hubungan dilakukan menggunakan sarana komunikasi digital"},{"key":"D","text":"kontak kelompok karena komunikasi melibatkan seluruh petugas pelayanan kesehatan"},{"key":"E","text":"kontak spontan karena percakapan berlangsung tanpa tujuan yang telah ditentukan"}],"answer":"C"}]},{"id":5,"title":"Paket 5","questions":[{"typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Sebuah perusahaan membuka lowongan pekerjaan dan menetapkan bahwa seluruh pelamar dinilai berdasarkan pendidikan, pengalaman, tes kemampuan, dan hasil wawancara. Nama daerah asal, suku, agama, serta jenis kelamin tidak digunakan sebagai dasar penilaian. Perusahaan juga melarang pewawancara memberikan perlakuan berbeda kepada pelamar karena latar belakang sosialnya."},{"kind":"text","text":"Prinsip kesetaraan yang paling jelas diterapkan adalah ...."}],"explanation":"Perusahaan menggunakan kemampuan yang relevan sebagai dasar seleksi dan tidak membedakan pelamar berdasarkan identitas sosial. Hal tersebut mencerminkan prinsip nondiskriminasi dan kesamaan kesempatan.","category":"Kesetaraan dan Ketimpangan Sosial","sourceId":"B3-SOS-B-19-01","type":"single","options":[{"key":"A","text":"pemberian hak istimewa berdasarkan kedekatan pelamar dengan pegawai perusahaan"},{"key":"B","text":"pembatasan kesempatan kerja berdasarkan kelompok yang telah lama bekerja"},{"key":"C","text":"perlakuan nondiskriminatif berdasarkan kompetensi yang relevan dengan pekerjaan"},{"key":"D","text":"pemberian kesempatan kerja berdasarkan latar belakang sosial setiap pelamar"},{"key":"E","text":"pemberian prioritas kepada pelamar berdasarkan asal wilayah tempat tinggalnya"}],"answer":"C","n":1},{"typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Warga mengeluhkan debu dan bau dari kawasan industri. Perusahaan menyatakan emisi masih berada di bawah batas yang ditetapkan, tetapi warga menggunakan hasil pemeriksaan dari lembaga berbeda. Demonstrasi terjadi setelah beberapa anak mengalami gangguan pernapasan."},{"kind":"text","text":"Langkah penanganan yang tepat adalah ...."}],"explanation":"Konflik perlu ditangani menggunakan data yang dapat dipercaya dan terbuka. Apabila ditemukan pelanggaran, diperlukan pemulihan dan pengawasan. Pemberhentian pekerja merupakan tindakan pembalasan yang justru memperbesar konflik.","category":"Konflik Sosial","sourceId":"B3-SOS-B-14-02","type":"multi","options":[{"key":"A","text":"membuka hasil pengujian dan informasi emisi agar dapat diperiksa oleh masyarakat"},{"key":"B","text":"menyusun pemulihan lingkungan dan pemantauan berkala apabila ditemukan pelanggaran"},{"key":"C","text":"melakukan pengujian kualitas udara oleh laboratorium independen yang terakreditasi"},{"key":"D","text":"memberhentikan pekerja yang keluarganya mengikuti demonstrasi penolakan industri"}],"answer":["A","B","C"],"n":2},{"typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Bentrokan antarsuporter menyebabkan korban luka dan kerusakan kendaraan warga. Pemerintah daerah berencana menggunakan pendekatan restoratif."},{"kind":"text","text":"Petunjuk: Kategorikan setiap tindakan sebagai Restoratif atau Tidak Restoratif."}],"explanation":"Pendekatan restoratif menekankan tanggung jawab pelaku, pemulihan korban, dan perbaikan hubungan. Hukuman menyeluruh tanpa membedakan keterlibatan tidak mencerminkan keadilan restoratif.","category":"Konflik Sosial","sourceId":"B2-BS2-14-14","type":"tf","categories":["Restoratif","Tidak Restoratif"],"statements":["Pelaku dan perwakilan kelompok dilibatkan dalam pemulihan kerugian korban.","Seluruh pendukung klub dilarang menghadiri pertandingan tanpa batas waktu.","Kedua kelompok melaksanakan kegiatan bersama untuk memperbaiki fasilitas rusak."],"answer":["B","S","B"],"n":3},{"typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Sebuah kawasan industri mulai menggunakan mesin otomatis. Produktivitas perusahaan meningkat, tetapi sebagian pekerjaan rutin tidak lagi membutuhkan banyak tenaga manusia. Pekerja yang memiliki keterampilan teknologi dipindahkan ke bagian baru, sedangkan sebagian pekerja lain kehilangan pekerjaan. Beberapa mantan pekerja kemudian masuk ke sektor informal dengan pendapatan lebih rendah karena belum memiliki keterampilan baru."},{"kind":"text","text":"Analisis yang paling tepat terhadap dinamika permasalahan tersebut adalah ...."}],"explanation":"Masalah bukan sekadar kehilangan pekerjaan. Perubahan teknologi menciptakan pergeseran kebutuhan keterampilan, sehingga pekerja yang dapat beradaptasi memperoleh peluang baru, sedangkan pekerja lain semakin rentan.","category":"Permasalahan Sosial","sourceId":"B1-SOS-21-01","type":"single","options":[{"key":"A","text":"sektor informal muncul karena perusahaan melarang pekerjanya mengikuti pelatihan keterampilan"},{"key":"B","text":"pekerja yang kehilangan pekerjaan pada dasarnya tidak mempunyai motivasi untuk bekerja kembali"},{"key":"C","text":"penggunaan teknologi menyebabkan semua jenis pekerjaan manusia menghilang secara bersamaan"},{"key":"D","text":"perubahan teknologi mengubah struktur pekerjaan dan dapat memperlebar ketimpangan keterampilan"},{"key":"E","text":"otomatisasi selalu menurunkan produktivitas karena jumlah tenaga kerja menjadi lebih sedikit"}],"answer":"D","n":4},{"typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Beberapa SMA menyediakan program pertukaran pelajar internasional dan kursus daring dari universitas luar negeri. Siswa yang memiliki kemampuan bahasa asing, perangkat digital, dan dukungan ekonomi keluarga dapat memanfaatkan program tersebut secara optimal. Sebagian siswa lainnya kesulitan mengikuti karena keterbatasan biaya dan teknologi."},{"kind":"text","text":"Evaluasi yang paling tepat terhadap kondisi tersebut adalah ...."}],"explanation":"Globalisasi pendidikan menyediakan akses pengetahuan yang lebih luas, tetapi kelompok yang memiliki modal ekonomi, teknologi, dan bahasa lebih mudah memanfaatkannya. Ketimpangan akses dapat kemudian menghasilkan ketimpangan kesempatan pendidikan.","category":"Globalisasi","sourceId":"B1-SOS-22-01","type":"single","options":[{"key":"A","text":"program internasional memastikan seluruh siswa memiliki pengalaman pendidikan yang setara tanpa perbedaan"},{"key":"B","text":"program internasional memperluas kesempatan belajar tetapi dapat memperlebar kesenjangan jika aksesnya tidak merata"},{"key":"C","text":"globalisasi pendidikan hanya berdampak pada peningkatan penggunaan bahasa asing di sekolah"},{"key":"D","text":"keterbatasan teknologi tidak berpengaruh karena seluruh materi global dapat diperoleh secara bebas"},{"key":"E","text":"pendidikan global membuat kemampuan ekonomi keluarga tidak lagi memengaruhi kesempatan belajar peserta didik"}],"answer":"B","n":5},{"typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Seorang pengemudi akan keluar dari halaman rumah menuju jalan raya. Ia menyalakan lampu penunjuk arah. Pengendara yang melintas melihat tanda tersebut, mengurangi kecepatan, lalu memberikan ruang agar kendaraan dapat keluar. Kedua pengendara tidak berbicara, tetapi memahami tindakan satu sama lain."},{"kind":"text","text":"Syarat interaksi sosial yang tampak dalam peristiwa tersebut adalah ...."}],"explanation":"Kedua pengendara berada dalam situasi langsung dan saling merespons. Lampu penunjuk arah menjadi simbol komunikasi. Komunikasi tidak harus berupa percakapan; gerakan atau tanda yang dimaknai dan ditanggapi juga termasuk komunikasi.","category":"Interaksi Sosial","sourceId":"B3-SOS-B-02-01","type":"single","options":[{"key":"A","text":"kontak langsung tanpa komunikasi karena kedua pihak tidak melakukan percakapan"},{"key":"B","text":"komunikasi satu arah tanpa kontak karena tidak terdapat tanggapan pengendara"},{"key":"C","text":"hubungan kelompok tanpa komunikasi karena pengendara tidak saling mengenal"},{"key":"D","text":"kontak tidak langsung dan komunikasi melalui perantara sebuah organisasi"},{"key":"E","text":"kontak langsung dan komunikasi melalui penggunaan simbol yang dipahami"}],"answer":"E","n":6},{"typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Pengunjung sebuah perpustakaan sering bertemu di ruang bacaan. Beberapa orang ternyata menyukai jenis buku sejarah yang sama. Mereka mulai berdiskusi, bertukar rekomendasi, dan membuat jadwal pertemuan bulanan. Setelah itu, komunitas menyusun aturan diskusi dan menunjuk seorang koordinator."},{"kind":"text","text":"Pernyataan yang tepat mengenai proses terbentuknya komunitas tersebut adalah ...."}],"explanation":"Kesamaan minat, interaksi berulang, dan pembentukan struktur mendukung lahirnya kelompok sosial. Kehadiran di lokasi yang sama tidak otomatis menjadikan semua orang sebagai anggota kelompok.","category":"Kelompok Sosial","sourceId":"B3-SOS-B-05-02","type":"multi","options":[{"key":"A","text":"berada di perpustakaan yang sama otomatis menjadikan semua pengunjung anggota"},{"key":"B","text":"penunjukan koordinator menunjukkan mulai terbentuknya struktur kelompok"},{"key":"C","text":"pertemuan berulang memperkuat interaksi dan kedekatan dalam komunitas"},{"key":"D","text":"kesamaan minat menjadi dasar awal terbentuknya hubungan antaranggota"}],"answer":["B","C","D"],"n":7},{"typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Pemerintah Desa Cendekia sebelumnya melayani administrasi warga secara manual. Setelah banyak keluhan mengenai antrean panjang, pemerintah desa merancang program pelayanan terpadu berbasis aplikasi. Perangkat desa mendapat pelatihan, data warga didigitalisasi, dan warga diberi sosialisasi sebelum program diterapkan. Perubahan tersebut merupakan bagian dari rencana pembangunan pelayanan desa."},{"kind":"text","text":"Berdasarkan proses terjadinya, perubahan sosial tersebut termasuk ...."}],"explanation":"Perubahan tersebut memiliki tujuan, perencanaan, pelatihan, sosialisasi, dan pelaksanaan yang disengaja, sehingga merupakan perubahan yang direncanakan (planned change).","category":"Perubahan Sosial","sourceId":"B3-SOS-C-25-01","type":"single","options":[{"key":"A","text":"perubahan regresif karena pelayanan digital mengembalikan masyarakat pada pola kehidupan lama"},{"key":"B","text":"perubahan revolusioner karena seluruh kehidupan masyarakat berubah dalam waktu bersamaan"},{"key":"C","text":"perubahan direncanakan karena dilaksanakan melalui program yang dipersiapkan sebelumnya"},{"key":"D","text":"perubahan kecil karena sistem pelayanan tidak memiliki hubungan dengan lembaga pemerintahan"},{"key":"E","text":"perubahan tidak direncanakan karena warga harus menyesuaikan penggunaan aplikasi pelayanan"}],"answer":"C","n":8},{"typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Sebuah kantor kecamatan ingin memastikan setiap penduduk memiliki kesempatan yang sama memperoleh dokumen kependudukan. Beberapa kebijakan diterapkan untuk warga dengan kondisi berbeda."},{"kind":"text","text":"Petunjuk: Kategorikan setiap tindakan sebagai Kesetaraan Formal atau Kesetaraan Substantif."}],"explanation":"Kesetaraan formal menempatkan semua orang dalam aturan yang sama. Kesetaraan substantif memperhatikan hambatan nyata dan memberikan dukungan yang diperlukan agar hak dapat dinikmati secara efektif.","category":"Kesetaraan dan Ketimpangan Sosial","sourceId":"B2-BS2-19-14","type":"tf","categories":["Formal","Substantif"],"statements":["Semua pemohon mengikuti aturan dasar administrasi yang sama.","Warga tunanetra memperoleh bantuan membaca dan mengisi formulir.","Petugas mendatangi warga lansia yang tidak mampu datang ke kantor."],"answer":["B","S","S"],"n":9},{"typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Pemuda dari beberapa kelompok etnis membentuk organisasi kebersihan lingkungan. Mereka memiliki latar belakang bahasa dan tradisi yang berbeda. Dalam kegiatan organisasi, seluruh anggota menggunakan bahasa Indonesia, menyusun aturan bersama, dan bergiliran menjadi koordinator. Di luar organisasi, mereka tetap mengikuti kegiatan budaya komunitas masing-masing."},{"kind":"text","text":"Pernyataan yang mencerminkan masyarakat multikultural adalah ...."}],"explanation":"Masyarakat multikultural memungkinkan identitas kelompok tetap dipertahankan sekaligus membangun aturan dan tujuan bersama. Kesatuan tidak mensyaratkan penghapusan budaya asal.","category":"Masyarakat Multikultural","sourceId":"B3-SOS-B-03-02","type":"multi","options":[{"key":"A","text":"anggota mempertahankan identitas budaya di luar kegiatan organisasi"},{"key":"B","text":"kepemimpinan bergilir menunjukkan kesempatan partisipasi yang setara"},{"key":"C","text":"anggota menggunakan aturan bersama untuk mencapai tujuan kolektif"},{"key":"D","text":"anggota harus meninggalkan budaya asal agar organisasi tetap bersatu"}],"answer":["A","B","C"],"n":10},{"typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Banjir besar menyebabkan ratusan keluarga harus mengungsi. Sejumlah pemuda dari latar belakang berbeda berkumpul secara spontan untuk mengumpulkan makanan dan pakaian. Setelah beberapa hari, mereka membagi tugas menjadi bagian pendataan, logistik, kesehatan, dan distribusi. Mereka juga menyusun aturan kerja agar bantuan dapat\n\ndiberikan secara teratur."},{"kind":"text","text":"Tahap penting yang menunjukkan kumpulan pemuda telah berkembang menjadi kelompok sosial adalah ...."}],"explanation":"Sekadar berkumpul belum cukup untuk disebut kelompok sosial. Kelompok terbentuk ketika terdapat tujuan bersama, interaksi, pembagian peran, dan aturan yang mengikat para anggotanya.","category":"Kelompok Sosial","sourceId":"B1-SOS-05-01","type":"single","options":[{"key":"A","text":"terbentuknya pembagian peran, aturan, dan tujuan yang disepakati bersama"},{"key":"B","text":"munculnya pemberitaan mengenai kegiatan relawan melalui media sosial"},{"key":"C","text":"banyaknya bantuan yang disumbangkan oleh masyarakat dari luar daerah"},{"key":"D","text":"para pemuda menyaksikan kerusakan yang dialami masyarakat terdampak"},{"key":"E","text":"para pemuda berada di lokasi bencana pada waktu yang bersamaan"}],"answer":"A","n":11},{"typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Penelitian di Kecamatan Sejahtera menemukan bahwa lansia jarang menghadiri posyandu karena lokasi pelayanan jauh, tidak tersedia kendaraan, dan anggota keluarga bekerja pada waktu pemeriksaan. Lansia yang memperoleh layanan antar-jemput dan pengingat jadwal menunjukkan tingkat kehadiran lebih tinggi. Petugas kesehatan akan merancang tindak lanjut berdasarkan temuan tersebut."},{"kind":"text","text":"Tindakan yang paling mencerminkan manfaat hasil penelitian adalah ...."}],"explanation":"Temuan menunjukkan bahwa akses dan dukungan keluarga memengaruhi kehadiran. Layanan keliling, pengingat, dan dukungan transportasi langsung menjawab hambatan yang ditemukan penelitian.","category":"Penelitian Sosial","sourceId":"B1-SOS-10-01","type":"single","options":[{"key":"A","text":"mengurangi frekuensi posyandu karena jumlah peserta yang hadir masih relatif rendah"},{"key":"B","text":"menyediakan layanan keliling, pengingat jadwal, dan dukungan transportasi terbatas"},{"key":"C","text":"menambah jenis pemeriksaan tanpa memperhatikan hambatan perjalanan para lansia"},{"key":"D","text":"mewajibkan seluruh lansia datang sendiri agar tidak bergantung kepada keluarganya"},{"key":"E","text":"memusatkan semua pelayanan di kecamatan agar peralatan mudah dikelola petugas"}],"answer":"B","n":12},{"typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Masuknya produk impor berharga murah membuat konsumen mempunyai lebih banyak pilihan. Namun, beberapa produsen lokal berskala kecil mengalami kesulitan bersaing karena biaya produksinya lebih tinggi. Produsen besar yang memiliki teknologi modern justru mampu bertahan dan memperluas pasar."},{"kind":"text","text":"Dampak yang tepat berdasarkan kasus tersebut adalah ...."}],"explanation":"Globalisasi perdagangan memberikan manfaat kepada konsumen, tetapi kemampuan produsen menghadapi kompetisi berbeda-beda. Pelaku bermodal besar lebih siap daripada usaha kecil.","category":"Globalisasi","sourceId":"B3-SOS-C-22-02","type":"multi","options":[{"key":"A","text":"semua produsen lokal pasti bangkrut setelah produk impor masuk ke pasar"},{"key":"B","text":"perbedaan modal dan teknologi dapat memperlebar kesenjangan antarpelaku usaha"},{"key":"C","text":"konsumen dapat memperoleh pilihan produk yang lebih beragam"},{"key":"D","text":"produsen kecil dapat menghadapi tekanan ekonomi yang lebih besar"}],"answer":["B","C","D"],"n":13},{"typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Survei terhadap 500 pekerja menunjukkan bahwa sebagian besar responden bersedia menggunakan bus kota jika jadwal keberangkatan dapat diprediksi, halte mudah dijangkau, dan kondisi kendaraan aman. Harga tiket yang murah tetap dianggap penting, tetapi bukan satu-satunya pertimbangan. Pemerintah kota ingin menggunakan temuan tersebut untuk meningkatkan jumlah pengguna angkutan umum."},{"kind":"text","text":"Manfaat praktis hasil penelitian tersebut adalah ...."}],"explanation":"Hasil penelitian menyediakan informasi konkret mengenai faktor yang dipertimbangkan pengguna. Temuan dapat dimanfaatkan sebagai dasar perbaikan pelayanan, tetapi tidak boleh digunakan untuk membuat kesimpulan mutlak bahwa seluruh warga pasti beralih","category":"Penelitian Sosial","sourceId":"B3-SOS-B-10-01","type":"single","options":[{"key":"A","text":"membuktikan bahwa semua pekerja akan meninggalkan kendaraan pribadi secepatnya"},{"key":"B","text":"menjadi dasar perbaikan jadwal, akses halte, keamanan, dan kebijakan tarif bus"},{"key":"C","text":"menunjukkan bahwa harga tiket tidak berhubungan dengan pilihan transportasi masyarakat"},{"key":"D","text":"membenarkan penghapusan angkutan lain karena bus dianggap paling dibutuhkan warga"},{"key":"E","text":"menentukan bahwa penambahan jumlah bus pasti menghilangkan kemacetan seluruh kota"}],"answer":"B","n":14},{"typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Di daerah wisata, kerajinan anyaman lokal kalah populer dibandingkan produk pabrikan impor yang lebih murah. Pengrajin muda ingin mempertahankan kerajinan tersebut agar tetap diminati."},{"kind":"text","text":"Langkah terbaik yang dapat dilakukan adalah ...."}],"explanation":"Dalam menghadapi globalisasi, budaya lokal perlu beradaptasi secara kreatif tanpa kehilangan identitas. Inovasi desain dengan tetap mempertahankan nilai lokal adalah langkah yang tepat.","category":"Kearifan Lokal","sourceId":"B1-SOS-29-01","type":"single","options":[{"key":"A","text":"meniru seluruh model produk luar tanpa identitas lokal"},{"key":"B","text":"mengembangkan desain baru tanpa menghilangkan ciri khas budaya daerah"},{"key":"C","text":"menjual produk hanya kepada warga setempat"},{"key":"D","text":"menyimpan semua produk kerajinan di gudang agar tidak rusak"},{"key":"E","text":"menghentikan produksi kerajinan tradisional"}],"answer":"B","n":15},{"typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Nelayan tradisional di Desa Samudra memprotes penggunaan kapal penangkap ikan berteknologi modern. Mereka menilai kapal tersebut menangkap ikan dalam jumlah besar dan mengurangi hasil tangkapan nelayan kecil. Sementara itu, pemilik kapal modern menyatakan telah memiliki izin dan menggunakan teknologi untuk meningkatkan produksi. Ketegangan meningkat setelah kedua kelompok saling menghalangi kegiatan melaut."},{"kind":"text","text":"Bentuk konflik yang paling menonjol dalam kasus tersebut adalah ...."}],"explanation":"Kedua kelompok memperebutkan akses terhadap sumber daya ikan yang menjadi sumber penghidupan. Karena berhubungan dengan kepentingan produksi dan pendapatan, kasus tersebut merupakan konflik ekonomi.","category":"Konflik Sosial","sourceId":"B3-SOS-B-13-01","type":"single","options":[{"key":"A","text":"konflik pribadi karena dua nelayan saling mempertahankan harga diri"},{"key":"B","text":"konflik rasial karena perbedaan fisik menimbulkan perlakuan diskriminatif"},{"key":"C","text":"konflik politik karena kelompok bersaing memperoleh jabatan pemerintah"},{"key":"D","text":"konflik keagamaan karena terdapat perbedaan nilai ritual masyarakat"},{"key":"E","text":"konflik ekonomi karena kelompok memperebutkan sumber penghidupan"}],"answer":"E","n":16},{"typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Petani di Desa Sukatani dahulu menanam dan memanen padi dengan tenaga manusia dalam kelompok besar. Setelah mesin tanam dan mesin panen digunakan, pekerjaan dapat selesai lebih cepat dengan jumlah pekerja yang lebih sedikit. Produksi meningkat, tetapi sebagian buruh tani kehilangan kesempatan bekerja saat musim panen. Beberapa di antaranya kemudian mencari pekerjaan di kota."},{"kind":"text","text":"Dampak perubahan sosial yang paling tepat dianalisis dari kasus tersebut adalah ...."}],"explanation":"Penggunaan teknologi meningkatkan efisiensi dan produktivitas, tetapi sekaligus mengurangi kebutuhan tenaga kerja tertentu. Dampak lanjutannya dapat berupa perubahan struktur pekerjaan dan migrasi tenaga kerja.","category":"Perubahan Sosial","sourceId":"B3-SOS-C-26-01","type":"single","options":[{"key":"A","text":"mekanisasi menghentikan urbanisasi karena warga desa tidak lagi membutuhkan pekerjaan di perkotaan"},{"key":"B","text":"mekanisasi meningkatkan solidaritas karena seluruh buruh tani memperoleh pekerjaan yang semakin banyak"},{"key":"C","text":"mekanisasi menurunkan produksi karena masyarakat semakin bergantung pada penggunaan teknologi pertanian"},{"key":"D","text":"mekanisasi meningkatkan efisiensi produksi tetapi mengurangi kebutuhan tenaga kerja pertanian tradisional"},{"key":"E","text":"mekanisasi menghapus pembagian kerja karena seluruh kegiatan pertanian dikerjakan langsung oleh petani"}],"answer":"D","n":17},{"typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Sebuah SMA menerapkan pembelajaran berbasis platform digital. Sebagian peserta didik memiliki laptop pribadi dan internet berkecepatan tinggi di rumah. Sementara itu, sejumlah peserta didik hanya menggunakan telepon genggam milik orang tua dan harus mencari jaringan internet di tempat umum. Dalam satu semester, kelompok pertama lebih sering mengumpulkan tugas tepat waktu dan lebih aktif mengikuti kelas tambahan daring."},{"kind":"text","text":"Dampak ketidaksetaraan yang paling tepat berdasarkan kasus tersebut adalah ...."}],"explanation":"Perbedaan akses perangkat dan internet menimbulkan perbedaan kesempatan belajar. Hal tersebut dapat berkembang menjadi kesenjangan pencapaian akademik, meskipun tidak berarti setiap siswa yang memiliki perangkat pasti memperoleh nilai tertinggi.","category":"Kesetaraan dan Ketimpangan Sosial","sourceId":"B3-SOS-B-18-01","type":"single","options":[{"key":"A","text":"meningkatkan perbedaan kesempatan belajar yang dapat memengaruhi pencapaian akademik siswa"},{"key":"B","text":"menghilangkan pengaruh kondisi ekonomi keluarga terhadap keberhasilan pendidikan siswa"},{"key":"C","text":"memastikan siswa yang mempunyai perangkat pribadi selalu memperoleh nilai paling tinggi"},{"key":"D","text":"membuat seluruh peserta didik memiliki kesempatan yang sama dalam mengikuti pembelajaran"},{"key":"E","text":"menyebabkan penggunaan teknologi menjadi tidak bermanfaat bagi seluruh kegiatan pendidikan"}],"answer":"A","n":18},{"typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Hasil penelitian menunjukkan bahwa anak bekerja karena pendapatan keluarga rendah, kebutuhan membantu orang tua, dan terbatasnya akses pendidikan. Sebagian anak bekerja hingga malam dan sering tidak mengikuti pelajaran. Penghasilan mereka membantu keluarga dalam jangka pendek, tetapi risiko putus sekolah semakin besar."},{"kind":"text","text":"Petunjuk: Kategorikan setiap pernyataan sebagai Simpulan Sesuai Data atau Simpulan Tidak Sesuai Data."}],"explanation":"Data mendukung hubungan kondisi ekonomi dengan pekerja anak dan dampaknya terhadap pendidikan. Tidak terdapat bukti bahwa pekerjaan anak selalu menjamin kesejahteraan jangka panjang.","category":"Penelitian Sosial","sourceId":"B2-BS2-07-14","type":"tf","categories":["Sesuai","Tidak Sesuai"],"statements":["Waktu kerja yang panjang dapat mengganggu keberlanjutan pendidikan anak.","Pekerjaan anak selalu meningkatkan kesejahteraan keluarga dalam jangka panjang.","Kondisi ekonomi keluarga menjadi salah satu faktor anak bekerja."],"answer":["B","S","B"],"n":19},{"typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Masyarakat Desa Mekarjaya biasanya melaksanakan rangkaian upacara perkawinan selama tiga hari. Generasi muda mulai mengusulkan penyederhanaan acara karena biaya yang diperlukan cukup besar. Tokoh adat menilai pengurangan tahapan dapat menghilangkan makna budaya. Perbedaan pandangan tersebut menimbulkan perdebatan antara kelompok muda dan kelompok tua."},{"kind":"text","text":"Fenomena tersebut termasuk kajian sosiologi karena berkaitan dengan ...."}],"explanation":"Stimulus menunjukkan perbedaan nilai, norma, dan pandangan antargenerasi. Sosiologi mengkaji bagaimana perubahan nilai dapat memengaruhi hubungan dan keteraturan sosial dalam masyarakat.","category":"Hakikat dan Objek Kajian Sosiologi","sourceId":"B2-BS2-01-04","type":"single","options":[{"key":"A","text":"kemampuan keluarga dalam mendekorasi tempat pelaksanaan perkawinan"},{"key":"B","text":"perubahan cuaca yang memengaruhi pelaksanaan upacara perkawinan"},{"key":"C","text":"perbedaan usia biologis antara anggota masyarakat muda dan tua"},{"key":"D","text":"pemilihan bahan makanan yang disediakan selama kegiatan berlangsung"},{"key":"E","text":"perbedaan nilai dan perubahan norma dalam kehidupan masyarakat"}],"answer":"E","n":20},{"typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Sebuah aplikasi populer menawarkan layanan gratis dan digunakan oleh jutaan pengguna dari berbagai negara. Ketika mendaftar, aplikasi meminta akses ke lokasi, daftar kontak, kamera, mikrofon, dan berbagai data pribadi. Banyak pengguna langsung menyetujui seluruh permintaan karena ingin segera menggunakan aplikasi."},{"kind":"text","text":"Tindakan yang paling mencerminkan sikap kritis adalah ...."}],"explanation":"Globalisasi digital menuntut literasi data. Pengguna perlu memahami privasi, izin akses, dan risiko keamanan digital sebelum menggunakan layanan.","category":"Globalisasi","sourceId":"B1-SOS-28-01","type":"single","options":[{"key":"A","text":"menyetujui seluruh izin karena aplikasi populer pasti menjamin keamanan pengguna"},{"key":"B","text":"membaca kebijakan privasi dan memberikan akses hanya pada data yang diperlukan"},{"key":"C","text":"mengunggah lebih banyak data pribadi agar fitur aplikasi dapat digunakan secara maksimal"},{"key":"D","text":"membagikan kata sandi kepada teman agar akun lebih mudah digunakan secara bersama-sama"},{"key":"E","text":"menggunakan identitas teman agar data pribadi sendiri tidak masuk ke dalam aplikasi"}],"answer":"B","n":21},{"typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Ketika terjadi wabah penyakit, sejumlah perusahaan tiba-tiba menerapkan kerja dari rumah. Rapat, pelaporan, dan koordinasi dilakukan melalui aplikasi digital. Setelah keadaan membaik, beberapa perusahaan tetap mempertahankan pola kerja hibrida karena dianggap efisien."},{"kind":"text","text":"Bentuk perubahan yang dapat diidentifikasi dari stimulus adalah ...."}],"explanation":"Pandemi menjadi faktor eksternal yang tidak direncanakan. Perubahan kemudian berkembang dan sebagian dilembagakan menjadi pola baru. Pernyataan D tidak tepat karena perubahan juga menyentuh organisasi dan interaksi kerja.","category":"Perubahan Sosial","sourceId":"B1-SOS-25-02","type":"multi","options":[{"key":"A","text":"penggunaan teknologi mempercepat perubahan pola interaksi dalam kegiatan pekerjaan"},{"key":"B","text":"seluruh perubahan merupakan perubahan kecil karena hanya berkaitan dengan tempat bekerja"},{"key":"C","text":"pada awalnya perubahan muncul sebagai respons terhadap kondisi yang tidak direncanakan"},{"key":"D","text":"sebagian perubahan kemudian bertahan dan menjadi pola baru dalam organisasi pekerjaan"}],"answer":["A","C","D"],"n":22},{"typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Sebuah permukiman baru dihuni warga dari berbagai daerah. Pemerintah kelurahan membentuk forum warga, mengadakan festival budaya, dan menyelenggarakan kegiatan olahraga bersama. Namun, beberapa kelompok masih menyebarkan stereotip negatif terhadap pendatang."},{"kind":"text","text":"Tentukan kategori setiap pernyataan berdasarkan stimulus."}],"explanation":"Dampak integratif memperkuat keterhubungan dan solidaritas sosial, sedangkan dampak disintegratif meningkatkan jarak, ketegangan, atau konflik.","category":"Perubahan Sosial","sourceId":"B1-SOS-26-03","type":"tf","categories":["Integratif","Disintegratif"],"statements":["Penyebaran stereotip negatif meningkatkan jarak sosial antarpenduduk.","Festival budaya memperkuat rasa saling mengenal antarkelompok masyarakat.","Forum warga memperluas komunikasi antarpenduduk dari latar berbeda."],"answer":["S","B","B"],"n":23},{"typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Penelitian dilakukan terhadap 240 warga dari empat kelurahan. Hasilnya menunjukkan bahwa warga yang pernah mengikuti pelatihan digital lebih mampu memeriksa sumber berita dan mengatur keamanan akun. Namun, kemampuan tersebut juga dipengaruhi tingkat pendidikan, pengalaman menggunakan internet, dan ketersediaan pendampingan. Sejumlah warga yang belum pernah mengikuti pelatihan tetap memiliki kemampuan baik karena terbiasa memeriksa informasi melalui beberapa sumber."},{"kind":"text","text":"Simpulan yang didukung oleh hasil penelitian adalah ...."}],"explanation":"Hasil penelitian menunjukkan hubungan positif antara pelatihan dan literasi digital, tetapi bukan hubungan mutlak. Pendidikan, pengalaman, dan pendampingan juga memengaruhi kemampuan warga.","category":"Penelitian Sosial","sourceId":"B3-SOS-B-07-02","type":"multi","options":[{"key":"A","text":"semua warga tanpa pelatihan digital tidak mampu membedakan informasi benar dan informasi palsu"},{"key":"B","text":"kemampuan literasi digital dipengaruhi oleh beberapa faktor, bukan hanya keikutsertaan dalam pelatihan"},{"key":"C","text":"pelatihan digital berkaitan dengan peningkatan kemampuan memeriksa informasi dan menjaga keamanan akun"},{"key":"D","text":"pengalaman menggunakan internet dapat membantu sebagian warga mengembangkan literasi digital secara mandiri"}],"answer":["B","C","D"],"n":24},{"typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Seleksi masuk sebuah sekolah unggulan menggunakan tes akademik. Secara formal seluruh calon peserta didik mengikuti tes yang sama. Namun, siswa dari keluarga berpenghasilan tinggi lebih banyak mengikuti bimbingan belajar berbayar, memiliki laptop pribadi, dan memperoleh akses buku tambahan. Sementara itu, sebagian siswa dari keluarga berpenghasilan rendah hanya mengandalkan fasilitas sekolah sebelumnya."},{"kind":"text","text":"Faktor yang berkontribusi terhadap ketidaksetaraan hasil seleksi adalah ...."}],"explanation":"Kesamaan tes belum tentu menghasilkan kesetaraan kesempatan apabila kondisi awal peserta berbeda. Modal ekonomi dan fasilitas belajar membuat sebagian siswa memiliki sumber persiapan lebih banyak.","category":"Kesetaraan dan Ketimpangan Sosial","sourceId":"B3-SOS-B-17-02","type":"multi","options":[{"key":"A","text":"perbedaan modal ekonomi yang memengaruhi kesiapan mengikuti seleksi"},{"key":"B","text":"ketimpangan akses peserta didik terhadap teknologi dan fasilitas belajar"},{"key":"C","text":"perbedaan kemampuan keluarga menyediakan sumber belajar tambahan"},{"key":"D","text":"kesamaan bentuk tes yang diberikan kepada seluruh calon peserta didik"}],"answer":["A","B","C"],"n":25},{"typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Remaja di Desa Budaya sering berlatih tari secara bersama-sama. Mereka ingin mempertahankan kesenian lokal dan menampilkannya dalam festival. Setelah jumlah anggota bertambah, mereka membentuk kelompok seni, menetapkan jadwal, memilih pelatih, dan membagi tanggung jawab perlengkapan."},{"kind":"text","text":"Petunjuk: Tentukan kategori Menunjukkan Kelompok Sosial atau Belum Menunjukkan Kelompok Sosial."}],"explanation":"Tujuan bersama, interaksi, aturan, serta pembagian peran menunjukkan keberadaan kelompok sosial. Sekadar berada di lokasi yang sama tanpa interaksi hanya membentuk kumpulan fisik.","category":"Kelompok Sosial","sourceId":"B2-BS2-05-14","type":"tf","categories":["Menunjukkan","Belum Menunjukkan"],"statements":["Anggota membentuk jadwal, peran, dan tanggung jawab yang disepakati.","Remaja hanya berada di lokasi festival tanpa saling berinteraksi.","Remaja mempunyai tujuan bersama untuk melestarikan kesenian lokal."],"answer":["B","S","B"],"n":26},{"typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Sebuah sekolah menerapkan pembelajaran daring untuk seluruh peserta didik. Peserta didik dari keluarga mampu dapat mengikuti kegiatan menggunakan komputer dan internet stabil. Sebagian peserta didik lain hanya memiliki satu telepon genggam yang digunakan bersama anggota keluarga. Perbedaan akses tersebut memengaruhi keaktifan, ketepatan pengumpulan tugas, dan hasil pembelajaran."},{"kind":"text","text":"Fenomena yang dapat dianalisis menggunakan sosiologi adalah ...."}],"explanation":"Ketidaksetaraan akses, stratifikasi sosial, dan kesenjangan digital merupakan fenomena sosial. Kecepatan prosesor merupakan persoalan teknis perangkat, bukan kajian utama sosiologi.","category":"Hakikat dan Objek Kajian Sosiologi","sourceId":"B3-SOS-B-01-02","type":"multi","options":[{"key":"A","text":"dampak kesenjangan digital terhadap hubungan dan pencapaian kelompok"},{"key":"B","text":"kecepatan prosesor perangkat yang digunakan peserta didik saat belajar"},{"key":"C","text":"ketidaksetaraan akses teknologi berdasarkan kondisi ekonomi keluarga"},{"key":"D","text":"pengaruh stratifikasi sosial terhadap kesempatan memperoleh pendidikan"}],"answer":["A","C","D"],"n":27},{"typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Peneliti akan mengkaji rendahnya partisipasi warga dalam kegiatan kerja bakti. Ia telah menyusun beberapa bagian berikut: manfaat penelitian; latar belakang; rumusan masalah; tujuan penelitian."},{"kind":"text","text":"Urutan sistematika bagian pendahuluan yang paling tepat adalah ...."}],"explanation":"Pendahuluan umumnya dimulai dengan latar belakang, dilanjutkan rumusan masalah, tujuan penelitian, lalu manfaat penelitian. Urutan tersebut memperlihatkan alur dari alasan penelitian menuju sasaran dan kegunaannya.","category":"Penelitian Sosial","sourceId":"B3-SOS-B-08-01","type":"single","options":[{"key":"A","text":"rumusan masalah–latar belakang–manfaat penelitian–tujuan penelitian"},{"key":"B","text":"tujuan penelitian–rumusan masalah–latar belakang–manfaat penelitian"},{"key":"C","text":"manfaat penelitian–tujuan penelitian–rumusan masalah–latar belakang"},{"key":"D","text":"latar belakang–tujuan penelitian–manfaat penelitian–rumusan masalah"},{"key":"E","text":"latar belakang–rumusan masalah–tujuan penelitian–manfaat penelitian"}],"answer":"E","n":28},{"typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Seorang peneliti ingin memahami cara pedagang pasar malam mempertahankan penghasilan ketika jumlah pengunjung menurun. Selama tiga bulan, peneliti mengikuti aktivitas pedagang sejak menyiapkan barang hingga menutup lapak. Peneliti juga berbincang secara mendalam, mencatat kebiasaan, serta mempelajari hubungan pedagang dengan pemasok dan sesama pedagang."},{"kind":"text","text":"Metode penelitian yang paling sesuai dengan kasus tersebut adalah ...."}],"explanation":"Peneliti berada cukup lama di lingkungan kelompok, mengikuti kehidupan sehari-hari, melakukan pengamatan langsung, dan menggali kebiasaan sosial. Prosedur tersebut mencerminkan metode etnografi.","category":"Penelitian Sosial","sourceId":"B3-SOS-B-09-01","type":"single","options":[{"key":"A","text":"survei kuantitatif karena peneliti mengukur pendapatan semua pedagang"},{"key":"B","text":"etnografi karena peneliti terlibat mengamati kehidupan kelompok secara mendalam"},{"key":"C","text":"studi dokumen karena peneliti hanya menggunakan laporan transaksi pedagang"},{"key":"D","text":"penelitian historis karena peneliti menelusuri perkembangan pasar sejak dahulu"},{"key":"E","text":"eksperimen sosial karena peneliti mengubah pola perdagangan di pasar"}],"answer":"B","n":29},{"typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Warga yang tinggal di sekitar sekolah mengeluhkan kebisingan dan kemacetan saat kegiatan ekstrakurikuler berlangsung. Para siswa merasa warga terlalu membatasi kegiatan sekolah. Setelah terjadi pertengkaran, pihak kelurahan mempertemukan kedua pihak. Pertemuan menghasilkan kesepakatan sementara mengenai jam kegiatan, tetapi hubungan siswa dan warga masih terasa renggang."},{"kind":"text","text":"Langkah lanjutan yang paling mendukung pembangunan perdamaian adalah ...."}],"explanation":"Forum komunikasi dan kegiatan bersama dapat memperbaiki hubungan serta membangun kembali kepercayaan. Perdamaian tidak cukup diwujudkan melalui pembatasan, tetapi perlu didukung interaksi positif dan kerja sama antarpihak.","category":"Konflik Sosial","sourceId":"B3-SOS-B-16-01","type":"single","options":[{"key":"A","text":"melarang seluruh kegiatan siswa di luar waktu pembelajaran utama"},{"key":"B","text":"memindahkan seluruh kegiatan ekstrakurikuler ke daerah yang jauh dari permukiman"},{"key":"C","text":"meminta warga tidak menyampaikan keluhan melalui saluran komunikasi sekolah"},{"key":"D","text":"membentuk forum komunikasi dan kegiatan sosial bersama siswa serta warga"},{"key":"E","text":"menempatkan petugas untuk membubarkan setiap kerumunan siswa di luar sekolah"}],"answer":"D","n":30}]}];</script><script>window.TKA_IMPORT_BANK=[{"id":"B1-SOS-22-01","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 22_Globalisasi(1).docx","n":3,"title":"Pendidikan Internasional","category":"Globalisasi","subcategory":"Peluang dan Ketimpangan Globalisasi","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Beberapa SMA menyediakan program pertukaran pelajar internasional dan kursus daring dari universitas luar negeri. Siswa yang memiliki kemampuan bahasa asing, perangkat digital, dan dukungan ekonomi keluarga dapat memanfaatkan program tersebut secara optimal. Sebagian siswa lainnya kesulitan mengikuti karena keterbatasan biaya dan teknologi."},{"kind":"text","text":"Evaluasi yang paling tepat terhadap kondisi tersebut adalah ...."}],"options":[{"key":"A","text":"program internasional memperluas kesempatan belajar tetapi dapat memperlebar kesenjangan jika aksesnya tidak merata"},{"key":"B","text":"pendidikan global membuat kemampuan ekonomi keluarga tidak lagi memengaruhi kesempatan belajar peserta didik"},{"key":"C","text":"program internasional memastikan seluruh siswa memiliki pengalaman pendidikan yang setara tanpa perbedaan"},{"key":"D","text":"globalisasi pendidikan hanya berdampak pada peningkatan penggunaan bahasa asing di sekolah"},{"key":"E","text":"keterbatasan teknologi tidak berpengaruh karena seluruh materi global dapat diperoleh secara bebas"}],"statements":[],"categories":[],"answer":"A","explanation":"Globalisasi pendidikan menyediakan akses pengetahuan yang lebih luas, te
