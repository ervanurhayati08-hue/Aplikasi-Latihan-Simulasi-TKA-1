xt":"kerentanan petani kecil terhadap kemiskinan dapat semakin besar ketika terjadi krisis"}],"statements":[],"categories":[],"answer":"A, B, dan D","explanation":"Ketimpangan aset berpengaruh terhadap akses modal, posisi kerja, dan kemampuan menghadapi risiko. Pernyataan C terlalu mutlak dan tidak didukung stimulus.","validation":"Lengkap dari sumber","reviewNotes":[]},{"id":"B3-SOS-B-18-03","bank":"Bank Soal 3","source":"Bank Soal 3","originDoc":"SOAL TKA 18(4).docx","n":12,"title":"Ketidaksetaraan dalam Dunia Kerja","category":"Kesetaraan dan Ketimpangan Sosial","subcategory":"Dampak Ketidaksetaraan","type":"category","typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Sebuah kawasan industri mempekerjakan pekerja tetap dan pekerja kontrak. Pekerja tetap menerima jaminan kesehatan serta kesempatan pelatihan, sedangkan pekerja kontrak dengan tugas serupa tidak memperoleh fasilitas yang sama. Dalam beberapa tahun, pekerja tetap lebih sering memperoleh promosi dan kenaikan pendapatan."},{"kind":"text","text":"Petunjuk: Kategorikan dampak sebagai Dampak Ekonomi atau Dampak Sosial."}],"options":[],"statements":["Perbedaan pendapatan antara pekerja tetap dan kontrak semakin melebar.","Muncul perasaan kurang dihargai pada kelompok pekerja kontrak.","Kesempatan meningkatkan kemampuan kerja berbeda antarkelompok pekerja."],"categories":["Ekonomi","Sosial"],"answer":"Dampak Ekonomi Dampak Sosial Dampak Ekonomi","explanation":"Pendapatan dan kesempatan meningkatkan kapasitas ekonomi termasuk dampak ekonomi. Perasaan tersisih atau kurang dihargai berkaitan dengan hubungan serta posisi sosial.","validation":"Lengkap dari sumber","reviewNotes":[]},{"id":"B3-SOS-B-19-01","bank":"Bank Soal 3","source":"Bank Soal 3","originDoc":"SOAL TKA 19(4).docx","n":2,"title":"Rekrutmen Pegawai","category":"Kesetaraan dan Ketimpangan Sosial","subcategory":"Prinsip Kesetaraan dan Inklusi","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text an.","validation":"Lengkap dari sumber","reviewNotes":[]},{"id":"B3-SOS-B-10-01","bank":"Bank Soal 3","source":"Bank Soal 3","originDoc":"SOAL TKA 10(4).docx","n":2,"title":"Pemanfaatan Angkutan Umum","category":"Penelitian Sosial","subcategory":"Manfaat Hasil Penelitian","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Survei terhadap 500 pekerja menunjukkan bahwa sebagian besar responden bersedia menggunakan bus kota jika jadwal keberangkatan dapat diprediksi, halte mudah dijangkau, dan kondisi kendaraan aman. Harga tiket yang murah tetap dianggap penting, tetapi bukan satu-satunya pertimbangan. Pemerintah kota ingin menggunakan temuan tersebut untuk meningkatkan jumlah pengguna angkutan umum."},{"kind":"text","text":"Manfaat praktis hasil penelitian tersebut adalah ...."}],"options":[{"key":"A","text":"menjadi dasar perbaikan jadwal, akses halte, keamanan, dan kebijakan tarif bus"},{"key":"B","text":"membuktikan bahwa semua pekerja akan meninggalkan kendaraan pribadi secepatnya"},{"key":"C","text":"menentukan bahwa penambahan jumlah bus pasti menghilangkan kemacetan seluruh kota"},{"key":"D","text":"membenarkan penghapusan angkutan lain karena bus dianggap paling dibutuhkan warga"},{"key":"E","text":"menunjukkan bahwa harga tiket tidak berhubungan dengan pilihan transportasi masyarakat"}],"statements":[],"categories":[],"answer":"A","explanation":"Hasil penelitian menyediakan informasi konkret mengenai faktor yang dipertimbangkan pengguna. Temuan dapat dimanfaatkan sebagai dasar perbaikan pelayanan, tetapi tidak boleh digunakan untuk membuat kesimpulan mutlak bahwa seluruh warga pasti beralih","validation":"Lengkap dari sumber","reviewNotes":[]},{"id":"B3-SOS-B-10-02","bank":"Bank Soal 3","source":"Bank Soal 3","originDoc":"SOAL TKA 10(4).docx","n":7,"title":"Anak Putus Sekolah","category":"Penelitian Sosial","subcategory":"Manfaat Hasil Penelitian","type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Penelitian menemukan bahwa anak putus sekolah di Desa Harapan dipengaruhi oleh biaya transportasi, kebutuhan membantu keluarga bekerja, dan kurangnya informasi mengenai bantuan pendidikan. Wawancara juga menunjukkan bahwa sebagian anak ingin kembali bersekolah apabila tersedia jadwal belajar yang lebih fleksibel dan dukungan biaya perjalanan."},{"kind":"text","text":"Program yang sesuai dengan hasil penelitian adalah ...."}],"options":[{"key":"A","text":"menyediakan bantuan transportasi bagi peserta didik yang memenuhi kriteria kebutuhan"},{"key":"B","text":"membuka layanan pendidikan fleksibel bagi anak yang masih harus membantu keluarganya"},{"key":"C","text":"memperluas penyebaran informasi mengenai beasiswa dan bantuan pendidikan yang tersedia"},{"key":"D","text":"memberikan sanksi kepada seluruh orang tua tanpa menelaah kondisi ekonomi keluarganya"}],"statements":[],"categories":[],"answer":"A, B, dan C","explanation":"Ketiga program tersebut secara langsung menjawab hambatan yang ditemukan penelitian. Pemberian sanksi umum tidak mempertimbangkan penyebab struktural dan kondisi keluarga.","validation":"Lengkap dari sumber","reviewNotes":[]},{"id":"B3-SOS-B-12-01","bank":"Bank Soal 3","source":"Bank Soal 3","originDoc":"SOAL TKA 12(4).docx","n":2,"title":"Program Pendampingan Kehadiran Siswa","category":"Penelitian Sosial","subcategory":"Rancangan Penelitian dan Etika","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Sebuah sekolah ingin mengetahui efektivitas program pendampingan terhadap kehadiran peserta didik yang sering absen. Dua kelas dengan karakteristik relatif sama dipilih. Kelas pertama mengikuti pendampingan selama delapan minggu, sedangkan kelas kedua menjalani kegiatan sekolah seperti biasa. Kehadiran kedua kelas dicatat sebelum dan setelah program."},{"kind":"text","text":"Rancangan penelitian yang paling sesuai adalah ...."}],"options":[{"key":"A","text":"survei deskriptif dengan menyebarkan angket satu kali kepada seluruh peserta didik"},{"key":"B","text":"studi kasus kualitatif dengan mewawancarai satu peserta didik yang sering tidak hadir"},{"key":"C","text":"eksperimen semu dengan kelompok perlakuan, kelompok pembanding, dan pengukuran berulang"},{"key":"D","text":"penelitian historis dengan membandingkan arsip kehadiran selama sepuluh tahun terakhir"},{"key":"E","text":"etnografi sekolah dengan mengamati kebiasaan peserta didik tanpa pemberian program"}],"statements":[],"categories":[],"answer":"C","explanation":"Terdapat kelompok yang menerima program, kelompok pembanding, serta pengukuran sebelum dan sesudah perlakuan. Karena kelompok kemungkinan tidak dibentuk melalui pengacakan individual, rancangan yang tepat adalah eksperimen semu dengan pola prates–pascates dan kelompok pembanding.","validation":"Lengkap dari sumber","reviewNotes":[]},{"id":"B3-SOS-B-12-02","bank":"Bank Soal 3","source":"Bank Soal 3","originDoc":"SOAL TKA 12(4).docx","n":7,"title":"Perubahan Sosial di Desa Wisata","category":"Penelitian Sosial","subcategory":"Rancangan Penelitian dan Etika","type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Desa Lestari berkembang menjadi tujuan wisata. Peneliti ingin mengetahui perubahan pendapatan warga, kesempatan kerja, hubungan sosial, dan pelaksanaan tradisi lokal. Tahap pertama dilakukan melalui survei terhadap 300 keluarga. Setelah hasil survei diperoleh, peneliti mewawancarai warga dari kelompok yang mengalami manfaat dan kerugian berbeda."},{"kind":"text","text":"Unsur rancangan penelitian yang sesuai adalah ...."}],"options":[{"key":"A","text":"menggunakan metode campuran karena data angka dan pengalaman warga sama-sama dikaji"},{"key":"B","text":"memakai desain berurutan karena wawancara dilakukan setelah hasil survei diperoleh"},{"key":"C","text":"memilih informan wawancara berdasarkan temuan yang muncul pada tahap kuantitatif"},{"key":"D","text":"mengabaikan perbedaan pengalaman warga karena hasil survei sudah mewakili seluruh keadaan"}],"statements":[],"categories":[],"answer":"A, B, dan C","explanation":"Penelitian menggabungkan survei kuantitatif dan wawancara kualitatif. Urutannya menunjukkan desain campuran eksplanatori berurutan, yaitu data kuantitatif dikumpulkan terlebih dahulu, kemudian diperdalam melalui wawancara. Informan kualitatif dapat dipilih berdasarkan pola hasil survei.","validation":"Lengkap dari sumber","reviewNotes":[]},{"id":"B3-SOS-B-12-03","bank":"Bank Soal 3","source":"Bank Soal 3","originDoc":"SOAL TKA 12(4).docx","n":12,"title":"Variabel Penelitian Transportasi","category":"Penelitian Sosial","subcategory":"Rancangan Penelitian dan Etika","type":"category","typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Peneliti ingin mengetahui pengaruh jarak rumah terhadap frekuensi penggunaan bus sekolah. Peneliti juga mencatat kepemilikan kendaraan pribadi karena faktor tersebut diduga memengaruhi keputusan siswa."},{"kind":"text","text":"Petunjuk: Kategorikan setiap unsur sebagai Variabel Bebas, Variabel Terikat, atau Variabel Kontrol/Pengganggu."}],"options":[],"statements":["Jarak rumah siswa dari sekolah.","Frekuensi penggunaan bus sekolah.","Kepemilikan kendaraan pribadi keluarga."],"categories":["Bebas","Terikat","Kontrol"],"answer":"Variabel Bebas Variabel Terikat Variabel Kontrol/Pengganggu","explanation":"Jarak rumah diposisikan sebagai faktor yang diduga memengaruhi penggunaan bus. Frekuensi penggunaan bus merupakan hasil yang diamati. Kepemilikan kendaraan pribadi dapat memengaruhi hubungan tersebut sehingga perlu dicatat atau dikendalikan.","validation":"Lengkap dari sumber","reviewNotes":[]},{"id":"B3-SOS-B-07-01","bank":"Bank Soal 3","source":"Bank Soal 3","originDoc":"SOAL TKA 7(4).docx","n":2,"title":"Penggunaan Gawai dan Pola Tidur Remaja","category":"Penelitian Sosial","subcategory":"Tujuan Penelitian","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text"," l lebih mampu memeriksa sumber berita dan mengatur keamanan akun. Namun, kemampuan tersebut juga dipengaruhi tingkat pendidikan, pengalaman menggunakan internet, dan ketersediaan pendampingan. Sejumlah warga yang belum pernah mengikuti pelatihan tetap memiliki kemampuan baik karena terbiasa memeriksa informasi melalui beberapa sumber."},{"kind":"text","text":"Simpulan yang didukung oleh hasil penelitian adalah ...."}],"options":[{"key":"A","text":"pelatihan digital berkaitan dengan peningkatan kemampuan memeriksa informasi dan menjaga keamanan akun"},{"key":"B","text":"semua warga tanpa pelatihan digital tidak mampu membedakan informasi benar dan informasi palsu"},{"key":"C","text":"kemampuan literasi digital dipengaruhi oleh beberapa faktor, bukan hanya keikutsertaan dalam pelatihan"},{"key":"D","text":"pengalaman menggunakan internet dapat membantu sebagian warga mengembangkan literasi digital secara mandiri"}],"statements":[],"categories":[],"answer":"A, C, dan D","explanation":"Hasil penelitian menunjukkan hubungan positif antara pelatihan dan literasi digital, tetapi bukan hubungan mutlak. Pendidikan, pengalaman, dan pendampingan juga memengaruhi kemampuan warga.","validation":"Lengkap dari sumber","reviewNotes":[]},{"id":"B3-SOS-B-07-03","bank":"Bank Soal 3","source":"Bank Soal 3","originDoc":"SOAL TKA 7(4).docx","n":12,"title":"Pertanian Perkotaan","category":"Penelitian Sosial","subcategory":"Tujuan Penelitian","type":"category","typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Penelitian terhadap enam kelompok pertanian perkotaan menunjukkan bahwa kegiatan menanam sayuran membantu mengurangi pengeluaran pangan dan mempererat interaksi warga. Namun, keberlanjutan program dipengaruhi ketersediaan lahan, pembagian tugas, dan keterbukaan pengelolaan dana. Kelompok yang tidak memiliki jadwal teratur cenderung berhenti setelah beberapa bulan."},{"kind":"text","text":"Petunjuk: Tentukan apakah setiap simpulan berikut Didukung atau Tidak Didukung oleh hasil penelitian."}],"options":[],"statements":["Pertanian perkotaan dapat memberikan manfaat ekonomi dan sosial bagi warga.","Semua kelompok pertanian perkotaan akan bertahan selama memperoleh bibit gratis.","Pembagian tugas dan pengelolaan kelompok memengaruhi keberlanjutan kegiatan."],"categories":["Didukung","Tidak Didukung"],"answer":"Didukung Tidak Didukung Didukung","explanation":"Hasil penelitian mendukung adanya manfaat ekonomi dan sosial serta pentingnya pengelolaan kelompok. Tidak terdapat data yang menyatakan bahwa pemberian bibit gratis menjamin keberlanjutan semua kelompok.","validation":"Lengkap dari sumber","reviewNotes":[]},{"id":"B3-SOS-B-08-01","bank":"Bank Soal 3","source":"Bank Soal 3","originDoc":"SOAL TKA 8(4).docx","n":2,"title":"Penelitian Partisipasi Warga","category":"Penelitian Sosial","subcategory":"Sistematika Laporan Penelitian","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Peneliti akan mengkaji rendahnya partisipasi warga dalam kegiatan kerja bakti. Ia telah menyusun beberapa bagian berikut: manfaat penelitian; latar belakang; rumusan masalah; tujuan penelitian."},{"kind":"text","text":"Urutan sistematika bagian pendahuluan yang paling tepat adalah ...."}],"options":[{"key":"A","text":"latar belakang–rumusan masalah–tujuan penelitian–manfaat penelitian"},{"key":"B","text":"latar belakang–tujuan penelitian–manfaat penelitian–rumusan masalah"},{"key":"C","text":"rumusan masalah–latar belakang–manfaat penelitian–tujuan penelitian"},{"key":"D","text":"tujuan penelitian–rumusan masalah–latar belakang–manfaat penelitian"},{"key":"E","text":"manfaat penelitian–tujuan penelitian–rumusan masalah–latar belakang"}],"statements":[],"categories":[],"answer":"A","explanation":"Pendahuluan umumnya dimulai dengan latar belakang, dilanjutkan rumusan masalah, tujuan penelitian, lalu manfaat penelitian. Urutan tersebut memperlihatkan alur dari alasan penelitian menuju sasaran dan kegunaannya.", ce":"Bank Soal 3","originDoc":"SOAL TKA 6(4).docx","n":2,"title":"Pengangguran Pascapenutupan Pabrik","category":"Permasalahan Sosial","subcategory":"Dampak Permasalahan Sosial","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Sebuah pabrik tekstil berhenti beroperasi karena mengalami kerugian. Ratusan pekerja kehilangan pendapatan dalam waktu hampir bersamaan. Sebagian pekerja membuka usaha kecil atau mengikuti pelatihan, tetapi banyak lainnya belum memperoleh pekerjaan baru. Beberapa keluarga menunda pembayaran sekolah anak, mengurangi konsumsi makanan bergizi, dan meminjam uang untuk memenuhi kebutuhan sehari-hari. Ketegangan rumah tangga juga meningkat karena tekanan ekonomi."},{"kind":"text","text":"Dampak gejala sosial yang paling tepat berdasarkan kasus tersebut adalah ...."}],"options":[{"key":"A","text":"pengangguran hanya memengaruhi pekerja karena anggota keluarga masih dapat menjalani kehidupan seperti biasa"},{"key":"B","text":"kehilangan pekerjaan dapat berkembang menjadi masalah ekonomi, pendidikan, kesehatan, dan hubungan keluarga"},{"key":"C","text":"penutupan pabrik memperbaiki keadaan masyarakat karena pekerja mempunyai waktu lebih banyak bersama keluarga"},{"key":"D","text":"pengangguran mendorong seluruh pekerja menjadi pengusaha sehingga ketergantungan pada perusahaan berkurang"},{"key":"E","text":"tekanan ekonomi hanya berlangsung sementara dan tidak berpengaruh terhadap kesejahteraan jangka panjang"}],"statements":[],"categories":[],"answer":"B","explanation":"Pengangguran berdampak lebih luas daripada hilangnya pendapatan. Kondisi tersebut dapat memengaruhi pemenuhan gizi, pendidikan anak, kemampuan membayar utang, kesehatan mental, dan keharmonisan keluarga.","validation":"Lengkap dari sumber","reviewNotes":[]},{"id":"B3-SOS-B-06-02","bank":"Bank Soal 3","source":"Bank Soal 3","originDoc":"SOAL TKA 6(4).docx","n":7,"title":"Perundungan Siber","category":"Permasalahan Sosial","subcategory":"Dampak Permasalahan Sosial","type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Sebuah video peserta didik saat melakukan kesalahan dalam presentasi diunggah tanpa izin. Video tersebut disebarkan dan diberi komentar menghina. Korban merasa malu, menutup akun media sosial, dan tidak mau kembali melakukan presentasi. Di kelas, peserta didik terbagi menjadi kelompok yang membela korban dan kelompok yang menganggap kejadian tersebut sebagai hiburan."},{"kind":"text","text":"Dampak yang tepat berdasarkan kasus tersebut adalah ...."}],"options":[{"key":"A","text":"korban dapat mengalami penurunan rasa percaya diri dan partisipasi dalam pembelajaran"},{"key":"B","text":"penyebaran video dapat memperluas jangkauan perundungan melampaui lingkungan sekolah"},{"key":"C","text":"perbedaan sikap peserta didik dapat memicu ketegangan antarkelompok di dalam kelas"},{"key":"D","text":"penghapusan akun media sosial menjamin seluruh dampak psikologis korban segera berakhir"}],"statements":[],"categories":[],"answer":"A, B, dan C","explanation":"Perundungan siber dapat berlangsung luas dan terus-menerus. Dampaknya mencakup tekanan psikologis, penurunan partisipasi akademik, serta polarisasi dalam kelompok. Menghapus akun tidak otomatis memulihkan kondisi korban.","validation":"Lengkap dari sumber","reviewNotes":[]},{"id":"B3-SOS-B-06-03","bank":"Bank Soal 3","source":"Bank Soal 3","originDoc":"SOAL TKA 6(4).docx","n":12,"title":"Ketimpangan Pelayanan Kesehatan","category":"Permasalahan Sosial","subcategory":"Dampak Permasalahan Sosial","type":"category","typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Fasilitas kesehatan lengkap tersedia di pusat kabupaten, sedangkan desa terpencil hanya memiliki tenaga kesehatan terbatas. Warga desa harus menempuh perjalanan panjang untuk memperoleh pemeriksaan lanjutan. Sebagian menunda berobat karena biaya transportasi dan kehilangan pendapatan selama perjalanan."},{"kind":"text","tex ahan Cara Berkomunikasi","category":"Perubahan Sosial","subcategory":"Perubahan Sosial Akibat Globalisasi","type":"category","typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Masyarakat semakin sering menggunakan media digital untuk berkomunikasi. Beberapa bentuk perubahan memiliki hubungan langsung dengan globalisasi, sedangkan perubahan lain tidak dapat disimpulkan demikian."},{"kind":"text","text":"Petunjuk: Tentukan apakah pernyataan berikut Dipengaruhi Globalisasi atau Tidak Menunjukkan Pengaruh Globalisasi."}],"options":[],"statements":["Warga mengikuti rapat organisasi internasional melalui konferensi video.","Keluarga melakukan kerja bakti membersihkan halaman rumah secara bersama.","Pelajar berdiskusi dengan teman dari negara lain melalui forum digital."],"categories":["Dipengaruhi","Tidak"],"answer":"Dipengaruhi Globalisasi Tidak Menunjukkan Pengaruh Globalisasi Dipengaruhi Globalisasi","explanation":"Globalisasi ditandai peningkatan hubungan lintas wilayah dan negara. Kerja bakti keluarga tidak dengan sendirinya menunjukkan pengaruh globalisasi.","validation":"Lengkap dari sumber","reviewNotes":[]},{"id":"B3-SOS-C-25-01","bank":"Bank Soal 3","source":"Bank Soal 3","originDoc":"SOAL TKA 25_Perrubahan sosial(1).docx","n":2,"title":"Reformasi Sistem Pelayanan Desa","category":"Perubahan Sosial","subcategory":"Bentuk Perubahan Sosial","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Pemerintah Desa Cendekia sebelumnya melayani administrasi warga secara manual. Setelah banyak keluhan mengenai antrean panjang, pemerintah desa merancang program pelayanan terpadu berbasis aplikasi. Perangkat desa mendapat pelatihan, data warga didigitalisasi, dan warga diberi sosialisasi sebelum program diterapkan. Perubahan tersebut merupakan bagian dari rencana pembangunan pelayanan desa."},{"kind":"text","text":"Berdasarkan proses terjadinya, perubahan sosial tersebut termasuk ...."}],"options":[{"key":"A","t :"Program tersebut merupakan planned change, dilaksanakan secara bertahap, dan terdapat agen perubahan yang mengarahkan prosesnya.","validation":"Lengkap dari sumber","reviewNotes":[]},{"id":"B3-SOS-C-25-03","bank":"Bank Soal 3","source":"Bank Soal 3","originDoc":"SOAL TKA 25_Perrubahan sosial(1).docx","n":12,"title":"Perencanaan Perubahan","category":"Perubahan Sosial","subcategory":"Bentuk Perubahan Sosial","type":"category","typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Sebuah daerah mengalami berbagai perubahan dalam kehidupan sosial."},{"kind":"text","text":"Petunjuk: Kategorikan sebagai Direncanakan atau Tidak Direncanakan."}],"options":[],"statements":["Pemerintah melaksanakan program wajib belajar untuk meningkatkan tingkat pendidikan warga.","Gempa menyebabkan masyarakat memindahkan permukiman ke wilayah yang lebih aman.","Pemerintah desa menjalankan program digitalisasi pelayanan selama tiga tahun."],"categories":["Direncanakan","Tidak"],"answer":"Direncanakan Tidak Direncanakan Direncanakan","explanation":"Perubahan terencana memiliki tujuan dan proses yang disiapkan. Perpindahan akibat gempa merupakan respons terhadap peristiwa yang sebelumnya tidak direncanakan.","validation":"Lengkap dari sumber","reviewNotes":[]},{"id":"B3-SOS-C-26-01","bank":"Bank Soal 3","source":"Bank Soal 3","originDoc":"SOAL TKA 26_Perubahan sosial(1).docx","n":2,"title":"Mekanisasi Pertanian","category":"Perubahan Sosial","subcategory":"Dampak Perubahan Sosial","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Petani di Desa Sukatani dahulu menanam dan memanen padi dengan tenaga manusia dalam kelompok besar. Setelah mesin tanam dan mesin panen digunakan, pekerjaan dapat selesai lebih cepat dengan jumlah pekerja yang lebih sedikit. Produksi meningkat, tetapi sebagian buruh tani kehilangan kesempatan bekerja saat musim panen. Beberapa di antaranya kemudian mencari pekerjaan di kota."},{"kind":"text","text":"Dam pe":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Dalam lima tahun terakhir, sejumlah minimarket dibuka di Kecamatan Margaasih. Warga menyukai tempat tersebut karena barang tertata, harga tercantum jelas, dan waktu pelayanan lebih panjang. Sebagian warung tradisional kemudian memperbaiki pelayanan, menerima pembayaran digital, serta menyediakan jasa pesan antar. Akan tetapi, beberapa warung kecil yang tidak mampu menyesuaikan diri mengalami penurunan pelanggan."},{"kind":"text","text":"Analisis yang paling tepat terhadap dampak perubahan tersebut adalah ...."}],"options":[{"key":"A","text":"berkembangnya minimarket menyebabkan seluruh warung tradisional berhenti beroperasi secara bersamaan"},{"key":"B","text":"perubahan perdagangan meningkatkan persaingan sekaligus mendorong sebagian pelaku usaha melakukan adaptasi"},{"key":"C","text":"perubahan perdagangan menghilangkan pilihan konsumen karena seluruh barang hanya tersedia di minimarket"},{"key":"D","text":"berkembangnya minimarket meningkatkan pendapatan setiap pedagang karena jumlah pembeli otomatis bertambah"},{"key":"E","text":"perubahan perdagangan hanya memengaruhi tempat berbelanja tanpa berpengaruh terhadap strategi pelaku usaha"}],"statements":[],"categories":[],"answer":"B","explanation":"Perubahan sosial-ekonomi tidak hanya menghasilkan persaingan, tetapi juga mendorong adaptasi usaha. Dampaknya berbeda bagi kelompok yang mampu dan tidak mampu melakukan penyesuaian.","validation":"Lengkap dari sumber","reviewNotes":[]},{"id":"B3-SOS-C-27-02","bank":"Bank Soal 3","source":"Bank Soal 3","originDoc":"SOAL TKA 27_Perubahan sosial(2).docx","n":7,"title":"Penggunaan AI dalam Administrasi Sekolah","category":"Perubahan Sosial","subcategory":"Dampak Perubahan Sosial","type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Sebuah sekolah mulai menggunakan sistem berbasis kecerdasan buatan untuk membantu pengolahan jadwal, rekap kehadiran, dan
