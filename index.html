.exam-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}.qcard{padding:30px 31px;min-height:590px}.qmeta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}.qnum{font-weight:900;font-size:25px;letter-spacing:-.7px}.tag{font-size:10px;border-radius:999px;padding:6px 9px;background:color-mix(in srgb,var(--accent) 10%,transparent);border:1px solid color-mix(in srgb,var(--accent) 20%,transparent);color:#c9f6f1;font-weight:800}.prompt{font-size:16px;line-height:1.76;color:#eff5fb}.prompt p{margin:0 0 13px}.data-table{width:100%;border-collapse:separate;border-spacing:0;margin:16px 0;font-size:13px;overflow:hidden;border:1px solid var(--line-strong);border-radius:12px}.data-table td,.data-table th{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px;text-align:left}.data-table tr:last-child td{border-bottom:0}.data-table td:last-child,.data-table th:last-child{border-right:0}.data-table tr:first-child{background:rgba(255,255,255,.045);font-weight:850}

.navcard{padding:17px;position:sticky;top:84px}.navcard::before{content:"Navigasi Soal";display:block;font-size:11px;letter-spacing:.8px;text-transform:uppercase;font-weight:900;color:#c9d6e4;margin-bottom:10px}.progressline{height:7px;background:rgba(255,255,255,.055);border-radius:99px;overflow:hidden;margin:8px 0 14px}.progressline i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 65%,#ffffff));border-radius:99px}.navgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.navn{aspect-ratio:1;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.028);color:#aebfd0;font-size:11px;font-weight:900;transition:.15s}.navn:hover{border-color:var(--line-strong);background:rgba(255,255,255,.055)}.navn.done{background:color-mix(in srgb,var(--ok) 13%,transparent);border-color:color-mix(in srgb,var(--ok) 35%,transparent);color:#ddfff0}.navn.current{background:color-mix(in srgb,var(--accent2) 12%,transparent);border-color:var(--accent2);color:#fff0bd;box-shadow:0 0 0 2px color-mix(in srgb,var(--accent2) 8%,transparent)}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:10.5px;color:var(--muted);margin:12px 0}.dot{width:8px;height:8px;border-radius:3px;display:inline-block;margin-right:4px}.dot.done{background:var(--ok)}.dot.current{background:var(--accent2)}.bottom-nav{display:flex;justify-content:space-between;gap:9px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}

.admin-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:18px}.admin-title{font-size:40px;margin:8px 0 4px;letter-spacing:-1.4px}.admin-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.admin-kpis .card{padding:17px 18px}.admin-kpis b{display:block;font-size:27px;letter-spacing:-1px}.admin-kpis span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.55px;font-weight:800}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}.admin-panel{padding:21px}.admin-panel h3{margin:0 0 14px;font-size:18px}.admin-panel textarea{min-height:92px;resize:vertical}.switch-row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid var(--line);text-transform:none;letter-spacing:0;margin:0;color:var(--ink)}.switch-row span{display:flex;flex-direction:column;gap:3px}.switch-row small{color:var(--muted);font-weight:500;text-transform:none;line-height:1.45}.switch-row input{width:19px;height:19px;accent-color:var(--accent);flex:0 0 auto}.switch-row.compact{padding:9px 0}.package-toggles{margin-top:7px}.monitor{margin-top:16px}.monitor-head{display:flex;justify-content:space-between;align-items:center;gap:20px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:13px;background:rgba(5,15,27,.3)}.admin-table{width:100%;border-collapse:collapse;min-width:700px}.admin-table th,.admin-table td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:12px}.admin-table th{background:rgba(255,255,255,.025);color:#aebfd0;font-size:9.5px;text-transform:uppercase;letter-spacing:.75px}.admin-table tbody tr:hover{background:rgba(255,255,255,.025)}.status{display:inline-block;padding:5px 8px;border-radius:999px;font-size:9.5px;font-weight:900;text-transform:uppercase;letter-spacing:.4px}.status.live{background:rgba(246,200,95,.12);color:#ffe69d;border:1px solid rgba(246,200,95,.18)}.status.done{background:rgba(95,213,148,.12);color:#bff5d4;border:1px solid rgba(95,213,148,.18)}.empty-state{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line-strong);border-radius:13px}

/* Admin recap pengerjaan */
.recap-panel{margin-top:16px}.recap-filters{display:grid;grid-template-columns:minmax(220px,1.5fr) minmax(150px,.7fr) minmax(170px,.8fr);gap:10px;margin:16px 0}.recap-filters input,.recap-filters select{margin:0}.recap-summary{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin:0 0 14px}.recap-summary>div{padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(5,15,27,.38)}.recap-summary b{display:block;font-size:21px;letter-spacing:-.5px}.recap-summary span{display:block;margin-top:3px;color:var(--muted);font-size:9.5px;text-transform:uppercase;letter-spacing:.55px;font-weight:800}.recap-table{min-width:1450px}.recap-table td:nth-child(9){font-size:14px}.recap-panel .monitor-head .actions{margin-top:0}

/* Pembaruan tampilan interaktif dan area simulasi guru */
.preview-launch{padding:25px 30px;display:flex;justify-content:space-between;align-items:center;gap:25px;margin-bottom:18px;background:radial-gradient(circle at 85% 5%,color-mix(in srgb,var(--accent) 20%,transparent),transparent 43%),linear-gradient(125deg,var(--surface2),var(--surface));border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
.preview-launch h2{font-size:26px;margin:10px 0}.preview-launch p{line-height:1.7;color:var(--muted);max-width:650px;margin:0}.preview-controls{display:grid;gap:10px;min-width:280px}.preview-controls select{margin:0}.preview-controls .btn{min-height:46px}
.audit-overlay{position:fixed;inset:0;z-index:200;background:rgba(1,8,18,.85);display:grid;place-items:center;padding:20px;backdrop-filter:blur(9px)}.audit-dialog{padding:28px;width:min(680px,100%);max-height:85vh;overflow-y:auto}.audit-dialog p{line-height:1.8}
.hero-main{background:radial-gradient(circle at 90% 20%,color-mix(in srgb,var(--accent) 20%,transparent),transparent 45%),linear-gradient(160deg,var(--surface2),var(--surface))}.hero-main h1{background:linear-gradient(110deg,#ffffff 25%,var(--accent) 120%);background-clip:text;-webkit-background-clip:text;color:transparent}.card{transition:border-color .2s}.start-card{border-color:color-mix(in srgb,var(--accent) 28%,var(--line))}.qcard{border-top:3px solid var(--accent)}.navn{min-height:36px}.option:focus-within,.tfrow:focus-within{border-color:var(--accent)}

/* Mode simulasi guru: kontrol tetap terlihat selama menelusuri soal */
.preview-bar{position:sticky;top:0;z-index:150;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;background:#102c54;color:#fff;padding:12px clamp(14px,3vw,40px);box-shadow:0 6px 20px rgba(9,30,60,.2)}

/* ===========================================================
   IDENTITAS VISUAL — SOSIOLOGI / RUANG SOSIAL
   Editorial, hangat, terinspirasi jejaring manusia & komunitas.
   =========================================================== */
:root, :root[data-theme="blue"]{
 --bg:#f5f1e9;--bg2:#fcf8f0;--surface:#ffffff;--surface2:#fffaf2;--surface3:#f5eee4;
 --ink:#20304a;--muted:#64728a;--accent:#bd4c3b;--accent2:#f2bf58;
 --danger:#c34b53;--ok:#19846f;--line:#e6dfd4;--line-strong:#d6cbbd;
 --shadow:0 16px 44px rgba(54,45,33,.06);--radius:22px;--radius-sm:13px;
 --accent-ink:#fff;--teal:#078a8b;--violet:#685cb4;--orange:#d76a48;
}
:root[data-theme="green"]{--accent:#147b69;--accent2:#e8b953;--teal:#176c87;--violet:#785d9e;--accent-ink:#fff}
:root[data-theme="purple"]{--accent:#7351a4;--accent2:#e5ab58;--teal:#087f86;--violet:#8866c5;--accent-ink:#fff}
html{scroll-behavior:smooth}
html,body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Verdana,Arial,sans-serif}
body{background:linear-gradient(180deg,#fffdf8 0%,var(--bg) 380px);background-attachment:scroll}
.app-shell{min-height:100vh}
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,253,248,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.topbar::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#d16149 0 26%,#f1bc59 26% 49%,#118888 49% 75%,#735aa7 75% 100%)}
.topbar-inner{padding:15px 24px;min-height:78px;max-width:1320px}
.brand{display:flex;gap:11px;align-items:center;color:var(--ink);font-size:16px;letter-spacing:-.35px;min-width:0}
.brand::before{display:none}
.brand-mark{height:42px;width:42px;flex:0 0 42px;border-radius:13px;background:#194963;display:grid;place-items:center;box-shadow:0 3px 0 #e6c266;overflow:hidden}
.brand-mark svg{width:29px;height:29px;display:block}
.brand .brand-text{color:var(--ink);font-weight:850;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:11px;background:#f2ece3;border:1px solid #e5dcd0;color:#53617a;padding:8px 12px}
.admin-link{margin-left:auto;border:1px solid #c9d1d5;border-radius:11px;background:#fff;color:#29475e;box-shadow:0 2px 0 #e4e8e7}
.admin-link:hover{color:var(--accent);border-color:var(--accent)}
.container{max-width:1320px;padding:33px 24px 62px}
.card{border:1px solid var(--line);border-radius:21px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.card::after{display:none}
.eyebrow{font-size:11px;font-weight:900;letter-spacing:1.3px;color:var(--accent)}
.eyebrow::before{width:15px;background:var(--accent)}
h1,h2,h3{color:var(--ink)}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:700;letter-spacing:-1.7px;line-height:1.095}
h2,h3{letter-spacing:-.55px}
.lead{color:#59647a;font-size:15px;line-height:1.8}
.muted,small.muted{color:var(--muted)}
label{color:#4c5b70;letter-spacing:.65px;font-size:10.7px;margin-top:14px}
input,select,textarea{background:#fff;color:var(--ink);border:1px solid #d6d7d5;border-radius:10px;min-height:45px;padding:11px 13px}
input::placeholder,textarea::placeholder{color:#929aa8}
input:hover,select:hover,textarea:hover{border-color:#9dacae}
input:focus,select:focus,textarea:focus{background:#fff;border-color:var(--teal);box-shadow:0 0 0 3px rgba(8,138,139,.12)}
.btn{min-height:42px;background:var(--accent);color:#fff;box-shadow:0 3px 0 rgba(84,44,29,.18);border:1px solid var(--accent);border-radius:10px;font-weight:800;letter-spacing:.04px}
.btn:hover{box-shadow:0 4px 0 rgba(84,44,29,.14);transform:translateY(-1px);filter:brightness(.98)}
.btn.secondary{background:#fff;color:#34516a;border:1px solid #cbd2d7;box-shadow:0 2px 0 #e8e7e3}
.btn.secondary:hover{background:#f6faf9}
.btn.gold{background:#f0bb50;color:#3d2d24;border-color:#e4ac42}
.btn.danger{background:#fff3f2;color:#ae3943;border:1px solid #efc9c9}
.btn:disabled{filter:grayscale(.35)}
.note{color:#758092;line-height:1.7}
.school-badge{background:#e6f5f1;border:1px solid #b8dfd6;color:#1c6d67;font-size:11px;margin-top:18px}
/* Halaman awal */
.hero{grid-template-columns:minmax(0,1.4fr) minmax(350px,.84fr);gap:22px;align-items:stretch}
.hero-main{padding:35px 34px 24px;min-height:0;display:flex;flex-direction:column;justify-content:flex-start;background:#fff9ee;position:relative;border-color:#eadaca}
.hero-main::before{display:none}
.hero-main h1{background:none;-webkit-background-clip:initial;background-clip:initial;color:#213451;font-size:clamp(35px,3.7vw,53px);margin:15px 0 18px;max-width:520px}
.hero-intro{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(205px,.75fr);align-items:center;gap:8px;min-height:295px}
.hero-copy{position:relative;z-index:2}
.hero-kicker{display:inline-flex;align-items:center;gap:8px;color:#b0483a;text-transform:uppercase;font-weight:900;letter-spacing:1.2px;font-size:10px}
.hero-kicker svg{width:19px;height:19px}
.hero-art{position:relative;align-self:stretch;display:flex;align-items:center;justify-content:center;min-width:0}
.hero-art svg{width:100%;max-width:330px;height:auto;display:block;filter:drop-shadow(0 8px 3px rgba(89,76,54,.03))}
.hero-art-caption{position:absolute;bottom:2px;text-align:center;left:0;right:0;font-size:10px;letter-spacing:.55px;text-transform:uppercase;font-weight:850;color:#7b6e68}
.hero-main .lead{font-size:14px;line-height:1.7}
.concept-band{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:17px;padding:16px 0 15px;border-top:1px dashed #decbb2;border-bottom:1px dashed #decbb2}
.concept-label{color:#895847;text-transform:uppercase;font-size:9px;letter-spacing:1.1px;font-weight:900}
.concept-chips{display:flex;gap:7px;flex-wrap:wrap}
.concept-chips span{font-size:11px;font-weight:750;color:#435363;padding:6px 10px;border:1px solid #e3d7c2;border-radius:30px;background:#fffcf6}
.concept-chips span:nth-child(2){background:#e8f5ef;border-color:#c8e5d6;color:#1c7264}
.concept-chips span:nth-child(3){background:#f0eafd;border-color:#e0d5ee;color:#6b569c}
.stats{gap:10px;margin-top:15px}
.stat{position:relative;border-radius:13px;background:#fff;border:1px solid #eedfcd;padding:14px 14px 12px}
.stat:nth-child(1){border-top:4px solid #cd5c49}.stat:nth-child(2){border-top:4px solid #188783}.stat:nth-child(3){border-top:4px solid #8464b9}
.stat b{color:#25445b;font-size:24px;line-height:1.3}
.stat span{color:#7a7780;font-size:9px;letter-spacing:.7px}
.start-card{border:1px solid #e5ddd0;padding:26px 27px 24px;box-shadow:0 18px 38px rgba(45,69,67,.07)}
.start-card::before{display:none}
.start-header{display:flex;align-items:flex-start;gap:13px;margin-bottom:10px;padding-bottom:17px;border-bottom:1px solid #ede6dc}
.start-icon{display:grid;place-items:center;background:#e8f4f2;border-radius:13px;height:53px;flex:0 0 53px;color:#14847f}
.start-icon svg{height:28px;width:28px}
.start-label{font-size:10px;font-weight:900;color:#158782;letter-spacing:1px;text-transform:uppercase;margin-top:1px}
.start-card h2{font-family:Georgia,"Times New Roman",serif;font-size:27px;letter-spacing:-.8px;margin:4px 0 5px}
.start-caption{font-size:12px;line-height:1.6;color:#778192;margin:0}
.start-card label{margin-top:11px;margin-bottom:6px}
.start-card input,.start-card select{min-height:43px}
.start-card .actions{margin-top:18px}.start-card .actions .btn{flex:1}
.start-card .note{background:#f5f9f8;border:1px solid #e4efec;border-radius:12px;padding:11px 12px;margin-top:14px;font-size:10.5px}
.start-card .note b{font-weight:700}
.study-section{margin:24px 0 0}
.study-heading{display:flex;align-items:center;gap:13px;margin:0 0 13px}
.study-heading span{color:#a35342;font-size:10px;font-weight:900;letter-spacing:1.25px;text-transform:uppercase;white-space:nowrap}
.study-heading:after{content:"";height:1px;flex:1;background:#e2dcd2}
.study-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.study-card{background:#fff;border:1px solid #e5dfd7;border-radius:15px;padding:17px 18px;display:flex;gap:13px;min-height:100px;align-items:flex-start}
.study-card:nth-child(1){border-left:4px solid #d46a52}.study-card:nth-child(2){border-left:4px solid #168987}.study-card:nth-child(3){border-left:4px solid #7864b1}
.study-pict{flex:0 0 34px;height:34px;border-radius:10px;display:grid;place-items:center}
.study-card:nth-child(1) .study-pict{background:#fce9df;color:#c75b43}.study-card:nth-child(2) .study-pict{background:#e2f4ef;color:#078a87}.study-card:nth-child(3) .study-pict{background:#f1edfa;color:#765dae}
.study-pict svg{width:21px;height:21px}
.study-card strong{display:block;font-size:13px;color:#293f56;margin:1px 0 5px}
.study-card p{font-size:11.5px;line-height:1.57;color:#728093;margin:0}
.footer{color:#8a8b91;text-transform:none;letter-spacing:.2px;font-size:10.5px;padding:13px 0}
/* Halaman soal */
.exam-grid{grid-template-columns:minmax(0,1fr) 310px;gap:18px}
.qcard{padding:28px 32px;min-height:580px;background:#fff;border-top:5px solid #188a89}
.qmeta{border-bottom:1px solid #e9e6e0;padding-bottom:17px;margin-bottom:20px}
.qnum{font-family:Georgia,serif;font-size:29px;color:#203c56}
.tag{background:#f2f7f5;color:#326d65;border:1px solid #cee3db;font-size:10px;padding:7px 10px}
.tag:nth-child(3){background:#fff1de;color:#9c5f35;border-color:#f0d6b5}
.prompt{color:#293b50;font-size:15px;line-height:1.85}
.option{background:#fcfbf7;border:1px solid #dfded9;color:#263c52;border-radius:12px;margin:10px 0;padding:14px 15px;text-transform:none;letter-spacing:0;font-size:13.5px;font-weight:500}
.option:hover{background:#f2f9f7;border-color:#63a8a2;transform:translateX(1px)}
.option.selected{border:2px solid #188987;background:#eaf7f3;box-shadow:inset 3px 0 0 #188987;padding:13px 14px}
.option input{accent-color:#0d8380}
.keybox{background:#f0ece3;color:#57677a;border-color:#e2ddd4}
.tfrow{background:#fcfbf7;border-color:#e5e0d7}
.tftext{color:#2e4258}
.tfchoices button{color:#516477;border:1px solid #d6d9d8;background:#fff}
.tfchoices button.on{color:#0c706c;background:#e7f7f1;border-color:#69afa8}
.navcard{padding:20px;background:#fff;top:95px}
.navcard::before{color:#44617b;font-size:10px}
.progressline{height:8px;background:#f0ebe5}
.progressline i{background:#16908d}
.navn{border:1px solid #e3e0d9;background:#f8f7f4;color:#597085;font-size:11px}
.navn:hover{border-color:#a0b5b5;background:#f2f7f5}
.navn.done{background:#def5ec;border-color:#90d8bf;color:#236f58}
.navn.current{background:#f9e8bd;border-color:#e9c36e;color:#7c5622;box-shadow:0 0 0 2px #f8df9b50}
.dot.done{background:#2da982}.dot.current{background:#dea84e}
.bottom-nav{border-top:1px solid #e8e6de}
.timer{margin-left:auto;background:#fff4da;border:1px solid #f0d79b;color:#835a1f;border-radius:10px}
.data-table{border-color:#dedbd4;color:#33475a}.data-table tr:first-child{background:#f6f3ea}.data-table td,.data-table th{border-color:#e5e0d7}
/* Hasil latihan dan admin */
.result{padding:35px;background:#fff}
.score-ring{background:conic-gradient(#0b8b84 calc(var(--score)*1%),#ebe9e4 0);box-shadow:0 12px 30px rgba(12,113,112,.09)}
.score-ring:after{background:#fff;border:1px solid #eae6db}.score-ring strong{color:#176d72}
.result-grid div{background:#faf7f1;border:1px solid #e7e2d8}
.result-grid b{color:#28485b}.result-grid span{color:#68798b}
.review-item{background:#fffcf8;border-color:#e5e2d8}.review-item.correct{border-left:4px solid #168e6e}.review-item.wrong{border-left:4px solid #cd6265}
.explain{color:#596b7c}
.admin-login{padding:33px;background:#fff}.admin-login h2{font-family:Georgia,serif}
.admin-head{padding:8px 0}.admin-title{font-family:Georgia,serif;color:#24455c}
.admin-kpis .card{border-color:#e8e0d7;background:#fff}
.admin-kpis .card:nth-child(1){border-top:4px solid #d05c48}.admin-kpis .card:nth-child(2){border-top:4px solid #d8a746}.admin-kpis .card:nth-child(3){border-top:4px solid #17908a}.admin-kpis .card:nth-child(4){border-top:4px solid #8165b3}
.admin-kpis b{color:#26485a}.admin-kpis span{color:#6e7a89}
.admin-panel{background:#fff;border-color:#e7e0d7}
.admin-panel h3{color:#253e55}
.switch-row{border-color:#eee7df;color:#31475d}.switch-row small{color:#778494}.switch-row input{accent-color:#0e8b86}
.preview-launch{background:#e9f5f1;border-color:#c6dfd7}
.preview-launch h2{color:#245e61}.preview-launch p{color:#4e7778}
.preview-bar{background:#214b5a}.preview-bar .btn{box-shadow:none}
.table-wrap{background:#fff;border-color:#e3ded5}.admin-table th{background:#f5f1e9;color:#536779}.admin-table td{color:#345068;border-color:#ede7df}.admin-table tbody tr:hover{background:#f8f7f2}
.recap-summary>div{background:#fbfaf6;border-color:#e8e1d8}.recap-summary b{color:#31516a}.recap-summary span{color:#788598}
.status.live{background:#fff4df;color:#8a631c;border-color:#f2dbad}.status.done{background:#e6f5ee;color:#187052;border-color:#b8e2d0}
.empty-state{color:#76889a;border-color:#d5d8d3}
.closed-box{color:#98444f;background:#fff2f0;border-color:#efcfce}.closed-box span{color:#8d6a6e}
.audit-overlay{background:#173144bc}.audit-dialog{background:#fff}.audit-dialog p{color:#405269}
.violation-banner{background:#fff1ef;color:#96352f;border-color:#e5bcb6}

@media(max-width:1100px){.hero{grid-template-columns:minmax(0,1.2fr) minmax(345px,.8fr)}.hero-intro{grid-template-columns:1fr 210px}.hero-main{padding:28px 25px 20px}.hero-main h1{font-size:39px}.hero-art-caption{font-size:9px}.start-card{padding:25px 22px}}
@media(max-width:950px){.hero,.exam-grid{grid-template-columns:1fr}.hero-intro{grid-template-columns:minmax(0,1fr) 280px}.hero-main h1{font-size:48px}.study-grid{grid-template-columns:repeat(3,1fr)}.navcard{position:static}.admin-grid,.admin-kpis{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.hero-intro{grid-template-columns:1fr}.hero-art{max-width:290px;margin:0 auto}.hero-intro{gap:4px}.hero-main h1{font-size:clamp(35px,8vw,45px)}.hero-main{padding:26px 21px 20px}.study-grid{grid-template-columns:1fr}.study-card{min-height:0}.concept-band{align-items:flex-start;flex-direction:column;gap:9px}.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:12px 9px}.stat b{font-size:22px}.stat span{font-size:8.5px}}
@media(max-width:620px){.container{padding:22px 13px 38px}.topbar-inner{padding:13px;min-height:69px}.brand{font-size:13px}.brand-mark{height:36px;width:36px;flex-basis:36px}.brand-mark svg{width:26px;height:26px}.admin-link{font-size:10.5px;padding:8px}.hero-main,.start-card,.qcard,.result,.admin-login,.admin-panel{padding:21px}.start-card{padding:24px 20px}.start-card h2{font-size:25px}.hero-art svg{max-width:270px}.hero-main h1{font-size:clamp(33px,9vw,42px);letter-spacing:-1.2px}.stats{grid-template-columns:repeat(3,1fr)}.result-grid,.admin-grid,.admin-kpis{grid-template-columns:1fr 1fr}.study-section{margin-top:18px}.qcard{min-height:0}.option{font-size:13px}.navgrid{grid-template-columns:repeat(5,1fr)}}
@media(max-width:390px){.stat b{font-size:20px}.stat span{font-size:8px}.stats{gap:6px}.hero-main{padding:21px 17px}.admin-grid{grid-template-columns:1fr}.start-header{gap:10px}}



/* Live monitoring — readable on desktop and phones */
.monitor-ping{display:inline-flex;color:#196a5d;font-weight:800;font-size:12px;background:#e0f6ec;padding:8px 12px;border:1px solid #a9e4ca;border-radius:999px;margin:13px 0 0}
.mini-progress{background:#dbe7e6;width:105px;height:7px;border-radius:99px;overflow:hidden;margin-bottom:5px}
.mini-progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#169f96,#53bd79)}
#monitorActivityList .admin-table{min-width:880px}
#monitorActivityList .btn{font-size:11px;padding:7px 9px}
#recapTable .recap-table{min-width:1700px}
@media(max-width:650px){.monitor-ping{font-size:11px}.mini-progress{width:75px}}

/* Reset individual siswa – jelas namun tidak mendominasi tabel */
.reset-quick-btn{padding:7px 11px!important;font-size:11px!important;white-space:nowrap;min-width:76px}
.reset-person{display:flex;flex-direction:column;gap:5px;background:#f7ece3;color:#56382d;border:1px solid #dfc8b9;padding:16px;border-radius:14px;margin:14px 0}
.reset-person strong{font-size:18px}.reset-person span{font-weight:650;font-size:13px}.reset-person small{font-size:12px;color:#856553}
.reset-dialog{max-width:560px}.reset-dialog select{max-width:100%}
.reset-dialog h2{font-size:28px}.reset-dialog .admin-msg{min-height:20px}

/* Akun siswa dan hasil progres per paket */
.student-dashboard-header{padding:27px 30px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;background:linear-gradient(120deg,#f8ebda,#ecf8f3 65%,#f7eff4);color:#24364c}
.student-dashboard-header .eyebrow{color:#a14b42}.student-dashboard-header h1{margin:12px 0}.student-dashboard-header p{margin:6px 0;line-height:1.6}
.student-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:17px 0 27px}.student-stats .card{padding:19px 22px;background:#fdfaf2;color:#243c4b}.student-stats b{display:block;font-size:32px;color:#1f827a}.student-stats span{font-size:12px;color:#566978;font-weight:750}
.student-portal-heading{display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;margin-bottom:12px}.student-portal-heading h2{margin:0}
.student-package-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.student-package{padding:23px;display:flex;flex-direction:column;gap:12px;background:#fffdf9;color:#23394b}.student-package h3{font-size:24px;margin:0}.student-package p{margin:0}.student-package .btn{margin-top:auto}
.student-package-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.student-package-n{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:#e9f1ec;color:#225f58;font-weight:900}
.student-package-status{font-size:11px;line-height:1.3;padding:7px 9px;border-radius:9px;background:#f1e6e2;color:#94513e;font-weight:800;text-align:right}.student-package-status.available{background:#d9f4e9;color:#226d4e}.student-package-status.active{background:#fff1cf;color:#80591c}
.student-package-score{padding:12px 14px;border:1px solid #e0e6db;border-radius:12px;background:#f6f7f1;font-size:33px;font-weight:900;color:#275d6e}.student-package-score small{display:block;font-size:11px;line-height:1.4;color:#6a7783;font-weight:600}
.student-history{padding:25px;margin-top:24px;background:#fffdf9;color:#20384a}.student-history h2{margin:0 0 8px}
@media(max-width:750px){.student-stats{grid-template-columns:repeat(2,1fr)}.student-dashboard-header{padding:21px}.student-history{padding:16px}} 

/* V3.2: tindakan log per akun di sisi laporan admin */
.log-row-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-width:106px}
.log-delete-btn{padding:7px 10px!important;font-size:11px!important;white-space:nowrap}
.log-admin-note{margin-top:10px;margin-bottom:10px;font-size:12px;line-height:1.6}
.log-action-message{font-size:12px;font-weight:750;margin-top:9px;min-height:1.3em;color:var(--ink)}
@media(max-width:620px){.log-row-actions{min-width:88px}.log-delete-btn{padding:7px 8px!important}}
.log-cleared-label{display:inline-flex;align-items:center;gap:5px;padding:8px 10px;border-radius:9px;background:rgba(61,148,120,.14);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);font-weight:800;font-size:11px;white-space:nowrap}.log-action-message:not(:empty){margin:9px 0 0;padding:10px 13px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface3);color:var(--ink);font-weight:700;line-height:1.5}

/* Ringkasan penskoran latihan dan panduan hasil TKA SMA/SMK 2026. */
.score-v34-kicker{text-transform:uppercase;letter-spacing:1.1px;font-size:11px;font-weight:900;color:#9b5d36;margin-bottom:8px}
.score-v34-main{display:grid;grid-template-columns:minmax(220px,.75fr) minmax(0,1.25fr);gap:16px;margin:24px 0 18px}
.score-v34-actual,.score-v34-reference{border:1px solid #e8dfd3;border-radius:18px;padding:23px 21px;background:#fbf8f2;min-width:0}
.score-v34-actual{text-align:center;background:linear-gradient(145deg,#e9f5f0,#fffaf2);border-color:#cce6dc}
.score-v34-actual .score-ring{margin:14px auto 12px}
.score-v34-actual h3,.score-v34-reference h3{font-size:20px;font-family:Georgia,serif;color:#23465a;margin:6px 0 11px}
.score-v34-actual p,.score-v34-reference p{color:#536779;line-height:1.6;font-size:13px;margin:8px 0}
.score-v34-scale{margin:18px 0 11px;position:relative;padding-top:22px}
.score-v34-track{height:16px;background:linear-gradient(90deg,#bd655c,#e4b54c 48%,#29a796 77%,#146b86 100%);border-radius:100px;position:relative}
.score-v34-threshold{position:absolute;top:-6px;bottom:-7px;left:87.5%;border-left:3px solid #24354a;box-shadow:1px 0 0 white}
.score-v34-marks{display:flex;justify-content:space-between;align-items:flex-start;font-size:11px;color:#435c70;margin-top:7px;font-variant-numeric:tabular-nums}
.score-v34-marks span:nth-child(2){display:none}

</style></head><body><div id="app"><div style="padding:40px;text-align:center">Memuat latihan TKA Sosiologi…</div></div><script>window.TKA_DATA=[{"id":1,"title":"Paket 1","questions":[{"n":1,"type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Media sosial memperlihatkan kehidupan selebritas, influencer, dan remaja dari berbagai negara. Sebagian siswa merasa harus memiliki pakaian bermerek, telepon terbaru, atau mengunjungi tempat populer agar diterima dalam kelompok pergaulan. Beberapa siswa yang tidak mampu mengikuti tren merasa rendah diri dan memilih menarik diri dari kelompok."},{"kind":"text","text":"Masalah sosial yang dapat diidentifikasi adalah ...."}],"explanation":"Globalisasi media dapat memperkuat konsumtivisme, perbandingan sosial, dan eksklusi. Kesamaan akses terhadap tren tidak otomatis menciptakan kesetaraan.","sourceId":"B1-SOS-24-02","category":"Globalisasi","options":[{"key":"A","text":"perilaku konsumtif karena pembelian didorong kebutuhan memperoleh pengakuan"},{"key":"B","text":"meningkatnya kesetaraan sosial karena semua remaja mengenal tren yang sama"},{"key":"C","text":"eksklusi sosial terhadap individu yang tidak mampu mengikuti tren tertentu"},{"key":"D","text":"tekanan sosial akibat perbandingan gaya hidup melalui media digital"}],"answer":["A","C","D"]},{"n":2,"type":"tf","typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Jumlah penduduk lanjut usia di Kecamatan Harapan meningkat. Pemerintah membuka layanan kesehatan lansia dan kegiatan sosial mingguan. Program tersebut membantu lansia tetap aktif dan memperluas pertemanan. Namun, kebutuhan perawatan harian bertambah, sementara banyak anggota keluarga usia produktif bekerja di luar daerah."},{"kind":"text","text":"Petunjuk: Tentukan kategori Tepat atau Tidak Tepat untuk setiap pernyataan."}],"explanation":"Program sosial dan kesehatan dapat meningkatkan kualitas hidup lansia. Namun, keluarga tetap memiliki peran penting dalam dukungan emosional, pendampingan, dan perawatan sehari-hari.","sourceId":"B2-BS2-06-14","category":"Permasalahan Sosial","statements":["Keluarga tidak lagi memiliki peran karena seluruh kebutuhan lansia ditanggung pemerintah.","Peningkatan jumlah lansia menambah kebutuhan pelayanan kesehatan dan pendampingan.","Kegiatan sosial dapat mengurangi kesepian dan memperkuat dukungan bagi lansia."],"answer":["S","B","B"],"categories":["Tepat","Tidak Tepat"]},{"n":3,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Reno bukan anggota komunitas atlet lari profesional. Namun, ia sering mengikuti akun atlet, menggunakan pola latihan mereka sebagai contoh, serta memilih perlengkapan olahraga berdasarkan rekomendasi komunitas tersebut. Reno menjadikan perilaku para atlet sebagai standar untuk menilai dan mengembangkan dirinya."},{"kind":"text","text":"Komunitas atlet tersebut bagi Reno termasuk ...."}],"explanation":"Kelompok yang dijadikan standar atau rujukan bagi perilaku seseorang disebut reference group/kelompok acuan, meskipun individu tersebut bukan anggotanya.","sourceId":"B2-BS2-20-04","category":"Kelompok Sosial","options":[{"key":"A","text":"kelompok okupasional karena Reno bekerja bersama para atlet dalam bidang olahraga"},{"key":"B","text":"kelompok informal karena Reno selalu terlibat langsung dalam seluruh kegiatan komunitas"},{"key":"C","text":"kelompok keanggotaan karena Reno tercatat sebagai anggota resmi komunitas tersebut"},{"key":"D","text":"kelompok primer karena Reno mempunyai hubungan emosional langsung dengan semua atlet"},{"key":"E","text":"kelompok acuan karena Reno menjadikannya rujukan dalam menentukan sikap dan perilaku"}],"answer":"E"},{"n":4,"type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Dua kelompok suporter sepak bola memiliki riwayat perselisihan. Sebelum pertandingan, unggahan lama tentang bentrokan kembali disebarkan tanpa konteks yang lengkap. Para anggota kemudian saling mengejek dan menganggap kelompok lawan selalu bertindak kasar. Bentrokan terjadi ketika kedua kelompok bertemu di terminal."},{"kind":"text","text":"Penyebab konflik yang sesuai dengan kasus adalah ...."}],"explanation":"Konflik dipicu oleh stereotip, informasi provokatif, dan fanatisme kelompok. Stimulus tidak menunjukkan adanya perebutan sumber ekonomi.","sourceId":"B1-SOS-15-02","category":"Konflik Sosial","options":[{"key":"A","text":"stereotip negatif yang terus dipertahankan terhadap kelompok lain"},{"key":"B","text":"kuatnya identitas kelompok yang disertai fanatisme berlebihan"},{"key":"C","text":"pembagian sumber ekonomi yang tidak merata di antara para suporter"},{"key":"D","text":"penyebaran informasi yang memperkuat prasangka dan permusuhan"}],"answer":["A","B","D"]},{"n":5,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Sejumlah peserta didik membentuk kelompok belajar untuk menghadapi ujian. Pada awalnya, semua anggota aktif bertukar catatan dan menjelaskan materi. Setelah beberapa minggu, muncul pembagian peran. Seorang peserta didik menjadi koordinator, beberapa anggota bertugas mencari sumber, sedangkan anggota lain menyusun rangkuman. Kelompok juga menetapkan aturan kehadiran dan sanksi bagi anggota yang tidak menjalankan tugas."},{"kind":"text","text":"Aspek yang menjadi fokus kajian sosiologi pada kasus tersebut adalah ...."}],"explanation":"Sosiologi mempelajari pembentukan kelompok, struktur, peran, norma, dan hubungan antaranggota. Kemampuan akademik atau jumlah rangkuman lebih dekat dengan kajian pendidikan secara individual, bukan fokus utama sosiologi.","sourceId":"B1-SOS-01-01","category":"Hakikat dan Objek Kajian Sosiologi","options":[{"key":"A","text":"kemampuan setiap peserta didik dalam memahami materi ujian"},{"key":"B","text":"jumlah halaman rangkuman yang disusun oleh setiap anggota"},{"key":"C","text":"proses terbentuknya struktur dan norma dalam kelompok sosial"},{"key":"D","text":"perbedaan nilai akademik yang diperoleh setelah kegiatan belajar"},{"key":"E","text":"tingkat kesulitan materi yang dipelajari menjelang pelaksanaan ujian"}],"answer":"C"},{"n":6,"type":"tf","typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Sebuah instansi menyusun proses seleksi kerja yang terbuka. Panitia menilai peserta berdasarkan kompetensi dan menyediakan fasilitas tes yang aksesibel."},{"kind":"text","text":"Petunjuk: Kategorikan setiap tindakan sebagai Nondiskriminatif atau Diskriminatif."}],"explanation":"Penilaian berdasarkan kemampuan dan penyediaan akomodasi merupakan praktik nondiskriminatif. Penolakan berdasarkan identitas etnis merupakan diskriminasi.","sourceId":"B3-SOS-B-19-03","category":"Kesetaraan dan Ketimpangan Sosial","statements":["Pelamar dinilai berdasarkan kemampuan yang relevan dengan pekerjaan.","Pelamar penyandang disabilitas memperoleh penyesuaian teknis saat tes.","Pelamar ditolak hanya karena berasal dari kelompok etnis tertentu."],"answer":["B","B","S"],"categories":["Nondiskriminatif","Diskriminatif"]},{"n":7,"type":"tf","typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Seorang perempuan terpilih menjadi kepala desa setelah memperoleh dukungan mayoritas warga. Ia melibatkan kelompok perempuan, pemuda, dan penyandang disabilitas dalam perencanaan pembangunan. Namun, sebagian warga menilai perempuan tidak seharusnya memimpin kegiatan publik. Perbedaan pandangan menimbulkan perdebatan dalam sejumlah pertemuan desa."},{"kind":"text","text":"Tentukan ketepatan setiap pernyataan berikut."}],"explanation":"Sosiologi mengkaji bagaimana masyarakat memberi makna sosial terhadap jenis kelamin melalui peran dan stereotip gender. Partisipasi kelompok yang beragam juga berkaitan dengan inklusi dan kesetaraan sosial.","sourceId":"B2-BS2-01-14","category":"Hakikat dan Objek Kajian Sosiologi","statements":["Penolakan terhadap pemimpin perempuan dapat dianalisis melalui stereotip gender.","Jenis kelamin pemimpin hanya merupakan fakta biologis sehingga tidak berkaitan dengan sosiologi.","Pelibatan berbagai kelompok mencerminkan upaya memperluas partisipasi sosial."],"answer":["B","S","B"],"categories":["Tepat","Tidak Tepat"]},{"n":8,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Sejumlah pemuda di Kota Mandiri bekerja sebagai desainer, penerjemah, dan programmer untuk perusahaan yang berada di negara lain. Mereka bekerja dari rumah dengan menggunakan platform konferensi video dan aplikasi manajemen proyek. Jam kerja menjadi lebih fleksibel, komunikasi dengan rekan kerja berlangsung lintas negara, dan kemampuan bahasa asing semakin dibutuhkan."},{"kind":"text","text":"Perubahan sosial yang paling tepat ditunjukkan oleh fenomena tersebut adalah ...."}],"explanation":"Globalisasi teknologi memungkinkan pekerjaan dilakukan lintas wilayah dan negara. Hal ini mengubah cara bekerja, kebutuhan keterampilan, komunikasi profesional, dan hubungan tenaga kerja dengan perusahaan.","sourceId":"B3-SOS-C-23-01","category":"Perubahan Sosial","options":[{"key":"A","text":"perubahan struktur keluarga karena seluruh pekerja memilih meninggalkan tempat tinggalnya"},{"key":"B","text":"perubahan sistem pendidikan karena semua pekerjaan tidak lagi membutuhkan keterampilan khusus"},{"key":"C","text":"perubahan pola permukiman karena seluruh tenaga kerja berpindah ke pusat industri internasional"},{"key":"D","text":"perubahan sistem politik karena perusahaan asing mengambil alih pemerintahan daerah setempat"},{"key":"E","text":"perubahan pola kerja akibat terhubungnya tenaga kerja lokal dengan pasar kerja global"}],"answer":"E"},{"n":9,"type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Pentingnya Keterlibatan Perempuan Dalam Politik"},{"kind":"text","text":"PARTAI POLITIK\nPerempuan yang berada di partai politik mampu menyuarakan isu kebijakan yang berpihak kepada perempuan melalui wakilnya yang duduk di parlemen. Mendorong perempuan menduduki jabatan penting di partai dan terpenuhinya minimal 30% kepengurusan perempuan."},{"kind":"text","text":"PARLEMEN\nKehadiran perempuan dalam Parlemen dapat memperjuangkan kebijakan yang berpihak pada perempuan karena perempuanlah yang tahu akan kebutuhannya. Selain itu juga dapat menentukan kebijakan dalam peningkatan kesetaraan dan keadilan gender."},{"kind":"text","text":"YUDIKATIF\nPerempuan dalam Lembaga Yudikatif sebagai pelaksana kebijakan harus terus mendukung terlaksananya semua peraturan yang berpihak kepada perempuan. Selain itu juga dapat mengusulkan kebijakan-kebijakan perlindungan terhadap perempuan."},{"kind":"text","text":"Penelitian ini bertujuan untuk memahami bagaimana keterlibatan perempuan dalam partai politik. Peneliti ingin melihat apakah perempuan benar-benar memiliki kesempatan dan mampu mengambil peran penting di dalamnya. Fokus peneliti adalah mengamati sejauh mana perempuan terlibat sebagai anggota biasa, pengurus partai, atau sebagai calon wakil rakyat dalam pemilihan umum. Dengan ini, peneliti berharap bisa mengetahui posisi perempuan dalam struktur partai dan kontribusi mereka terhadap aktivitas politik. Penelitian ini penting untuk melihat kesetaraan gender dalam dunia politik."},{"kind":"text","text":"Manakah pernyataan yang menunjukkan tujuan penelitian kualitatif studi kasus dari permasalahan sosial tersebut?\nKlik pada setiap pilihan jawaban benar! Jawaban benar lebih dari satu."}],"explanation":"Penelitian kualitatif studi kasus bertujuan memahami fenomena secara mendalam, sehingga tujuan yang sesuai ialah mengidentifikasi kesempatan dan peran perempuan (A), memahami kontribusi spesifik perempuan dalam dinamika politik partai (B), serta melihat sejauh mana kesetaraan gender terwujud (D). Pilihan C menggunakan konsep korelasi dan pilihan E menekankan pengaruh sebab-akibat, yang lebih khas penelitian kuantitatif.","sourceId":"D2025-07","category":"TKA Sosiologi 2025","options":[{"key":"A","text":"Untuk mengetahui sejauh mana kesetaraan gender terwujud dalam struktur dan praktik partai politik."},{"key":"B","text":"Untuk menganalisis korelasi antara tingkat keterlibatan perempuan dengan eksistensi partai politik."},{"key":"C","text":"Untuk mengidentifikasi kesempatan dan peran yang dapat diambil perempuan dalam aktivitas politik di partai."},{"key":"D","text":"Untuk menentukan pengaruh keterlibatan perempuan terhadap pengambilan keputusan yang berpihak pada perempuan."},{"key":"E","text":"Untuk memahami kontribusi spesifik perempuan terhadap dinamika dan keputusan politik di dalam partai."}],"answer":["A","C","E"]},{"n":10,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"[Ilustrasi visual: telepon genggam dengan tulisan “HOAX” dan tombol “SHARE”.]"},{"kind":"text","text":"Di era digital saat ini, media sosial menjadi salah satu sumber utama informasi bagi masyarakat. Namun, tidak semua informasi yang tersebar dapat dipertanggungjawabkan. Baru-baru ini, di sebuah kota kecil, beredar pesan berantai di aplikasi pengirim pesan yang menyebutkan akan terjadi gempa besar dan mengimbau warga untuk segera mengungsi. Informasi tersebut ternyata tidak berasal dari lembaga resmi dan terbukti hoaks. Akibatnya, banyak warga panik, meninggalkan rumah, bahkan terjadi penjarahan di beberapa toko. Situasi ini menunjukkan bagaimana penyebaran informasi yang tidak benar bisa menimbulkan kepanikan massal dan merusak tatanan sosial masyarakat."},{"kind":"text","text":"Mengapa masalah sosial dalam ilustrasi tersebut merupakan dampak dari globalisasi?"}],"explanation":"Teknologi komunikasi global memungkinkan informasi beredar sangat cepat dan menjangkau banyak orang tanpa dibatasi wilayah. Sifat ini juga berlaku bagi informasi palsu, sehingga hoaks dapat menyebar secara cepat dan masif serta menimbulkan kepanikan sosial.","sourceId":"D2025-27","category":"TKA Sosiologi 2025","options":[{"key":"A","text":"Globalisasi memungkinkan penyebaran informasi, termasuk hoaks, secara cepat dan masif melintasi batas geografis."},{"key":"B","text":"Globalisasi menyebabkan homogenitas budaya sehingga masyarakat lebih mudah percaya pada satu jenis informasi."},{"key":"C","text":"Globalisasi memfasilitasi peningkatan interaksi dan relasi sosial secara tatap muka yang intens antarwarga."},{"key":"D","text":"Globalisasi menekankan pentingnya peran lembaga formal dalam mengontrol setiap bentuk komunikasi masyarakat."},{"key":"E","text":"Globalisasi mendorong kembalinya nilai-nilai tradisional dan kearifan lokal yang mampu menyaring informasi."}],"answer":"A"},{"n":11,"type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Sebuah pasar dihuni pedagang dari berbagai suku dan daerah. Para pedagang menjual makanan, kain, dan kerajinan khas komunitasnya. Ketika menetapkan aturan kebersihan dan keamanan, pengelola hanya berkonsultasi dengan kelompok pedagang terbesar. Pedagang lain merasa kebutuhannya tidak dipertimbangkan dan mulai menolak aturan tersebut."},{"kind":"text","text":"Pernyataan yang tepat berdasarkan stimulus adalah ...."}],"explanation":"Keragaman tidak otomatis menghasilkan kesetaraan. Dominasi kelompok besar dan tidak dilibatkannya kelompok lain dapat melemahkan konsensus serta memicu penolakan.","sourceId":"B2-BS2-03-09","category":"Masyarakat Multikultural","options":[{"key":"A","text":"dominasi kelompok terbesar dapat menimbulkan ketidaksetaraan partisipasi"},{"key":"B","text":"keberagaman otomatis menjamin semua kelompok memperoleh pengaruh setara"},{"key":"C","text":"pasar menunjukkan keragaman budaya melalui barang yang diperdagangkan"},{"key":"D","text":"penolakan aturan menunjukkan lemahnya konsensus dalam masyarakat majemuk"}],"answer":["A","C","D"]},{"n":12,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Sebuah kawasan yang dahulu dihuni keluarga berpenghasilan rendah berkembang menjadi pusat kuliner dan wisata. Harga tanah serta biaya sewa meningkat tajam. Sebagian pemilik rumah memperoleh keuntungan dari kenaikan harga properti, tetapi banyak keluarga penyewa harus pindah ke wilayah yang lebih jauh. Warga lama juga mengeluhkan berkurangnya interaksi karena tetangga yang telah tinggal bersama selama bertahun-tahun tersebar ke berbagai tempat."},{"kind":"text","text":"Dampak sosial yang paling kuat dari kondisi tersebut adalah ...."}],"explanation":"Kenaikan harga kawasan dapat mendorong kelompok berpenghasilan rendah keluar dari lingkungan lama. Dampaknya adalah perubahan komposisi penduduk dan melemahnya jaringan sosial yang sebelumnya terbentuk.","sourceId":"B1-SOS-18-01","category":"Kesetaraan dan Ketimpangan Sosial","options":[{"key":"A","text":"berkurangnya mobilitas penduduk karena biaya tempat tinggal semakin mudah dijangkau masyarakat"},{"key":"B","text":"menguatnya solidaritas warga karena seluruh keluarga memperoleh manfaat ekonomi yang sama besar"},{"key":"C","text":"melemahnya ikatan sosial akibat tersingkirnya sebagian warga dari lingkungan tempat tinggalnya"},{"key":"D","text":"meningkatnya pemerataan kepemilikan rumah bagi seluruh kelompok masyarakat di kawasan tersebut"},{"key":"E","text":"hilangnya seluruh kegiatan ekonomi masyarakat setelah kawasan berkembang menjadi tujuan wisata"}],"answer":"C"},{"n":13,"type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Sebuah organisasi menyiarkan kegiatan lingkungan melalui media sosial. Pembawa acara menjelaskan tujuan penanaman pohon kepada penonton. Sebagian penonton memberikan pertanyaan melalui kolom komentar, kemudian pembawa acara menjawabnya. Penonton lain hanya membuka tayangan beberapa detik tanpa memperhatikan isi pembicaraan."},{"kind":"text","text":"Pernyataan yang menunjukkan berlangsungnya interaksi sosial adalah ...."}],"explanation":"Interaksi terjadi ketika terdapat penyampaian pesan, penerimaan, dan respons. Penonton yang hanya membuka tayangan tanpa memperhatikan pesan belum menunjukkan komunikasi yang bermakna.","sourceId":"B3-SOS-B-02-02","category":"Interaksi Sosial","options":[{"key":"A","text":"pembawa acara menanggapi pertanyaan yang dikirimkan penonton"},{"key":"B","text":"pengguna membuka tayangan tanpa memperhatikan atau memahami isinya"},{"key":"C","text":"pembawa acara menyampaikan pesan melalui media sosial"},{"key":"D","text":"penonton mengajukan pertanyaan yang berkaitan dengan kegiatan"}],"answer":["A","C","D"]},{"n":14,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Pandemi COVID-19 yang melanda dunia sejak awal tahun 2020 telah membawa perubahan dalam berbagai aspek kehidupan, termasuk cara kita berinteraksi dan menjaga hubungan sosial. Kebijakan jaga jarak atau physical distancing menjadi norma baru yang wajib dipatuhi, sementara aktivitas tatap muka, termasuk pembelajaran, beralih secara drastis menjadi daring."},{"kind":"text","text":"Apa yang memungkinkan interaksi sosial tetap terjadi pada masa pandemi meskipun terdapat pembatasan tatap muka secara langsung?"}],"explanation":"Interaksi sosial mensyaratkan adanya kontak sosial dan komunikasi. Ketika pertemuan langsung dibatasi, komunikasi tetap berlangsung melalui media daring sehingga hubungan sosial masih dapat terjadi walaupun tanpa tatap muka.","sourceId":"D2025-02","category":"TKA Sosiologi 2025","options":[{"key":"A","text":"Lingkungan sekitar menyediakan jaringan internet."},{"key":"B","text":"Siswa dan guru menggunakan handphone."},{"key":"C","text":"Semua pihak mengikuti aturan dengan taat."},{"key":"D","text":"Individu memahami teknologi informasi."},{"key":"E","text":"Komunikasi tetap terjalin melalui media daring."}],"answer":"E"},{"n":15,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Sebuah kawasan kuliner dahulu didominasi makanan tradisional. Dalam beberapa tahun terakhir, banyak kedai mulai menjual makanan yang terinspirasi dari Korea, Jepang, dan negara Barat. Menariknya, beberapa pelaku usaha menggabungkan cita rasa tersebut dengan bahan lokal. Muncul menu seperti mi pedas dengan sambal tradisional dan kue lokal dengan gaya penyajian modern."},{"kind":"text","text":"Pengaruh globalisasi yang paling tepat pada kasus tersebut adalah ...."}],"explanation":"Kasus menunjukkan hibridisasi budaya, yaitu unsur budaya global diterima tetapi kemudian dipadukan dengan budaya lokal. Globalisasi tidak selalu menghilangkan budaya lokal.","sourceId":"B1-SOS-23-01","category":"Globalisasi","options":[{"key":"A","text":"terjadinya perpaduan unsur budaya global dengan budaya lokal dalam kehidupan masyarakat"},{"key":"B","text":"terjadinya penghapusan makanan tradisional karena masyarakat wajib mengikuti budaya asing"},{"key":"C","text":"terjadinya isolasi budaya karena masyarakat semakin jarang mengetahui perkembangan luar negeri"},{"key":"D","text":"terjadinya keseragaman budaya karena semua daerah menghasilkan makanan dengan bentuk identik"},{"key":"E","text":"terjadinya penolakan masyarakat terhadap seluruh unsur budaya yang berasal dari luar"}],"answer":"A"},{"n":16,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Globalisasi mendorong pertumbuhan ekonomi di negara-negara berkembang terutama di sektor industri dan jasa. Namun, pembangunan seringkali tidak merata dan terpusat di kota-kota besar. Padahal, akses terhadap pendidikan dan teknologi sebelumnya memang sudah banyak terpusat di wilayah kota. Meskipun hal ini tampak menguntungkan, perusahaan multinasional yang masuk ke negara berkembang sebenarnya diuntungkan karena bisa membayar upah rendah kepada pekerja lokal. Sebagian bahkan tidak memberikan hak-hak yang adil seperti pekerja dari negara asal mereka. Sayangnya, hal ini sering dianggap lazim demi mendorong perekonomian negara dan menyerap tenaga kerja tinggi."},{"kind":"text","text":"Mengapa globalisasi pada kasus tersebut dapat menimbulkan kesenjangan sosial?"}],"explanation":"Globalisasi dapat memperlebar kesenjangan apabila manfaat pembangunan terkonsentrasi di wilayah tertentu dan perlindungan terhadap pekerja tidak memadai. Dari opsi yang tersedia, C paling mendekati masalah struktural tersebut karena menekankan pentingnya perencanaan dan peran pemerintah agar pembangunan, hak pekerja, serta akses ekonomi tidak timpang.","sourceId":"D2025-23","category":"TKA Sosiologi 2025","options":[{"key":"A","text":"Kesenjangan sosial pada kasus terjadi karena tidak adanya kesadaran dari pekerja untuk memperjuangkan keadilan sosial."},{"key":"B","text":"Kesenjangan sosial pada kasus muncul karena pertumbuhan ekonomi Indonesia yang lambat dibandingkan negara lain."},{"key":"C","text":"Kesenjangan sosial pada kasus terjadi karena adanya alienasi/keterasingan pekerja dari produk yang dihasilkannya."},{"key":"D","text":"Kesenjangan sosial pada kasus terjadi karena kurangnya perencanaan dan peran pemerintah dalam pembangunan ekonomi."},{"key":"E","text":"Kesenjangan sosial pada kasus terjadi karena industrialisasi merupakan perubahan sosial dampaknya tidak bisa diprediksi."}],"answer":"D"},{"n":17,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Sebuah pusat perbelanjaan menjual berbagai produk makanan impor yang sedang populer di media sosial. Produk lokal dengan fungsi serupa juga tersedia dan memiliki kualitas baik. Sebagian remaja beranggapan bahwa produk impor selalu lebih bergengsi sehingga tidak mau mencoba produk lokal."},{"kind":"text","text":"Sikap kritis yang paling tepat adalah ...."}],"explanation":"Sikap kritis ditunjukkan dengan penilaian objektif, bukan berdasarkan gengsi, asal negara, atau popularitas. B. Pilihan Ganda Kompleks MCMA Petunjuk: Pilih semua jawaban yang benar.","sourceId":"B2-BS2-28-04","category":"Kearifan Lokal","options":[{"key":"A","text":"memilih produk berdasarkan kualitas, kebutuhan, harga, serta informasi yang dapat dipertanggungjawabkan"},{"key":"B","text":"memilih produk yang paling viral tanpa perlu membandingkan kualitas dan manfaatnya"},{"key":"C","text":"hanya menggunakan produk lokal meskipun kualitas dan keamanannya tidak dapat dipastikan"},{"key":"D","text":"mengikuti pilihan influencer karena mereka dianggap lebih mengetahui seluruh produk"},{"key":"E","text":"selalu memilih produk impor karena produk tersebut berasal dari negara yang lebih maju"}],"answer":"A"},{"n":18,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"[Ilustrasi visual: aksi protes menolak tambang]"},{"kind":"text","text":"Di Desa Tanjung Harapan, sebuah perusahaan tambang mulai beroperasi setelah mendapatkan izin dari pemerintah daerah. Perusahaan tersebut membuka lahan secara besar-besaran, termasuk wilayah hutan adat yang selama ini dikelola secara turun-temurun oleh masyarakat lokal. Masyarakat adat menolak keberadaan tambang karena merasa tidak dilibatkan dalam proses perizinan dan khawatir kehilangan sumber penghidupan. Dalam beberapa bulan terakhir, terjadi aksi protes yang berujung pada bentrokan antara warga dan aparat keamanan."},{"kind":"text","text":"Berdasarkan ilustrasi tersebut, apa penyebab utama terjadinya konflik sosial di Desa Tanjung Harapan?"}],"explanation":"Akar konflik adalah benturan kepentingan antara kegiatan pertambangan dan hak masyarakat adat atas lahan yang telah dikelola turun-temurun. Minimnya komunikasi dan partisipasi memperburuk konflik, tetapi pokok pertentangan dalam stimulus adalah klaim dan kepentingan yang saling bertabrakan atas lahan tersebut.","sourceId":"D2025-16","category":"TKA Sosiologi 2025","options":[{"key":"A","text":"Kurangnya komunikasi dan partisipasi masyarakat dalam proses pengambilan keputusan."},{"key":"B","text":"Perusahaan tidak memberikan pelatihan kerja kepada masyarakat sekitar."},{"key":"C","text":"Pemerintah daerah tidak mampu mengelola hasil tambang dengan baik."},{"key":"D","text":"Masyarakat adat tidak memiliki pengetahuan tentang kegiatan pertambangan modern."},{"key":"E","text":"Terjadi benturan kepentingan antara perusahaan dan hak masyarakat adat atas lahan."}],"answer":"E"},{"n":19,"type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Desa Lestari berkembang menjadi tujuan wisata. Peneliti ingin mengetahui perubahan pendapatan warga, kesempatan kerja, hubungan sosial, dan pelaksanaan tradisi lokal. Tahap pertama dilakukan melalui survei terhadap 300 keluarga. Setelah hasil survei diperoleh, peneliti mewawancarai warga dari kelompok yang mengalami manfaat dan kerugian berbeda."},{"kind":"text","text":"Unsur rancangan penelitian yang sesuai adalah ...."}],"explanation":"Penelitian menggabungkan survei kuantitatif dan wawancara kualitatif. Urutannya menunjukkan desain campuran eksplanatori berurutan, yaitu data kuantitatif dikumpulkan terlebih dahulu, kemudian diperdalam melalui wawancara. Informan kualitatif dapat dipilih berdasarkan pola hasil survei.","sourceId":"B3-SOS-B-12-02","category":"Penelitian Sosial","options":[{"key":"A","text":"mengabaikan perbedaan pengalaman warga karena hasil survei sudah mewakili seluruh keadaan"},{"key":"B","text":"menggunakan metode campuran karena data angka dan pengalaman warga sama-sama dikaji"},{"key":"C","text":"memilih informan wawancara berdasarkan temuan yang muncul pada tahap kuantitatif"},{"key":"D","text":"memakai desain berurutan karena wawancara dilakukan setelah hasil survei diperoleh"}],"answer":["B","C","D"]},{"n":20,"type":"tf","typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Penghuni rumah susun berasal dari berbagai daerah dan belum saling mengenal. Masalah kebersihan dan keamanan membuat mereka mengadakan pertemuan. Penghuni lalu memilih pengurus, menyusun aturan penggunaan fasilitas, dan menetapkan iuran lingkungan."},{"kind":"text","text":"Petunjuk: Tentukan kategori Tepat atau Tidak Tepat untuk setiap pernyataan."}],"explanation":"Permasalahan bersama mendorong penghuni berinteraksi dan membentuk organisasi. Struktur terlihat melalui pengurus dan aturan. Perbedaan daerah tidak menghalangi pembentukan kelompok selama terdapat kepentingan bersama.","sourceId":"B3-SOS-B-05-03","category":"Kelompok Sosial","statements":["Masalah bersama menjadi pendorong terbentuknya organisasi penghuni.","Perbedaan asal daerah membuat kelompok sosial tidak mungkin terbentuk.","Pemilihan pengurus menunjukkan terbentuknya struktur dalam kelompok."],"answer":["B","S","B"],"categories":["Tepat","Tidak Tepat"]},{"n":21,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Dahulu, masyarakat desa hidup rukun dan saling membantu melalui kegiatan gotong royong, seperti membersihkan lingkungan bersama-sama. Namun, belakangan ini kegiatan tersebut mulai ditinggalkan. Banyak warga lebih memilih menyewa jasa kebersihan karena kesibukan pekerjaan masing-masing. Perubahan ini menimbulkan kekhawatiran di kalangan tokoh masyarakat karena dinilai dapat mengikis nilai kebersamaan yang menjadi ciri khas desa."},{"kind":"text","text":"Apa makna perubahan perilaku masyarakat desa jika ditinjau dari sudut pandang sosiologi?"}],"explanation":"Perubahan dari gotong royong menuju penggunaan jasa kebersihan menunjukkan perubahan nilai sosial yang memengaruhi pola hubungan antarwarga. Fokus sosiologi bukan semata-mata kenaikan pendapatan atau tren modern, melainkan perubahan nilai kebersamaan dan dampaknya terhadap interaksi sosial.","sourceId":"D2025-01","category":"TKA Sosiologi 2025","options":[{"key":"A","text":"Perubahan nilai sosial yang memengaruhi interaksi antarwarga."},{"key":"B","text":"Kecenderungan masyarakat dalam menyesuaikan diri dengan tren modern."},{"key":"C","text":"Perubahan gaya hidup karena meningkatnya pendapatan masyarakat desa."},{"key":"D","text":"Pergeseran sistem ekonomi dari komunal menuju individualisme."},{"key":"E","text":"Penurunan semangat kerja kolektif karena pengaruh globalisasi."}],"answer":"A"},{"n":22,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Dua rumah makan berada pada kawasan yang sama. Keduanya menjual makanan sejenis dan berusaha menarik pelanggan dengan meningkatkan kebersihan, memperbaiki pelayanan, serta menawarkan menu baru. Pemilik kedua usaha tetap menaati aturan dan tidak menyebarkan informasi buruk mengenai pesaingnya."},{"kind":"text","text":"Bentuk hubungan sosial yang ditunjukkan dalam kasus tersebut adalah ...."}],"explanation":"Kedua rumah makan berusaha memperoleh pelanggan dengan meningkatkan kualitas tanpa menggunakan ancaman atau kekerasan. Hubungan tersebut termasuk persaingan yang bersifat disosiatif.","sourceId":"B3-SOS-B-04-01","category":"Proses Sosial","options":[{"key":"A","text":"asimilasi karena kedua usaha melebur dan membentuk kebudayaan yang baru"},{"key":"B","text":"kontravensi karena kedua usaha menyembunyikan kebencian secara terbuka"},{"key":"C","text":"persaingan karena kedua usaha berupaya memperoleh pelanggan secara wajar"},{"key":"D","text":"konflik karena kedua usaha menggunakan kekerasan untuk menguasai pasar"},{"key":"E","text":"akomodasi karena kedua usaha menghentikan perbedaan melalui perundingan"}],"answer":"C"},{"n":23,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Seorang peserta didik sering diejek karena bentuk tubuh dan cara bicaranya. Ejekan kemudian berlanjut melalui grup pesan kelas. Beberapa teman membagikan foto korban tanpa izin dan menambahkan komentar yang merendahkan. Korban mulai menghindari pergaulan, tidak aktif dalam pembelajaran, dan sering meminta izin tidak masuk sekolah. Peserta didik lain merasa takut menjadi sasaran apabila membela korban."},{"kind":"text","text":"Evaluasi yang paling tepat terhadap dampak perundungan tersebut adalah ...."}],"explanation":"Perundungan dapat menimbulkan kecemasan, penurunan kepercayaan diri, ketidakhadiran, dan penurunan prestasi. Dampaknya juga dirasakan lingkungan sekolah karena peserta didik lain menjadi takut serta menganggap perilaku merendahkan sebagai hal biasa.","sourceId":"B1-SOS-06-01","category":"Permasalahan Sosial","options":[{"key":"A","text":"perundungan menunjukkan bahwa korban belum mampu menyesuaikan diri dengan kebiasaan teman sekelas"},{"key":"B","text":"perundungan hanya menimbulkan rasa tidak nyaman tanpa memengaruhi proses pendidikan di sekolah"},{"key":"C","text":"perundungan mengganggu kondisi psikologis korban serta melemahkan rasa aman di lingkungan sekolah"},{"key":"D","text":"perundungan dapat dihentikan dengan memindahkan korban tanpa mengubah perilaku kelompok pelaku"},{"key":"E","text":"perundungan memperkuat solidaritas karena peserta didik membentuk kelompok pertemanan yang lebih dekat"}],"answer":"C"},{"n":24,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Di sebuah desa yang sedang berkembang, hidup dua kelompok masyarakat dengan latar belakang budaya dan kebiasaan yang berbeda, yaitu satu kelompok berasal dari penduduk asli desa dan kelompok lainnya berasal dari warga pendatang. Pada awalnya, hubungan antara kedua kelompok kerap diwarnai kesalahpahaman saat rapat desa, karena perbedaan cara pandang dan nilai-nilai budaya yang dianut. Kondisi ini menimbulkan ketegangan sosial yang menghambat pembangunan desa. Melihat hal ini, tokoh masyarakat menginisiasi kegiatan bersama seperti gotong royong, pelatihan kewirausahaan, dan dialog antarbudaya. Melalui proses ini, kedua kelompok mulai saling memahami, menghargai perbedaan, dan bekerja sama dalam pembangunan desa. Mereka juga sepakat untuk tetap mempertahankan budaya masing-masing, sambil merancang kegiatan budaya bersama yang melibatkan semua warga tanpa membedakan asal-usul."},{"kind":"text","text":"Berdasarkan ilustrasi tersebut, bentuk hubungan sosial apakah yang akhirnya terwujud di antara kedua kelompok masyarakat di atas?"}],"explanation":"Akomodasi adalah proses meredakan pertentangan atau ketegangan agar kelompok yang berbeda dapat hidup dan bekerja sama. Dalam kasus ini kedua kelompok melakukan dialog, kegiatan bersama, dan kesepakatan tanpa harus menghapus identitas budaya masing-masing.","sourceId":"D2025-04","category":"TKA Sosiologi 2025","options":[{"key":"A","text":"Koersi, karena kedua kelompok menyelesaikan konflik dengan dominasi kelompok yang lebih kuat."},{"key":"B","text":"Asimilasi, karena kedua kelompok membentuk budaya baru dengan menghilangkan perbedaan."},{"key":"C","text":"Persaingan, karena masing-masing kelompok tetap mempertahankan identitas budaya secara tertutup."},{"key":"D","text":"Akomodasi, karena terdapat upaya meredakan ketegangan dengan kesepakatan bersama dan saling membantu."},{"key":"E","text":"Kontravensi, karena terjadi perbedaan pandangan meskipun belum sampai pada konflik terbuka."}],"answer":"D"},{"n":25,"type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Di Desa Kencana semakin banyak perempuan memperoleh pendidikan tinggi dan bekerja di sektor profesional. Pendapatan keluarga tidak lagi hanya bersumber dari suami. Pembagian pekerjaan rumah tangga mulai didiskusikan antara pasangan, dan perempuan semakin sering terlibat dalam pengambilan keputusan keluarga maupun kegiatan masyarakat."},{"kind":"text","text":"Dampak perubahan sosial yang sesuai adalah ...."}],"explanation":"Perubahan pendidikan dan pekerjaan perempuan memengaruhi pembagian peran, relasi gender, dan partisipasi sosial. Namun, tidak berarti seluruh fungsi keluarga hilang. C. Pilihan Ganda Kompleks Kategori","sourceId":"B2-BS2-26-09","category":"Perubahan Sosial","options":[{"key":"A","text":"perubahan peran perempuan menyebabkan seluruh fungsi keluarga tradisional menghilang"},{"key":"B","text":"meningkatnya partisipasi perempuan dalam kegiatan ekonomi dan kehidupan publik"},{"key":"C","text":"meningkatnya posisi perempuan dalam proses pengambilan keputusan di masyarakat"},{"key":"D","text":"berubahnya pembagian peran dalam keluarga menjadi lebih terbuka untuk dinegosiasikan"}],"answer":["B","C","D"]},{"n":26,"type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Dua perusahaan pengiriman bersaing memperoleh pelanggan dengan menawarkan waktu pengiriman lebih cepat dan sistem pelacakan yang lebih baik. Ketika terjadi bencana, keduanya sepakat menggunakan gudang bersama untuk menyalurkan bantuan. Setelah keadaan pulih, mereka kembali menjalankan usahanya masing-masing."},{"kind":"text","text":"Pernyataan yang tepat adalah ...."}],"explanation":"Hubungan sosial bersifat dinamis. Kedua perusahaan bersaing dalam kegiatan bisnis, tetapi bekerja sama ketika menghadapi kebutuhan kemanusiaan. Kerja sama sementara tidak menghapus persaingan usaha.","sourceId":"B2-BS2-04-09","category":"Proses Sosial","options":[{"key":"A","text":"penggunaan gudang bersama menunjukkan kerja sama dalam keadaan tertentu"},{"key":"B","text":"kerja sama sementara menghapus seluruh persaingan antara kedua perusahaan"},{"key":"C","text":"hubungan sosial dapat berubah sesuai situasi dan tujuan yang dihadapi"},{"key":"D","text":"peningkatan layanan menunjukkan bentuk persaingan antarpelaku usaha"}],"answer":["A","C","D"]},{"n":27,"type":"tf","typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Seorang petugas perpustakaan membantu pengunjung penyandang hambatan pendengaran. Pengunjung menggunakan bahasa isyarat untuk menanyakan lokasi buku. Petugas memahami beberapa isyarat, menunjukkan rak yang dimaksud, lalu pengunjung mengangguk sebagai tanda memahami petunjuk tersebut."}],"explanation":"Komunikasi dapat menggunakan bahasa lisan, tulisan, gerakan, simbol, atau isyarat. Hal terpenting ialah pesan diterima, dipahami, dan memperoleh tanggapan.","sourceId":"B1-SOS-02-03","category":"Interaksi Sosial","statements":["Komunikasi tidak terjadi karena kedua pihak tidak menggunakan bahasa lisan.","Bahasa isyarat dapat berfungsi sebagai sarana komunikasi sosial.","Anggukan pengunjung merupakan respons terhadap petunjuk petugas."],"answer":["S","B","B"],"categories":["Tepat","Tidak Tepat"]},{"n":28,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Sebuah sekolah ingin mengetahui efektivitas program pendampingan terhadap kehadiran peserta didik yang sering absen. Dua kelas dengan karakteristik relatif sama dipilih. Kelas pertama mengikuti pendampingan selama delapan minggu, sedangkan kelas kedua menjalani kegiatan sekolah seperti biasa. Kehadiran kedua kelas dicatat sebelum dan setelah program."},{"kind":"text","text":"Rancangan penelitian yang paling sesuai adalah ...."}],"explanation":"Terdapat kelompok yang menerima program, kelompok pembanding, serta pengukuran sebelum dan sesudah perlakuan. Karena kelompok kemungkinan tidak dibentuk melalui pengacakan individual, rancangan yang tepat adalah eksperimen semu dengan pola prates–pascates dan kelompok pembanding.","sourceId":"B3-SOS-B-12-01","category":"Penelitian Sosial","options":[{"key":"A","text":"etnografi sekolah dengan mengamati kebiasaan peserta didik tanpa pemberian program"},{"key":"B","text":"penelitian historis dengan membandingkan arsip kehadiran selama sepuluh tahun terakhir"},{"key":"C","text":"studi kasus kualitatif dengan mewawancarai satu peserta didik yang sering tidak hadir"},{"key":"D","text":"eksperimen semu dengan kelompok perlakuan, kelompok pembanding, dan pengukuran berulang"},{"key":"E","text":"survei deskriptif dengan menyebarkan angket satu kali kepada seluruh peserta didik"}],"answer":"D"},{"n":29,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Menjelang pemilihan kepala daerah, pendukung dua calon saling menyebarkan tuduhan melalui media sosial. Perdebatan semakin keras setelah masing-masing kelompok mengadakan demonstrasi untuk mendukung calonnya. Bentrokan terjadi ketika kedua kelompok bertemu di depan kantor penyelenggara pemilihan."},{"kind":"text","text":"Bentuk konflik yang paling tepat adalah ...."}],"explanation":"Konflik berkaitan dengan persaingan memperoleh dan mempertahankan kekuasaan melalui pemilihan kepala daerah. Oleh sebab itu, kasus tersebut termasuk konflik politik.","sourceId":"B2-BS2-13-04","category":"Konflik Sosial","options":[{"key":"A","text":"konflik politik karena berkaitan dengan perebutan kekuasaan pemerintahan"},{"key":"B","text":"konflik agama karena setiap pendukung memiliki keyakinan yang berbeda"},{"key":"C","text":"konflik rasial karena kelompok dibedakan berdasarkan ciri keturunan"},{"key":"D","text":"konflik ekonomi karena berkaitan dengan pembagian sumber daya produksi"},{"key":"E","text":"konflik pribadi karena hanya melibatkan perbedaan karakter dua calon"}],"answer":"A"},{"n":30,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Pada suatu daerah terjadi ketegangan antara komunitas adat dengan perusahaan perkebunan sawit. Konflik ini bermulai dari klaim terhadap hak kepemilikan lahan. Perusahaan berpegang pada izin yang mereka miliki, sementara komunitas adat merasa terabaikan. Konflik ini mengakibatkan terjadinya bentrokan fisik dan pemblokiran jalan oleh warga yang mengakibatkan aktivitas distribusi hasil perkebunan sawit menjadi terhambat. Mediasi awal dalam rangka penyelesaian konflik yang terjadi sudah dilakukan tetapi gagal total dan bahkan memperparah ketegangan dan ketidakpercayaan antara kedua belah pihak (komunitas adat dan pihak perusahaan perkebunan sawit). Situasi yang terjadi ini berada pada titik kritis dan memerlukan intervensi yang lebih kuat."},{"kind":"text","text":"Bagaimana strategi yang tepat untuk mencapai kedamaian yang berkelanjutan antara komunitas adat dan perusahaan perkebunan?"}],"explanation":"Mediasi telah gagal dan situasi sudah berada pada titik kritis, sehingga dibutuhkan intervensi pihak ketiga yang lebih kuat. Arbitrase melibatkan pihak ketiga yang independen dan menghasilkan keputusan yang mengikat, sehingga merupakan pilihan yang paling sesuai di antara opsi yang tersedia.","sourceId":"D2025-15","category":"TKA Sosiologi 2025","options":[{"key":"A","text":"Mengembangkan program kemitraan usaha bersama antara kedua belah pihak dengan sistem pembagian keuntungan yang dibagi secara adil."},{"key":"B","text":"Melakukan dialog multi-pihak yang melibatkan pemerintah, akademisi, dan organisasi non pemerintah untuk membangun pemahaman bersama."},{"key":"C","text":"Memulai kembali negosiasi antara manajemen perusahaan dan perwakilan komunitas adat tanpa melibatkan campur tangan pihak ketiga yang netral."},{"key":"D","text":"Melakukan arbitrase dengan menunjuk pihak ketiga yang independen dan memiliki kewenangan untuk membuat keputusan mengikat secara hukum."},{"key":"E","text":"Membentuk forum musyawarah desa yang difasilitasi oleh tokoh masyarakat setempat untuk mencari solusi terbaik yang berbasis kearifan lokal."}],"answer":"D"}]},{"id":2,"title":"Paket 2","questions":[{"n":1,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Pemerintah Kota Madani membuka program beasiswa bagi pelajar SMA yang berasal dari keluarga kurang mampu. Program ini tidak hanya berdasarkan nilai akademik, tetapi juga mempertimbangkan latar belakang ekonomi dan akses pendidikan siswa. Selain itu, fasilitas transportasi gratis diberikan khusus bagi siswa dari daerah terpencil untuk memudahkan mereka bersekolah."},{"kind":"text","text":"Berdasarkan ilustrasi di atas, bagaimana prinsip kesetaraan sosial diterapkan dalam pelayanan publik?"}],"explanation":"Beasiswa untuk siswa kurang mampu dan transportasi gratis bagi siswa dari daerah terpencil bertujuan mengurangi hambatan yang berbeda-beda agar semua siswa memiliki peluang untuk berkembang. Ini merupakan penerapan kesetaraan kesempatan, bukan perlakuan identik tanpa mempertimbangkan kondisi awal.","sourceId":"D2025-21","category":"TKA Sosiologi 2025","options":[{"key":"A","text":"Kesetaraan politik, karena semua siswa mendapat hak suara dalam menentukan program."},{"key":"B","text":"Kesetaraan hukum, karena semua siswa diperlakukan sama tanpa melihat latar belakang."},{"key":"C","text":"Kesetaraan ekonomi, karena pemerintah memberikan bantuan kepada semua warga."},{"key":"D","text":"Kesetaraan kesempatan, karena siswa diberi peluang yang setara untuk maju."},{"key":"E","text":"Kesetaraan budaya, karena pemerintah menghormati adat dan kebiasaan lokal."}],"answer":"D"},{"n":2,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Peneliti ingin memahami pengalaman peserta didik yang pernah menjadi korban perundungan siber. Ia memilih delapan informan yang bersedia menceritakan pengalaman secara mendalam. Wawancara dilakukan beberapa kali untuk menggali perasaan, perubahan perilaku, dukungan yang diterima, serta cara korban memaknai peristiwa tersebut. Hasil wawancara kemudian dikelompokkan ke dalam tema-tema pengalaman."},{"kind":"text","text":"Metode yang paling tepat digunakan dalam penelitian tersebut adalah ...."}],"explanation":"Fenomenologi digunakan untuk memahami pengalaman hidup dan pemaknaan subjektif individu terhadap suatu peristiwa. Wawancara mendalam dan analisis tema sesuai dengan karakteristik metode tersebut.","sourceId":"B1-SOS-09-01","category":"Penelitian Sosial","options":[{"key":"A","text":"penelitian korelasional untuk menghitung hubungan dua variabel dalam bentuk angka"},{"key":"B","text":"penelitian fenomenologi untuk memahami pengalaman subjektif para korban"},{"key":"C","text":"penelitian historis untuk mengetahui perkembangan perundungan dari waktu ke waktu"},{"key":"D","text":"penelitian survei untuk memperoleh persentase korban di seluruh sekolah"},{"key":"E","text":"penelitian eksperimen untuk membandingkan perilaku sebelum dan sesudah perlakuan"}],"answer":"B"},{"n":3,"type":"tf","typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Sejumlah orang berdiri di halte untuk menunggu bus. Mereka tidak saling berbicara dan sibuk dengan telepon masing-masing. Ketika bus datang, seorang penumpang mengingatkan bahwa lansia sebaiknya naik terlebih dahulu. Penumpang lain memahami pesan tersebut, memberi jalan, dan membantu lansia masuk ke dalam bus."},{"kind":"text","text":"Tentukan kategori setiap pernyataan berdasarkan stimulus."}],"explanation":"Berada di tempat yang sama belum otomatis membentuk interaksi. Interaksi muncul ketika terdapat tindakan yang ditujukan kepada pihak lain, pesan yang dipahami, dan respons. Saling mengenal bukan syarat mutlak interaksi sosial.","sourceId":"B3-SOS-B-02-03","category":"Interaksi Sosial","statements":["Imbauan dan respons penumpang menunjukkan adanya kontak serta komunikasi.","Keberadaan orang-orang di halte saja belum tentu membentuk interaksi sosial.","Interaksi hanya dapat terjadi jika semua orang di halte sudah saling mengenal."],"answer":["B","B","S"],"categories":["Tepat","Tidak Tepat"]},{"n":4,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Sekelompok siswa sering berkumpul setelah sekolah karena memiliki kegemaran fotografi. Mereka tidak memiliki struktur pengurus resmi, aturan tertulis, ataupun pembagian jabatan. Anggota bebas mengikuti kegiatan memotret bersama sesuai waktu yang disepakati melalui grup percakapan. Keanggotaan terbentuk karena kesamaan minat dan kedekatan antaranggota."},{"kind":"text","text":"Kelompok tersebut paling tepat dikategorikan sebagai ...."}],"explanation":"Kelompok terbentuk atas kesamaan minat tanpa struktur dan aturan resmi sehingga termasuk kelompok informal.","sourceId":"B3-SOS-B-20-01","category":"Kelompok Sosial","options":[{"key":"A","text":"kelompok referensi karena seluruh siswa ingin meniru anggota kelompok"},{"key":"B","text":"kelompok sekunder karena seluruh hubungan anggotanya bersifat sementara"},{"key":"C","text":"kelompok okupasional karena setiap anggota memperoleh penghasilan tetap"},{"key":"D","text":"kelompok formal karena memiliki kegiatan yang dilaksanakan secara teratur"},{"key":"E","text":"kelompok informal karena terbentuk spontan atas dasar kesamaan minat"}],"answer":"E"},{"n":5,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Dua kelompok petani berselisih mengenai batas penggunaan lahan irigasi. Setelah beberapa kali terjadi ketegangan, kepala desa mempertemukan kedua pihak. Mereka memeriksa dokumen, mendengarkan penjelasan masing-masing, lalu menyepakati pembagian waktu penggunaan air. Kesepakatan tersebut diterima untuk mencegah perselisihan berulang."},{"kind":"text","text":"Bentuk hubungan sosial yang terjadi pada akhir kasus adalah ...."}],"explanation":"Akomodasi merupakan proses meredakan atau menyelesaikan pertentangan agar tercapai kestabilan. Musyawarah dan pembagian waktu penggunaan air menunjukkan bentuk akomodasi.","sourceId":"B1-SOS-04-01","category":"Proses Sosial","options":[{"key":"A","text":"asimilasi karena identitas kelompok petani tidak lagi dapat dibedakan"},{"key":"B","text":"akulturasi karena kedua pihak menerima unsur kebudayaan dari luar"},{"key":"C","text":"kontravensi karena penolakan masih disembunyikan oleh kedua kelompok"},{"key":"D","text":"akomodasi karena pertentangan diselesaikan melalui kesepakatan bersama"},{"key":"E","text":"persaingan karena kedua pihak tetap berusaha memperoleh air terbanyak"}],"answer":"D"},{"n":6,"type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Desa Harmoni dihuni penduduk asli, warga pendatang, dan kelompok etnis minoritas. Dalam musyawarah pembangunan, tokoh penduduk asli lebih sering menentukan keputusan. Warga pendatang dan kelompok minoritas hadir, tetapi usul mereka jarang dipertimbangkan. Akibatnya, pembangunan fasilitas lebih banyak diarahkan ke wilayah yang dihuni kelompok dominan."},{"kind":"text","text":"Penilaian yang paling tepat terhadap masyarakat tersebut adalah ...."}],"explanation":"Salah satu dinamika masyarakat multikultural adalah kemungkinan munculnya dominasi kelompok ter
