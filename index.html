tapi kelompok yang memiliki modal ekonomi, teknologi, dan bahasa lebih mudah memanfaatkannya. Ketimpangan akses dapat kemudian menghasilkan ketimpangan kesempatan pendidikan.","validation":"Lengkap dari sumber","reviewNotes":[]},{"id":"B1-SOS-22-03","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 22_Globalisasi(1).docx","n":13,"title":"Perdagangan Global","category":"Globalisasi","subcategory":"Peluang dan Ketimpangan Globalisasi","type":"category","typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Perdagangan bebas membuat produk dari berbagai negara masuk ke pasar domestik. Konsumen memperoleh pilihan lebih luas, tetapi usaha kecil menghadapi persaingan dengan perusahaan besar."},{"kind":"text","text":"Tentukan kategori setiap pernyataan berdasarkan stimulus."}],"options":[],"statements":["Konsumen dapat memperoleh lebih banyak pilihan barang.","Perbedaan kekuatan modal dapat memengaruhi kemampuan usaha bersaing.","Semua usaha kecil pasti berhenti beroperasi karena perdagangan global."],"categories":["Didukung","Tidak Didukung"],"answer":"1. Didukung Stimulus; 2. Didukung Stimulus; 3. Tidak Didukung Stimulus","explanation":"Stimulus menunjukkan adanya tekanan kompetisi, tetapi tidak menyatakan bahwa semua usaha kecil pasti gagal.","validation":"Lengkap dari sumber","reviewNotes":[]},{"id":"B1-SOS-23-01","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 23_Globalisasi.docx","n":3,"title":"Kuliner Lokal dan Tren Global","category":"Globalisasi","subcategory":"Pengaruh Globalisasi terhadap Kehidupan Sosial Budaya","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Sebuah kawasan kuliner dahulu didominasi makanan tradisional. Dalam beberapa tahun terakhir, banyak kedai mulai menjual makanan yang terinspirasi dari Korea, Jepang, dan negara Barat. Menariknya, beberapa pelaku usaha menggabungkan cita rasa tersebut dengan bahan lokal. Muncul menu seperti mi pedas dengan sambal tradisional dan kue lokal dengan gaya penyajian modern."},{"kind":"text","text":"Pengaruh globalisasi yang paling tepat pada kasus tersebut adalah ...."}],"options":[{"key":"A","text":"terjadinya penolakan masyarakat terhadap seluruh unsur budaya yang berasal dari luar"},{"key":"B","text":"terjadinya perpaduan unsur budaya global dengan budaya lokal dalam kehidupan masyarakat"},{"key":"C","text":"terjadinya penghapusan makanan tradisional karena masyarakat wajib mengikuti budaya asing"},{"key":"D","text":"terjadinya isolasi budaya karena masyarakat semakin jarang mengetahui perkembangan luar negeri"},{"key":"E","text":"terjadinya keseragaman budaya karena semua daerah menghasilkan makanan dengan bentuk identik"}],"statements":[],"categories":[],"answer":"B","explanation":"Kasus menunjukkan hibridisasi budaya, yaitu unsur budaya global diterima tetapi kemudian dipadukan dengan budaya lokal. Globalisasi tidak selalu menghilangkan budaya lokal.","validation":"Lengkap dari sumber","reviewNotes":[]},{"id":"B1-SOS-23-03","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 23_Globalisasi.docx","n":13,"title":"Perubahan Dunia Kerja","category":"Globalisasi","subcategory":"Pengaruh Globalisasi terhadap Kehidupan Sosial Budaya","type":"category","typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Perusahaan lokal mulai terhubung dengan jaringan bisnis internasional. Karyawan menghadapi perubahan dalam pola pekerjaan dan keterampilan yang dibutuhkan."},{"kind":"text","text":"Tentukan kategori setiap pernyataan berdasarkan stimulus."}],"options":[],"statements":["Rapat dengan mitra luar negeri dilakukan melalui platform konferensi video.","Karyawan mengikuti pelatihan bahasa asing untuk berkomunikasi dengan pelanggan.","Sebagian pekerja melaksanakan tugas dari rumah untuk perusahaan lintas negara."],"categories":["Pola Kerja","Kompetensi"],"answer":"1. Perubahan Pola Kerja; 2. Perubahan Kompetensi; 3. Perubahan Pola Kerja","explanation":"Globalisasi dapat mengubah baik cara pekerjaan dilaksanakan maupun kemampuan yang harus dimiliki pekerja.","validation":"Lengkap dari sumber","reviewNotes":[]},{"id":"B1-SOS-24-01","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 24_Globalisasi(1).docx","n":3,"title":"Produk Global dan Usaha Lokal","category":"Globalisasi","subcategory":"Permasalahan Sosial akibat Globalisasi","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Sebuah pusat perdagangan mulai dipenuhi produk pakaian impor dengan harga relatif murah dan model yang cepat berubah mengikuti tren internasional. Produsen pakaian rumahan di sekitar wilayah tersebut mengalami penurunan jumlah pembeli. Sebagian usaha kecil mengurangi tenaga kerja karena tidak mampu menekan biaya produksi seperti perusahaan besar."},{"kind":"text","text":"Masalah sosial akibat globalisasi yang paling tampak adalah ...."}],"options":[{"key":"A","text":"melemahnya daya saing usaha lokal yang dapat memicu kehilangan pekerjaan masyarakat"},{"key":"B","text":"meningkatnya pemerataan pendapatan karena produk asing dapat dibeli dengan harga rendah"},{"key":"C","text":"bertambahnya perlindungan tenaga kerja karena seluruh perusahaan memiliki keuntungan tinggi"},{"key":"D","text":"menurunnya persaingan perdagangan karena konsumen hanya membeli produk buatan dalam negeri"},{"key":"E","text":"meningkatnya kesempatan usaha kecil karena perusahaan global menghentikan pemasaran produknya"}],"statements":[],"categories":[],"answer":"A","explanation":"Arus perdagangan global meningkatkan kompetisi. Usaha kecil yang kurang kompetitif dapat kehilangan pasar dan mengurangi tenaga kerja. Dampak tersebut dapat berkembang menjadi pengangguran atau kerentanan ekonomi.","validation":"Lengkap dari sumber","reviewNotes":[]},{"id":"B1-SOS-24-02","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 24_Globalisasi(1).docx","n":8,"title":"Tren Global dan Tekanan Sosial Remaja","category":"Globalisasi","subcategory":"Permasalahan Sosial akibat Globalisasi","type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Media sosial memperlihatkan kehidupan selebritas, influencer, dan remaja dari berbagai negara. Sebagian siswa merasa harus memiliki pakaian bermerek, telepon terbaru, atau mengunjungi tempat populer agar diterima dalam kelompok pergaulan. Beberapa siswa yang tidak mampu mengikuti tren merasa rendah diri dan memilih menarik diri dari kelompok."},{"kind":"text","text":"Masalah sosial yang dapat diidentifikasi adalah ...."}],"options":[{"key":"A","text":"perilaku konsumtif karena pembelian didorong kebutuhan memperoleh pengakuan"},{"key":"B","text":"tekanan sosial akibat perbandingan gaya hidup melalui media digital"},{"key":"C","text":"eksklusi sosial terhadap individu yang tidak mampu mengikuti tren tertentu"},{"key":"D","text":"meningkatnya kesetaraan sosial karena semua remaja mengenal tren yang sama"}],"statements":[],"categories":[],"answer":"A, B, dan C","explanation":"Globalisasi media dapat memperkuat konsumtivisme, perbandingan sosial, dan eksklusi. Kesamaan akses terhadap tren tidak otomatis menciptakan kesetaraan.","validation":"Lengkap dari sumber","reviewNotes":[]},{"id":"B1-SOS-24-03","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 24_Globalisasi(1).docx","n":13,"title":"Dampak Budaya Global","category":"Globalisasi","subcategory":"Permasalahan Sosial akibat Globalisasi","type":"category","typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Siswa sebuah SMA semakin banyak terpapar budaya populer dari luar negeri melalui film, musik, media sosial, dan berbagai platform digital."},{"kind":"text","text":"Tentukan kategori setiap pernyataan berdasarkan stimulus."}],"options":[],"statements":["Siswa mempelajari seni negara lain sambil tetap mengembangkan seni daerah.","Siswa menganggap budaya lokal tidak bernilai dan berhenti mempelajarinya.","Musisi muda memadukan instrumen tradisional dengan genre musik internasional."],"categories":["Pengayaan","Masalah"],"answer":"1. Pengayaan Budaya; 2. Masalah Sosial-Budaya; 3. Pengayaan Budaya","explanation":"Kontak budaya tidak selalu menghasilkan masalah. Masalah muncul ketika budaya lokal ditinggalkan atau dipandang rendah, sedangkan perpaduan kreatif dapat menjadi pengayaan budaya.","validation":"Lengkap dari sumber","reviewNotes":[]},{"id":"B1-SOS-28-01","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 28_Globalisasi.docx","n":3,"title":"Aplikasi Digital dan Data Pribadi","category":"Globalisasi","subcategory":"Sikap Kritis terhadap Globalisasi","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Sebuah aplikasi populer menawarkan layanan gratis dan digunakan oleh jutaan pengguna dari berbagai negara. Ketika mendaftar, aplikasi meminta akses ke lokasi, daftar kontak, kamera, mikrofon, dan berbagai data pribadi. Banyak pengguna langsung menyetujui seluruh permintaan karena ingin segera menggunakan aplikasi."},{"kind":"text","text":"Tindakan yang paling mencerminkan sikap kritis adalah ...."}],"options":[{"key":"A","text":"menyetujui seluruh izin karena aplikasi populer pasti menjamin keamanan pengguna"},{"key":"B","text":"membaca kebijakan privasi dan memberikan akses hanya pada data yang diperlukan"},{"key":"C","text":"mengunggah lebih banyak data pribadi agar fitur aplikasi dapat digunakan secara maksimal"},{"key":"D","text":"menggunakan identitas teman agar data pribadi sendiri tidak masuk ke dalam aplikasi"},{"key":"E","text":"membagikan kata sandi kepada teman agar akun lebih mudah digunakan secara bersama-sama"}],"statements":[],"categories":[],"answer":"B","explanation":"Globalisasi digital menuntut literasi data. Pengguna perlu memahami privasi, izin akses, dan risiko keamanan digital sebelum menggunakan layanan.","validation":"Lengkap dari sumber","reviewNotes":[]},{"id":"B1-SOS-28-02","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 28_Globalisasi.docx","n":8,"title":"Budaya Pop Global","category":"Globalisasi","subcategory":"Sikap Kritis terhadap Globalisasi","type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Siswa di sebuah sekolah sangat menyukai musik dan film dari berbagai negara. Mereka mulai mempelajari bahasa asing dan memahami kebudayaan lain. Namun, beberapa siswa menganggap kesenian daerah sendiri tidak relevan dan tidak perlu dipelajari."},{"kind":"text","text":"Sikap kritis yang tepat adalah ...."}],"options":[{"key":"A","text":"mempelajari budaya asing sebagai bagian dari perluasan wawasan"},{"key":"B","text":"tetap mengenal dan mengembangkan budaya lokal sebagai identitas masyarakat"},{"key":"C","text":"menolak seluruh budaya asing agar budaya lokal tidak mengalami perubahan"},{"key":"D","text":"menilai unsur budaya asing secara selektif sesuai nilai dan konteks masyarakat"}],"statements":[],"categories":[],"answer":"A, B, dan D","explanation":"Sikap kritis terhadap globalisasi budaya berarti terbuka tetapi selektif, sekaligus tetap memiliki kesadaran terhadap identitas lokal.","validation":"Lengkap dari sumber","reviewNotes":[]},{"id":"B1-SOS-28-03","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 28_Globalisasi.docx","n":13,"title":"Penggunaan Teknologi Global","category":"Globalisasi","subcategory":"Sikap Kritis terhadap Globalisasi","type":"category","typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Sekolah menggunakan berbagai platform digital untuk mendukung pembelajaran."},{"kind":"text","text":"Tentukan kategori setiap pernyataan berdasarkan stimulus."}],"options":[],"statements":["Memeriksa kredibilitas materi digital sebelum digunakan sebagai referensi.","Menyalin seluruh materi internet tanpa mencantumkan sumber.","Menggunakan teknologi untuk berdiskusi dan mengembangkan karya sendiri."],"categories":["Bijak","Tidak Bijak"],"answer":"1. Pemanfaatan Bijak; 2. Pemanfaatan Tidak Bijak; 3. Pemanfaatan Bijak","explanation":"Pemanfaatan teknologi harus memperkuat literasi, kreativitas, dan integritas akademik.","validation":"Lengkap dari sumber","reviewNotes":[]},{"id":"B1-SOS-01-01","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 1(3).docx","n":3,"title":"Kelompok Belajar Peserta Didik","category":"Hakikat dan Objek Kajian Sosiologi","subcategory":"Kajian Sosiologi","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Sejumlah peserta didik membentuk kelompok belajar untuk menghadapi ujian. Pada awalnya, semua anggota aktif bertukar catatan dan menjelaskan materi. Setelah beberapa minggu, muncul pembagian peran. Seorang peserta didik menjadi koordinator, beberapa anggota bertugas mencari sumber, sedangkan anggota lain menyusun rangkuman. Kelompok juga menetapkan aturan kehadiran dan sanksi bagi anggota yang tidak menjalankan tugas."},{"kind":"text","text":"Aspek yang menjadi fokus kajian sosiologi pada kasus tersebut adalah ...."}],"options":[{"key":"A","text":"kemampuan setiap peserta didik dalam memahami materi ujian"},{"key":"B","text":"proses terbentuknya struktur dan norma dalam kelompok sosial"},{"key":"C","text":"jumlah halaman rangkuman yang disusun oleh setiap anggota"},{"key":"D","text":"tingkat kesulitan materi yang dipelajari menjelang pelaksanaan ujian"},{"key":"E","text":"perbedaan nilai akademik yang diperoleh setelah kegiatan belajar"}],"statements":[],"categories":[],"answer":"B","explanation":"Sosiologi mempelajari pembentukan kelompok, struktur, peran, norma, dan hubungan antaranggota. Kemampuan akademik atau jumlah rangkuman lebih dekat dengan kajian pendidikan secara individual, bukan fokus utama sosiologi.","validation":"Sumber lama","reviewNotes":[]},{"id":"B1-SOS-01-02","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 1(3).docx","n":8,"title":"Gerakan Donasi melalui Media Sosial","category":"Hakikat dan Objek Kajian Sosiologi","subcategory":"Kajian Sosiologi","type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Setelah terjadi bencana, sejumlah pemuda membuat kampanye donasi melalui media sosial. Informasi tersebut menyebar dengan cepat dan bantuan terkumpul dari berbagai daerah. Namun, warga mulai mempertanyakan pengelolaan dana karena laporan penyaluran belum diumumkan. Sebagian penyumbang menghentikan dukungan sampai pengurus memberikan laporan secara terbuka."},{"kind":"text","text":"Pernyataan yang menunjukkan kajian sosiologi adalah ...."}],"options":[{"key":"A","text":"media sosial dapat mendorong terbentuknya tindakan kolektif masyarakat"},{"key":"B","text":"kepercayaan sosial memengaruhi keberlanjutan partisipasi para penyumbang"},{"key":"C","text":"kualitas kamera menentukan tingkat keberhasilan seluruh kegiatan donasi"},{"key":"D","text":"transparansi berhubungan dengan legitimasi kelompok pengelola bantuan"}],"statements":[],"categories":[],"answer":"A, B, dan D","explanation":"Tindakan kolektif, kepercayaan sosial, partisipasi, serta legitimasi kelompok merupakan kajian sosiologi. Kualitas kamera tidak menjadi unsur utama dalam analisis hubungan sosial.","validation":"Sumber lama","reviewNotes":[]},{"id":"B1-SOS-01-03","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 1(3).docx","n":13,"title":"Banjir dan Respons Masyarakat","category":"Hakikat dan Objek Kajian Sosiologi","subcategory":"Kajian Sosiologi","type":"category","typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Banjir melanda sebuah kawasan perkotaan. Warga dari beberapa lingkungan membentuk dapur umum, mengumpulkan pakaian, dan membantu mengevakuasi lansia. Di sisi lain, terjadi perselisihan karena sebagian warga menilai bantuan lebih banyak diberikan kepada kelompok tertentu. Pemerintah kemudian membuka data penerima bantuan dan melibatkan perwakilan warga dalam pendistribusian."},{"kind":"text","text":"Tentukan ketepatan setiap pernyataan berikut."}],"options":[],"statements":["Kerja sama warga setelah banjir merupakan bentuk tindakan sosial kolektif.","Perselisihan pembagian bantuan dapat dikaji melalui konsep keadilan sosial.","Sosiologi hanya mengkaji penyebab alamiah banjir dan tidak mengkaji respons masyarakat."],"categories":["Tepat","Tidak Tepat"],"answer":"1. Tepat; 2. Tepat; 3. Tidak Tepat","explanation":"Sosiologi tidak mengkaji proses alamiah terjadinya banjir, tetapi mengkaji tindakan kolektif, pembagian bantuan, konflik, keadilan, dan hubungan antara masyarakat dengan pemerintah.","validation":"Sumber lama","reviewNotes":[]},{"id":"B1-SOS-02-01","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 2(2).docx","n":3,"title":"Pengumuman di Stasiun","category":"Interaksi Sosial","subcategory":"Syarat Interaksi Sosial dan Komunikasi","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Petugas stasiun mengumumkan bahwa keberangkatan kereta mengalami keterlambatan. Para penumpang mendengar pengumuman tersebut, tetapi sebagian tidak memahami\n\nkarena suara pengeras terlalu pelan. Mereka tetap menunggu di jalur keberangkatan yang salah dan tidak memberikan tanggapan terhadap pesan petugas."},{"kind":"text","text":"Mengapa interaksi sosial belum berlangsung secara efektif dalam kasus tersebut?"}],"options":[{"key":"A","text":"petugas dan penumpang tidak mempunyai persamaan tujuan dalam menggunakan layanan"},{"key":"B","text":"penumpang tidak berada di tempat yang sama ketika pengumuman mulai disampaikan"},{"key":"C","text":"pesan yang disampaikan tidak diterima dan dimaknai dengan jelas oleh penumpang"},{"key":"D","text":"petugas tidak menggunakan bahasa asing ketika mengumumkan perubahan keberangkatan"},{"key":"E","text":"penumpang tidak memiliki hubungan pribadi dengan petugas yang memberikan pengumuman"}],"statements":[],"categories":[],"answer":"C","explanation":"Komunikasi membutuhkan pesan yang dapat diterima dan dimaknai. Dalam stimulus, suara yang tidak jelas menyebabkan penumpang gagal memahami informasi. Karena itu, komunikasi sebagai salah satu syarat interaksi belum berlangsung efektif.","validation":"Sumber lama","reviewNotes":[]},{"id":"B1-SOS-02-02","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 2(2).docx","n":8,"title":"Kerja Sama Tim Penyelamat","category":"Interaksi Sosial","subcategory":"Syarat Interaksi Sosial dan Komunikasi","type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Saat banjir, petugas penyelamat memberikan tanda dengan peluit kepada warga yang berada di atap rumah. Warga memahami tanda tersebut, melambaikan kain, dan menunjukkan jumlah orang yang membutuhkan pertolongan. Petugas kemudian mengarahkan perahu menuju lokasi warga."},{"kind":"text","text":"Unsur yang mendukung terjadinya interaksi sosial dalam kasus tersebut adalah ...."}],"options":[{"key":"A","text":"adanya tanda yang berfungsi sebagai pesan kepada warga"},{"key":"B","text":"adanya pemahaman warga terhadap makna bunyi peluit"},{"key":"C","text":"adanya respons warga melalui lambaian dan isyarat jumlah korban"},{"key":"D","text":"adanya kesamaan pekerjaan antara petugas dan seluruh warga terdampak"}],"statements":[],"categories":[],"answer":"A, B, dan C","explanation":"Peluit berfungsi sebagai pesan, warga memahami maknanya, lalu memberikan respons. Kesamaan pekerjaan bukan syarat interaksi sosial.","validation":"Sumber lama","reviewNotes":[]},{"id":"B1-SOS-02-03","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 2(2).docx","n":13,"title":"Komunikasi dengan Bahasa Isyarat","category":"Interaksi Sosial","subcategory":"Syarat Interaksi Sosial dan Komunikasi","type":"category","typeLabel":"Pilihan Ganda Kompleks Kategori","promptBlocks":[{"kind":"text","text":"Seorang petugas perpustakaan membantu pengunjung penyandang hambatan pendengaran. Pengunjung menggunakan bahasa isyarat untuk menanyakan lokasi buku. Petugas memahami beberapa isyarat, menunjukkan rak yang dimaksud, lalu pengunjung mengangguk sebagai tanda memahami petunjuk tersebut."}],"options":[],"statements":["Bahasa isyarat dapat berfungsi sebagai sarana komunikasi sosial.","Anggukan pengunjung merupakan respons terhadap petunjuk petugas.","Komunikasi tidak terjadi karena kedua pihak tidak menggunakan bahasa lisan."],"categories":["Tepat","Tidak Tepat"],"answer":"1. Tepat; 2. Tepat; 3. Tidak Tepat","explanation":"Komunikasi dapat menggunakan bahasa lisan, tulisan, gerakan, simbol, atau isyarat. Hal terpenting ialah pesan diterima, dipahami, dan memperoleh tanggapan.","validation":"Sumber lama","reviewNotes":[]},{"id":"B1-SOS-29-01","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 29_Kearifan lokal(1).docx","n":3,"title":"Penguatan Kerajinan Lokal","category":"Kearifan Lokal","subcategory":"Penguatan Budaya dan Kearifan Lokal","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Di daerah wisata, kerajinan anyaman lokal kalah populer dibandingkan produk pabrikan impor yang lebih murah. Pengrajin muda ingin mempertahankan kerajinan tersebut agar tetap diminati."},{"kind":"text","text":"Langkah terbaik yang dapat dilakukan adalah ...."}],"options":[{"key":"A","text":"menghentikan produksi kerajinan tradisional"},{"key":"B","text":"meniru seluruh model produk luar tanpa identitas lokal"},{"key":"C","text":"mengembangkan desain baru tanpa menghilangkan ciri khas budaya daerah"},{"key":"D","text":"menjual produk hanya kepada warga setempat"},{"key":"E","text":"menyimpan semua produk kerajinan di gudang agar tidak rusak"}],"statements":[],"categories":[],"answer":"C","explanation":"Dalam menghadapi globalisasi, budaya lokal perlu beradaptasi secara kreatif tanpa kehilangan identitas. Inovasi desain dengan tetap mempertahankan nilai lokal adalah langkah yang tepat.","validation":"Lengkap dari sumber","reviewNotes":[]},{"id":"B1-SOS-29-02","bank":"Bank Soal 1" es":[]},{"id":"B1-SOS-05-01","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 5(2).docx","n":3,"title":"Kelompok Relawan Bencana","category":"Kelompok Sosial","subcategory":"Pembentukan Kelompok Sosial","type":"single","typeLabel":"Pilihan Ganda","promptBlocks":[{"kind":"text","text":"Banjir besar menyebabkan ratusan keluarga harus mengungsi. Sejumlah pemuda dari latar belakang berbeda berkumpul secara spontan untuk mengumpulkan makanan dan pakaian. Setelah beberapa hari, mereka membagi tugas menjadi bagian pendataan, logistik, kesehatan, dan distribusi. Mereka juga menyusun aturan kerja agar bantuan dapat\n\ndiberikan secara teratur."},{"kind":"text","text":"Tahap penting yang menunjukkan kumpulan pemuda telah berkembang menjadi kelompok sosial adalah ...."}],"options":[{"key":"A","text":"para pemuda berada di lokasi bencana pada waktu yang bersamaan"},{"key":"B","text":"para pemuda menyaksikan kerusakan yang dialami masyarakat terdampak"},{"key":"C","text":"terbentuknya pembagian peran, aturan, dan tujuan yang disepakati bersama"},{"key":"D","text":"banyaknya bantuan yang disumbangkan oleh masyarakat dari luar daerah"},{"key":"E","text":"munculnya pemberitaan mengenai kegiatan relawan melalui media sosial"}],"statements":[],"categories":[],"answer":"C","explanation":"Sekadar berkumpul belum cukup untuk disebut kelompok sosial. Kelompok terbentuk ketika terdapat tujuan bersama, interaksi, pembagian peran, dan aturan yang mengikat para anggotanya.","validation":"Sumber lama","reviewNotes":[]},{"id":"B1-SOS-05-02","bank":"Bank Soal 1","source":"Bank Soal 1","originDoc":"SOAL TKA 5(2).docx","n":8,"title":"Forum Pedagang Pasar","category":"Kelompok Sosial","subcategory":"Pembentukan Kelompok Sosial","type":"multi","typeLabel":"Pilihan Ganda Kompleks (MCMA)","promptBlocks":[{"kind":"text","text":"Pedagang Pasar Sentosa awalnya menjalankan usaha secara sendiri-sendiri. Ketika terjadi peningkatan pencurian, mereka mulai bertukar informasi dan mengadakan p
